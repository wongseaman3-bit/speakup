lanes we have.\n\nIf we introduced bus lanes, it would lead to even worse pollution. There would be less space for cars so there would be more traffic jams than now.\n\nThis would be unfair to people who drive private cars. Many people have to drive private cars for their work. They would have a lot of inconvenience. Taxis, lorries and other road users would also suffer.\n\nHong Kong is just not a place where you can introduce more bus lanes.\n\nPeter Li, Wan Chai","task":"Your class is going to debate the motion: ‘More bus lanes are needed in Hong Kong.’ Your group is preparing for the debate. You may want to talk about:","points":["whether buses are a convenient form of travel","whether bus lanes are a suitable solution to traffic congestion","other solutions to the traffic congestion problems","anything else you think is important"],"ir":["Do you like taking the bus?","What don’t you like about buses?","Do you prefer the bus or the MTR?","How do you spend the time when you are on the bus?","Do you think Hong Kong has a good bus service?","Do you think road congestion is bad in Hong Kong?","What kinds of improvements can be made to bus services?","Are buses the cause or solution to the traffic congestion in Hong Kong?"]},{"id":"2017-8.1","no":"8.1","label":"It is important to fight age discrimination","intro":"This Letter to the Editor appeared in a newspaper in Hong Kong:","title":"It is important to fight age discrimination","text":"In a recent report, the incoming head of the Equal Opportunities Commission (EOC), Hong Kong’s anti-discrimination office, Alfred Chan Cheung-ming, is quoted as saying that one of his priorities will be to battle against age discrimination.\n\n[hope this will happen as although in the past the EOC has been active in other anti-discriminatory fields, I feel it has not done enough about the problem of discrimination faced by older people.\n\nI wish Mr Chan success in his fight to stop unequal treatment of the elderly, which is one of the most serious forms of discrimination that exists in Hong Kong. I say this because I think it may affect more people in a more truly negative way than any other form of discrimination.\n\nThe fact that so many people are forced to leave their employment only because of their age is a terrible aspect of Hong Kong life. In many countries this is no longer the case and there is no reason why Hong Kong should be behind other countries in this area.\n\nMr Chan’s objective to increase work opportunities for senior citizens is an excellent one.\n\nT hope he can pressure the government to pass laws so that people of 60 and above, and sometimes even less than that, can continue in jobs that they are perfectly capable of doing, as well as more easily find jobs related to their expertise and experience. I wish him luck.\n\nChris Tsui, Discovery Bay","task":"Your class is doing a project on different forms of discrimination in Hong Kong. Your group has been asked to discuss discrimination against older people. You may want to talk about:","points":["advantages of allowing older people to work","advantages of not allowing older people to work","what can be done to reduce discrimination against older people","anything else you think is important"],"ir":["Would you like to work when you are over 60?","How can older people spend their time if they are not working?","Why do some employers not want older workers?","What age do you think people should retire at?","What advantages can older workers bring to a company?","Do you think people will retire at a later age in the future?","Why do you think people want to continue working after 60?","Do young people also suffer age discrimination?"]},{"id":"2017-8.2","no":"8.2","label":"Fair fine?","intro":"This article and Letter to the Editor appeared in a newspaper in Hong Kong:","title":"Fair fine?","text":"A 71-year-old Hong Kong cleaning employee, working at Southorn Playground, was fined HK$1,500 for throwing waste water on a street on Monday by the Food and Environmental Hygiene Department.\n\nHowever, after a number of newspaper and TV reports about her fine for littering, her employer Baguio Cleaning Services Company has decided to pay the fine for her.\n\n\"I was scared I would have to pay it by myself,\" Zhou said, adding it would be very expensive as she only earns HK$8,300 a month. JES GODSI ISO SII ESOS OBIS OAR ISSO OOOO TASB TASES TIO ISO IIIA AAI IA DIN IE\n\nEqual penalties for those who break the rules\n\ncannot accept the actions of an elderly cleaner dumping waste water in a street in Wan Chai or her employer paying the fine for her.\n\nJust because someone is underprivileged does not mean they should not be punished if they have done something wrong, in this case emptying waste water in the street. If she broke regulations then she should have accepted the punishment. If she was struggling to pay the fine, then she could have been given more time to pay it.\n\nWe all have to be responsible for our actions and recognise the importance of cracking down on pollution on our streets.\n\nWe have to recognise that all stakeholders have to play their part in ensuring society is orderly and that we all stick to the necessary rules.\n\nKris Lam, Sham Shui Po","task":"You have been asked to discuss whether fines and penalties are an effective way to keep Hong Kong streets clean. You may want to talk about:","points":["whether the elderly cleaner should have been fined","whether fines and penalties stop people littering","any problems that fines and penalties cause","anything else you think is important"],"ir":["Do you think there is a lot of litter in Hong Kong?","What do you do if there is no bin for your rubbish?","Why do you think that people litter?","Are there other ways to stop people littering?","Do you agree that throwing water on the street is littering?","Are fines a suitable way to stop anti-social behaviour?","Does government advertising stop people littering?","Should rich people pay the same fines as poor people?"]},{"id":"2017-8.3","no":"8.3","label":"Hiking and camping at Sunset Peak, Lantau Island","intro":"This article appeared on a blogger’s webpage:","title":"Hiking and camping at Sunset Peak, Lantau Island","text":"I did it! 1 DID IT!!!!!! First time night hiking and camping at Sunset Peak. An amazing and enjoyable experience! Thank you John for taking me there and making sure I had the torch charged, for letting us know the weather information and for finding the route. The best thing you did was go first and check there were no spiders on the path! Thank you!!\n\n4 hours’ hike with a big backpack, I was tired!! We arrived around 3am, put up the tent and said goodnight at around 4.30, But we didn’t manage to see sunrise because we didn’t get up until 8!!! Then we started our super relaxing morning, first came a cup of hot coffee, followed by hot noodles with a can of spicy pork.....mmmm...yummy and feeling contented!!!\n\nWe then packed and started heading down at around midday. Omg, going down is far more challenging than going up, my legs were shaking during the last 20 minutes of the hike and immediately sat down on a bench when I saw one!\n\nFeeling tired today but it’s all worth it. Only problem is there is no photo taking at night!!! LOL I was a bit nervous before the hike, thinking I am too slow and will drag the group down. John had assured me that I could walk at a slow pace. But I needn’t have worried. We all helped each other.\n\nI slept for 14 hours after the hike!! Really a great night and day!!!","task":"Your class is thinking about organising a night hike and camp on a mountain to celebrate graduation from school. You are meeting to discuss the preparation for the trip. You may want to talk about:","points":["why night hiking has become popular with students","what you should or should not take on the trip","any problems you may face on the trip","anything else you think is important"],"ir":["I Why do people like camping?","Is it better to hike in a group or alone?","Who prefers hiking more: young people or the elderly?","What memorable things do people see when they go hiking?","How can hikers protect the environment?","Should mountain bikes be allowed to use hiking paths?","Do you think hiking will become more popular in the future?","ea area wen How does hiking affect the environment?"]}]},{"id":"2018","year":"2018","label":"2018 DSE","tasks":[{"id":"2018-1.1","no":"1.1","label":"Helper idea easier said than done","intro":"This article appeared in the opinion page of a newspaper in Hong Kong:","title":"Helper idea easier said than done","text":"The Hong Kong Government is looking at giving elderly people who live alone in public housing up to HK$8,000 a month to employ domestic helpers from overseas to look after them and help reduce the costs of providing care homes for the elderly.\n\nThe idea seems simple, and could be done by expanding the current community care service voucher for the elderly. But unfortunately, it isn’t that easy.\n\nFor the elderly, receiving the subsidy would only mark the beginning of a long list of hassles they would find difficult to handle, unless the government was committed to help them every step of the way. That would include assisting them in the hiring of a helper and paying regular visits — and I mean weekly, not once every few months — to ensure everything is going smoothly.\n\nAnd when two adults stay together, sharing an extremely small public housing unit designed for use by one, won’t problems arise over time due to the crowded space?\n\n‘The results could be deadly if the relationship between the elderly person and helper goes terribly wrong.\n\nA sensible alternative is for those who have no family support and are unable to live independently to reside in dedicated homes for the elderly.\n\nInstead of investing in the subsidies, wouldn’t it make better sense to use the money to improve existing facilities or build new ones, and employ staff trained to look after the residents 24 hours a day, seven days a week?","task":"Your school social worker wants you to discuss whether the proposal to provide a domestic helper for all elderly people who live alone in public housing is a good idea. Your group is meeting to discuss this. You may want to talk about:","points":["why the government suggested the idea","the advantages and disadvantages of the idea","any other ways to help elderly people who live alone","anything else you think is important"],"ir":["Would you like to work with elderly people?","Is Hong Kong a good place for elderly people?","What activities could make elderly people enjoy their day?","Does Hong Kong help elderly people enough?","Should elderly people live with their families?","Is loneliness a big problem in Hong Kong?","Which is a better option for the elderly: to live alone or in a care home?","What is the most difficult thing for elderly people to deal with?"]},{"id":"2018-1.2","no":"1.2","label":"The decline and fall of TVB?","intro":"This article appeared in an online TV magazine:","title":"The decline and fall of TVB?","text":"TVB, Hong Kong’s biggest free TV station, used to be Hong Kong’s pride. It was a leader in shaping the city’s pop culture in the 1980s. But the broadcaster appears to be losing support with the latest viewing figures showing that the average evening audience of TVB fell from 2.4 million in 1984 to 1.58 million in 2016.\n\nThe fall is especially noticeable in TVB top drama series. In 2008, four out of the five top-rated TVB shows had an average audience size of more than two million viewers. By 2016, none of the five top-rated shows passed two million viewers.\n\nThe lack of financial investment and creativity are two reasons often given for the decline in the broadcaster’s viewing figures. Many of the TVB drama serials have been shot using the same props and sceneries for years now. TVB fans have made fun of this by doing a \"screen capture\" of one scene in a drama series and comparing it with another done for another show. Because of the management’s cost-control measures, only a small number of artists dominate the shows in primetime slots. As a result, viewers get confused after watching the same actor performing the roles of three different characters in three different drama programmes in a single night.\n\nThe worst may yet be to come for TVB though, as more Hong Kong viewers take to the internet to satisfy their drama-watching craving, especially given the current trend for watching all things Korean.","task":"You are doing a school project on TVB. Your group has been asked to discuss the fall in the number of viewers. You may want to talk about:","points":["why TVB was so successful in Hong Kong in the past","why there is a fall in the number of viewers","whether TVB can be successful again in the future","anything else you think is important"],"ir":["Do you ever watch TVB?","Do you enjoy watching TVB dramas?","What types of TVB programme do you like to watch?","Do you prefer local TV programmes or foreign TV programmes?","Do you prefer to watch programmes on TV or online?","Should the government do more to support free TV stations?","How would you feel if TVB closed?","How important is TVB to Hong Kong culture?"]},{"id":"2018-1.3","no":"1.3","label":"Teachers must have the right to switch off","intro":"This letter to the editor appeared in a local newspaper:","title":"Teachers must have the right to switch off","text":"I am writing because I am concerned about the use of text messaging at schools in Hong Kong or to be precise the use of text messaging after school hours.\n\nMany schools in Hong Kong now allow teachers and students to communicate with each other by text message. This is so much easier now for students, with the numerous instant messaging tools available on smartphones. It can significantly improve real-time communication when in the past a delay was inevitable.\n\nSome schools even create WhatsApp groups for each class. These include the teacher, the students and critically they often include the parents.\n\nAs a result, many teachers nowadays are concerned about the number of text messages they get from parents after the school day has ended and they are back at home.\n\nMany teachers feel they have to answer the questions that have been posed, often related to schoolwork. If they cannot give a swift reply then the students or their parents might blame them for being inefficient and not professionally-conscientious. If they do reply they are accused of being biased or favouring one particular student.\n\nStudents and parents need to appreciate that teachers have the right to enjoy their leisure time. In my opinion, teachers should be authorised to decline to reply to such questions after school hours if they want\n\nto.\n\nSamuel Lee, Sai Kung","task":"Your school principal is worried about the increase in the use of text messaging in your school. Your group is discussing this topic. You may want to talk about:","points":["why students and parents want to text teachers","the advantages and disadvantages of students and teachers texting each other","what schools can do to improve other means of communication between students and teachers","anything else you think is important"],"ir":["Do you like to send text messages?","Do people in Hong Kong text too much?","Would you prefer to text your teachers or have face-to-face meetings?","Should students be able to text their teachers at any time?","Should schools set rules about texting?","What are the pros and cons of group chats?","When people take a long time to reply to text messages, is it rude?","How would you advise people to set boundaries between their personal and professional life?"]},{"id":"2018-2.1","no":"2.1","label":"Bike-sharing services push off in Hong Kong","intro":"This article appeared in a newspaper in Hong Kong:","title":"Bike-sharing services push off in Hong Kong","text":"Smart.bike, a start-up founded by Peter Wong two months ago, aims to offer busy people an easy option for short distance commutes. The service works by allowing cyclists to rent and drop off bicycles around Hong Kong.\n\n\"We are here to make transportation convenient and affordable,\" he said. A ride on a Smart bike will cost HK$S per half hour. Currently, bike rentals for leisure purposes cost HK$40 per day in Tai Po.\n\nWong said that there was a great demand for bike-sharing in a city like Hong Kong, where people walk considerable distances between public transport stops. Bicycles certainly fill this gap.\n\nTo rent a Smart bike, which is powered by solar panels, users will need to log into a mobile application, register their credit card and pay a deposit of HK$399. An active map will locate the nearest bicycle.\n\nThe company has 400 bikes at present. The number is expected to reach 1,000 by the end of the week, and 20,000 by July.\n\nUnlike existing bike rental services in Hong Kong, cyclists riding Smart bikes will not have to pick up and drop off their bicycles at fixed locations.\n\n\"You can park them anywhere as long as it is legal,\" Wong said, referring to public cycle parking spaces across the city.\n\nHe said the service could also be a solution for people who had very limited living space to store their own bikes.","task":"Your economics teacher wants you to discuss businesses which offer sharing services. You may want to talk about:","points":["the advantages of bike-sharing services","the problems of bike-sharing services and possible solutions","other sharing services that could be introduced in Hong Kong","anything else you think is important"],"ir":["Do you ever go cycling?","How did you learn to ride a bike?","Would you use a bike-sharing service?","Why can cycling in Hong Kong be dangerous?","Would you prefer to cycle to school or take public transport?","What can the government do to improve safety for cyclists?","Do you think car-sharing would be successful?","Will there be more sharing services in the future?"]},{"id":"2018-2.2","no":"2.2","label":"Why are the streets of Hong Kong full of kids in matching T-shirts?","intro":"This article appeared in a newspaper in Hong Kong:","title":"Why are the streets of Hong Kong full of kids in matching T-shirts?","text":"There's nothing quite as crazy as OCamp.\n\nMost countries operate introduction days for students at the start of university, but there’s nothing quite as uniquely crazy as the orientation week for new students in Hong Kong (known as ‘OCamp’).\n\nOCamps tend to run from about three days to a week before a university term starts. Bright-eyed students arrive ready to embark on their all-new college careers. They all have to wear the same t-shirts and do a\n\nsequence of crazy activities.\n\nEvery OCamp has a \"city hunt\" — where students are given silly tasks to do all over the city. You might be sent to Fortress to ask for a solar-powered flashlight — an old joke from a Stephen Chow movie ~ or be told to wave at people in the gym until they wave back.\n\nThen there’s the \"Campfire\". Sometimes there’s a circle of flashlights, sometimes there’s not, but the whole group joins in and is taught songs and dances.\n\nStudents stay up talking, getting to know each other. They have to learn as much as they can about each other before the start of university.\n\nIt’s frankly crazy, but it works. OCamp is about bringing different students together and giving them a way to bond, starting them out on friendships that will get them through university and beyond. Once you’ve learned the dance steps to really stupid songs, nothing’s ever going to be the same again.","task":"Your principal has asked you to help with an OCamp for new S1 students at your school. Your group is meeting to discuss this. You may want to talk about:","points":["the advantages and disadvantages of having an OCamp","activities that would help new students get to know each other","how to organise the activities","anything else you think is important"],"ir":["Would you like to join an OCamp?","Do you think an OCamp is a good way to meet new friends?","Why is it important for students to make new friends at an OCamp?","What problems do students face if they can’t attend OCamp?","Would you enjoy doing a dance in front of lots of people?","How else can universities help new students adapt to university life?","Who would be better at organising the OCamp: students or teachers?","Would an OCamp be a good idea in the workplace?"]},{"id":"2018-2.3","no":"2.3","label":"Li Ka Shing Foundation to give HK$5,000 each to DSE candidates in remote districts","intro":"This article appeared in a newspaper in Hong Kong:","title":"Li Ka Shing Foundation to give HK$5,000 each to DSE candidates in remote districts","text":"Gift comes under scheme that covers 3,700 candidates from schools in Tin Shui Wai and outlying islands,\n\nTycoon Li Ka-shing’s charity is giving HK$5,000 cash each to students in some districts sitting for the Diploma of Secondary Education examination. The Li Ka Shing Foundation said it hoped that the gift would enable them to focus their energy on the exam.\n\nIt comes under the pilot scheme \"Decide Well, Spend Wisely\", which covers 3,700 candidates from secondary schools in Tin Shui Wai and outlying islands, including Lantau, Cheung Chau, Lamma and Peng Chau.\n\n\"We trust that [the students] will spend the money wisely according to their needs,\" the Foundation said in an announcement. Although students will be able to spend the money on anything and there will be no checks, the Foundation is confident that most students will use the money wisely and use it to help their studies and prepare themselves for the exams.\n\nThe funds will be distributed upon registration.\n\nThe charity explained that the cash initiative was based on feedback received from \"Love HK Your Way!\", a HK$300 million charity campaign launched by the foundation in 2010, which indicated unconditional cash distribution could be a direct and cost-efficient approach.\n\nThe Foundation said it would review its learning from this pilot scheme and decide whether to extend it to candidates from other areas.\n\nThe Foundation was set up in 1980 to manage the tycoon’s charitable donations.","task":"The Li Ka Shing Foundation is consulting students about whether the scheme should be available for all students in Hong Kong. They have asked your group for comments on the scheme. You may want to talk about:","points":["the advantages and disadvantages of the scheme","whether students will spend the money wisely","whether it should be available for all students in Hong Kong","anything else you think is important"],"ir":["Would you like to get this money?","Do you think 5000 dollars is too much money to give to students?","If you were Li Ka Shing, what charity would you support with the money?","Is money important for a successful education?","Which other groups of people could benefit more from a donation like this?","Are students taught enough about how to manage money?","What other kind of help could be given to students?","Why do the wealthy like to give money to charity?"]},{"id":"2018-3.1","no":"3.1","label":"Four reasons why doing nothing is not boring at all","intro":"This article appeared in an online blog:","title":"Four reasons why doing nothing is not boring at all","text":"For all the wonderful ways that smartphones make life easier and information more accessible, the truth is, we're not programmed to be constantly in \"go\" mode, and this overstimulation can have a seriously yourself pause from friends and technology is one of the best things you can do. Here are four reasons to\n\n1. It Stops Tech Addiction.\n\nSmartphone addiction is a real thing. Spending too much time using technology and social media has been linked to depression and worry, and poor sleep. So the next time you have time to kill, stick your phone in your bag and kill time the old-fashioned way: whether it’s daydreaming, doodling, or just sitting around, keep away from that screen.\n\n2. Doing Nothing Can Boost Creativity.\n\nResearch has found that daydreaming involves the same processes that govern imagination. So if you’re\n\n3. You Can Discover New Hobbies & Interests.\n\nIf you use the extra energy you have saved doing nothing to try a new activity, you’ll enjoy your time and learn something, whereas if you’re just scrolling through Instagram, you won’t really have gained\n\nanything. 4, Unplugging & Recharging Can Relieve Stress.\n\nTake some time to unplug and recharge for improved sleep and less stress.","task":"Your principal has asked your group to prepare a talk for the next Parent-Teacher Association meeting on why letting students do nothing can be a good thing. You may want to talk about:","points":["whether students have enough free time","the advantages and disadvantages of students doing nothing","how you will explain to parents the value of letting their children do nothing","anything else you think is important"],"ir":["When do you feel bored?","What things do you find boring?","What do you do to stop being bored?","Do you enjoy doing nothing?","Do students have too many activities outside school?","Do you find school holidays boring?","Do you think it is important to keep busy?","Do you think exposure to technology has restricted your imagination?"]},{"id":"2018-3.2","no":"3.2","label":"Mongkok e-sports festival shoots for the stars","intro":"This letter to the editor appeared in a local newspaper:","title":"Mongkok e-sports festival shoots for the stars","text":"I was glad to see that the three-day e-sports festival in Mongkok last weekend proved to be so popular, with gamers coming from all over the world to take part. If you’re not up to speed, an e-sports festival is an event where gamers compete by playing multi-player video games on a huge screen on stage with a live audience watching.\n\nThe event in Mongkok was the first event of its kind in Hong Kong though big e-sports festivals in South Korea have been attracting large numbers of tourists and spectators to their venues in recent years. Many Hong Kong locals took the opportunity to attend hoping to learn something from the top international players.\n\nThe government gave a grant of HK$35 million for the festival and, as it was so successful, I hope additional funding will be made available so that we can see more of these events involving gamers from here and abroad.\n\nA word of warning though for all of you who have set your hearts on having a career as a professional gamer touring the world competing at these events, Just like being a pop star, only a lucky few succeed. Many more fall by the wayside, their dreams in tatters with nothing more than a video game addiction to show for it, while their classmates at school have passed their exams and moved on to university.\n\nTheo Lam, Po Lam","task":"You are members of the school computer club. You want to hold an inter-school e-sports festival at your school. You are meeting to discuss this. You may want to talk about:","points":["advantages of holding an inter-school e-sports festival at your school","possible problems that may occur","how to promote the festival","anything else you think is important"],"ir":["Would you like to go to an e-sports festival?","Do you think e-sports will become more popular in the future?","Would your parents be happy if you became an e-sports professional?","What skills do you need to be good at e-sports?","Should schools teach e-sports in PE lessons?","Why do some people enjoy watching rather than playing computer games?","Could someone be a successful gamer and a successful student?","Should the government promote e-sports festivals?"]},{"id":"2018-3.3","no":"3.3","label":"Want to get fired up? The Hong Kong Fire Services Department is seeking hundreds of recruits","intro":"This article appeared in a local newspaper:","title":"Want to get fired up? The Hong Kong Fire Services Department is seeking hundreds of recruits","text":"As a member of the Hong Kong Fire Services Department (FSD), whose primary purpose it is to serve and protect the community, a Hong Kong firefighter has a challenging career. At the same time, being a firefighter offers a variety of career opportunities, is hugely rewarding and has an excellent starting salary ($18,000 per month).\n\nThe men and women of the FSD can be called upon to cover a range of incidents, including traffic and industrial accidents, gas leakages, landslides, flooding, building collapses, and even malfunctioning lifts.\n\nIn the next year, the FSD is aiming to recruit 60 station officers and 160 firefighters.\n\n\"The first and most important question that anyone considering a career as a Hong Kong firefighter should ask themselves is: ‘Do I have the wholehearted willingness to serve the community?’,\" says Wong Ka-wing, divisional officer of the FSD’s recruitment, training and examination group. \"Being a firefighter is about being trustworthy, and someone the public can always rely on in any situation.\"\n\nThose wishing to be a firefighter have to complete a 36-week training programme. Then recruits are assigned to fire stations around Hong Kong to begin a three-year probation period. \"On-the-job field training is very important because this is where recruits are dealing with real-life scenarios,\" says Wong. The FSD also provides public education and awareness training and carries out fire safety inspections on licensed premises.","task":"Your careers adviser has asked the class to give presentations on different careers and jobs in Hong Kong. Your group has been asked to give a presentation on being a firefighter. You are meeting to discuss the topic. You may want to talk about:","points":["what skills and qualities are needed to be a good firefighter","the advantages and disadvantages of working as a firefighter","activities that you could organise to help students learn about the job","anything else you think is important"],"ir":["Would you like to be a firefighter?","Would your parents like you to become a firefighter?","What do you think is the worst part of being a firefighter?","Do you think a high academic qualification is necessary to be a firefighter?","What do you think would be the best part of working for the Fire Services Department?","Do you think the job of a firefighter is rewarding?","Should duties be different for male and female firefighters?","Does Hong Kong society appreciate firefighters?"]},{"id":"2018-4.1","no":"4.1","label":"An interview with music producer Mark Lui","intro":"This article appeared in a Hong Kong magazine:","title":"An interview with music producer Mark Lui","text":"Do you think the Hong Kong music scene is getting better or worse?\n\nI would have to say that the industry is getting worse. The younger generation lacks hunger and the drive to be a superstar. I also don’t see any new composers trying to do anything innovative. People seem content to just turn out the same old formulae again and again.\n\nWhat do you think about our upcoming artists?\n\nThe talent is higher but the motivation is lower, which is a pity. Artists these days aren’t hungry enough. They just want to do music because it’s fun and cool.\n\nWhy do you feel young people aren’t hungry enough?\n\nT think these days life is too easy for them. They get everything they want from their parents. They often ! have helpers and grandparents carrying bags and doing everything for them.\n\n! Do you think we can change this?\n\nIt will be very difficult. The schools are not strict enough and so students don’t learn the importance of. hard work. Stars like Jacky Chan spent years and years working hard every day to develop their talent. Now young people think it is enough to have a cool haircut and the latest fashions.\n\nWhat advice would you give to young people wanting to join the music scene?\n\nThey need to put down their phones and realise that if they have talent it needs to be developed and the only way to do that is hard work and practice.\n\nA number of famous people in Hong Kong, such as Mark Lui, have recently criticised the young generation.","task":"Your group is meeting to discuss this issue. You may want to talk about:","points":["why older people criticise the younger generation","whether you think the criticism is fair","what is the biggest challenge for young people nowadays","anything else you think is important"],"ir":["Do you think young people are hard working?","Do you think young people have an easy life?","Are young people today given too much help?","Do you think the younger generation are talented?","Why is it hard for the older generation to understand the young?","Do teachers and parents understand the challenges younger people face?","Would you prefer to be a teenager today or a teenager in the past?","How can the older generation better support the younger generation?"]},{"id":"2018-4.2","no":"4.2","label":"Laid-back life in Taiwan is very tempting","intro":"This article appeared in the letters to the editor section of a newspaper in Hong Kong:","title":"Laid-back life in Taiwan is very tempting","text":"I refer to Nick Westra’s article \"Why are so many Hongkongers moving to Taiwan?\". I agree that a lot of people from Hong Kong are realising that Taiwan is the ideal place for them to settle down.\n\nThe living environment in Hong Kong is becoming more difficult. Costs keep rising in what is already one of the most expensive cities in the world, especially when it comes to property prices and rent. People have to work long hours to earn enough to cover living expenses. They don’t have enough time to spend with their families and are so tired that on Sundays they often sleep all day.\n\nLife in the city is too hectic, and the workplace is too competitive.\n\nHowever, the pace of life is much slower in Taiwan. I think you can enjoy a much less complicated way of life there and being away from the fierce competition in Hong Kong’s offices must be very liberating.\n\nFamilies with children can have a good quality of life because, although the salaries are lower in Taiwan, the cost of living is also much lower.\n\nWhile it is a big change in lifestyle, I am sure people who relocate to Taiwan will eventually adapt to living there and enjoy living there.\n\nLily Wong, Kwai Chung","task":"Recently two of your classmates have left school and moved to Taiwan. You are discussing this with your group. You may want to talk about:","points":["the differences between Hong Kong and Taiwan","the advantages and disadvantages of going to live in Taiwan","the most important factor in deciding whether to move to Taiwan","anything else you think is important"],"ir":["Would you like to visit Taiwan?","Would you like to live in Taiwan?","Do you think you will ever live in another country?","What do you think people miss when they move away from Hong Kong?","What problems do young people face when they move to another country?","Why do you think most Hongkongers work long hours?","Would you stay in touch with friends who move to another country?","Does modern communication make emigrating easier?"]},{"id":"2018-4.3","no":"4.3","label":"No Attendance No Problem","intro":"This article appeared in the letters to the editor section of a newspaper in Hong Kong:","title":"No Attendance No Problem","text":"automatically, Under the new policy, they can still pass with less-than-perfect attendance records.\n\nteaching staff at the university.\n\nrespect their choices.\n\nteaching, as their attendance is no longer guaranteed.\n\nclassrooms.\n\ndifferent commitments in more flexible schedules.\n\nSimon Wang, Kowloon Tong\n\nI support the Hong Kong Baptist University’s (HKBU) recent decision to relax attendance requirements for all its students. In the past, students skipping more than 30 per cent of classes would fail a course\n\nI feel this new policy may improve the overall quality of teaching and stimulate innovation among\n\nUniversity students are young adults who should learn to make responsible decisions on how to spend their time. If they find a better way to study course materials than attending lectures, the university should\n\nAlso, under the new policy, all university teachers must rethink how to attract students with more effective\n\nAs a lecturer at the university myself, I have created a series of video lectures students will watch in advance. They can learn the basic concepts and techniques at their own pace through the videos and assigned reading. They can then discuss the materials and receive my feedback on their thinking during classes. I have also created WhatsApp groups for my students to discuss course materials outside the\n\nWith the new attendance policy, Baptist University is well positioned to provide more resources allowing students to access course materials in videos, to study anywhere using their mobile devices and to juggle","task":"Your careers advisor has asked you to discuss attendance policies in education. You may want to talk about:","points":["the advantages and disadvantages of HKBU’s attendance policy","whether you think the policy will be successful","whether it could be applied to secondary schools","anything else you think is important"],"ir":["Do you like learning online?","Is it important for students to go to all classes?","How would parents feel about a relaxed attendance policy?","Should students who don’t go to class still pass the course?","Are video lessons the same as face-to-face lessons?","Why is face-to-face teaching sometimes helpful?","Are students mature enough to decide if they need to go to class?","Is attendance more important in some classes than others?"]},{"id":"2018-5.1","no":"5.1","label":"Boxing champion Rex Tso reveals secret of success","intro":"This article appeared in a local newspaper:","title":"Boxing champion Rex Tso reveals secret of success","text":"Rex Tso Sing-yu, a.k.a, The Wonder Kid, has fought 18 professional boxing matches since 2011 and won them all.\n\nThis year was definitely an important year for Tso. Yet despite his busy fighting schedule, he was able to help many worthwhile causes and serve as an inspiration for youngsters who feel lost and have no direction in life.\n\n\"I think sports are good for children and teenagers, especially boxing,\" said Tso. \"Not until I started professional boxing did I find my life goals.\"\n\nAs a teenager, he thought of himself as \"junk\". He didn’t do well academically or in other things, except playing video games.\n\nAfter secondary school, he and his friends tried out all sorts of jobs, including being a warehouse worker and a driver. But all those jobs were short-lived as Tso felt he was physically unfit and needed to be stronger to do this type of work.\n\nTso’s life turned a new page when Jay Lau Chi-yuen opened a boxing gym and invited him over. That’s when he really picked up boxing and began to enter professional matches.\n\n\"Boxing teaches you the need to work hard,\" said Tso. \"When fighting, you feel under immense stress and quickly learn to control your emotions and develop self-control. Outside the ring, you have to be disciplined about food and learn to keep to your training schedule. These are important life skills.\"","task":"Your group has been asked to write a letter to Rex Tso inviting him to speak at your school. You are meeting to discuss the letter. You may want to talk about:","points":["why Rex would be a suitable speaker","how to persuade Rex to come to your school","whether boxing should be promoted in secondary schools in Hong Kong","anything else you think is important"],"ir":["Would you like to try boxing?","Is boxing a popular sport in Hong Kong?","Do you like watching boxing on TV?","Should girls do boxing?","Does boxing get enough support in Hong Kong?","Why do some people enjoy dangerous sports such as boxing?","Do you think boxing encourages violence?","Is it important to let young people take risks through activities such as boxing?"]},{"id":"2018-5.2","no":"5.2","label":"9-year-old’s America’s Got Talent appearance sparks parenting debate","intro":"This article appeared in a newspaper in Hong Kong:","title":"9-year-old’s America’s Got Talent appearance sparks parenting debate","text":"The appearance of nine-year-old Hong Kong singer Celine Tam on US talent show America's Got Talent has reignited a debate on parenting, with some members of the public accusing her parents of not letting her have a childhood.\n\nOther bloggers have defended her parents, however, claiming that her parents are only helping Celine achieve her dreams.\n\nTam’s audition — in which she sang the hit My Heart Will Go On — went viral with over 7 million views, Local media reported that she began learning to sing when she was three years old. She practises for several hours a day, and has participated in numerous televised Hong Kong and mainland Chinese talent shows in her nine short years.\n\nBut Tam’s story sparked comments from some Hongkongers. \"This is outrageous,\" wrote one commenter on the Facebook page of news outlet Apple Daily. \"Just another way for her parents to make money off her.\"\n\nAnother agreed: \"Why couldn’t they have waited until she’s older and more mature before pushing her out in front of everyone?\"\n\nOthers disagreed, however, claiming that Tam’s experience was not extraordinary. \"Many children have entered similar competitions. As a parent, if you don’t make a decision for your kids, people will say you're irresponsible,\" wrote ManInCentral-CK. \"But if you make a decision for them, people will say you don’t respect their wishes.\"","task":"TVB has asked your school if any of the students would like to take part in a new talent show. Your music: teacher has asked you for your opinions on talent shows. You may want to talk about:","points":["why talent shows are popular","the advantages and disadvantages of taking part in talent shows","whether parents should let their children take part in talent shows","anything else you think is important"],"ir":["Do you watch talent shows?","Would you like to be on a talent show?","Should schools organise talent shows for students?","What could children learn from competing in a talent show?","What advice would you give to a young child entering a talent show?","Do you think talent shows will remain popular in the future?","What would be stressful about being on a talent show?","Why do people want to be famous?"]},{"id":"2018-5.3","no":"5.3","label":"Brisbane’s waterfront shows Hong Kong the way","intro":"This article appeared in an online blog:","title":"Brisbane’s waterfront shows Hong Kong the way","text":"Few places in the world have a more stunning natural asset than Victoria Harbour, yet there has been little effort to turn it over to public enjoyment.\n\nMy recent trip to the north Australian city of Brisbane made that obvious. There are no spectacular skyline views or night-time light shows reflected on shimmering waters. Yet the city’s council has turned their waterfront into a place of recreation and enjoyment for people to enjoy simple activities. There are 20km of floating walkways and bicycle paths, riverside restaurants, parks, gardens and even a beach.\n\nA free ferry service makes for leisurely travel between the business and shopping district, restaurants and attractions. Among the places I visited was the Greek Garden, a 1,500-square-metre area of land on the river’s south bank where herbs and vegetables are grown, largely by volunteers; it is essentially a kitchen garden aimed at showing how to grow food plants sustainably at home. The fresh produce is harvested and given away free from food carts. As well as the Greek Garden, an art gallery and performing arts complex, there’s a man-made beach, grasslands, rainforest, a pagoda, a giant wheel, plazas, walkways, a promenade, shops and restaurants.\n\nThe area, as with other riverside stretches, is lively and flourishing. Hong Kong’s harbour front is, by comparison, dull and boring. Tsim Sha Tsui’s Avenue of the Stars and the laser light show each evening are interesting, but the unfriendly environment of concrete paving and benches doesn’t encourage people to stay.","task":"You have been asked to propose facilities that could improve Victoria Harbour. The facilities should encourage more local people to visit the harbour. You may want to talk about:","points":["what people might enjoy doing at Victoria Harbour front","which facilities might be suitable for Victoria Harbour front","how the new facilities could best be promoted","anything else you think is important"],"ir":["Do you often go to Victoria Harbour?","What do you enjoy most on a visit to Victoria Harbour?","What would attract young people to visit Victoria Harbour?","Should the government do more to improve Victoria Harbour?","Should the harbour be for business or for pleasure?","What types of facilities at the harbour are attractive for families with children?","Should the government make Victoria Harbour more accessible to the public?","Would you say that Victoria Harbour is the symbol of Hong Kong?"]},{"id":"2018-6.1","no":"6.1","label":"Man arrested for flying drone to take photos in Hong Kong International Airport","intro":"This article appeared in a newspaper in Hong Kong:","title":"Man arrested for flying drone to take photos in Hong Kong International Airport","text":"A Sl-year-old man accused of flying a drone to take photographs in the restricted area of Hong Kong International Airport's departure terminal last week was arrested upon his return to the city on Monday.\n\nThe Hongkonger was picked up at the airport after flying in from Tokyo around midday, police said.\n\nHe was arrested on suspicion of breaking Airport Authority law on flight safety. The investigation showed the man was flying a drone to take photographs in the restricted area of the airport’s departure hall at about 1.30pm last Thursday before he took a flight to leave Hong Kong.\n\nPolice were informed after his photos were posted on the internet. Detectives from the airport police district were then assigned to track him down.\n\nAfter being identified, the man was placed on a list of persons wanted by police. He was stopped at the airport at noon, and police found the drone in his luggage.\n\nThe incident has prompted police to ask members of the public not to fly model planes or drones to take photos inside the airport.\n\nA police source said the man had flown the drone near a boarding gate while waiting for a Tokyo-bound flight for a holiday.\n\nHe posted the photos taken by the drone on his Facebook page, and they were quickly picked up by internet users and spread online.","task":"You are meeting members of your science group to discuss a project on drones. You may want to talk about:","points":["why drones are popular and useful","what problems drones might cause","what rules there should be about flying drones in Hong Kong","anything else you think is important"],"ir":["Would you like to have a drone?","Are drones popular in Hong Kong?","Where is a good place to fly a drone in Hong Kong?","Where would it be dangerous to fly a drone?","Why are drones good for taking photos?","How do you think drones will be used in the future?","How might drones be misused by some people?","How could the police use drones to reduce crime?"]},{"id":"2018-6.2","no":"6.2","label":"Fake News: There’s a LOT of it about","intro":"This article appeared on a blogger’s webpage:","title":"Fake News: There’s a LOT of it about","text":"A few years ago, lots of people online were talking about a video they’d seen about chicken McNuggets, The video said that chicken McNuggets were not made from real chicken, but something pink and horrible — people were so upset by the pictures that they said they’d never ever eat chicken McNuggets again.\n\nHowever, these images were fake because a while ago, I watched another video about how chicken McNuggets are actually made — and they are totally made from chicken.\n\nI realise it’s super-easy to post made-up stuff, sometimes even fake news, on the internet. I also know anyone with a camera can make a fake film that anyone ~ especially those who don’t go online very much ~ will believe. They’ll say they saw it \"all over the internet\", therefore it must be true.\n\nJ think if we believe everything we read online, whether it’s on Facebook, YouTube, or any other forum, without asking questions or thinking deeply about it, then we have a big problem. We need to double-check what we read online, and teach others to question what they read online, too.\n\nIt’s scary that we live in an age when anyone with access to the internet can publish their own \"news\", This is why journalism has become so important. A good journalist can protect us all from misinformation.","task":"Your group has to prepare a debate with the motion ‘The internet should be censored because it encourages fake news.’ You may want to talk about:","points":["arguments for the motion","arguments against the motion","which side would be easier to argue","anything else you think is important"],"ir":["What do you use the internet for?","Do you watch news on TV or on the internet?","Why do people spend so much time on the internet?","Do you trust everything you read on the internet?","Do you trust information in a newspaper more than on the internet?","What problems does fake news cause?","How can we raise people’s awareness about fake news?","Should governments control what is on the internet?"]},{"id":"2018-6.3","no":"6.3","label":"China schools seek to nip young love in the bud","intro":"This article appeared in a local newspaper:","title":"China schools seek to nip young love in the bud","text":"In recent weeks a number of mainland Chinese secondary schools have introduced new rules designed to discourage teenage dating and romance. Many people are unhappy about the new rules.\n\nIn one secondary school in Hangzhou, pupils of the opposite sex have been given a very important new instruction. They must maintain a minimum distance of half a metre from each other at all times. In addition, boys and girls are not allowed to go around school premises in pairs.\n\nAnother school, in the eastern city of Wenzhou, Zhejiang province, has banned what it calls \"close what \"close interaction\" really means.\n\nThe school authorities in Wenzhou have threatened \"severe punishment\" against offenders.\n\nSecondary schools in China admit students aged just 11 — they are just at the point when they become interested in the opposite sex.\n\nAnd with reports that teenage romance has become more popular at schools, school authorities — as well as parents — are worried that children’s academic performance is being affected.\n\nSome schools have moved to stop the young love with the implementation of tight measures — and they will certainly find support from some.\n\nMany Chinese regard teenage romance as something undesirable ~ a feeling that \"early love\" is immature love — and this helps explain why schools are increasingly teaching young people about the \"undesirable effects\" of dating.","task":"A parent has complained to your school principal about his child dating another student. Your class has been asked to discuss whether there should be guidelines about dating. You may want to talk about:","points":["whether you agree with the no dating rule adopted in China","the advantages and disadvantages of secondary school students dating","guidelines or advice schools should give students about dating","anything else you think is important"],"ir":["How do parents feel about students dating?","Is dating common among secondary school students?","Do students focus too much on their social life and not enough on their studies?","Have attitudes to dating changed since your parents were young?","Is dating good for developing social skills?","Should students tell their parents if they are dating?","How would you feel if your school stopped students from dating?","Do attitudes to dating in Hong Kong differ from those in China?"]},{"id":"2018-7.1","no":"7.1","label":"To reduce stress, sink into a sound bath (no water required)","intro":"This article appeared in a magazine in Hong Kong:","title":"To reduce stress, sink into a sound bath (no water required)","text":"Gong baths are a type of music therapy that have been used for healing for thousands of years. Canadian-born Martha Collard wants to help as many people as possible to lower stress in fast-paced Hong Kong. To do this, she set up Red Doors Studio, where she hosts gong baths. We gave it a try.\n\nWhat is a gong bath? Don’t be confused by the word bath — there is no water. It’s the sound waves that you ¢ are bathed in.\n\nHealing with harmonious sound, such as singing or drumming has been used to clear minds and bodies for thousands of years and gongs (basically flat metal drums) are ideal for this.\n\nHow does it work? Taking a gong bath is easy. You don’t have to do anything except lie down and close your eyes. Get under the comfortable blanket, have a lavender-scented eye pillow placed over your eyes and ... gong.\n\nHow does it feel?\n\nThe emotional effect was instant: I] had tears in my eyes and the hairs on my arms stood up. Collard says everyone’s reaction is different. \"Some people laugh, some cry.\" Immediately after the session I felt \"fuzzy\", as if in a dreamlike state but a few hours later I had intense focus and energy: I was \"buzzing\" so much that I found it difficult to sleep, something that never normally happens.\n\nDecision\n\nI will definitely make it a regular thing.","task":"Your school is going to use a room for music therapy. Your group has been asked to suggest a suitable music therapy activity to be introduced to the room. You may want to talk about:","points":["whether a gong bath would be suitable","other music therapy activities that might be suitable","how to promote music therapy at your school","anything else you think is important"],"ir":["Would you like to try a gong bath?","Do you think gong baths will become popular?","What do you usually do to relax?","Should schools use music and sounds to help students reduce stress?","Are students more stressed than adults?","What do you feel is the biggest cause of stress in Hong Kong?","Can stress be productive?","Do you think we should encourage more traditional ways of reducing stress?"]},{"id":"2018-7.2","no":"7.2","label":"End to printed handouts good green initiative","intro":"This article appeared in the letters to the editor section of a newspaper in Hong Kong:","title":"End to printed handouts good green initiative","text":"Lam campus. This green initiative was welcomed. ban on giving printed paper handouts to students. . other universities in Hong Kong as well. given for a very short period of time only. After the term ends, they will probably not be read again.\n\nsuch a tremendous waste of paper.\n\ncooperation that we can ensure the sustainability of our world.\n\nAnson C.Y. Chan, North Point\n\nEarlier this year, the University of Hong Kong banned the sale of disposable bottled water on its Pok Fu Now, in this new academic year, one department at HKU has implemented an unprecedented policy ~ a I believe this is the right thing to do, and the initiative should be adopted by other departments and the A semester at our universities lasts about three months, so students will use any handouts that they are Sometimes, lecturers even print out in-class activity materials that are only used for a few minutes. This is\n\nNearly all university students these days own laptops. These can be used to access online learning resources systems (in HKU and most of the other universities, it is called Moodle) onto which lecturers will upload teaching materials. As long as teachers upload their handouts, there is no need for printouts.\n\nThis can significantly reduce the amount of paper used for teaching purposes. It is through this kind of","task":"Your school is planning on introducing ‘paperless classrooms’. The school principal has asked students for their opinion on the idea. You may want to talk about:","points":["how schools can become paperless","what challenges there will be","whether you think it will be successful","anything else you think is important"],"ir":["Do you use a lot of paper at school?","How often do your teachers give you handouts?","Do you prefer working on paper or on a laptop?","Do your teachers let you do homework online?","Do you keep your school handouts and books after your exams?","Does modern technology, such as laptops, improve teaching and education?","Are some subjects better done with paper rather than online?","Does using IT help to improve the environment?"]},{"id":"2018-7.3","no":"7.3","label":"Employment traps","intro":"This article appeared on a government website:","title":"Employment traps","text":"Every summer vacation, many students look for summer jobs hoping to get pocket money and working experience. With limited life experience and an eagerness to seek jobs, students often fall prey to scammers’ employment traps which cheat them out of money, steal their personal data or even make them carry out illegal activities.\n\nWhen facing unfamiliar recruitment processes and procedures, students should stay alert and exercise caution. Before taking up any job offer, they should understand the nature of the job thoroughly and assess whether they can meet the job requirements.\n\nThey should never be tempted by an exceptionally high salary or they may get cheated out of money or end up committing crimes. Many students take any job that happens to come their way. They should pay attention to industrial safety and avoid taking up dangerous work, such as construction work, the operation of heavy machinery, handling of chemicals and corrosive substances, work processes involving extremely strictly follow all safety regulations.\n\nStay alert when seeking jobs. Watch out for employment traps. Tip 1: Watch out for offers that are too attractive Tip 2: Take good care of personal safety, personal data and belongings\n\nTip 3: Find out about your employer and study the employment contract\n\nTip 4: Be informed about current affairs and be ready to seek help","task":"You have been asked by the school careers advisor to help organise an activity to help raise awareness of employment traps students may face if they apply for a summer job. You may want to talk about:","points":["the advantages and disadvantages of summer work","how to raise awareness of employment traps for students","summer jobs that would be suitable for students","anything else you think is important"],"ir":["Would you like to have a summer job?","What can students learn from a summer job?","What summer job would you not enjoy?","Are young people more aware of these traps than in the past?","Is it easier to cheat younger people or older people?","What is a suitable age to start doing summer work?","Should parents encourage children to do summer jobs?","Should schools arrange summer jobs for students?"]},{"id":"2018-8.1","no":"8.1","label":"Growing use of animals in helping the sick","intro":"This article appeared in a newspaper in Canada:","title":"Growing use of animals in helping the sick","text":"Animal-assisted therapy was once rare and met with the objection that it would only make hospitals dirty, It is, however, increasingly popular in hospitals, according to an Ontario doctor.\n\nFrom watching goldfish swim to having a dog, animal therapy is used to help people relax and give comfort. Many hospitals and homes for the elderly now have animal therapy programs in place.\n\n\"People think it works and like the idea of it, so they do it,\" explains Maggie O’Haire, a doctor in Ontario University.\n\nOne challenge as the practice has become more widespread has been explaining how exactly it works. \"Positive changes from animal-assisted contact are varied and there is no single way that has yet been identified,\" says O’ Haire.\n\nThere are a number of theories, however. One is that humans have always enjoyed connecting with other living things. Another is the social support theory — the idea that therapy animals provide a form of simple support.\n\nIn the past ten years, animal-assisted therapy has greatly expanded. Today, programs exist that provide animals who assist with physical therapy, help tutor children in reading and provide comfort in different places such as disaster zones and university campuses.\n\nWhile research on the subject still has a long way to go, recently studies have shown that having a pet around can lower blood pressure, and the American Heart Association has stated that owning a dog may even lower the risk of heart disease.","task":"Your school principal is interested in keeping pets at the school as he believes that animal therapy is good for students. He has asked you to discuss the idea. You may want to talk about:","points":["the advantages and disadvantages of animal therapy","what types of animal would be most suitable for a school","how the animals could be looked after and help the students","anything else you think is important"],"ir":["Do you like playing with animals?","Would you like your school to have a pet?","Do you think students would be good at looking after a school pet?","Is Hong Kong a suitable place for animal therapy?","Should animals be allowed into hospitals?","What animals are suitable for the elderly?","What can looking after a pet teach people?","How does a pet provide emotional support for people?"]},{"id":"2018-8.2","no":"8.2","label":"No more Paper Money or Coins","intro":"This article appeared on a blogger’s webpage:","title":"No more Paper Money or Coins","text":"A quick question: what do you take with you when you leave your house? Keys, wallet, and your phone, right? And people in China? I can tell you, most of the time, I just take my phone and just like me, there are now millions of people in China enjoying this cash-free life. The Chinese are now living in the People’s Republic of Digital.\n\nSuper apps in China have changed our life, and introduced a new era where small change and cash has been left behind.\n\n[=] [=] All is needed is a QR code, which can be found everywhere from the largest shop i to the smallest stores. .\n\nWhat's a QR code? It’s a Quick Response barcode with a random pattern of tiny black squares against a white background. Shoppers pay by scanning the code with their phones after selecting their goods. No cash is needed in the transaction and everything can be paid by one swipe of your phone.\n\nThe fact is, every morning when I go to buy breakfast at the street cart vendor, my 4RMB Chinese jian bing (a kind of pancake with vegetables and eggs inside, which is really yummy by the way), I can just scan, beep and walk off with my pancakes!\n\nIt sounds like China’s started the transition to a cash-free economy faster than anyone could have imagined, Experts say by 2030 China will be for all intents and purposes, cashless!\n\nThis is China.\n\nStay tuned.","task":"Your Liberal Studies class is discussing how technology is changing society. Your group has been asked to d discuss a ‘cashless’ society. You may want to talk about:","points":["why many shops prefer people to pay by phone","what problems a cashless society may cause","whether Hong Kong should be cash-free in the near future","anything else you think is important"],"ir":["Do you prefer paying by cash or Octopus card?","What things do you need to pay for in cash?","Why do some people prefer to use cash?","Should you always carry some cash?","What problems can carrying cash have?","How would older people feel about a cashless society?","Are changes in technology always a good thing?","Is a cashless society a sign of a developed country?"]},{"id":"2018-8.3","no":"8.3","label":"Getting back to nature at city farms","intro":"This post on city farms appeared on a discussion forum:","title":"Getting back to nature at city farms","text":"Some of you guys probably know about rentable allotments or city farms but I thought I’d share my experience with people new to Hong Kong.\n\nI rent my city farm in Fu Tei near Tuen Mun. live in the neighbouring village but you can get there from Jordan on the KMB 63X very easily.\n\nAnyway, I rent about 150sqf for 300HKD per month. This price includes the use of all tools and the owner waters the whole farm once or twice a day as needed. She also sells everything else you need.\n\nIt is a great community atmosphere and is very busy on Sundays. Some people take it more seriously than others and I have seen some amazing vegetables come out of the ground around here.\n\nThere are no real regulations and as long as you don’t bother your neighbours nobody cares. Many people have barbecues there.\n\n[ve got carrots, beans, choi sum and some herbs planted. I’m never sure what my wife is growing but she has some vegetables growing also!\n\nAnyway, these allotments are all over the New Territories and you should be able to find them if you’re prepared to ask around the locals. Just thought T’d share this bit of info with you all and if anyone would like any further information or to come and have a look, feel free to ask!","task":"Your class teacher is interested in renting a small piece of farmland near your school. He has asked your group to discuss the topic. You may want to talk about:","points":["the benefits of renting a piece of farmland","whether students in your class would be interested in having a class farm","how to organise a class farm","anything else you think is important"],"ir":["Would you like to grow your own food?","Would you like to learn how to grow food?","Who would be more interested in farming: young people or older people?","Why is renting farmland becoming popular?","Do you think you would be good at farming?","Should schools teach students more about farming and nature?","Why are there so few farms in Hong Kong?","Do you think food tastes better if you grow it yourself?"]}]},{"id":"2019","year":"2019","label":"2019 DSE","tasks":[{"id":"2019-1.1","no":"1.1","label":"Redevelopment in Western District leaves residents without a good night’s sleep","intro":"This article appeared in a local newspaper:","title":"Redevelopment in Western District leaves residents without a good night’s sleep","text":"have any say in the redevelopment and are forced to leave.\"\n\nIf you took a walk around Western District just a couple of years ago, you would see mostly stationery shops, bakeries, grocers and university students eating in cha chaan tengs. For years, even with its proximity to Central, the old neighbourhood remained largely untouched, retaining its traditional characteristics and flavour.\n\nBut when three new MTR stations —- Sai Ying Pun, HKU and Kennedy Town — opened in the area in late 2014, they brought with them a whole range of bars and expensive restaurants that drew in young rich hipsters. Today, Western District is the new, trendy neighbourhood, with young professionals increasingly turning older buildings into expensive trendy flats, forcing many long-term residents to leave the area that has been their home all their lives.\n\n‘Traditional shops are forced to leave because of high rents: 250 of the 700 shops in the Sai Ying Pun area either changed tenants or closed down from 2015 to 2017.\n\nThere have been multiple complaints from residents about noise from bars and restaurants. \"For families and the elderly in this area, they are disturbed by the noise every day and can’t afford to shop,\" one netizen said. \"We can’t stop the world from developing, but there has to be a balance.\"","task":"Your class is discussing the redevelopment of older districts in Hong Kong. Your group has been asked to discuss the problems redevelopment causes. You may want to talk about:","points":["why old districts are redeveloped","what problems.redevelopment cause","what the government should do to reduce the problems residents face","anything else you think is important"],"ir":["‘What do you like about the area you live in?","What is the biggest advantage of redevelopment?","‘What types of shops are typical of old neighbourhoods?","Why do older people like to live in traditional districts?","What would you like to change about your district?","Would you prefer to live in an old neighbourhood or a redeveloped area?","Is the redevelopment of old areas too slow in Hong Kong?","Who benefits most from redevelopment?"]},{"id":"2019-1.2","no":"1.2","label":"Four types of wedding photos to capture your big day","intro":"This article appeared in an online magazine:","title":"Four types of wedding photos to capture your big day","text":"Choosing the style for your wedding photos can be one of the trickiest decisions you have to make in planning for your big day. Read on to find out the four main styles:\n\n1. Creative: Some photographers use unusual and creative situations to take memorable wedding photos. One interesting photo taken by a famous photographer shows a happy couple in the bathroom with the husband sitting on the toilet and the wife in the bath!\n\n2. Glamour: Some wedding photography looks so good it could be a famous couple in a magazine spread. Posing at a beautiful location in Hong Kong has always been popular. In recent years, though, travelling to glamorous places in Europe and Japan has become common as couples look for more and more exciting and glamorous locations.\n\n3. Storytelling: Storytelling means photographing a wedding in a true or natural style. It should be fun and light-hearted, but also capture the various feelings the couple go through during their wedding. Often there are no famous buildings or backgrounds; the focus is on the relationship between the couple.\n\n4, Studio: The most traditional way of taking wedding photos is to book a studio. The advantage of shooting indoors is that all factors such as weather and light are under control. The couple are able to change into a number of different outfits. The studio also offers a more private setting and allows for more personal and detailed photographs.","task":"Your class teacher is getting married. She has asked you about what type of wedding photos you like best. You are discussing this With your group. You may want to talk about:","points":["why wedding photographs are important","what is important for wedding photos to show","which style you think is most popular","anything else you think is important"],"ir":["Do you like people taking photographs of you?","Have you ever been to a wedding?","What photographs do you like to share?","What do people do with their wedding photographs?","Would you like to spend a lot of money on a wedding?","‘Which is more important: a wedding photo or a wedding video?","Are professionally taken photos still important nowadays?","Are weddings still important in Hong Kong?"]},{"id":"2019-1.3","no":"1.3","label":"Online Scams: Get Wise!","intro":"This article appeared in an online blog:","title":"Online Scams: Get Wise!","text":"More and more Hong Kong people are being cheated online. Not only is the number of crimes increasing, but the amount of money being stolen is also increasing. And what’s more, you have to be vigilant ‘cause these online scams can come in all shapes and forms. The most common at the moment are:\n\nDating and romance scams Scammers create false IDs on dating websites. Once they’ve got\n\nyour trust, they ask to borrow money which, needless to say, is never , \"84 TOP ONLINE repaid. In September 2018, a local woman was cheated out of more SCAMS than 100, million dollars by her online boyfriend. ~ .\n\nComputer hacking Emails are often used to trick people out of passwords or to use software to spy on people as they use their\n\nown computer. Once they have your password they can hack into your account (or accounts if you’re stupid enough to use the same password for multiple accounts) and take control of...well, your life!\n\nOnline shopping scams A common scam is not getting what you paid for. A scammer will sell a product, but send a faulty or an inferior product or sometimes won’t send any product at all.\n\nBanking and credit card scams\n\nScammers send text messages and emails that pretend to be from a bank or financial institution. They usually claim there is a problem with your account and request details. They then use these details to steal money from your account. .","task":"The police will be- visiting your school to talk about online crimes. Your teacher has asked your group to discuss this problem first. You may want to talk about:","points":["whether online crime is a serious problem in Hong Kong","what type of online crimes students should worry about most","how students should protect themselves","anything else you think is important"],"ir":["Do you spend much time online?","Do you ever shop online?","Would you make friends with someone online?","Should online safety be taught in schools?","Is it possible to make real friends on the internet?","Why is the number of online crimes increasing?","What kinds of people are likely to be cheated online?","Who should be blamed for online scams?"]},{"id":"2019-2.1","no":"2.1","label":"Today I saw a fortune teller in Hong Kong...","intro":"This text appeared in the author’s personal blog page:","title":"Today I saw a fortune teller in Hong Kong...","text":"Fortune telling is one of the oldest professions in the world, and it still plays a critical role in Hong Kong. it’s much more a science than you think. Keen to experience the real Hong Kong culture, my friend and I went off to Temple Street and once there decided to go with the palm and face reading. We sat on our plastic stools, bargained the price and got started.\n\nI go first. The only thing the fortune teller asks me is my date of birth. He looks at his books of Chinese zodiac for a moment, then observes my face intensely...\n\n...After a while, he starts describing my life accurately! My job, how I love the outdoors, even my plans for the future. So far I’m quite impressed, he’s really getting the details right. This guy is good. He sees that something changed in 2012, I went in a whole new direction in my life — the year I quit my job to travel the world. He didn’t ask if I was in a relationship, but he starts describing my husband — a handsome man ~ and the relationship accurately. He looks at me with a very serious expression and insists: he is not the right man for you. .\n\nAfter fifteen minutes talking, the fortune teller is exhausted. To be honest, so am 1. I came just as a curious traveller, and ended up a believer. And worried about my husband!","task":"Your class is doing a project on Hong Kong culture in the 21st century. Your group has been asked to discuss the art of fortune telling. You may want to talk about:","points":["why people like going to fortune tellers","why fortune telling is an important part of Chinese culture","whether fortune telling will remain popular in the modern world","anything else you think is important"],"ir":["Would you go to a fortune teller?","Do you believe in fortune telling?","Do you want to know about your future?","‘What kind of people believe in fortune tellers?","Would you like to study fortune telling as a subject?","Do you believe some people are born lucky?","Do fortune tellers take advantage of people?","Should fortune tellers need a licence to practise?"]},{"id":"2019-2.2","no":"2.2","label":"Apple Screen Time Control","intro":"This review appeared in a tech magazine:","title":"Apple Screen Time Control","text":"Are your children always on their phones and iPads? Do you, as a parent, worry about the websites your children are visiting? Does your family argue over screen time?\n\nThe answer may well be Apple’s new Screen Time Control.\n\n‘Screen Time Control is a new app that allows parents to manage the amount of time their children spend on their iPad or iPhone by using their own iPhone to check the websites or apps their children are using.\n\nScreen Time Control also has a feature called \"Downtime\". This allows parents to block certain apps and to set up a time limit of how long children can spend on their phones. That means no more late-night phone calls, unlimited playing of online games or watching YouTube videos.\n\nWith Apple Screen Time Control, when apps run past the time limit, their icons go dark and the apps simply won’t work. Useful apps, such as e-books or homework sites or messaging for emergencies are not affected.\n\nApple already has parental controls for blocking certain movies, adult websites and podcasts with explicit language but this new feature will allow parents better control over how children use their devices.\n\nSo a neat new app to help parénting, although I would always recommend that it is best for families to have serious conversations about screen time. It’s only through a mutual understanding about why the restrictions are imposed that ail family members can understand them.","task":"Your school is a holding a meeting to introduce Apple’s Screen Time Contro] to students and parents. Your group is meeting to discuss the idea. You may want to talk about:","points":["whether parents should control students’ screen time","advantages and disadvantages of Apple Screen Time Control","whether software like Apple Screen Time Control is the best way to limit students’ screen time","anything else you think is important"],"ir":["Do you spend a lot of time online?","Does being online affect your homework?","Would you like your parents to control your screen time?","Why do you think students spend so much time on their phones?","What is the biggest problem caused by too much screen time?","Does spending time on your phone affect family relationships?","Should parents know everything their children do online?","Can students be trusted to control their own screen time?"]},{"id":"2019-2.3","no":"2.3","label":"Learning from little Iceland","intro":"This article appeared in a local newspaper:","title":"Learning from little Iceland","text":"In recent years, Iceland, a tiny country of just 350,000 people has become surprisingly successful in international football. Ten years ago, they did not even rank in the top 100 of the FIFA World Rankings, but have now jumped up to 22nd place, drawing 1-I with Argentina at the World Cup and beating England before that.\n\nThe Hong Kong Football Association (HKFA) sees Iceland as a great example of what could be done to improve local football. Both Hong Kong and Iceland face similar problems such as the lack of locations to play the sport and a lack of players. The difference lies in the fact that Iceland has invested money in building playing facilities and in training coaches.\n\nHoping to ‘earn from Iceland’s example, the HKFA will send representatives to Iceland to lea how to improve. Perhaps the most exciting part of all is that the Hong Kong youth team will travel to Iceland for ten days to play, allowing our young players to experience Western football and its culture.\n\nCritics of the $I million project argue that such a scheme cannot solve the real problems of Hong Kong football and sport in general. Those in charge of sport in Hong Kong are often accused of not having the interests of the athletes at heart. The head of the Olympic committee came under fierce criticism in the 2014 Winter Olympics for taking six officials to the Olympics but no doctor for the competing athlete.","task":"Your class is doing a project on \"The Importance of International Sport’. Your group has been asked to discuss the development of sport in Hong Kong. You ma
