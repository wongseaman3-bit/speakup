tch TV programmes about history?","Did you learn much about the history of Hong Kong at school?","Do you like visiting historical places?","Which historical figure do you admire?","Would you like to live in the past?","Why is it important to learn about history?","Do you think history often repeats itself?"]},{"id":"2016-5.3","no":"5.3","label":"Are young people losing the ability to read emotions?","intro":"This article appeared in a newspaper in the United States:","title":"Are young people losing the ability to read emotions?","text":"Children’s social skills may be declining as they have less time for face-to-face interaction due to their increased use of digital media, according to a study. Scientists conducted a study on American sixth-graders, aged 13-14 years old. These students reported that they text, watch television, and play video games for an average of four-and-a-half hours on a typical school day.\n\nAt the beginning of the study, students were evaluated for their ability to recognize other people’s emotions in photos and videos. The students were shown 48 pictures of faces that were happy, sad, angry or scared, and asked to identify their feelings. They were divided into two groups and then, one group of students was sent to a camp for five days where they weren’t allowed to use electronic devices.\n\nAfter five days, all students were asked to look at another set of photos. The children who had been at the camp improved significantly in their ability to read facial emotions and other nonverbal cues to emotion, compared with the students who continued to use their media devices.\n\n\"This research shows a model of what more face-to-face interaction can do,\" the researcher said. \"Empathy is our ability to identify what someone else is thinking or feeling, and to respond to their thoughts and feelings with an appropriate emotion. When children grow up without the ability to empathize, they won’t trust others or develop creativity.\"","task":"You are members of the Student Union and are concerned about students’ use of electronic devices. You may want to talk about:","points":["the negative effects of electronic devices on young people","why developing social skills is important","whether young people should be encouraged to have more face-to-face interaction","anything else you think is important"],"ir":["Which electronic devices do you spend most time on?","How do you usually communicate with your friends?","Could you live without electronic devices?","Can electronic devices affect people’s ability to make new friends?","Do you think students should spend more or less time using electronic devices?","How do electronic devices affect people’s social life?","In your opinion, should parents control children’s use of electronic devices?","Is the overuse of electronic devices a problem in Hong Kong?"]},{"id":"2016-6.1","no":"6.1","label":"Walking in Hong Kong","intro":"Below is an extract from a Hong Kong magazine:","title":"Walking in Hong Kong","text":"Hong Kong’s streets are like no other place in the world, and walking through the city’s streets is part of what shapes us into such a unique community. Unlike the inhabitants of car-reliant North America, walking is a daily activity for us all. With one of the world’s best public transport systems, we walk from home to the station or bus stop; we use our feet to shop, eat or simply wander, taking in the vibrant street life that surrounds us. We city-dwellers love it, and why not? It’s carbon-neutral and it keeps us fit.\n\nIncreasingly, however, street-level crossings are being wiped out, and pedestrians are being directed to a succession of footbridges and underground tunnels. While Hong Kong is dense and some layering is necessary, these aerial networks keep us away from our own streets, and our own sense of community.\n\nLandscape architect Gavin Coates says, \"Since the 1950s everything has been completely car-oriented. The result today is an extremely unfriendly environment for pedestrians. London, New York, and Paris have all moved on... there has been a dramatic shift in terms of their thinking while Hong Kong seems stuck in the 1960s. Our city is for people, not for cars. The vehicles-first mentality seems absurd in Hong Kong where only about 6.67 percent of the population own a car. If the majority of the population doesn’t own a car, why are drivers given such importance?\"","task":"Your group is designing a campaign leaflet to make Hong Kong a more walkable city. You are brainstorming ideas for the leaflet. You may want to talk about:","points":["the challenges people face when walking through the streets of Hong Kong","suggestions for improving the street conditions for pedestrians","content and organisation of the leaflet","anything else you think is important"],"ir":["Do you prefer to walk or to take the bus?","How much walking do you do every day?","What’s the furthest you have ever walked in one day?","What useful things could you do while walking?","Do you think walking is the best way to keep fit?","Do you prefer walking on the beach, in the countryside or in the city?","How would the area where you live change if no vehicles were allowed?","Which part of Hong Kong do you think could be pedestrianised?"]},{"id":"2016-6.2","no":"6.2","label":"Be thankful, Hong Kong: five other ways Singapore is stricter","intro":"Below is an extract from an article about some of Singapore’s laws:","title":"Be thankful, Hong Kong: five other ways Singapore is stricter","text":"In defence of the MTR’s recent crackdown on passengers breaking its rules by taking \"oversized\" luggage on trains, the Hong Kong government reasoned that Singapore has far stricter laws.\n\n1. Thenext time you and your friends take a group pic inside an MTR train, know that you’ ve just enjoyed one of Hong Kong’s wonderful liberties, because Singapore prohibits snapping photos on all trains.\n\n2. Forgot your towel after you’ve finished showering? You can make that trek across the living room naked if you choose. But in Singapore you would be breaking the law if in public view and could be fined up to $$2,000 (HK$11,245) and thrown in jail for three months.\n\n3. If you forget to flush a public toilet in Hong Kong, the worst punishment you’d get is a scolding. Over in Singapore, you’d be committing a crime and could be fined $$150.\n\n4. Littering is no excuse, but sometimes we can be forgetful with our rubbish. In Singapore, the first offence could be an instant fine of up to $2,000, and with a third offence you may have to clean the streets while wearing a sign that says, \"I am a litterer\".\n\n5. Suffering from bad breath? Here, we can buy gum at any 7-11 for a quick fix. But in Singapore, you\n\n! 4 4 4\n\nwouldn’t be able to find any because selling gum is strictly forbidden.","task":"Imagine the Hong Kong Government is proposing to introduce the five laws above in line with Singapore. In your group discuss this proposal. You may want to talk about:","points":["some reasons why the Government would like to implement these laws","possible consequences of implementing these laws","the fairness of the punishments mentioned in the article","anything else you think is important"],"ir":["Should chewing gum be banned in schools?","Do you think you should be allowed to eat or drink on the MTR?","Do you think littering is a serious problem in Hong Kong?","What rules did your parents make you follow when you were younger?","Do you think Hong Kong should have similar punishments to Singapore for littering?","If you had the power to make a new rule in your school, what would it be?","Which of the laws in the article would annoy you most?","Do you think harsher punishments reduce crime?"]},{"id":"2016-6.3","no":"6.3","label":"Teddy bear-themed coffee shops to open in China","intro":"Below is an extract taken from a Hong Kong newspaper","title":"Teddy bear-themed coffee shops to open in China","text":"From Japan’s Hello Kitty to America’s Charlie Brown, themed coffee shops are increasing in mainland cities, where most coffee drinkers still tend to focus more on the café experience than the coffee itself.\n\nAdding to that list is the Great British Teddy Bear, a new company that aims to open 100 coffee shops in 12 mainland cities. There is a growing interest in British culture on the mainland, where British-style school uniforms and British TV dramas have remained popular.\n\nBesides coffee, desserts and traditional British afternoon tea, the cafés will feature famous character bears including Sherlock Holmes, The Queen, the British policeman and Shakespeare.\n\nCustomers can drink tea and eat cucumber sandwiches from old-style British cups and plates. Police helmets will be used as lampshades in the coffee shops, with bowler hats as wall lights, while illuminated windows will reveal famous British views including Big Ben and the Houses of Parliament.\n\nTeddy bear-themed coffee shops are not new to major Chinese cities, but company founder Paul Jessup believes there is still a place in the market for an authentic British brand. \"More Chinese are learning to appreciate Western culture as they seek greater quality in their life. We find the time has arrived to offer the public something truly British.\"","task":"As part of an extra-curricular Business Studies course, your group is going to present ideas for a Hong Kong-themed coffee shop in Shanghai. You may want to talk about:","points":["what items you could sell in the coffee shop","what you would like to promote about Hong Kong","how you would decorate the coffee shop","anything else you think is important"],"ir":["Do you go to coffee shops?","Would you like to go to a teddy bear coffee shop?","Do you think there are too many western-style coffee shops in Hong Kong?","Why do you think western-style coffee shops are so popular in Hong Kong?","Do you think a Hong Kong-themed coffee shop would be popular in China?","Do you think a teddy bear coffee shop would be popular in Hong Kong?","What theme would be popular in a coffee shop in Hong Kong?","How important is the atmosphere of a coffee shop?"]},{"id":"2016-7.1","no":"7.1","label":"All Kids are Winners in American Schools","intro":"Below is an extract from a newspaper article:","title":"All Kids are Winners in American Schools","text":"Recently, I got a phone call from my son’s football coach. My son’s team didn’t win the toumament, but the coach called to ask whether I’d like to order a trophy for my son anyway. I didn’t know what to say. Sure, I'd heard of participation prizes, but I was expecting little pencils and erasers, not trophies that looked exactly like the ones the real winners got.\n\nThese days, even the term \"winner\" can get you into trouble. Today, it’s all about every child at their own pace and how we’re all \"winners\".\n\nWhen I was a kid, I wasn’t very good at sports and although it was painful to always be the last person to be picked for the team, I did learn something really valuable — how to lose. Losing builds character and toughness in a way that nothing else can.\n\nYet, fewer and fewer kids these days are learning this important lesson. According to a recent study by the Chance to Shine charity, most schoolchildren would be \"relieved or not bothered\" if competitive games were disallowed. Some schools in Singapore, for example, have started to ban some playground games, because they put too much pressure on some kids.\n\nI understand that losing is discouraging and that kids sometimes need to experience the excitement of winning in order to gain confidence, but I worry that, in our rush to protect our kids, we could be doing more harm than good.","task":"In preparation for writing an essay, your group is discussing whether Hong Kong schools should treat all children as winners. You may want to talk about:","points":["the pros and cons of giving trophies to losing teams","whether learning how to lose is an important lesson to learn","whether certain competitive games should be discouraged at school","anything else you think is important"],"ir":["What competition would you like to win?","How do you feel when you lose?","Are you very competitive?","Do you feel any pressure to win at school?","How important do you think trophies are?","In sport is winning the only important thing?","Do you think coming second is equal to losing?","Do you think the pressure to win in sport encourages cheating?"]},{"id":"2016-7.2","no":"7.2","label":"Oxford Dictionary Word of the Year","intro":"This article appeared in an online newspaper.","title":"Oxford Dictionary Word of the Year","text":"Oxford Dictionary 2015 word of the year is difficult to pronounce because it has no letters. It is a cartoon yellow face, shedding two giant tears. They are not tears of sadness but tears of joy. The image shows the \"playfulness and intimacy\" of emoji or emoticon culture.\n\nEvery year, Oxford Dictionary chooses a word that captures the year’s biggest trends or changes in the English language. The tiny illustrations that appear on social media and text conversations have seen a surge in popularity in recent years. \"You can see how traditional alphabet scripts have been struggling to meet the visually focused demands of 21st century communication,\" said Oxford Dictionary’s president. \"It’s not surprising that a pictographic script like emoticons has stepped in to fill those gaps.\" The Oxford University Press’s selection of a pictograph reflects the huge power behind these simple images as people, especially smartphone users, increasingly choose emoticons over words in electronic conversation.\n\nOthers, however, believe that this may lead to a dumbing down of nue civilization. For example, \"we’re out of toilet paper\" can be eee\n\nexpressed as:\n\nThe idea of a picture-based language that can be read by everyone is charming, but remember that a person can say only so much with pictures, Without written words, how do people evaluate, debate and advance new ideas? However, language is always changing and now\n\nlanguage is evolving again in the digital era.","task":"Your group are members of an English club and are discussing ways people cozamunicate in the 21st century. You may want to talk about:","points":["the advantages of using emoticons to communicate","whether an emoticon is a good choice for Word of the Year","whether picture-based language will grow more or less popular in the future","anything else you think is important"],"ir":["Do you use emoticons when you send text messages?","Which emoticons do vou like most?","Do you communicate with your parents using emoticons?","How do you feel when you receive a text message in emoticons?","Do you think people will forget how to write properly if they keep using emoticons?","What problems may occur if messages only contain emoticons?","Do people interpret emoticons in different ways?","Does the choice of an emoticon as Word of the Year signal a dumbing down of civilization?"]},{"id":"2016-7.3","no":"7.3","label":"Meditation in school","intro":"Below is an extract from a newspaper about practising meditation exercises at school in the U.S.:","title":"Meditation in school","text":"Linda Ryden, a teacher at Lafayette Primary School in Washington, leads about 500 of the school’s students in weekly courses on meditation. Meditation is a practice aimed at enhancing self-awareness and reducing anxiety by focusing, without judgment, on the present moment. \"Close your eyes and take three deep breaths,\" she instructs her students, who fall into a familiar rhythm of silently counting their breaths.\n\nWith research linking meditation to improved focus, mood and behavior, the movement has ballooned, spreading from health-care institutions to well-known companies, the military and athletics. Now, it’s increasingly being used at schools and with children.\n\nWith high-stakes tests beginning in elementary school, increasingly overscheduled afternoons and pressure to do more demanding extracurricular activities at ever-younger ages, kids are feeling overwhelmed. Supporters of meditation hope the practice can help them cope with the demands.\n\nThe idea of getting restless kids to sit still or anxious teens to meditate might seem unrealistic. But kids often enjoy it, readily turning to the practice as a way to self-soothe, and taking the techniques home with them.\n\n\"When I’m mad, and I get into a fight with my brother or anyone in my family, I go up to my room, and I start meditation, and it calms me down so things get back to normal,\" says Jacopo Cascone, one of Ryden’s fourth-grade students. \"I thought it was weird at first,\" he says, \"but now I realise it totally helps with everything in my life.\"","task":"The Education Bureau is considering whether meditation training should be introduced into secondary schools in Hong Kong. Your group is discussing whether this is a good idea. You may want to talk about:","points":["why it might be necessary to teach students meditation","ways it could be introduced into schools","possible problems faced by schools","anything else you think is important"],"ir":["What do you do to help yourself relax?","Do you think you would enjoy taking a meditation class?","What makes you feel calm?","Did you feel under a lot of pressure at your primary school?","Are you good at controlling your emotions?","What things frustrate you in life?","Do you think meditation is a useful way for a person to spend their time?","How could meditation training help the army or athletes?"]},{"id":"2016-8.1","no":"8.1","label":"Twin-credible! Secondary school with 20 sets of twins","intro":"Below is an article taken from a local English newspaper:","title":"Twin-credible! Secondary school with 20 sets of twins","text":"De Aston School, a secondary school in Lincolnshire, England, has a record-breaking number of twins in attendance. Among the 907 pupils enrolled at the school, there are 20 pairs of twins, 12 of whom are identical. Most incredibly, the school welcomed six sets of identical twins this past September, all of whom started grade seven.\n\nStunned teachers at the school say they have never seen anything like it and believe there must have been \"something in the water\" in the local area.\n\nSince the school requires students to dress in identical blue and white uniforms, it’s proven difficult for the teachers to tell the siblings apart. Most of the twins have also found it confusing, with their classmates and teachers having trouble telling them apart. Kieron and Calvin Chow, 14, both say they are often mistaken for one another, even by their teachers, and Charlotte and Stephanie Rae, 14, say they would like to be treated more as individuals in day-to-day life.\n\nWhether it’s 15-year-old Nicole and Macy Yuen, who say they answer the same questions with the same answers at the same time, or 11-year-old Charlotte Kaur, who came down with a headache after her identical twin Emily banged her head, there really is a touch of twin magic in De Aston’s classrooms.\n\nEllenor Beighton, De Aston School's headteacher, said: \"All of our twins are delightful young people who we treat as individuals and we’re very happy to have them here.\"","task":"Your group is doing a school project on the subject of twins. This is your first meeting and you are brainstorming ideas. You may want to talk about:","points":["possible content for the project","how you are going to get the information you need","how you could present your project","anything else you think is important"],"ir":["Do you know any twins?","Would you like to be a twin?","What difficulties might the parents of twins have?","Do you think identical twins should be put in separate classes?","In the future would you be happy to be a parent of twins?","What do you think are the benefits of being a twin?","If you were an identical twin, do you think you would dress the same?","What do you find interesting about twins?"]},{"id":"2016-8.2","no":"8.2","label":"Young people are drinking less so they don’t look bad on Facebook","intro":"This article appeared in a newspaper in the United Kingdom:","title":"Young people are drinking less so they don’t look bad on Facebook","text":"A new study in the UK has found that people aged 16-24 are drinking significantly less alcohol, with 27% giving up alcohol, almost a 10% increase from 10 years ago. At the same time, young people binge-drinking (drinking a lot at once) has fallen to 18%. Interestingly, the changes in young people’s drinking don’t seem to be because of health reasons. A concern much more important than liver damage? Facebook embarrassment.\n\nAccording to the Office for National Statistics (ONS), young people are scared of being shamed on social media with drunk photos and Twitter evidence of their embarrassing behaviour. The ONS says ‘Young people who spend a lot of time online are quite happy to tag photos of their friends who are drunk and passed out on the floor, but are more concerned about being tagged themselves. This might curb their behaviour.’\n\nThe convenience of sharing photos with friends (and non-friends) through social networking sites and blogs is undeniable. People forget however that anything posted on Facebook or anywhere else on social media can come back to haunt them in the future. Even if a person deletes a photo, it will continue to live on if another person has shared it. In addition, tagging, or identifying people on social media pictures, poses dangers such as revealing a person’s name, what they look like, and their location when the picture was uploaded.","task":"You are members of the Peer Counselling team concerned about students’ behaviour on social media (e.g. Facebook, Twitter, Instagram, WeChat, Weibo). You may want to talk about:","points":["whether it is important to present a good image on social media","what is acceptable behaviour on social media","other problems young people have using social media","anything else you think is important"],"ir":["Do you post photos on social media?","What kinds of photos do you post on social media?","Do you like looking at other people’s photos?","What kinds of photos would you not share with friends on social media?","Do you mind if people tag you without your permission?","Do young people feel pressure when using social media?","Do you think the use of social media should be monitored?","Do you judge people based on what you see on social media?"]},{"id":"2016-8.3","no":"8.3","label":"4 Cool Biking Gadgets for the Keen Cyclist","intro":"Below is an extract from a technology and design webpage:","title":"4 Cool Biking Gadgets for the Keen Cyclist","text":"In this technology-dominated day and age, your cycling experience can be made safer and more enjoyable with these four modern gadgets.\n\nWireless Bicycle Turn Signal\n\nThis under-seat turn signal unit is battery-powered, has ultra-bright LED lights and will emit a loud beeping sound when you make a turn. The signals are activated wirelessly using a push-button controller attached to your bicycle’s handlebar. [HK$560]\n\nBoom Bottle\n\nThe Boom Bottle is a wireless Bluetooth speaker designed for outdoor activity. It fits perfectly in a bicycle water bottle cage, and is waterproof. The Boom Bottle also has a built-in microphone, so it can work as a speakerphone. The rechargeable battery offers 10 hours of use and the Boom Bottle comes in pink, grey, blue, yellow and green. [HK$1120]\n\nRevolights Revolights are rings of LED lights mounted onto your wheels ensuring that you are visible from the front, back and side. [HK$1120 per wheel]\n\nHovding is an inflatable helmet, worn around your neck. It uses sensors to detect when a crash occurs, and immediately inflates itself to protect your head. It can only be used once, but it does have an external shell that can be changed to match the colour of your outfit. [HK$4400]","task":"You are all members of your school’s Bicycle Club. You are going to give a talk about bicycle safety in Hong Kong and recommend two of the gadgets above to your club. You raay want te talk about:","points":["how to be safe when cycling in Hong Kong","the advantages and disadvantages of the gadgets advertised","which two you would recommend","anything else you think is important"],"ir":["Do you ride a bicycle?","Do you think it is safe to ride a bicycle in Hong Kong?","Why do you think few people ride bicycles in Hong Kong?","Do you think cycling is becoming more popular in Hong Kong?","Do you think there should be more cycle paths in Hong Kong?","Do you think all cyclists should wear a helmet?","Do you think cyclists should be allowed to take their bikes on the MTR?","What can the Government do to encourage more people to cycle in Hong Kong?"]},{"id":"2016-9.1","no":"9.1","label":"French city gets ‘short story vending machine’ in public areas","intro":"This article appeared on a social media site:","title":"French city gets ‘short story vending machine’ in public areas","text":"Technology has truly invaded our lives; from tablets to smartphones, there is no time which could be called a ‘no screen time’. Grenoble in France wants to help people utilise their monotonous waiting time by reading short stories which are ‘dispensed’ from a machine. It’s an interesting experimental project that aims to help people do something better than fiddling with their mini gadgets while they are waiting. It also hopes to bring back the culture of reading literature that is lost in a technological world.\n\nThe short story vending machines deliver good quality popular literature to people waiting in public spaces, just like the way soft drinks are dispensed. The original stories have been written by established authors from the community and also by new authors who want to publish their work. However, the best part about these vending machines is they are free to use. In all, there will be eight machines spread across the town: at the town hall, the tourist office, libraries and in social centres.\n\nUsers have the option to choose the length of the literature depending on the time they have to kill. The ‘three minute’ format, for example, takes the form of a piece of paper that’s 8 X 60 cm in size, while the \"five minute’ version could be double the size.\n\nSo the next time you have to wait for your friend to arrive, you will have enough stories to tell when you meet.","task":"Your group is part of a reading club and you are discussing ways to encourage the reading of literature. You may want to talk about:","points":["whether fewer people are interested in reading literature than before","whether short story vending machines will encourage people to read more literature","other ways to promote the reading of literature","anything else you think is important"],"ir":["Do you like to read stories?","What do you like to read?","Do you think you would use a short story vending machine?","What do you usually do while you’re waiting?","Should readers have to pay for stories from vending machines?","Will short story vending machines replace electronic reading devices?","Would short story vending machines be popular in Hong Kong?","What are the benefits of reading literature?"]},{"id":"2016-9.2","no":"9.2","label":"Should Hong Kong schools be doing more for left-handed children?","intro":"Below is an extract from a recent news website:","title":"Should Hong Kong schools be doing more for left-handed children?","text":"In Hong Kong more than one in 10 children are left-handed and face problems using right-handed implements and equipment that can leave some feeling clumsy and uncoordinated.\n\n\"My son is left-handed and left-footed,\" says Mrs Chan. \"There doesn’t seem to be much consideration given to left-handers at his school. He is good at sport, and they are playing hockey this term in Year Six, but with right-handed sticks. The violins and recorders sent home for practice are also for right-handers. His handwriting is illegible and he hasn’t been taught to hold his pencil properly.\" Handwriting is certainly more challenging for left-handers as their writing is often blocked from view and easily rubbed and messed up by their writing hand.\n\nDespite the increase in equipment such as non-smudge pens, specially designed scissors, and a wider range of musical instruments such as left-handed guitars, left-handed children still have to overcome the frustrations of living in a right-handed world. They have to struggle with everyday tasks such as manipulating zips and buttons when dressing.\n\nBut it is not all gloom for left-handers. Researchers are unsure why, but left-handers have a greater chance of having a higher IQ. Also, it can be an advantage to be left-handed in certain sports such as tennis, and being a left-footer is often sought after in soccer teams. Look on the Internet and find the famous inventors, scientists, entrepreneurs and sports people who are left-handed.","task":"Today is International Left-Handers Day. Your group is organising activities for the day at your school. You may want to talk about:","points":["some of the frustrations that left-handed people experience","how these difficulties can be overcome","activities you may organise for the event","anything else you think is important"],"ir":["Do you know any left-handed people?","How well can you use your left hand?","Can you use both hands and both feet equally well?","Do you think it would be a good idea to celebrate an International Left-Handers Day?","Do you think left-handers have an advantage in sports?","Do you think left-handers are more creative than right-handers?","Do you think left-handed children should be forced to become right-handed?","Do you think ail children should be taught to use both hands well at an early age?"]},{"id":"2016-9.3","no":"9.3","label":"Text Walking Lanes for Smartphone Addicts","intro":"This article appeared in a newspaper in the United States:","title":"Text Walking Lanes for Smartphone Addicts","text":"There’s a \"culture of walking and texting\" on the Utah Valley University (UVU) campus but that’s not the main reason UVU came up with an idea to paint a \"texting lane\" on a staircase. It was first and foremost a design project, inspired by the massive number of kids walking around with their faces buried in their iPhones.\n\n7 nen \"You have 18-24 year olds walking down the hall with smartphones, you’re almost bound to run into someone somewhere; it’s é something we’re dealing with in this day and age,\" the Principal said, \"Preventing accidents isn’t the reason we did it—we did into engage the students. It’s meant to be there for people to look at and enjoy.\"\n\nNational Geographic Museum drew similar lanes along a stretch of street in Washington D.C. It was an experiment for a TV series on behavioural science called \"Mind over Masses.\" However, this caused confusion in the city because some people followed the lanes while others just ignored them.\n\nWill these walking lanes have much of an impact? Considering that those who text and walk probably don’t pay much attention to their surroundings in the first place, it’s likely they won’t even notice the change. Regardless, these texting lanes have sparked conversation about distracted walking, and that’s always a good start in pointing out a major societal problem.","task":"Your group is part of the Student Union and you are discussing ways to raise awareness about texting while walking. You may want to talk about:","points":["the problems caused by using smartphones while walking","whether texting lanes can help to solve these problems","other ways of making people aware of the dangers of texting while walking","anything else you think is important"],"ir":["Do you use your smartphone while you are walking?","Would you walk in a texting lane?","Why do people use their smartphones while they are walking?","Are you aware of your surroundings when you use your smartphone?","Do you think texting lanes should be created in Hong Kong?","Do you think the problem of texting while walking will get worse?","How would your phone habits be different if it was illegal to use smartphones while walking?"]}]},{"id":"2017","year":"2017","label":"2017 DSE","tasks":[{"id":"2017-1.1","no":"1.1","label":"Young Hongkongers head north to Shenzhen for job opportunities","intro":"This article appeared in a newspaper in Hong Kong:","title":"Young Hongkongers head north to Shenzhen for job opportunities","text":"Can’t find your dream job in Hong Kong? Shenzhen’s Qianhai economic zone may be the solution but you'd better be prepared to live without Facebook or Twitter.\n\nHerman Leung Ka-hin, who is from Hong Kong, is now working for a finance company in Shenzhen. Leung graduated this year and made the decision to work on the Mainland during his final year of study.\n\n\"I believe in the prospect of mainland China economic growth,\" he said. \"It would be better for me to start my career in the Mainland,\"\n\nUnlike jobs in Hong Kong with well-established career paths, Leung said his boss told him to expect uncertainty in his job because there were new policies and new developments all the time.\n\nLeung said that would give him more opportunities to try something new. \"Before I came here, worried about working with mainland colleagues as there might be cultural differences,\" he said. \"But after working here, I found that I had been over-worrying and I work with my\n\nmainland colleagues well.\"\n\nLeung said pay levels in Qianhai were similar to Hong Kong but the cost of living was much lower.\n\nOne thing he would like to see improve is the traffic. He lives in an apartment in northern Shenzhen\n\njams.\n\nHongkongers working in Qianhai also miss out on some popular social media networks such as Facebook and Twitter, which are banned on the Mainland along with some overseas websites.","task":"Your group has been asked to discuss whether Hongkongers could benefit from working in Shenzhen. You may want to talk about:","points":["advantages and disadvantages of working in Shenzhen","whether this will become a popular trend","advice for people who would like to work in Shenzhen","anything else you think is important"],"ir":["Have you ever been to Shenzhen?","Would you like to work in Shenzhen?","Would you like to live outside Hong Kong?","What would you miss if you left Hong Kong?","What would be the best thing about working in Shenzhen?","What would you find difficult about working in mainland China?","Is it more common for Hongkongers to work outside Hong Kong than in the past?","Does Hong Kong lose or benefit from young people working in Shenzhen?"]},{"id":"2017-1.2","no":"1.2","label":"Giving money to parents?","intro":"This blog entry appeared on a website:","title":"Giving money to parents?","text":"I give money to my parents and parents-in-law. I have no problem with it, even though we have a young family just starting out, with all the expenses that go along with that stage in life and having a baby.\n\nI do understand why we do it. It’s a respect thing. It’s a way to show honour to parents, and with my husband’s parents it isn’t really about the money or even the amount, it’s about the act itself. This is an important way that Chinese parents can express or accept love from their children and it also seems to be an easy way for Chinese families to show and accept love.\n\nThankfully my parents-in-law are not demanding in their attitude, but we like to give them some money anyway. We give it with a cheerful heart and see it as a blessing to show our love to them in this way. Also, this sort of thing is connected indirectly with the traditions of showing respect for elders, and remembering dead relatives and ancestor worship.\n\nHowever, I do know people who are in the same position as me, but don’t have much money and find it very difficult to give money to older family members. They want to buy a flat or save money, but need to give money to their parents and parents-in-law. Sometimes their parents really need the money, so they have to give up their own hopes to help their family\n\nIt's difficult.","task":"As part of your English class, your group has been asked to write a reply to this blog entry. You may want to talk about:","points":["reasons people give money to their parents","whether this tradition should continue in Hong Kong today","other ways people can show respect to their parents","anything else you think is important"],"ir":["What gifts do parents like to get?","Other than giving money, how can children help their parents?","Would you give money to your parents?","Should children discuss money with their parents?","Do you think young people today respect their elders?","Do parents today still expect money from their children?","If you were a parent, would you expect your children to give you money?","Should children give money to their parents if their parents are rich?"]},{"id":"2017-1.3","no":"1.3","label":"Book fair fighting fit with martial arts theme","intro":"This press report appeared on a webpage:","title":"Book fair fighting fit with martial arts theme","text":"This year's Hong Kong Book Fair will for the first time in 27 years carry a theme — \"Chinese Martial Arts Literature\", The theme will focus on the works of various Hong Kong novelists in the genre and help promote Kung Fu themed books and stories.\n\nThe fair, which last year attracted more than a million people, runs from July 20 to 26 at the Hong Kong Convention and Exhibition Centre in Wan Chai,\n\nBenjamin Chau Kai-leung, from the Hong Kong Trade Development Council, noted that the fair has previously paid tribute to one author, but this year they have decided on a special theme for a change.\n\nAs part of the theme, a Chinese martial arts literature exhibition will feature in the art gallery with works from martial arts novelists topped by Louis Cha Leung-yung, better known as Jin Yong and eight other authors,\n\nPrized exhibits such as handwritten clips, first editions, screenplay adaptations and comic books from the novelists will also feature.\n\nChau pointed out that the work of these writers is becoming more popular around the world, \"The martial arts world portrayed in these novels embodies the essence of Chinese culture and is an important way of sharing and promoting Chinese culture. People all round the world are interested in Chinese Kung Fu,\" he said, \"Having a theme makes the fair distinct from previous years, builds excitement, increases awareness of our event and makes this year’s fair feel fresher.\"\n\nTickets are HK$25 for adults and HK$10 for children and are available online and at convenience stores.","task":"Your group has been asked to discuss the idea of a theme for a future Hong Kong Book Fair. You may want to talk about:","points":["why the Hong Kong Book Fair is popular","whether Chinese martial arts literature was a suitable theme","possible theme for the future","anything else you think is important"],"ir":["I Would you like to go to the Hong Kong Book Fair?","Do you enjoy reading Kung Fu books?","Is the Hong Kong Book Fair a good place to buy books?","Do you think the Hong Kong Book Fair will continue to be popular in the future?","Who likes the Hong Kong Book Fair more: younger or older people?","Would a good theme encourage you to go to the Hong Kong Book Fair?","Is the Hong Kong Book Fair a good way to encourage young people to read more?","Does Kung Fu adequately represent Hong Kong culture?"]},{"id":"2017-2.1","no":"2.1","label":"Can you understand Hong Kong if you don’t speak Cantonese?","intro":"This article appeared in a local magazine:","title":"Can you understand Hong Kong if you don’t speak Cantonese?","text":"People who live and work in Hong Kong often struggle if they cannot speak Cantonese. It can be simple everyday problems like speaking to a taxi driver or getting served in a restaurant. As a result, recently more and more people are studying Cantonese. Total enrollment for Cantonese programmes grew by about 30% from 1,508 in 2010 to 1,918 last year at the Chinese University of Hong Kong. Other institutions also report this trend,\n\nTypical of the increasing number of people studying Cantonese is Jonathan Ma, a 33-year-old English teacher, who was born in Hong Kong but moved to the United Kingdom when he was a child so he never learnt Cantonese. Ma recently began learning Cantonese intensively and he now realises how important it is not just for day-to-day living but also for understanding Hong Kong culture.\n\nWhile Hong Kong is a city where many people speak English or Putonghua, Cantonese dominates the local language scene and those who are not proficient in Cantonese can feel isolated from local culture, and find it difficult to establish relationships with the many locals who cannot speak the language that they do.\n\nNot having Cantonese limits not only their social circle but also their ability to understand issues that are important to Hongkongers and to integrate themselves into local communities.","task":"You are doing a project on the importance of Cantonese in everyday life in Hong Kong. You may want to talk about:","points":["problems non-Cantonese speaking people may have if they live in Hong Kong","advantages if they learn Cantonese","ways to help people who do not speak Cantonese feel more connected to Hong Kong","anything else you think is important"],"ir":["I Do you think it is easy to learn Chinese?","Do you know someone who can’t speak Cantonese?","What can you do to help someone learn Cantonese?","Can you tell me a job where speaking Cantonese is a must?","Do you think it is more important to read or to speak Chinese?","Are adults too old to learn how to speak Cantonese?","Do you think Cantonese will become less important in the future?","Should more be done to promote the use of Cantonese to non-Cantonese speakers?"]},{"id":"2017-2.2","no":"2.2","label":"Ice Bucket Challenge","intro":"This article appeared in an online newspaper:","title":"Ice Bucket Challenge","text":"Chances are if you’ve spent any time on social media in the past couple of years, you will have seen people throw a bucket of ice water over their heads to raise awareness for people who suffer from amyotrophic lateral sclerosis (ALS). If you have, you've taken part in a viral online campaign for a good cause.\n\nHere’s how the Ice Bucket Challenge works: someone who wants to participate (or has been \"challenged\" via social media by a friend) films themselves dumping a bucket of ice water on their head. This person then challenges a friend to do the same in the name of ALS, within 24 hours, and/or donate money to the cause.\n\n\"People want to do something for the world. They want to contribute, but they want it to be easy,\" said Christine Outram, a charity representative. \"It’s great because you have something that makes you feel good but isn’t too hard to accomplish.\"\n\nThe viral challenge actually started when Pete Frates, a 29-year-old American resident diagnosed with ALS, had a bucket of water thrown over his head and he started posting pictures of the challenge on social media with his father’s help. The pictures quickly went viral and spread across the internet.\n\n\"It is certainly amazing to see how far and wide the campaign continues to spread, increasing both awareness and funds,\" said Christine. \"Since the start of the challenge, there have been more than 307,600 posts on Twitter and public Facebook pages.\"","task":"Your school is raising money for Hong Kong charities. Your group has been asked to consider if online activities such as the Ice Bucket Challenge would be suitable. You may want to talk about:","points":["why the Ice Bucket Challenge was so successful","other online activities you could hold to raise money for charity","whether your suggestions would be popular","anything else you think is important"],"ir":["Have you ever raised money for charity?","Would you take part in an activity such as the Ice Bucket Challenge?","Who would you invite to do the Ice Bucket Challenge?","Apart from raising money, how else could you help charities?","Why should students help charities?","Should private companies support charities?","Is social media the best way for young people to get involved in charity?","Which is more important for charities: raising awareness or raising money?"]},{"id":"2017-2.3","no":"2.3","label":"Too many signals?","intro":"This article appeared in a newspaper in Hong Kong:","title":"Too many signals?","text":"The Hong Kong Observatory was founded in 1883. Back then, it had a number of roles but the most important was providing accurate weather observations and a typhoon warning service. For shipping, which played a central role in the city’s development, these warnings were vital.\n\nIn the more than a century since its establishment, the agency has evolved due to the changing expectations in the city and so has the number of weather warnings. There are now 21 weather warning signals. During the summer months it is common for warnings to be issued every day of the month and sometimes multiple warnings are issued at the same time.\n\nHowever, referring to the number of signals now used, Marco Wong Tse-yan, a senior manager for a local fast-food chain, said: \"The signals are confusing and not appropriate for modern international businesses; many shops don’t even close now for some typhoon signal number eights because the weather might not be too bad.\" As Hong Kong has become more developed, the effect of the weather on daily life has reduced and not only are businesses questioning the use of signals but some schools also feel they are closing unnecessarily.\n\nAn Observatory spokeswoman, answering complaints about the effect warnings have on economic activities, said they make decisions purely on the basis of scientific data, rather than taking into account the impact a No.8 signal would have on businesses.","task":"You are doing a project about the Hong Kong Observatory and you have been asked to discuss how suitable the current signals in Hong Kong are. You may want to talk about:","points":["the advantages of the current warning signals","possible problems caused for families, schools and businesses by the current signals","possible improvements to the current system","anything else you think is important"],"ir":["How do you feel when a typhoon is coming to Hong Kong?","What do you do when there is no school because of a bad weather warning?","What do most people do during typhoons?","How do you feel when the red rain signal is raised?","What companies suffer the most from typhoons in modern day Hong Kong?","Have you ever been frightened in a typhoon?","What should the police do about people going to the beach during Typhoon Number 8?","Do you think it is fair for taxis to charge double the fare during a typhoon?"]},{"id":"2017-3.1","no":"3.1","label":"EQ or IQ?","intro":"This article appeared in a health magazine:","title":"EQ or IQ?","text":"What is the difference between Intelligence Quotient (IQ) and Emotional Quotient (EQ)? IQ is a measure of people’s intelligence EQ is a measure of the ability of people to understand their own or other people’s emotions and feelings.\n\nWhy is EQ important?\n\nEmotional intelligence is claimed to be more important than traditional measures of intelligence such as IQ. Research shows that 85 percent of your financial success is due to EQ skills, your personality and ability to communicate, discuss, and lead. Surprisingly, only 15 percent is due to subject knowledge.\n\nWhy is low EQ a problem? Many kids today are \"emotionally unprepared\" to compete in the work environment because of low EQ. Low EQ is linked to violence, drinking alcohol, drug use, obesity and unhappiness.\n\nA survey found that more than half of American students experienced feelings of worry and anxiety, and about a third felt deep depression during the academic year. People with low EQ find it difficult to learn if people around them,\n\nWhy might EQ be falling?\n\nChildren develop social and emotional skills through strong family and community links, as well as through free play with other children. But just as parents have become more protective and family size has fallen, then children’s free time and face-to-face contact with others have also decreased.","task":"You have been asked to give a presentation on developing younger students’ EQ for the school’s study support scheme. You are meeting to discuss the topic. You may want to talk about:","points":["what problems students face which affect their emotions","why EQ is important","ways your school can help students to develop emotional intelligence","anything else you think is important"],"ir":["I Who can you talk to when you have problems?","Do your friends discuss their problems with you?","Do you like to work in groups?","Do you agree that having a high IQ is important?","Which is more important: IQ or EQ?","How does a large family help develop EQ?","Do Hong Kong schools prepare students to have a high EQ?","Do you think all successful people have a high EQ?"]},{"id":"2017-3.2","no":"3.2","label":"Smartphones blamed as Hongkongers lose interest in the city’s libraries","intro":"This article appeared in a magazine in Hong Kong:","title":"Smartphones blamed as Hongkongers lose interest in the city’s libraries","text":"Hongkongers have been borrowing fewer books from public libraries over the past five years, from over 60 million books in 2012 to 55 million this year — with smartphones being blamed for the fall.\n\nThe city’s education system was also criticised for not developing a love of reading among students. And one cultural commentator said many of the readers visiting libraries were there for the air conditioning or to kill time,\n\nJimmy Pang Chi-ming, head of publishing house Subculture, said the reading culture in Hong Kong had been bad for years. \"Nowadays, Hong Kong people just surf the internet with their phones or tablets whenever they’re free,\" Pang said. \"Fewer people read books so there are also fewer new books being published. It's a vicious circle.\"\n\nThat seems to be borne out by the statistics, which showed that the most borrowed English-language adult non-fiction book last year was an old English exam question paper. It was borrowed 9,124 times.\n\nIn contrast, according to the department's statistics, the number of times the public libraries’ seven e-book collections were used rose from about 142,000 in 2012 to 194,000 times last year,\n\nMost borrowed books 2015 Number of times taken out The Legend of the Condor (Chinese fiction) 11,094\n\nHKDSE Reading Examination Question Papers (Adult English non-fiction) 9,124\n\nThe Five People You Meet In Heaven (English fiction) 1,849","task":"Your group has been asked to provide suggestions on how modern libraries could be made more attractive to teenagers. You may want to talk about:","points":["what young people currently like about libraries","reasons many young people don’t use libraries","new activities that might attract more people to use libraries","anything else you think is important"],"ir":["When was the first time you visited a library?","Who uses libraries more: adults or young people?","What types of books do you borrow from the library?","Why are libraries important?","How is your school library different from a public library?","Do we still need libraries now that we have the internet?","How do you think libraries will change in the future?","SI aAw RYN How would the closing of libraries affect the local community?"]},{"id":"2017-3.3","no":"3.3","label":"Road accidents and car safety","intro":"This article appeared in a newspaper in Hong Kong:","title":"Road accidents and car safety","text":"Cars have become safer as new technology, improvements to roads and better driving have reduced the number of accidents in nearly all developed countries.\n\nmaking advances in vehicle safety Road Accidents per 1,000 vehicles cameras, radar, seat-belts, new construction materials, better road design 2013\n\nand driver education have all been important reasons for the fall in the number 1993 Sl\n\nof road accidents\n\nHowever, a leading road safety campaigner 1953\n\nCar companies and governments have been\n\npoints out, \"As car technology continues to SS\n\nevolve, roads are safer but we still have the 0 50 100 150 200 250 problems caused by the people behind the\n\nwheel: not using seat-belts, drink-driving, The chart shows the number of road accidents has fallen rapidly in\n\ndriving while texting — these are problems —_ Hong Kong since 1953. that the best designers can't solve.\"\n\nOther problems include pedestrians not following rules, poor lighting and animals running onto roads.","task":"The Transport Police are visiting your school. Your group has been asked to discuss road safety in Hong Kong. You may want to talk about:","points":["why the number of accidents has fallen in Hong Kong","some common causes of road accidents","what people should do to make sure they are safe while using the road","anything else you think is important"],"ir":["Do you think Hong Kong roads are safe?","Should schools teach more about road safety?","Should bicycles be allowed to use the same roads as cars?","— What dangerous things do pedestrians do?","What can be done to help the elderly be safer when crossing roads?","How should we stop people crossing the road illegally?","Do you think most Hong Kongers follow road safety rules?","Would reducing the number of cars in Hong Kong make roads safer?"]},{"id":"2017-4.1","no":"4.1","label":"Music unplugged","intro":"This article appeared in a newspaper in Hong Kong:","title":"Music unplugged","text":"Following the death of a 72-year-old man on Sunday during a fight between Leisure and Culture Services Department (LCSD) officials and performers, the Tuen Mun District Council held a meeting to look for more venues for the elderly to enjoy outdoor music performances.\n\nLarge crowds of retired people gather at Tuen Mun Park for free musical performances, especially on Saturdays and Sundays. The crowds enjoy singing and dancing to the music. Some performers use electronic music and amplifiers in the park, which is against regulations.\n\nThe LCSD received 400 noise complaints from last November to February. The number of complaints dropped to five from February to May after the department strictly enforced the ban on electronic music and amplifiers. However, enforcing the ban has caused trouble between performers and officials. Singing groups complained that singing without amplification was similar to \"cooking without salt\".\n\nTuen Mun district councillor Chan Wan-sang said the department planned to install a HK$50 million soundproof system in the park's theatre, and allow the use of amplifiers in one area, with noise not exceeding 70 decibels.\n\nMr Chan urged the department to open up more venues for the elderly people to perform music, saying one area will not be enough. Chan said unused squash courts and community centres should be provided for the elderly free-of-charge to ease the problem.","task":"You are doing a social studies project on \"Keeping the Elderly Active\". You are meeting to discuss this issue. You may want to talk about:","points":["why the elderly enjoy singing in parks","problems with having outdoor music performances","ways to overcome these problems","anything else you think is important"],"ir":["Do older people in your family enjoy singing?","What do elderly people enjoy doing in their free time?","What is the difference between the songs the elderly enjoy and those the young enjoy?","Have you ever seen groups of elderly people singing in the park?","Are there activities that are not suitable for the elderly?","Why is it important for the elderly to keep busy?","Why do some old people prefer to stay at home?","Should retirement be something to look forward to or to worry about?"]},{"id":"2017-4.2","no":"4.2","label":"Tattoo you? And did you know the legal age","intro":"This article appeared in a newspaper in Hong Kong:","title":"Tattoo you? And did you know the legal age","text":"for all these?\n\nIt is currently illegal for those under 18 to get tattooed unless Aetivie vasa\n\nthe tattoo is performed \"for medical reasons by a registered ity gal age\n\nmedical practitioner\". This means that even with your parents’ Working age 13\n\npermission, a tattoo artist cannot mark a person under 18. Still, ie\n\nthis rule hasn’t stopped some teenagers from getting tattoos in ‘ ,\n\nillegal shops a : sei Marriage (with’parents 4 agreement)\n\nThe trend for tattoos amongst youngsters has encouraged Category III film\n\nmany teenagers to seek tattoos by non-legal means before they Driving / Smoking / 18\n\nreach 18. Anushka Purohit, 15, says: \"Tattoos make you look Tattoo\n\ncooler, not scary, all my classmates want one.\" Working in factories 15\n\nHowever, a representative of a Hong Kong school says that Being at home alone 16\n\nstudents \"lack the maturity\" to make these kinds of decisions, Election candidates / 54\n\nnot to mention that it is against the law. Driving large trucks\n\nRoss Turpin, a tattoo artist, urges youngsters not to get inked at such a young age. \"Most ideas and fads that become internet sensations will fade in time and clients might later regret getting those tattoos.\"","task":"Your class has been asked to discuss whether the various legal ages are suitable. You may want to talk about:","points":["why the government has age limits for people getting tattoos","why the age limits differ for different activities","whether any age limits should be changed","anything else you think is important"],"ir":["Do you like tattoos?","Why is it dangerous for young people to be home alone?","When do you think is the best age to get married?","What type of tattoo do you think people will regret the most?","What do you think is worse: underage smoking or underage driving?","Do you think most people obey the legal ages in Hong Kong?","Do you think the government should give more responsibility to teenagers?","What age do you think people become adults?"]},{"id":"2017-4.3","no":"4.3","label":"Students withdrawing from society","intro":"This article appeared in a New York newspaper:","title":"Students withdrawing from society","text":"For nearly three years, Damo Miyawaki didn’t talk to his family and friends, He seldom left his bedroom, sleeping during the day and staying up all night, surfing the web and reading Japanese comics. The only time he ever went outside was to eat, something he would do in the middle of the night to avoid any contact with other people.\n\nDamo, now 18, was suffering from a serious health and social condition that is facing many young people in many countries. It causes young people to stay indoors, sometimes for years, watching TV, surfing the internet and reading, avoiding all social contact and often cutting off ties with family and friends. In Japan, around one million people, mostly men between the ages of 15 and 20, are said to suffer from the condition.\n\nThis problem is very painful and serious for families, who are unable to communicate with sufferers and face daily problems arising from the condition. Some children refuse to speak to their parents and just wait for food to be placed outside their bedroom door.\n\nIt can also affect the economy, with those suffering not working or earning money.\n\nA specialist in this illness, Dr Kato states that, \"Much work and social life is now carried out remotely, using technology, and this causes problems but there are also cultural reasons such as a sense of embarrassment and an emotional dependence on the mothers. Often sufferers just feel that there are too many social pressures on them and they decide to withdraw from society.\"","task":"Your Liberal Studies class is discussing some of the social problems faced by young people today. You may want to talk about","points":["why some young people avoid social contact","why this is a problem for them and their families","how to overcome these problems","anything else you think is important"],"ir":["Do you prefer to stay at home or go out to meet friends?","How much time do you spend alone?","Why is it important to talk to family and friends?","Why is it difficult for some young people to talk to their families?","How can parents better communicate with their children?","Does the internet make the problem of withdrawing from society worse?","Will withdrawing from society become worse in the future?","What are the benefits of spending time alone?"]},{"id":"2017-5.1","no":"5.1","label":"Why spoilt kids need a stay in boot camp to toughen up","intro":"This article appeared in a parenting column of a newspaper in Hong Kong:","title":"Why spoilt kids need a stay in boot camp to toughen up","text":"Here’s my prediction for the next growth industry: boot camps for children.\n\nThey are very popular with Korean parents, who send their kids off to these army-style boot camps where youngsters are shouted at, made to do difficult exercise, clean toilets, and sleep in basic conditions that shock many of the kids sent there. Parents send them because they are worried that the modern generation is too soft and spoiled.\n\nResearch has found that over-protective parenting occurs more frequently in educated and professional households, and that richer children complain more and are less self-sufficient. The recent story of maids going to university halls to clean rooms for Hong Kong students speaks for itself and would seem to corroborate the claim that many Hong Kong students are overprotected and lack independence.\n\nBoot camp forces children to face a difficult and challenging environment on their own in the hope that it will build those skills that the modern generation are often lacking. After two weeks cleaning toilets, eating basic food and running up mountains, parents hope their kids will better deal with managing disappointment.\n\nI've been threatening my daughter with a Korean style boot camp for years, ever since the time we stayed in the Peninsula Hotel, and she argued that the Venetian Macau was preferable. She knows this threat is empty, but honestly, if there were boot camps in Hong Kong, I'd be the first customer.","task":"Your Liberal Studies class is doing a project on the problems faced by children who are spoilt and over-protected by their parents. You have been asked to discuss whether boot camps would be suitable for Hong Kong. You may want to talk about:","points":["what children might learn in a boot camp","whether boot camp would be popular with Hong Kong parents","other methods to encourage students to be more independent","anything else you think is important"],"ir":["Would you like to go to a boot camp?","How would you feel if you were sent to boot camp?","Where would be a suitable location for a boot camp in Hong Kong?","Are there some children who should not be sent to boot camp?","What would be the best age to send children to a boot camp?","Why do you think parents spoil children?","What problems do spoilt children face when they become adults?","Why is the number of over-protected children on the increase?"]},{"id":"2017-5.2","no":"5.2","label":"Foods to Enhance Your Mood / Foods to Avoid","intro":"This article appeared in a health and lifestyle magazine:","title":"Foods to Enhance Your Mood / Foods to Avoid","text":"FOODS TO ENHANCE YOUR MOOD\n\nDark chocolate: People get a nice mood boost whenever they eat a bar of low sugar dark chocolate because of the chemicals in chocolate.\n\nProtein: Protein – like eggs, a piece of cheese or a handful of nuts – helps to keep your blood sugar levels steady for enhanced energy and mood.\n\nBananas: Bananas contain a chemical that makes you feel happy.\n\nCoffee: Drinking a morning cup improves your general sense of wellbeing.\n\nBerries: Berries which have a deep colour, like blueberries and blackberries, improve coordination, memory function and your mood.\n\nFish: Salmon and other fish reduce worry and depression.\n\nFOODS TO AVOID\n\nJust as foods can lift your mood, they can also quickly bring it down. Here are the top three foods that can trigger a poor mood.\n\nSugar: Sugars in junk food, candy and soda can make you feel tired by changing your blood sugar levels.\n\nWhite bread, white rice and wheat: White bread and white rice may negatively impact mood and brain health. Wheat in particular has also been linked to mental health problems in some cases.\n\nProcessed foods: The list of ingredients in processed foods, including instant noodles, fish balls and ham, is a long one. They contain bad fats, artificial colours, monosodium glutamate (MSG), artificial sweeteners and other ingredients linked to bad temper, irritability and poor mood.","task":"Your group is researching ideas for foods that improve the way students feel. You are discussing whether any of the items mentioned in the magazine would be suitable. You may want to talk about:","points":["foods in schools which are good or bad for your mood","whether school menus should only offer healthy food","the benefits of having mood-enhancing foods","anything else you think is important"],"ir":["What healthy foods do you eat?","Do you think about the health benefits of the food you eat?","Are there any foods you don’t eat because they are bad for you?","Do you worry about eating unhealthy food?","Are people today more aware of the importance of healthy food?","Apart from food, what else can change your mood?","How can you make sure you eat food that is good for your mood?","Why are so many foods that are bad for your mood popular with young people?"]},{"id":"2017-5.3","no":"5.3","label":"Great teacher = great results?","intro":"This blog entry appeared on an education website:","title":"Great teacher = great results?","text":"The great teacher myth is often presented as a simple equation: great teaching gets great results. Many people support it but it is completely wrong.\n\nThe great teacher myth sounds plausible. After all, children spend a lot of time at school and we spend a great deal of money on education. By the time they are 16, children have been at school for 10,000 hours, which is often said to be the minimum needed to master a skill. Surely teachers must be the biggest factor in ensuring that all this effort is worthwhile?\n\nThe key problem with this idea is when it comes to exams and learning, children are the ones who actually have to do the hard work. Unfortunately, much to the frustration of every teacher — and parent — in the city, children don’t always do what they are told, or learn what we attempt to teach them, What’s more, some children find school and learning easy and some don’t.\n\n‘Trying to teach anyone anything is difficult unless they actually want to learn, and can do so. Learning is hard work; it requires effort, repetition, practice, mental and physical exertion.\n\nDoes that mean that teachers don’t matter? Of course it doesn’t. They help and provide excellent support, but we should understand they are not the most important factor in educational success.","task":"Your group has to prepare for a debate with the motion: \"Good teachers are the most important factor in educational success.\" You may want to talk about:","points":["arguments for the motion","arguments against the motion","which side would be easier to argue","anything else you think is important"],"ir":["Would you like to be a teacher?","Do you think being a teacher is a good job?","What kind of students do teachers like?","What is the most important skill for a teacher to have?","Do teachers get enough respect?","What characteristics make a good teacher?","Does learning require hard work?","Have you ever been inspired by a teacher?"]},{"id":"2017-6.1","no":"6.1","label":"Falling out of love with iPhones?","intro":"This article appeared in a newspaper in the UK:","title":"Falling out of love with iPhones?","text":"Apple may be the leading provider of smartphones in China but they announced that they sold 16% fewer iPhones in April 2016 than in April 2015 and made 18% less money from them.\n\nThe company said most of the fall was because the Chinese economy was not growing as fast as in the past.\n\nChina is the second-largest market in the world for Apple products behind the US, and profits in China fell 30%,\n\nIn addition to the weak economy, demand for iPhones was also hit by changing fashions. The iPhone is no\n\nlonger seen as a must have for fashionable young people in China. Asian rivals, which are often cheaper, are now given more equal status,\n\nResearcher Annette Zimmerman wrote last month that the problem was not Apple’s alone; pointing out that the price of smartphones in China was still the main problem, even for very inexpensive devices. The majority of Chinese people still cannot afford the price of a smartphone. \"Sellers were not able to reduce the price of a ‘good enough to use’ smartphone lower than US$50,\" she said.\n\nDespite the sales decrease, Tim Cook, Apple CEO said \"the future of Apple in China is very bright\" and promised that the company has some \"amazing innovations\" for the future.","task":"Your class is doing a project on the topic of \"The importance of smartphones in China\". You are meeting to discuss the topic. You may want to talk about:","points":["how smartphones benefit people","why sales of iPhones did not grow in China in 2016","whether iPhones will continue to be successful in China","anything else you think is important"],"ir":["I Do you like Apple iPhones?","Are iPhones more popular with young people or older people?","Why are people willing to pay a higher price for Apple products?","Why do people line up to buy Apple products?","Why do you think Apple is so successful?","What problems do smartphones cause?","Why do people in China like buying American products like the iPhone?","How do you think smartphones will change in the future?"]},{"id":"2017-6.2","no":"6.2","label":"Teens who play online games perform better in school","intro":"This article appeared in a newspaper in Australia:","title":"Teens who play online games perform better in school","text":"Teenagers who play online games every day are more likely to get higher grades in school, a new Australian study based on the results of 12,000 students has found.\n\nThe goal of the study - published in the Average improvement in test scores\n\nInternational Journal of Communication — was to for online gamers investigate the effect playing online games had on teenagers and whether it affected their education. Science\n\nReading\n\nChief researcher, Dr Posso, stated, \"Although there Maths may be some problems with students spending too\n\nlong playing games, it is possible that a number of fy) 5 10 15 skills learnt from online gaming help improve knowledge and skills in some important school Percentage subjects.\"\n\nThe reasoning is that online games generally ask players to solve puzzles, which require skills in maths, reading and science. \"When you play online games, you're solving puzzles to move to the next level and that involves using some of the general knowledge and skills that you've been taught in the classroom,\" Dr Posso added.","task":"The Student Union wants to introduce an Online Games Day at school. You are meeting to discuss this. You may want to talk about:","points":["the benefits of playing online games","possible activities for the Online Games Day","problems you may face setting up an Online Games Day","anything else you think is important"],"ir":["Do you play online games?","Would you like your school to use more games during lessons?","Do older people worry too much about teenagers playing online games?","Do you think online games help your reading and maths skills?","What other activities help improve reading and maths skills?","Do you agree that students benefit from playing online games?","Do you think all online games are beneficial?","Will online games become a bigger part of school life in the future?"]},{"id":"2017-6.3","no":"6.3","label":"Top working holiday jobs for 18-26 year olds in Australia","intro":"This job advertisement appeared in a newspaper in Australia:","title":"Top working holiday jobs for 18-26 year olds in Australia","text":"Ordinary, Standard. Normal. Is that what you want from your working holiday jobs? We thought not! Which is why we offer some of the most exciting working holiday jobs in the country. Australia Working Holidays are a great introduction to the real culture of Australia. You will learn new skills, meet amazing people, and earn while you do it to fund your travels across the country! Not only are these some of the best jobs in Australia, most of them are a way to an international qualification and will help you to attract job offers for years to come.\n\nWork on a sailing boat in the Whitsundays \"Sail away with us, honey, put your heart in our hands.\" Work on a boat as you travel to 74 beautiful islands of the Whitsundays. This is a life-changer.\n\nseem Farm Hand There are few things more Australian than working on a farm where you'll work hard until sun down, and learn to saddle and ride a horse, work the farm, and even shear the wool off a sheep’s back.\n\nFruit Picking\n\nPicking fruit is a sweet way to make money. Few people realise it, but you can extend your visa by a full 12 months if you pick for a minimum of three months, It’s win-win!\n\nCall us on 0333 321 7841 to find out more.","task":"You have been asked to give a presentation on working holidays. You are meeting to discuss the topic. You may want to talk about:","points":["the advantages of going on a working holiday","whether the type of jobs in the advertisement are suitable for Hong Kong students","other types of jobs that are suitable for students","anything else you think is important"],"ir":["Would you like to go on a working holiday?","Would your parents allow you to go on a working holiday?","Would you enjoy working on a farm?","Is eighteen too young for students to go on a working holiday?","Is ita good idea to work in a Chinese restaurant during a working holiday?","What skills do you think students should have to enjoy a successful working holiday?","What problems might students face working on a remote farm?","What are the advantages for countries that employ people on working holidays?"]},{"id":"2017-7.1","no":"7.1","label":"Hong Kong needs more blood donors","intro":"This article appeared in the student newspaper:","title":"Hong Kong needs more blood donors","text":"Hong Kong needs more people to give blood; and finding new blood donors is a central aim of the Hong Kong Red Cross,\n\nThe Hong Kong Red Cross supplies blood to all Hong Kong hospitals and these supplies of blood are vital for the effectiveness of Hong Kong’s health services.\n\nThe Red Cross is always looking for new donors, but finding enough people to give blood is difficult.\n\nFortunately, schools and young people are willing to give blood, with over 70% of new blood donors coming from secondary school students. Currently, students over the age of 16 can give blood, with their parents’ permission.\n\nChan Kin-hei, a representative of the Red Cross, said, \"We are happy to go to schools at any time, but the schools should make sure that students have enough time to give blood, encourage them to take part by advertising our visit, and arrange for helpers to support our staff.\"\n\nChan stated that an important benefit of encouraging students to give blood is that once they give blood, many will continue to do so into their adult life. So not only is it important for the present needs of hospitals, but it is also good for long-term blood supplies.\n\nHe added that there were also health benefits for those who give blood: \"It’s good for the heart, reduces the risk of cancer, and also students get a free blood test to check if they have any health problems.\"","task":"Your school would like to invite the Red Cross to collect blood from students and staff. You are a member of the Students’ Union and the principal has asked you to help organise the event. You may want to talk about:","points":["why giving blood is important","how to encourage students to take part in the event","suitable times and places for the event","anything else you think is important"],"ir":["Would you give blood?","Why do some people like to give blood?","How could more adults be encouraged to give blood?","Why are some people afraid of giving blood?","How can the Red Cross help donors to relax when giving blood?","What do students learn from giving blood?","Should people be paid to give blood?","Should giving blood be made compulsory?"]},{"id":"2017-7.2","no":"7.2","label":"Hong Kong’s Geopark","intro":"Below are some photographs of Hong Kong:","title":"Hong Kong’s Geopark","text":"Hong Kong’s Geopark, a UNESCO-listed wonder of volcanic rocks, cliffs and caves. One of Hong Kong's greatest natural attractions, yet hardly known to tourists or even locals.\n\nVictoria Harbour, one of the world's most renowned deep-water harbours, and where the British first colonized Hong Kong.\n\nThis mind-boggling image captures the soaring apartment blocks in one of the world's most densely populated areas, Hong Kong.\n\nPo Lin Monastery, Lantau Island,\n\nAlways in motion, Hong Kong Hong Kong. The colossal statue of\n\nOne of Hong Kong's heritage\n\nattractions, the Chi Lin Nunnery, is a large temple complex of elegant wooden architecture and\n\nthe Great Buddha sits high on a hill, looking down upon countless\n\noffers a diverse and exciting travel experience, featuring Chinese traditions, arts and culture.\n\nsoul-soothing lotus ponds visitors from around the world.","task":"Your group has been invited to select one of the above photographs to represent Hong Kong on the cover of a travel book. You may want to talk about:","points":["what attracts tourists to Hong Kong","what each picture represents about Hong Kong","which photograph should be chosen for the cover of the travel book","anything else you think is important"],"ir":["Which places do tourists often visit in Hong Kong?","Are there places in Hong Kong you would like to visit?","What can be done to attract more tourists to Hong Kong?","What makes Hong Kong special?","Are you proud to live in Hong Kong?","Do you agree that Hong Kong is an international city?","What do tourists find interesting about Hong Kong culture?","What do tourists think about when they hear the name Hong Kong?"]},{"id":"2017-7.3","no":"7.3","label":"Too Few Bus Lanes / More Congestion and Pollution","intro":"These two Letters to the Editor appeared in a local newspaper:","title":"Too Few Bus Lanes / More Congestion and Pollution","text":"TOO FEW BUS LANES\n\nI am writing to ask why there are so few bus lanes in Hong Kong.\n\nThere is only 22 km of road reserved for buses, yet nearly 40% of people travel to work and school by bus.\n\nThe heavy traffic means that bus travel is slow, which increases the amount of pollution at our roadsides. Many people avoid using buses because they are so slow.\n\nI believe the government should urgently create bus priority lanes. They should also consider introducing extra bus lanes during peak hours.\n\nAlternatively they could ask private car owners to pay tolls or apply for a permit to use certain roads.\n\nSomething needs to be done to decrease bus journey times and make bus travel more convenient.\n\nJohn Wong, Kwun Tong\n\nMORE CONGESTION AND POLLUTION\n\nHong Kong is a small city and there are limits to the number of roads and
