lps you learn at the same time.\n\nAsk questions. Don’t be afraid to ask questions\n\nor for help from a teacher or your friends. This Take notes. Taking notes will not only keep you will truly help you understand the material. more engaged during class, but also help you narrow down what you need to study. It’s much easier to\n\nreread your notes than to reread your entire textbook!\n\nSleep. Getting a good night’s rest will sharpen your focus and improve your working memory.","task":"Your group is preparing a sharing session for S.4 students to help them prepare for senior forms. You are meeting to discuss the topic. You may want to talk about:","points":["what challenges S.4 students can expect","how to help S.4 students develop good habits","other advice to give S.4 students","anything else you think is important"],"ir":["What do you usually do after school?","Do you like working in groups?","What is the best thing about studying in senior forms?","What is one thing that you have learned about developing good habits?","How can students improve their time management?","What is the best way to motivate yourself to study?","Which is more important for success: study or social skills?"]},{"id":"2023-6.3","no":"6.3","label":"Performing acts for hire","intro":"These profiles appeared on a website about performing acts:","title":"Performing acts for hire","text":"1. Rock Band\n\nBrother Plainview is an alternative rock band based in Hong Kong. They have been performing around the city since 2018.\n\nPrice: $10,000 (2 hours) Requirements: must provide a large stage and a sound system\n\n\"Booked Brother Plainview for our New Year’s Eve party and they were fantastic! The dance floor was packed during their energetic performances.\"\n\n2. Comedian\n\nVivek is a Hong Kong stand-up comedian who performs both in\n\nEnglish and Cantonese. He performs in comedy clubs, and has won awards for his humour,\n\nPrice: $5,000 (I hour) Requirements: must provide a small stage, a mic, and 2 water bottles\n\n\"Local Hong Konger but sees society as an ___ outsider. Effortlessly blends comedy with public consciousness.\"\n\n3. Lion Dance Group\n\nKwok’s Lion Dance group performs traditional lion dance, LED lion dance, and also Hip-Hop lion dance to attract both younger and older audiences.\n\nPrice: $7,000 (15 minutes) Requirements: must provide a large stage, and meals for 8 people\n\n\"Amazing Lion Dance show! There's martial arts, stunts, costumes...even if you don’t know much Chinese culture, you'll love itt\"","task":"Your school is celebrating its anniversary and your teacher has asked your group to choose one performing act to hire for the celebration. You are meeting to discuss this. You may want to talk about:","points":["what students would like about each act","other important factors when choosing an act","the best option for the school’s celebration","anything else you think is important"],"ir":["Do you like to watch Lion Dance?","Do you enjoy watching live shows at school?","Do you enjoy performing on stage?","Do you prefer telling or listening to jokes?","What is your most memorable school celebration?","Do you think celebrations are a good use of school money?","What are the best ways performers can promote themselves?","Do you think it’s difficult to be a musician nowadays?"]},{"id":"2023-7.1","no":"7.1","label":"Time in different cultures","intro":"This blog post appeared on the author’s personal webpage:","title":"Time in different cultures","text":"If you live in Hong Kong, you may well be always looking at the clock and writing down your many appointments in a calendar. But does every culture use time this way? Different cultures have different views on how to use time. For example, in Switzerland or Germany, punctuality is important. Being late is unacceptable and often viewed as disrespectful. Other cultures, on the other hand, don’t stress punctuality. They might be an hour late, a day late, a week late. And that’s okay. Time is not ruled by a schedule, and neither is business,\n\nPsychologist Robert Levine analysed different cultures and their attitude towards time. He found that more economically developed countries like the USA, Germany, or Japan are fast-paced. In other words, they greatly value time since \"time is money\".\n\nOn the other hand, countries with less developed economies are slow-paced. Cultures such as the Middle East, South America, or Eastern Europe have a more relaxed attitude towards time. They are more family and socially oriented.\n\n1A\n\nHowever, such differences may not always be as clear. For example, even though Japan has a fast-paced culture, they view social relationships as important.","task":"Your group is doing a project on how different cultures view time. You are meeting to discuss the project. You may want to talk about:","points":["Hong Kong people’s attitude towards time","whether attitudes towards time are changing","how to live a more slow-paced life","anything else you think is important"],"ir":["Are you often late for school?","Is being on time important to you?","How do you feel when your friends are late?","Do you prefer a fast-paced or a slow-paced lifestyle?","Is a fast-paced lifestyle healthy?","Do Hong Kong people have good work-life balance?","Is work-life balance important?","es Naw RYN Do you agree that time is money?"]},{"id":"2023-7.2","no":"7.2","label":"We’re hiring a summer intern","intro":"This is an advertisement for a local video game company:","title":"We’re hiring a summer intern","text":"Are you a gamer? Do you want to contribute to the © You need to: %,\n\ndevelopment of video games? Do you have _ . knowledge of coding and programming? If your have good knowledge of coding and\n\nanswer is yes, apply to be our summer intern at Programming OR .\n\nBMShock. - have good knowledge of graphic design and animation programmes\n\n‘Who are we? - have good problem-solving skills\n\nBMShock is a fast-growing video game developer - be able to work in teams\n\nin Hong — Kong = Our two fast-paced speak fluent Cantonese and English\n\nfirst-person-shooter games, Marvel Strike and Glory and Honour, are famous for their beautiful content You will:\n\nand rich visual effects. - assist in the development of real-time visual\n\nWhy should 2 effects with designers, developers and other ya ‘ould you apply’ ; a sitists\n\nThe video game development industry is quickly _ give feedback on products\n\nemerging as one of the most profitable industries in . the 21\" century, This is a once in a lifetime - assist in managing BMShock’s Instagram and opportunity to be part of a team behind the creation Twitter pages for game launches\n\nof some of the best award-winning games. Gain experience at an entry level position which can set\n\nyou up for a thriving future career. Apply by emailing your CV to\n\nrecruitment@bmshock.com.hk now!","task":"Your group is considering whether the above advertisement should be posted on the notice board of the Career Team. You may want to talk about:","points":["how students can benefit from internships","whether the video game internship is a suitable choice for students","ways the Career Team can promote internships","anything else you think is important"],"ir":["Do you like playing video games?","Do you want to work in the video gaming industry?","Do parents like their children to take part in internship programmes?","Should internships be compulsory for students?","Do you think video games are too violent?","Should the video gaming industry do more to attract female workers?","Why are video games so addictive?","Are video gamers given enough recognition by society?"]},{"id":"2023-7.3","no":"7.3","label":"Instagram craze threatens species’ survival","intro":"This article appeared on a website:","title":"Instagram craze threatens species’ survival","text":"An Instagram-driven craze in Japan for keeping otters in cafes and as pets has bey caused an increase in catching the animals from the wild, putting them in danger of extinction, investigators from environmental groups say.\n\nBecause of the animal’s popularity, many people have opened otter cafes in Japan, where customers touch, play with, feed and cuddle them. Hundreds of people are also buying them to keep at home. Not only is the trade cruel because the stolen otters are given unsuitable homes, diets and surroundings, but worse — it is bringing down populations of the species.\n\nAll four species from Southeast Asia are already in decline from loss of their natural habitat and climate change, but now the pet trade poses a new human threat. The population of some species has decreased by half in three decades.\n\nCassandra Koenen, who heads the Wildlife Not Pets campaign, says, \"Just because a wild animal is cute, it does not mean you should take it home with you. Unfortunately, cute animals can generate a lot of likes on Instagram.\"\n\n\"Once otters are in people’s homes, there is no way to provide the space and freedom these animals would have in the wild. Many animals are kept in small spaces and don’t have the correct nutrition, even if owners have the best intentions to care for them properly.\"","task":"Your class is doing a project on animal conservation. Your group has been asked to discuss the topic of keeping pets. You may want to talk about:","points":["the advantages of keeping wild animals as pets","the disadvantages of keeping wild animals as pets","how social media may affect the choice of pets","anything else you think is important"],"ir":["What is your favourite animal?","What do you think is the best pet to have?","Why do some people go to cafes to see wild animals?","Should cafes use wild animals to attract customers?","Why do some people keep dangerous animals as pets?","Why are some people not suitable pet owners?","Why do some owners spend a lot of money on their pets?","Are the rights of animals given too much importance?"]},{"id":"2023-8.1","no":"8.1","label":"Will everyone be eating insects by 2050?","intro":"This article appeared on a webpage:","title":"Will everyone be eating insects by 2050?","text":"By 2050 the population is expected to reach 9 billion. To feed all of those hungry mouths, we will need to produce almost twice as much food as we currently do. But that isn’t going to be easy. One possible solution? Insects.\n\nEating insects is a common practice that’s been taking place for thousands of years, Around 2 billion people regularly eat insects as part of their diet, and over 1,900 species are edible. The most commonly eaten bugs are beetles, caterpillars, bees, wasps and ants.\n\nSo what’s so good about insects? Well, they’re nutritious and healthy. Insects actually have a high fat, protein, vitamin, fibre and mineral content that is often comparable to fish or livestock. Beetles, for example, contain on average 205 g/kg protein; beef contains 256 g/kg.\n\nRaising insects as a source of food as opposed to farmed animals is more environmentally friendly. Insects require significantly less land and water than traditionally-farmed animals and also reproduce much more quickly. Additionally, insects produce a fraction of the greenhouse gases when compared with other livestock, particularly cattle. Finally, insect farming can provide jobs and income to people living in poor areas. Insects are sustainable, green, nutritious and could help people out of poverty. Chocolate-covered caterpillars, anyone?","task":"You are doing a project on the food we will eat in the future. Your group is meeting to discuss insects as food. You may want to talk about:","points":["how eating insects can benefit people and the environment","why people may not want to eat insects","how to promote insects as food","anything else you think is important"],"ir":["Would you like to try eating insects?","Is eating healthy food important to people in Hong Kong?","Should people change their diet to help the environment?","Do you think Hong Kong should promote eating insects?","Should restaurants have insects on their menu?","Do you think Hongkongers will eat more healthy foods in the future?","Should Hong Kong develop insect farms?","Can people impact the environment by changing their diet?"]},{"id":"2023-8.2","no":"8.2","label":"Global study on walking puts Hong Kong a step ahead","intro":"This article appeared in a newspaper:","title":"Global study on walking puts Hong Kong a step ahead","text":"According to a recent study, Hong Kong people walk an average of 6,880 steps a day, compared with a world average of 4,961, making them the most active in the world.\n\nResearchers said they hoped their study could help policymakers around the world design towns and cities that encourage more physical activity. \"In cities that are more walkable, everyone tends to take more daily steps, whether male or female, young or old, healthy or obese,\" Jennifer Hicks, one of the researchers, said.\n\nThere are many studies suggesting there are health benefits of walking, even if only for 30 minutes a day. Some say walking fast is best, others believe walking slowly is good enough, and a few recommend a steep flight of steps. The advice for those who want to add a few extra years to their life is that, whenever possible, taking the footpath will pay off better than getting into a vehicle. Most Hong Kong people walk a lot, but out of necessity, not choice.\n\nStudies say it is a good thing, though: walking prolongs life. It reduces the risk of diabetes, high blood pressure, respiratory and heart diseases, and even cancer. Walking is also free. It’s convenient, requiring no special training or equipment, and it can be done at any age. Hong Kong people have obviously worked all that out.","task":"Your group is doing a project on walking-friendly cities. You are meeting to discuss this. You may want to talk about:","points":["what makes Hong Kong suitable for walking","what discourages people from walking in Hong Kong","whether you think Hong Kong people are active","anything else you think is important"],"ir":["Do you like walking around the city?","Where is the best place in Hong Kong to go for a walk?","What things do people do while they are walking?","Why is walking a good exercise for old people?","What is the longest walk or hike you have taken?","Do you sometimes use the stairs rather than take the lift?","Do you find that walking helps you think?","Do you think people will walk less in the future?"]},{"id":"2023-8.3","no":"8.3","label":"Harbourside Concert Series","intro":"This post appeared on an events website:","title":"Harbourside Concert Series","text":"The Harbourside Concert Series is a musical treasure: three nights of stunning classical music against the backdrop of the glorious Victoria Harbour. Stretch out on the West Kowloon lawn and enjoy the sumptuous delights of the world-class line-up.\n\nDay One: 18\" November, 7pm The City Chamber Orchestra of Hong Kong and Special Guests Day Two: 19\" November, 7pm Hong Kong Sinfonietta and Special Guests Day Three: 20\" November, 6:30 pm The Hong Kong Philharmonic Orchestra\n\nThe event promises to be spectacular, highlighting the best the ci MUSIC ON THE has to offer and the bright future of classical ed in Hong Kong\n\n-and: i from the city’ ith orchestras will be maki: HAUSA Social opperances, slongride’ cameos iow cage wed me\n\nNOV18 20 @ WEST KOWLOON performers,\n\nTickets are on sale now from the usual vendors.\n\n1-day pass: $380; 2-day pass: $600; 3-day pass, with free picnic blanket: $750\n\nSpecial Offer for Schools: contact our ticket office to sign up for the \"Music for Schools\" programme: free tickets for students, plus classroom and promotional materials for the concerts, Spread the joy of classical music!","task":"You are members of your school’s Music Club. You have been asked by your principal to discuss the Harbourside Concert Series. You may want to talk about:","points":["whether the Harbourside Concert Series will be a popular event with young people","how the event can be promoted in your school","other ways to introduce classical music to students at your school","anything else you think is important"],"ir":["Do you like listening to music?","Do you like going to music concerts?","Do you prefer indoor or outdoor concerts?","Do you prefer live music or listening to music online?","Do you think classical music concerts should be free for young people?","Is Hong Kong a good place for outdoor concerts?","Can concerts attract more tourists to visit Hong Kong?","How can the government support concert organisers?"]}]},{"id":"2024","year":"2024","label":"2024 DSE","tasks":[{"id":"2024-4.1","no":"4.1","label":"Vocational training in Germany","intro":"This article appeared on a website:","title":"Vocational training in Germany","text":"Did you know most German students don’t want to go to university? Instead, vocational education and training (VET) is a very common pathway to gain skills and embark on a successful career. VET combines job-training and study, so students can both study and work at the same time. VET offers certifications for people who are interested in becoming an electrician, tax specialist, nurse, ambulance worker, dental technician, hairdresser, film and video editor, and product designer.\n\nDepending on the job, trainees may work for three to four days a week in the company, factory, or shop to learn practical skills through on-the-job training. Trainees earn a modest salary which helps with student expenses.\n\nOn the other days, students go to school to learn both job-specific and general education subjects, such as English, maths, and physical education. The program usually lasts between two and four years. At the end of the training, students take an examination and are then given their certifications. They can continue to work in the place they were trained, study to obtain further qualifications or even become self-employed.\n\nThe VET program supplies Germany’s companies with well-trained employees. It also helps trainees transition into work life. VET opens up a variety of promising career options for young people. Both young people and adults wanting to change careers can take part.","task":"Your group is doing a project on job training for graduates of secondary school. You are meeting to discuss the topic. You may want to talk about:","points":["what vocational training offers that university does not","how vocational training can benefit society","what would attract more students to join a vocational training course","anything else you think is important"],"ir":["What do you want to do after secondary school?","Why is going to university important to Hong Kong students?","How can young people learn more about different careers?","When should students start thinking about their career?","Would you ever work for no pay to get some job experience?","Would you like to go to a foreign country to gain work experience?","Which do you think is more important: qualifications or experience?","Why do you think employers value vocational training?"]},{"id":"2024-4.2","no":"4.2","label":"About the Book Club","intro":"‘These are extracts taken from a Book Club’s Facebook page:","title":"About the Book Club","text":"When and where do you meet? What kind of books do you read? Book Club meetings are held We just finished reading the classic, ‘Pride and every Friday in the School Library Prejudice’ by Jane Austen. Next on our list is from 4pm-Spm. \"Wuthering Heights’ by Emily Bronté, another\n\nHow is it structured? female writer from 19\" century England.\n\nEvery week, members will get a worksheet that highlights 10 important vocabulary items and 8\n\nHow much does it cost? It’s free but you need to buy your own books.\n\nquotes from the text that we will How many members are there? discuss in our weekly meeting. We currently have eight members who attend regularly. Comments\n\n~ \"Tt was hard to stay awake, Maybe snacks might help...?\" - \"T couldn’t get myself to read the first book and then T felt bad, so I didn’t come bac] or ~ \"[never had a chance to participate — always the same people who dominate the discussion.\"\n\n~ \"Do we have to learn vocabulary and grammar? I'd rather just chat about the book.\"\n\n- \"We already read classics in English lessons! Can we read books that are more up to date?\" ee","task":"Your group has been asked to suggest changes to improve the Book Club. You are meeting to discuss this. You may want to talk about:","points":["why students should join a book club","why students may not be interested in joining a book club","howto make meetings more interesting and enjoyable for students","anything else you think is important"],"ir":["What types of books do you enjoy reading?","Do you prefer reading paper books or e-books?","Would you rather join a book club or a film club?","Are Hong Kong people too busy to read books?","Would you join a book club that meets online?","Do you think a book club is a good place to make friends?","a Which do you learn more from: fiction or non-fiction books?","What's the difference between reading for pleasure and reading for study?"]},{"id":"2024-4.3","no":"4.3","label":"‘The smells of Hong Kong","intro":"This article appeared in a local newspaper:","title":"‘The smells of Hong Kong","text":"Hong Kong is ‘fragrant harbour’ in Cantonese. There are actually many different smells, not necessarily pleasant and fragrant, that can make people think of this city. The following are some examples.\n\nMoney Hong Kong is a financial centre in Asia. It is no surprise that the smell of money, both banknotes and coins, is a symbolic smell of the city.\n\nSeafood\n\nOne never forgets the strong smell of dried seafood in Sheung Wan and the smell of shrimp paste in Sai Kung. All over Hong Kong, in wet markets, the odour of fish stalls is another reminder of how close Hong Kong is to the sea.\n\nJoss sticks and incense In Chinese temples, burning joss sticks and incense gives off a relaxing and woody fragrance that reflects the cultural roots of Hong Kong.\n\nStreet food Hong Kong people love street food, particularly food that has strong flavours and smells: curry fish balls, stinky tofu, egg tarts and fried chestnuts.\n\nExhaust fumes on the road Unpleasant as it may be, the smell of the exhaust gases from cars, lorries and buses all year round just reflects the busy traffic and the energy of the city.\n\nGreenery\n\nContrary to most people’s first impression, 75 percent of Hong Kong’s territory is actually green: country parks, agricultural or semi-rural land. The refreshing and calming scents of trees and grass always offer escape from the stress of city life.","task":"The Tourism Board is organising an event called ‘Discover Hong Kong’. Your group wants to set up a stall to introduce the different smells of Hong Kong. You may want to talk about:","points":["why introducing Hong Kong through smells is a good idea","which three smells best represent Hong Kong and why","ways to attract visitors to your stall","anything else you think is important"],"ir":["What is your favourite smell?","What smell do you hate most?","What smells remind you of your school?","What smell do you like most in nature?","What smells remind you of your home?","Would you buy something because it smells good?","Should foods that have strong smells be banned in public areas?","Should movies incorporate smell in their production?"]}]},{"id":"2025","year":"2025","label":"2025 DSE","tasks":[{"id":"2025-1.1","no":"1.1","label":"Edgar Cheung’s journey from shy teenager to Olympic gold medallist","intro":"This article appeared on a website:","title":"Edgar Cheung’s journey from shy teenager to Olympic gold medallist","text":"How many years must a fencer train before he can call himself an Olympic champion? Edgar Cheung Ka-long, Hong Kong’s double Olympic champion would know.\n\nIn fact, Cheung didn’t take up fencing until he was 10 years old. “All the basketball classes were closed during the summer,” he recalls. “My father asked if I would be interested in a fencing course. I still remember it was a summer course for beginners. We practised footwork but that was all. Towards the end of the course, the teacher asked if anybody would like to try it with a real fence. Many of my classmates raised their hands, but I was too shy to do it in front of people. Even today, I would still consider myself an introvert. I’m not used to presenting myself during public appearances,” he explains.\n\nCheung made his Olympic debut at the 2016 Rio Games. At the 2018 Asian Games, he helped Hong Kong win a silver medal in the team event. In Tokyo, his incredible run to gold included an unbelievable victory against his Italian rival in the final match. Finally, in Paris, he became the first Hong Kong athlete to win consecutive Olympic gold medals.\n\n“I am happy to have won the Olympic gold medals. This is the dream of every athlete,” Cheung says. “But more importantly the gold medal has made a great impact on society, ensuring more Hong Kong people know about fencing and more youngsters are willing to take up the sport.”","task":"Edgar Cheung Ka-long is going to visit your school. Your group is preparing for his visit and to interview him. You may want to talk about:","points":["how his visit can benefit students","questions to ask him during the interview","other activities you could do on his visit","anything else you think is important"],"ir":["What sports do you enjoy watching?","Have you watched the Olympic games on TV?","Have you ever learned a sport during the summer holiday?","Do you think fencing is dangerous?","What qualities are needed to be a professional athlete?","How has Cheung’s success influenced Hong Kong people?","How can more youngsters be encouraged to become professional athletes?","Should the government invest more in producing elite athletes?"]},{"id":"2025-1.2","no":"1.2","label":"Photo-taking visitors not welcomed by everyone","intro":"This article was recently published online:","title":"Photo-taking visitors not welcomed by everyone","text":"We often take photos of such aspects of everyday life as scenery and food, and we see others posting these kinds of pictures on social media. In some places, however, people are pushing back against this trend.\n\nVermont, USA\nOfficials in this town recently voted to close its roads in autumn, when the leaves of the trees turn colour and the area is at its most beautiful. Hundreds of tourists began going there to take photos, and many were parking near people’s private homes, damaging property and even arguing with local residents. “Traffic in this area has steadily increased, causing environmental, safety, and quality of life issues,” the town reported.\n\nMount Fuji, Japan\nIn May 2024, a Japanese town built a wall to block views of Mount Fuji, Japan’s most famous mountain. Large groups of tourists started going there to take photos and refused to obey rules on throwing trash and parking. One resident said, “When visitors don’t respect rules, leave litter behind and ignore traffic regulations, then as regrettable as it is, we have to take action.”\n\nBerlin, Germany\nBefore opening N&S, one of Germany’s top-rated restaurants, owner Billy Wagner set a ‘no photos, no videos’ rule for the place. He mentions two reasons for the rule: privacy for the other diners and appreciation for the food. “I was interested in analogue focus, which is what a restaurant visit is really all about: to smell, taste, feel, see.” He felt that the only way that people could have that focus was to put their phones away.","task":"Your group is discussing the issue of taking photos in public places. You may want to talk about:","points":["why people might not like others taking photos in public places","places in Hong Kong that are popular for taking photos","whether Hong Kong needs to have rules for photo taking in public places","anything else you think is important"],"ir":["Do you like taking photos?","Do you like to share photos with friends?","Is taking photos a popular hobby among teenagers?","Have you ever gone to a place just to take photos?","Is taking photos an important part of travelling?","Who likes taking photos more: younger people or older people?","Can taking photos spoil an experience?","Do you think tourism causes disruption to local people?"]},{"id":"2025-1.3","no":"1.3","label":"As PC ownership declines, smartphones are on the rise","intro":"This article recently appeared on a technology website:","title":"As PC ownership declines, smartphones are on the rise","text":"During the 1990s, as personal computers or ‘PCs’ – including desktops and laptop computers – became more user-friendly, ownership of these devices increased dramatically. In the US, households owning a PC rose from 15% in 1990 to 35% in 1997. As the internet became more popular and usable, ownership continued to rise, and by 2007, about 271 million people worldwide owned a PC.\n\nIn that same year, something incredible happened. Apple released the iPhone, the world’s first modern smartphone. That year, 124 million smartphones were sold; within four years, smartphone sales surpassed those of PCs. By 2015, sales of smartphones were nearly five times higher than those of PCs.\n\nAlthough PC ownership received a brief boost during the Covid-19 pandemic, when many people had to work from home, that was short-lived. In 2022, sales of PCs dropped by 20% from the previous year, and worldwide PC sales fell again in 2023 and 2024. Smartphone sales, meanwhile, have been rising by about 10% year on year, and by 2024, nearly 60% of all web traffic was from mobile devices.\n\nDoes this mean that the PC is dead? Not quite, say analysts. For people who work mostly in one place, for instance, a PC is more convenient, and for gamers who play high-end video games that require a lot of power, PCs are clearly better than phones.\n\nIn the end, analysts say, the device you choose to use is the one that works best for you.","task":"You are members of your school technology club. Your group is discussing the rise of smartphones. You may want to talk about:","points":["why smartphones are so popular","whether PCs are still useful for students","whether smartphones will one day completely replace PCs","anything else you think is important"],"ir":["Do you use a smartphone?","Do you ever use a computer for homework?","Do teenagers in Hong Kong spend too much time on their smartphones?","Do you think that you could live without a smartphone?","Should students be allowed to use smartphones in school?","Do you think schools should provide laptops for students?","Do you prefer to work on a PC or smartphone?","Should very young children be allowed to use a smartphone?"]},{"id":"2025-2.1","no":"2.1","label":"Travelling North Becomes New Trend","intro":"This article appeared in a local newspaper:","title":"Travelling North Becomes New Trend","text":"Many will have noted the growing trend of Hong Kong residents travelling north to Shenzhen. The activities on these trips may include leisure activities and even medical services.\n\nAccording to the latest data from the Immigration Department, 53 million trips were made by Hong Kong residents heading north in 2023. Since 2019, the consumption pattern of Hong Kong people in Shenzhen has gradually shifted from spending on leisure activities to everyday purchases, from dining and entertainment to medical check-ups, grocery shopping and even real estate purchases.\n\nTake supermarket shopping as an example. Sam’s Club in Shenzhen has recently become a hit among families from Hong Kong. During weekends and holidays, it is common to see Hong Kong people stocking up on groceries and also enjoying dining after shopping.\n\nAaron Chan spent his New Year holidays in Shenzhen, during which he tried hot pot and barbecue and drank a lot of milk tea. “The cost of a good meal is half the price. In Shenzhen, you are spoilt for choice and the fruit and vegetables are much cheaper,” he stated.\n\nApart from being cheaper and the variety it offers, Shenzhen is attracting more people because of its high-quality services. A visitor from Hong Kong, Sally Wu, said that she had noticed great improvements in the quality of service in Shenzhen over the last few years. “For example, service staff there will proactively inform you about discount offers, and their friendly attitude makes you feel comfortable,” she added.","task":"Your group is working on a project on the changing leisure activities of Hong Kong people. You are preparing a presentation about the trend of travelling to Shenzhen. You might want to talk about:","points":["why trips to Shenzhen are becoming popular","why some Hong Kong people prefer Shenzhen to other places","how Hong Kong businesses could keep people in the city during holidays","anything else you think is important"],"ir":["What do you do at weekends?","Have you ever been to Shenzhen?","Would you like to travel to Shenzhen with your family?","What would you do on a family trip to Shenzhen?","Do you think the trend of Hong Kong people travelling to Shenzhen will continue?","Apart from going to Shenzhen, how could Hong Kong people spend their free time?","Do you think it is convenient to make everyday purchases in Shenzhen?","How will the travel habits of Hong Kong people change in the future?"]},{"id":"2025-2.2","no":"2.2","label":"American teenagers today are driving less than their parents did","intro":"This article was recently published on a news webpage:","title":"American teenagers today are driving less than their parents did","text":"14 years ago, when Zachary Grand turned 17, he couldn’t wait to get his driving licence. Back then, a driving licence was considered a sign of adulthood: you were not a child anymore and could travel around freely, not depending on anyone else.\n\nHow times have changed. While the share of US teenagers with a driving licence was over 65% in 1995, today it is below 40%. In cities that have good public transport, the percentage is even lower.\n\nGrand notes that teens do not want to get their driving licences anymore. “When I recently moved from California to Chicago, I was really surprised to see that so few young people here want to drive. It’s incredible!”\n\nThe reasons behind this trend are many, and complicated. For one thing, car costs have increased a lot and so have the prices of petrol and insurance. Additionally, cities and towns have grown more crowded and less car-friendly, and many states in the US have made it harder for teenagers to get a driving licence.\n\nTechnology is also a factor. Things that teens used to do in person – hanging out with friends, taking classes, shopping for clothes, playing games – can now be done online. Ride-hailing apps like Uber and home delivery apps have also made driving less necessary.\n\n“You can do anything from your phone,” Grand says. “Call an Uber or even book a train or bus if you want to.”","task":"Your group is discussing whether it is worth learning to drive in Hong Kong. You may want to talk about:","points":["the benefits and challenges of being a driver in Hong Kong","whether Hong Kong is a car-friendly city","reasons why so few teenagers learn to drive in Hong Kong","anything else you think is important"],"ir":["Do you want to learn to drive?","Do young people in Hong Kong usually learn to drive?","Is Hong Kong a safe city for driving?","Do you think schools should teach students how to drive?","Do you think it is necessary for teenagers to learn to drive in Hong Kong?","Should the government encourage more or less car ownership in Hong Kong?","Should Hong Kong young people be allowed to drive at a younger age than 18 years old?","Do you think that learning to drive is a sign of adulthood?"]},{"id":"2025-2.3","no":"2.3","label":"How phobias happen, and what you can do if you have an irrational fear","intro":"This article appeared in a magazine:","title":"How phobias happen, and what you can do if you have an irrational fear","text":"Have you heard of Chelonaphobia, or fear of turtles? Emily Ko, a Hong Kong-born freelance writer is scared of turtles, and while it sounds silly to most people, that’s exactly what a phobia is – an extreme fear of a threat and expecting danger that’s out of proportion to the actual risk.\n\n“I was five years old when my parents came home with two pet turtles,” Emily says. “I freaked out. Obviously, my parents didn’t throw away the turtles – they put them in my brother’s room. But these things live long lives… I didn’t go into that bedroom for 10 years.”\n\nHong Kong-based hypnotherapist Sonia Samtani has dealt with a range of phobias – some common, some not. “I’ve treated people for fear of public speaking, cockroaches, needles, medical procedures, flying and dark spaces, and less common phobias such as cats, escalators, and pigeons.” Samtani says phobias can also eat away at a person’s self-confidence and self-esteem. The impact may get more severe if that person doesn’t know why they are scared of something.\n\nHowever, there are techniques that can help people overcome even the most extreme phobias. One popular type of treatment that helps people change the way they think and behave, is to gradually expose them to their fear so they feel less anxious about it. In this way, people don’t have to suffer from phobias all their lives.","task":"Your group is doing a group project about common fears among Hong Kong teenagers. You may want to talk about:","points":["common fears that Hong Kong teenagers have","why they may have such fears","how they can overcome those fears","anything else you think is important"],"ir":["What things are you afraid of?","Do you know anybody who is scared of an animal?","Were you afraid of anything when you were younger?","Why would some people be afraid of taking the lift?","How can you help a friend who has a fear of public speaking?","Where would you seek help if you had a fear of something?","How do people’s fears affect their self-confidence?","Do you think some fears might disappear as you get older?"]},{"id":"2025-3.1","no":"3.1","label":"Hong Kong travel firm still offering wildlife experiences despite animal welfare pledge","intro":"This article appeared in a local newspaper:","title":"Hong Kong travel firm still offering wildlife experiences despite animal welfare pledge","text":"Hong Kong-based travel firm Vapido is continuing to promote attractions that feature wild animal performances despite a new animal welfare policy enacted last month. The company defended its tours and said it was committed to helping “build a responsible tourism community and improve the lives of animals in the travel industry.”\n\n“Our approach is to continually work with operators to encourage long-term and sustainable change, which not only takes into consideration animal welfare but also communities who are directly impacted by the industry,” a company spokesperson said. “We continue to work with our partners across the world to achieve this. One example is elephant tourism in Thailand, which comes with a cultural and religious heritage, and is beneficial for the local communities and the economy,” she added.\n\nEarlier this year, the travel company vowed to end ticketing for some animal attractions. Under its new policy, situations where wild animals are drugged or abused are banned. This ban extends to circuses and shows during which animals are forced to perform unnatural behaviour.\n\nHowever, the animal welfare NGO, People for the Ethical Treatment of Animals, shared a video that showed dead bodies of horses and camels outside a tourist site in Egypt. While camel-riding activities in Egypt are listed as “currently unavailable” on Vapido’s website, the company continues to offer camel rides in places including Dubai, Morocco, and Turkey.","task":"You are a member of the Tourism and Travel Club at your school. Your group is giving a presentation to students about the effects of tourism on animals and local communities. You may want to talk about:","points":["types of tourist activities that involve animals","how these activities may cause harm to animals","possible benefits of these activities for animals and local communities","anything else you think is important"],"ir":["Have you ever watched an animal show?","Do you enjoy animal shows?","Would you go on a camel ride?","How would you encourage people to treat animals better?","Do animals used in shows have a better life?","Why do people go to animal shows when on holiday?","Should all animal shows be banned?","What can the government do to increase tourists’ awareness about animal welfare?"]},{"id":"2025-3.2","no":"3.2","label":"Music groups no longer dominate the pop charts","intro":"This article recently appeared on a news website:","title":"Music groups no longer dominate the pop charts","text":"When the British rock group The Beatles first visited America in 1964, it set off a musical explosion. Not only did this group become hugely popular around the world, but young people everywhere also started buying musical instruments and forming pop and rock groups of their own.\n\nFor the rest of the 20th century, music groups dominated the pop charts. In the year 2000, for instance, over 80% of the songs listed in the ‘Hot 100’ biggest musical acts compiled by Billboard magazine were by pop, rock or hip-hop groups.\n\nHow times have changed. According to recent data, very few of the hottest songs from the year 2024 were from music groups. In August 2024, only one group, Imagine Dragons, had a hit in the Global Top 50. Individual performers like Ariana Grande, Taylor Swift, Eminem and Dua Lipa now dominate the charts.\n\nWhile there are many reasons for this trend, experts say that the biggest factor has been the rise of social media. As music executive Chris Price notes, social media “is mainly a solo activity. It’s easier as an individual singer to express what kind of artist you are on YouTube or Instagram than for four people to do the same thing.”\n\nAnother factor is the improved technology for recording music alone, as software like Ableton Live allows people to make high-quality music at home. “In the past, if you wanted to make music for people to dance to, you needed a band,” says Price. “Now you just need a laptop.”","task":"Your group is discussing changes in pop music trends in recent years. You may want to talk about:","points":["whether music groups are popular in Hong Kong","whether it is better to watch a performance by a music group or an individual performer","how social media has affected pop music trends","anything else you think is important"],"ir":["Do you like listening to music?","Would you like to be part of a music group?","Do boys and girls usually like the same kinds of music?","Should all children learn to play a musical instrument?","Do teens usually prefer music from Hong Kong or music from other places?","Do older and younger people in Hong Kong like the same kinds of music?","Is music important to young people these days?","Do you think music groups will completely disappear in the future?"]},{"id":"2025-3.3","no":"3.3","label":"The art of self-care","intro":"This article appeared in a local magazine:","title":"The art of self-care","text":"More often than not, we are busy with work, maintaining our friendships and checking in with our families. And as we enjoy taking care of others, it’s also important to take care of ourselves. Self-care is key to our physical and mental health.\n\n“Self-care is when you engage in activities that take care of yourself,” Valerie Ho, the founder of an e-commerce platform specializing in self-care products, explains. When we do not engage in self-care activities, “physically, we feel the symptoms of stress, things like increased heart rate, increased blood pressure, headaches, and stomach upsets. From a mental health perspective, there is an increase in anxiety or depression, and emotionally, people may find themselves more easily irritated or crying without any reason,” says Odile Thiang from MindHK, an NGO focusing on wellbeing among Hong Kong people.\n\nAccording to Odile, there are three pillars of self-care – exercise, sleep, and diet. Regular exercise is not only important for your physical health, but from a mental health perspective, it has been shown to treat feelings of anxiety and depression. Getting enough sleep is also an incredibly important part of self-care and helps us recharge. And watching what you eat is beneficial to both your body and your emotions.\n\nIf you don’t know where to start, Odile suggests trying coupling – pairing something you love with something you know is good for you, but you’re not too keen on. “A lot of people find it hard to get motivated about exercising, so couple it with watching your favourite Netflix show.”","task":"You are members of the organising committee for Self-Care Month at your school. You are meeting to discuss this. You may want to talk about:","points":["whether Hong Kong students are aware of the importance of self-care","activities to organise during the Self-Care Month","ways to encourage students to take part in self-care activities","anything else you think is important"],"ir":["Do you enjoy exercise?","Do you think you get enough sleep?","What activities do you do if you feel stressed?","Does your school promote well-being among students?","Do students in Hong Kong have enough time to do exercise?","Do you think exercise can help improve mental health?","How can parents support their children’s well-being?","Who should be responsible for students’ health: schools or parents?"]},{"id":"2025-4.1","no":"4.1","label":"Why Spirited Away Changed Animation Forever","intro":"This article appeared in a film magazine:","title":"Why Spirited Away Changed Animation Forever","text":"In 2001, one of the most celebrated anime movies hit theatres in Japan. Directed by Hayao Miyazaki and produced by Studio Ghibli, Spirited Away would leave a mark on animation in the 21st century.\n\nThe story follows an ordinary 10-year-old girl, Chihiro, as she arrives at a deserted theme park that turns into a world of spirits at night. Her parents are turned into pigs by Yubaba, the witch who manages a bathhouse serving otherworldly customers. Chihiro must work in the bathhouse to save her parents and find a way to return home. The story is a tale of resilience, as Chihiro gradually finds her inner strength.\n\nThe movie arrived at a time when people thought animation was for children. Spirited Away destroyed prejudice about the art form and proved that a movie created in Japanese with elements of Japanese folklore could reach global audiences of all ages.\n\nJane Napier, a film critic, underlines the global impact of the movie. The movie’s theme is uncertainty. “I think this is one reason why this movie is so popular; it recognizes that the world can be scary, and that we don’t always know what’s going to happen to us,” Napier explains.\n\nTo Yoshioka, a Studio Ghibli fan, Spirited Away can be interpreted in numerous ways by the viewer. “This is key for the film to be loved as a classic,” he says. “So, even 20 years on, Spirited Away is a movie that can be watched and rewatched.”","task":"You are members of the School Movie Society. You have been asked to plan a Movie Festival at your school. You may want to talk about:","points":["whether anime movies would be suitable for the festival","other types of movies that are popular among secondary school students","other activities to organise for the festival","anything else you think is important"],"ir":["Do you like anime movies?","What is your favourite animated movie?","Do you prefer animated or live-action movies?","Do you think that anime movies can be for adults?","Should all anime movies have a happy ending?","What type of movies make you want to watch them again?","What makes an anime movie appealing?","Do you agree anime movies have artistic value?"]},{"id":"2025-4.2","no":"4.2","label":"Can a personality test help decide your future career?","intro":"This article recently appeared in an online newspaper:","title":"Can a personality test help decide your future career?","text":"The Myers-Briggs Type Indicator (MBTI) is a self-reported personality test that can help you find out what kind of person you are. Among other things, the test assesses people’s likes, dislikes, personal preferences, and possible career paths.\n\nThere are 16 personality types in total in the test. Many young people nowadays take the test to see if it can help them choose a suitable future job.\n\nAccording to LinkedIn, a website that helps people find suitable careers, job seekers can use the MBTI test in multiple ways. First, it can help them identify their strengths, weaknesses, preferred work style, and ability to get along with others. Additionally, people can find lists online showing how common each MBTI type is in various fields of work, which can help them choose a career that matches their personality.\n\n“By using the MBTI, you can discover your personality type and how it influences your work preferences, behaviours, and outcomes,” the site reports. “You can also use the MBTI to find careers that match your type.”\n\nHowever, it is not only potential employees who use the MBTI but employers as well. In China, many companies, including large international ones, now require job applicants to complete the test, and it is one of the factors that may help them decide whether to hire someone – or not.\n\n“Some companies may not want to hire someone whose personality test results do not suit their goals,” said Ning, a senior media executive.","task":"Your group is attending a career planning workshop at school and you are discussing the use of personality tests in finding a job. You may want to talk about:","points":["benefits of using personality tests for choosing a career","problems with using personality tests for choosing a career","other ways to decide how to choose the right career","anything else you think is important"],"ir":["What job would you like to do?","Have you ever taken a personality test?","Are personality tests popular among young people in Hong Kong?","Do your friends have similar personalities to you?","Is it important to know your own personality type?","What kind of personality do you get along well with?","Has your personality changed since you were younger?","Should employers be allowed to use personality tests?"]},{"id":"2025-4.3","no":"4.3","label":"Scouts Create a Better World","intro":"This article appeared on a website:","title":"Scouts Create a Better World","text":"Many Scout organizations worldwide have committed to achieving the United Nation’s Sustainable Development Goals (SDGs). For example, the groups aim to end poverty, reduce inequality and combat climate change.\n\nLearning key values\nFrom as young as six, boys and girls can join to learn about nature while playing games, making friends and learning important values. “The key values of a Scout are respect for others, for oneself and for the environment,” says Morgan, a Belgian Scout leader. In Greece, for example, Scouts are given tips on how they can implement the SDGs in their daily lives, such as by asking for a donation to charity instead of a gift on their birthday to achieve Goal 1: No Poverty; or by not letting their tap run when brushing their teeth for Goal 6: Clean Water and Sanitation.\n\nEveryone is welcome\nInclusion is an important principle of Scouting. “Everyone is welcome in Scouting. One of the most important values for young people taking part is that everyone can participate and that you can be yourself,” says Takahashi, Director of Scouting Japan. “Cooking together at camp or sleeping in a tent promotes community life and respect for different opinions,” says Luc, another Scout leader from Luxembourg.\n\nGlobal solidarity\nScouting not only brings young people together at a national level, but also internationally. Thousands of young members from 171 countries meet every four years at the World Scout Jamboree. Held in a different location each time, the 10-day educational event promotes peace and friendship.","task":"Your group would like to start a Scouting Club. You are meeting to prepare a presentation to convince the School Board. You may want to talk about:","points":["benefits of Scouting for secondary school students","activities to organise for the club","ways to encourage other students to join the club","anything else you think is important"],"ir":["Do you enjoy nature?","Would you like to be a Scout?","Have you ever gone camping?","Would you enjoy sleeping in a tent?","Is camping a popular activity in Hong Kong?","Would you prefer camping in a Scout group or with your family?","Do you agree Scouts could make the world a better place?","What lessons that you learn as a Scout would be the most important?"]},{"id":"2025-5.1","no":"5.1","label":"A daring heart: Meet the bamboo scaffolders of Hong Kong","intro":"This article appeared on a website:","title":"A daring heart: Meet the bamboo scaffolders of Hong Kong","text":"Intricate bamboo scaffolding is still part of the cityscape in Hong Kong. The metropolis is one of the world’s last remaining cities to use bamboo scaffolding in construction and building repair. Luckily, the Construction Industry Council (CIC) and its students are keeping this sustainable skill alive.\n\nScaffolders perched on bamboo frames several storeys high are a common sight, and are nicknamed ‘spiders’ by Hong Kong people for their agility over the scaffold. Mo Jia Yu wraps his legs around a pole to balance high above the ground and secure a joint, a skill he must master to become a bamboo scaffolder in Hong Kong. “You have to have a daring heart,” says Mo, one of dozens of students who enrol each year at the CIC to learn the traditional method. “You need courage as well as skill to survive,” says Professor Chang from the Architecture Department of the University of Hong Kong. “This discourages people from going into the industry.”\n\nDespite the dangers involved in the craft, Chang hopes Hong Kong will preserve it as part of its cultural heritage.\n\nBamboo is readily available across the border in southern Chinese provinces. Its price and efficiency makes it popular, while lightweight bamboo is also easier to transport through a cramped urban centre.\n\n“Bamboo scaffolds are suited to the odd and tight spaces in Hong Kong,” adds instructor Kin Kee Wo, who has worked in the construction industry for nearly 30 years. “It can be built in the most unthinkable places, in the most beautiful ways.”","task":"Your group is doing a project on bamboo scaffolding. You are meeting to discuss this. You may want to talk about:","points":["benefits of using bamboo for scaffolding","ways of improving the safety of bamboo scaffolding","whether bamboo scaffolding is part of Hong Kong’s heritage","anything else you think is important"],"ir":["Do you often see bamboo scaffolding in Hong Kong?","Would you like to learn to build bamboo scaffolding?","Would you like to work in the construction industry in Hong Kong?","Are you worried when you have to walk under bamboo scaffolding?","Should bamboo scaffolders be paid high salaries?","How can bamboo scaffolding be made safer for workers?","Should bamboo scaffolding be taught at secondary schools?","Do you think people will continue learning traditional crafts?"]},{"id":"2025-5.2","no":"5.2","label":"Should Teenagers Drink Coffee and Caffeinated Energy Drinks?","intro":"This article appeared on a webpage:","title":"Should Teenagers Drink Coffee and Caffeinated Energy Drinks?","text":"Teenagers now have another thing to worry about: coffee. This time, it isn’t parents trying to prohibit their kids from becoming over-caffeinated: it’s Caligula Coffee, one of the largest coffee chains in the UK.\n\nAn employee’s recent refusal to serve an iced coffee to a 12-year-old is reigniting a controversial question. Should shops be allowed to ban the sale of coffee and energy drinks to teenagers and kids?\n\nWhile Caligula Coffee isn’t completely banning the sale of coffee to teenagers, the company’s new policy allows its employees to deny serving them drinks that contain caffeine, including energy drinks. “We do not encourage the sale of caffeine to children under 16,” the company’s spokesperson said. Some customers, including the 12-year-old’s father, are upset. He expressed his outrage online saying his daughter just deserved a treat.\n\nBut not everyone is against a ban. The UK government, for example, has been working to prohibit the sale of coffee and energy drinks to teenagers after declaring the link between caffeine consumption and various health issues among younger consumers too strong to ignore.\n\nThe National Institute of Health (NIH) says that significant amounts of caffeine affect the heart and blood vessels. According to Dr George of the NIH, when it comes to teenagers and caffeine, education and moderation are both key. And it’s also important to remember who you’re talking to. “Beware once you tell someone, especially teenagers, that they can’t have something: they will find a way to get their hands on it.”","task":"You are members of the Healthy Life for All Club at your school. Your group is meeting to discuss the impact of coffee and energy drinks on teenagers. You may want to talk about:","points":["negative effects of coffee and energy drinks on teenagers’ health","what the club can do to make those effects known among students","whether coffee and energy drinks should be sold to teenagers","anything else you think is important"],"ir":["Do you like energy drinks?","What drinks are popular among teenagers?","Do young people drink more coffee than old people?","Do you believe the coffee ban for teenagers is a good idea?","Should schools ban unhealthy drinks?","What advice could you give a parent whose child drinks too many energy drinks?","What can be done to help teenagers consume fewer energy drinks?","Do you agree that banning something is not likely to work with teenagers?"]},{"id":"2025-5.3","no":"5.3","label":"Gap Year: Work or Travel?","intro":"This article appeared as a blog post:","title":"Gap Year: Work or Travel?","text":"Students always face many tests and exams. Taking a break from studies for a year and having a rest sounds attractive. A “Gap year”, usually taken after the end of secondary school and before starting university, provides an opportunity for students to explore the world, look for a richer spiritual life and exchange cultural ideas.\n\nWhat did Hong Kong students do during their gap years? Oscar Chan Chi-kin, a year one business student at the Hong Kong University of Science and Technology, didn’t go to university immediately. Instead, he went to Singapore in his gap year and volunteered to help young people develop leadership skills. “Instead of being career-driven, I hoped to gain a life direction and figure out what I love to do,” he said. After the gap year, he knew what his ideal working environment would look like in his future career. “Whether the company vision aligns with my personal values is really important.”\n\nBesides travelling and volunteering, young people from Asia also choose to intern and work to enrich their resumés and sharpen their competitive edge. However, Sascha Choi On, a student who has just started studying at CUHK has a different view: “Nowadays it’s changing. Some of my friends took a gap year because they really wanted to find a sense of self, such as ‘who I am’ and ‘what the goal in my life is’. Some students really care about their inner peace and happiness rather than just focusing on earning money,” she said.","task":"You are invited to participate in a round table discussion at the Hong Kong Youth Forum about taking a gap year after secondary school. You may want to talk about:","points":["benefits of taking a gap year","challenges of taking a gap year","activities young people could do during their gap year","anything else you think is important"],"ir":["Would you like to take a gap year?","What would you do during a gap year?","Would you prefer to volunteer or to travel during a gap year?","Where would you like to travel to during a gap year?","Do you know what career you would like to pursue?","Do you think taking a gap year is popular among Hong Kong young people?","How can students make sure that their gap year is not wasted?","How would travelling during a gap year help somebody’s career?"]},{"id":"2025-6.1","no":"6.1","label":"Hong Kong’s growing second-hand luxury clothes culture","intro":"This article appeared on a fashion website:","title":"Hong Kong’s growing second-hand luxury clothes culture","text":"Redress, an NGO promoting sustainability through popularising second-hand fashion, is back with its seasonal “Get Redressed #ShopSecondhand” pop-up store in Hong Kong. Located at Taikoo Place, Quarry Bay, the second-hand pop-up store’s success over the years shows a growing second-hand culture in the city. Meanwhile, online second-hand luxury fashion platforms like Hula, Vestiaire Collective and Little Dot Vintage sell discounted items from brands like Dior, Chanel, and Gucci.\n\nShoppers can expect to see donated second-hand clothes and accessories from all over Hong Kong, with pieces ranging from luxury designer labels to more trendy and affordable ones, according to Redress’ event page. The clothing items up for resale are donated by people and collected through the NGO’s takeback program. With something for everyone, the event is expected to be size- and gender-inclusive, while shoppers will be confident that they are reducing their carbon footprint by buying second-hand clothes that would otherwise end up in the city’s landfills.\n\nAccording to Redress’ 2020 study on Hong Kong’s fashion consumption, changes in consumer habits were considerable after the pandemic, with two out of three actively changing their behaviour, and 30 per cent of respondents acknowledging the environmental cost of shopping habits. What is particularly interesting is that 31 per cent of respondents already own second-hand clothing, while 12 per cent have been reselling clothes online and offline as well. There is no doubt about the sustainable fashion industry’s potential in Hong Kong.","task":"Your class is preparing a social studies project on second-hand clothing in Hong Kong. You may want to talk about:","points":["what Hong Kong people normally do with their unwanted clothes","why second-hand fashion is growing in Hong Kong","ways to promote second-hand fashion","anything else you think is important"],"ir":["Do you like shopping for clothes?","Would you like to wear second-hand clothes?","Do you think buying second-hand clothing is a good idea?","What do you do with the clothes you no longer need?","Why do some people think second-hand clothing is not a good idea?","Would you be concerned about the cleanliness of second-hand clothes?","Why do people throw their clothes away so often?","How has the pandemic changed clothes shopping in Hong Kong?"]},{"id":"2025-6.2","no":"6.2","label":"In trilingual Hong Kong, Korean language is the new kid on the block","intro":"This article appeared in a newspaper:","title":"In trilingual Hong Kong, Korean language is the new kid on the block","text":"For decades, French, Spanish, German and Japanese have been the most popular foreign languages among Hong Kong students. But in recent years, Korean has emerged as the new kid on the block. The latest estimate by the Korean consulate in Hong Kong showed that there were around 40,000 Korean learners in 2024 based on enrolment figures at universities and private academies.\n\nIn secondary schools, most Korean lessons are taught as extracurricular classes. But some have gone a step further to include the language in their curriculum as an elective. The introduction of Korean into the public school curriculum, although still at an early stage, is significant and a testament to its popularity, experts say. Professor Li Chor-Shing said the launching of Korean classes in public schools shows that many young people are motivated to learn Korean, and that it could help students with their future career prospects.\n\nTeachers say Korean has gained popularity in public schools as young people see learning Korean as more than just a hobby. Ms. Lai, who has taught Korean for over 10 years, said she has seen a shift in the past two to three years in the reasons young people want to learn the language. “It used to be K-pop fans wanting to learn how to write ‘Oppa, I love you’ in letters to their idols,” Ms. Lai said. “But now, aside from that, students also see Korea as a study destination or they want to work there.”","task":"You are members of the Student Union. Your school is going to require students to learn a language other than Chinese or English and you are meeting to discuss this. You may want to talk about:","points":["why Hong Kong students should learn other languages","which other languages would be popular among students","how students can learn other languages outside the classroom","anything else you think is important"],"ir":["Would you like to learn Korean?","Do you like Korean culture?","Would you prefer to learn languages online or at school?","Is listening to songs useful for learning a language?","Is it important to speak many languages to have a successful career?","Would you prefer learning an Asian or a European language?","Do you think you will need to learn more languages in the future?","Do you need to know a country’s culture to learn its language?"]},{"id":"2025-6.3","no":"6.3","label":"Once-in-a-lifetime adventures","intro":"This advertisement appeared on the website of a travel agency:","title":"Once-in-a-lifetime adventures","text":"Here at Global Travel, we’ve specialised in delivering unforgettable educational tours to places all over the world for over 50 years. Take a look at our current trips on offer.\n\nSwim with turtles in Australia\nSwim with endangered species at the world-famous Ningaloo Reef, home to around 500 types of fish and other sea creatures. At only 100 metres offshore, there’s no need to scuba dive – the snorkelling is amazing. See the seven species of turtles that build their nests on beaches and islands nearby. You can also learn how to save coral reefs, which play a vital role in the marine environment.\n\nVisit a volcanic cave in Iceland\nTravel down 120m below the surface of the earth into an ancient volcanic cave. Explore the colourful rock formations and the huge underground spaces. Above ground, visit the ice lakes to see the incredible filming locations of movies like Star Wars and TV shows like Game of Thrones. You’ll be amazed by the views as you learn more about the rocks we take for granted.\n\nSee the starry night in Morocco\nMorocco, in North Africa, has some of the world’s best skies for stargazing. The dry climate means cloudless skies all year round, with no towns or light pollution in its remote nature reserves. Experience a unique camping tour in the desert with dedicated guides who know all the best places to see these heavenly wonders. Find out about the history of our universe from the very heart of the desert.","task":"Your school has won a free adventure trip. You are part of the School Travel Team and are meeting to discuss the three choices above. You may want to talk about:","points":["which trip would be most beneficial for students to join","problems and challenges that the students might face on the trip","how to convince parents to let their children join the trip","anything else you think is important"],"ir":["Have you ever been on a school trip?","Would you like to go on an adventure trip?","Would you prefer to take a relaxing trip or an adventure trip?","Do you think adventure trips are appropriate for students?","Would you prefer to travel to far away places or to stay near to Hong Kong?","Would you prefer going on a trip with your school or with your family?","Are you interested in exploring marine life?","What makes an adventure trip memorable?"]},{"id":"2025-7.1","no":"7.1","label":"Urban beekeeping: A good idea?","intro":"This article appeared in an Australian newspaper:","title":"Urban beekeeping: A good idea?","text":"Thousands have taken up urban beekeeping in Sydney. The reaction from neighbours is not always positive. Rob Simms has three beehives in his garden, and gives away jars of honey to keep his neighbours sweet. “I delayed doing anything for six months because I thought I wouldn’t get neighbour approval,” Simms said. “Now I give people jars of honey and everyone’s happy.”\n\nBut the beekeeping boom has created problems for urban living. Catherine Heath, a resident, considers herself pro-bee. However, this spring her garden has become a no-go zone because of aggressive bees, and she noticed an adjoining house had a sign on the front fence advertising homegrown honey. “It’s to the point that in good weather, we can’t use the backyard most of the time,” Heath says. “There are a lot of bees and they behave in a strange way. They attack both dogs and humans unprovoked.”\n\nDouglas Purdie, president of Sydney Bee Club, said this was not unheard of. “Bees, like all wild things, go through cycles and temperament, just like you can have a dog that’s very nice today and tomorrow bites you,” he said.\n\nThe Department of Primary Industries says Sydney has over 15,000 registered beekeepers and around 400,000 hives. Dr Tobias Smith, a researcher at the University of Queensland, comments that native Australian bees are stingless. “If you have flowers around, they will just do their own thing, and you sit back and enjoy watching them,” Smith said. “They’re a really easy pet.”","task":"You are members of your student council. You are discussing if it is a good idea to put a beehive on the school campus as a biology project. You may want to talk about:","points":["benefits of beekeeping at school","problems that beekeeping could cause at school","other activities that could help students to learn about bees","anything else you think is important"],"ir":["Do you like honey?","Are you scared of bees?","Would you like to have an insect as a pet?","Would you like to keep bees?","How can schools make beekeeping safe for students?","Would your neighbours be upset if you took up beekeeping?","Do you think Hong Kong is suitable for urban beekeeping?","How else can schools promote a connection with nature?"]},{"id":"2025-7.2","no":"7.2","label":"Young people love subtitles; older people, not so much","intro":"This article was recently published on a news website:","title":"Young people love subtitles; older people, not so much","text":"Anyone who has ever watched movies or TV shows should be familiar with subtitles.\n\nThese are words that are shown on the bottom or side of a screen to indicate what the speakers on screen are saying. For viewers to follow along with the story, the timing of the texts must be the same as the timing of the people speaking.\n\nOriginally, subtitles had two main purposes: to translate the words from a foreign language into your own language, and to allow people who have hearing problems to understand the words being spoken.\n\nRecently, however, there has been a new trend among young people in the UK. According to research, 4 out of 5 viewers between the age of 18-25 use subtitles all the time – even when watching movies or TV shows in their own language – while less than 25% of people aged between 56-75 do so.\n\n“I think it’s natural now for young people to accept subtitles,” said UK media expert Melanie Sharpe. She added that while older people feel that using subtitles while listening to someone speak “requires too much thinking,” young people “can take in far more information quickly because they’re used to it.”\n\nNobody knows exactly how this trend started, but one theory is that young people grew up with seeing subtitles on social media and are now comfortable with them.\n\nAnother factor may be the poor sound quality of streamed videos. “They might be using subtitles because of background noise or changing volumes,” Sharpe said.","task":"You are members of the school’s Campus TV Team and you are discussing whether to add English and Chinese subtitles to your programmes. You may want to talk about:","points":["benefits of adding subtitles to the programmes","whether adding subtitles to programmes would be popular among students","type of programmes subtitles are not suitable for","anything else you think is important"],"ir":["Is there a Campus TV channel at your school?","Do you usually use subtitles when watching movies?","Do you prefer English or Chinese subtitles?","Are movies without subtitles difficult to watch?","Are movies with subtitles less enjoyable?","Do you agree that young people like subtitles?","Do you prefer to have subtitles when watching a movie in your own language?","Can subtitles help people to learn a language?"]},{"id":"2025-7.3","no":"7.3","label":"An unusual career that may be one of the most desired jobs of the future","intro":"This article was published recently on a news website:","title":"An unusual career that may be one of the most desired jobs of the future","text":"As artificial intelligence or ‘AI’ becomes more widely used and starts replacing some traditional jobs, many young people worry about their future careers.\n\nAccording to some experts, however, there is one popular job trend which will not be easily taken over by AI: being a ‘personal shopper’.\n\nA personal shopper refers to a person who helps customers find products that they need by doing their shopping for them. Instead of visiting real stores or spending hours searching online, a customer with little free time can find a personal shopper with the right skills, knowledge and connections to help meet their needs.\n\n“This is a job that has grown quickly,” says American business executive Tom Ward. “And it’s grown in line with the way that customers want to shop.”\n\nThe best personal shoppers have expert knowledge of their field. To become a professional clothing shopper, for instance, you need to learn everything about fashion, from the top designer names to the latest fashion trends.\n\nWhile AI assistants may also have such knowledge, the benefit of human shoppers is that when they visit stores to locate good quality or ‘on sale’ items, they build personal relationships with store owners and supply shops. This can help a human shopper see the quality of the goods, get the best possible prices, and even find unusual products not available online. These benefits, say retail experts, mean that human personal shoppers are still the best choice.","task":"Your class is talking about personal shopping as a career. Your group has been asked to discuss the reasons for this trend. You may want to talk about:","points":["whether being a personal shopper would be a good job for teenagers","if AI will one day replace human salespeople in face-to-face shopping","how shopping will change in the future","anything else you think is important"],"ir":["Do you like shopping?","Where is your favourite place to shop?","Do you prefer to shop alone or with friends?","Do you prefer shopping online or in a shop?","Would you be a good personal clothes shopper?","What do you think would be difficult about being a personal shopper?","Would you hire a personal shopper if you were too busy to shop yourself?","Is shopping a leisure activity or a necessity?"]},{"id":"2025-8.1","no":"8.1","label":"How an app is reshaping Hong Kong tourism","intro":"This article appeared on a website:","title":"How an app is reshaping Hong Kong tourism","text":"Carrying three lenses, two cameras and a tripod with him, Mainland Chinese tourist, Wei Qingyu, arrived at a basketball court with his girlfriend in search of a photo spot in Kennedy Town on a cloudy day. But why this sports facility in a residential area on Hong Kong Island?\n\nWei said it provided the perfect vantage point to capture the city’s historic trams going along a vibrant street against the backdrop of Victoria Harbour. It was a tip Wei saw on Xiaohongshu, an Instagram-like social media platform popular on the Mainland and beyond.\n\nXiaohongshu, known for travel tips, has more than 200 million active users, with more than 70 per cent of the users born in the 1990s. The app has reshaped Hong Kong’s tourism landscape, as influencers share ideas and tips for previously ordinary places. Some bring takeaways from McDonald’s to MacDonnell Road in Mid-Levels for a fun photo. Others flock to Yau Ma Tei Police Station for a shot of the iconic building. Another destination popularised on Xiaohongshu is a busy footbridge in Mong Kok. Colourful neon signs adorning the residential buildings are a popular draw for tourists, who want to capture the nostalgic vintage vibe of Hong Kong.\n\n“The scenery, with some background music, seems quite romantic,” a Malaysian tourist said. “Hong Kong feels familiar because its dramas and films are very popular in Malaysia, and we go hunting for places we see on the app.”","task":"Your group has entered a competition to create a video for young tourists who visit Hong Kong. You may want to talk about:","points":["famous places to include in the video","activities to show in the video","difficulties your group may face while making the video","anything else you think is important"],"ir":["Do you like making videos?","Have you ever taken a photo at a famous place in Hong Kong?","Do you read travel tips on social media?","Is social media useful for exploring Hong Kong?","What makes Hong Kong popular among tourists?","Do you follow any influencers who share travel tips?","What aspects of Hong Kong would you like to see on social media?","Do you agree influencers are important for promoting tourism?"]},{"id":"2025-8.2","no":"8.2","label":"Why was Super Mario a plumber?","intro":"This article appeared in an online magazine:","title":"Why was Super Mario a plumber?","text":"In 1985, a little Italian plumber became the face of video games, and changed the way we play them. ‘Super Mario Bros’ featured the main character in the game, Mario, jumping around collecting coins and rushing to save Princess Peach from a villainous turtle.\n\nAt the time, video games were usually created by computer engineers, as opposed to today’s artists.\n\n“I was trying to use the technology available at the time to produce a distinctive-looking character from a small number of pixels, and that resulted in Mario,” said Shigeru Miyamoto, the game designer and producer of Super Mario Bros. As to why he picked a 26-year-old Italian-American plumber from New York as the main character, Miyamoto said, “We wanted him to be someone who might live near you, and not a superhero.”\n\n“People had never seen a game like Super Mario Bros,” said Frank Cifaldi, co-director of the Video Game History Foundation, “Super Mario Bros manages to convey an epic adventure in a massive world. Day turns to night as you progress. You cross bridges into new lands.” Super Mario Bros changed the way we play video games – “from merely aiming for a high score to playing a game to experience an adventure and see it through to its ending,” he said.\n\nTo celebrate Super Mario’s 40th anniversary, Nintendo has launched Mario-centred games. These new games use nostalgia for Mario and other classic games while experimenting with recent technologies like augmented reality.","task":"Your group is preparing a class project about video games. You may want to talk about:","points":["why people
