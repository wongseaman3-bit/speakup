 still play classic games like Super Mario Bros","what makes a video game popular for a long time","what video games will be like in the future","anything else you think is important"],"ir":["Do you play video games?","What kind of video games do you like?","Do you prefer games with ordinary characters or superheroes?","Do adults like playing the same video games as young people?","Would you like to be a game developer?","Are all video games suitable for children to play?","Do you agree that video games can be works of art?","How do video games influence young people?"]},{"id":"2025-8.3","no":"8.3","label":"A hot social media site among teens is one people might not expect","intro":"This article was published recently on a business website:","title":"A hot social media site among teens is one people might not expect","text":"If you were trying to guess which social media sites are becoming popular among teenagers, what would you choose? Snapchat? Instagram? Facebook?\n\nYou might be surprised to learn that a growing number of high schoolers are now turning to a site that is all about success at work: LinkedIn.\n\nThe world’s largest online professional network, LinkedIn, helps people find the right jobs, connect with others in their field, make important professional connections and learn skills necessary for career success. It also allows users to join career-related discussions and to read, and comment on, articles from their field.\n\nAccording to recent studies, many teenagers in North America now see LinkedIn as the hottest social media platform. This is partly because they are trying to prepare themselves for today’s fast-moving job market, but also because they like the positive tone of the site.\n\n“When I go on Facebook, I just see people with horrible feelings and bad ideas,” said one teenager. “And when I go on LinkedIn, it’s so positive and honest—this is how social media should be.”\n\nMany secondary students also say that they like LinkedIn because it helps them to find role models, to follow their interests, and to learn about possible future job trends.\n\n“I had been interviewing teenagers about social media,” said journalist Anya Kamenetz. “And I learned that this site is popular with those who are really focused on their futures.”","task":"Your class is talking about the growing popularity of LinkedIn among teens. Your group has been asked to discuss this trend. You may want to talk about:","points":["why teenagers may be turning away from other social media sites","whether social media is useful for finding career information","whether secondary school students should be concerned about their future careers","anything else you think is important"],"ir":["Do you use social media?","Which social media sites are most popular among teenagers?","What job would you like to do in the future?","Which careers are most popular among teenagers nowadays?","Would you look for jobs on social media?","How do people in Hong Kong usually look for jobs?","Would you post your profile on social media to find a job?","How can you check if information on social media is trustworthy?"]}]}];

const $ = s=>document.querySelector(s);

const fmtBlank = s=>esc(s).replace(/___/g,'<span style="border-bottom:2px solid var(--gold);padding:0 14px"></span>');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}
let saveT;
function save(){
  LS.set('data',DATA);
  clearTimeout(saveT);
  saveT=setTimeout(()=>api('save',{data:DATA}).catch(e=>{console.warn(e); toast('⚠️ 進度未能儲存，稍後會再試');}),1500);
}
async function api(action,payload){
  if(!API_URL||!TOKEN){ logout(true); throw new Error('請先登入'); }
  const body=JSON.stringify(Object.assign({action,token:TOKEN},payload||{}));
  let j;
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(API_URL,{method:'POST',body});
      j=await r.json();
      if(j.ok||j.error==='LOGIN'||!/too many|simultaneous|Service|timed out|繁忙/i.test(j.message||'')) break;
    }catch(e){ j={ok:false,error:'NET',message:'網絡連線出錯，請檢查 Wi-Fi'}; }
    await new Promise(r=>setTimeout(r,2500*(i+1)+Math.random()*2000));
  }
  if(!j.ok){ if(j.error==='LOGIN') logout(true); throw new Error(j.message||j.error); }
  return j.result;
}
async function aiCached(key,action,payload){
  if(MEM[key]) return MEM[key];
  const r = await api(action,payload); MEM[key]=r; return r;
}
function taskPayload(t){return {id:t.id,title:t.title||t.label,intro:t.intro,text:t.text,task:t.task,points:t.points};}

function speakWord(w){ if(!('speechSynthesis' in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(w); const v=pickVoice(); if(v){u.voice=v;u.lang=v.lang} else u.lang='en-GB'; u.rate=.9; speechSynthesis.speak(u); }
let VOICES=[];
function loadVoices(){ VOICES=(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang)); }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(){
  const pref=LS.get('voice','');
  return VOICES.find(v=>v.name===pref) || VOICES.find(v=>/en-GB/i.test(v.lang)&&/(Daniel|Google UK|Serena|Kate|Arthur)/i.test(v.name)) || VOICES.find(v=>/en-GB/i.test(v.lang)) || VOICES.find(v=>/en-US/i.test(v.lang)) || VOICES[0] || null;
}

function route(){
  const h = location.hash.replace(/^#\/?/,'').split('/');
  const k = h[0]||'home';
  document.querySelectorAll('#nav a,#bnav a').forEach(a=>a.classList.toggle('on', a.dataset.k===(['paper','task'].includes(k)?'home':k)));
  window.scrollTo(0,0);
  if(k==='paper') return viewPaper(h[1]);
  if(k==='task') return viewTask(h[1],h[2]||'gd',h[3]);
  if(k==='vocab') return viewVocab();
  if(k==='scripts') return viewScripts();
  if(k==='history') return viewHistory();
  viewHome();
}

function gdCheck(t){
  const n=notes(t.id).gd; const pts=t.points.filter(p=>!/anything else/i.test(p));

  const done=items.filter(x=>x[1]).length; const ok = done>=items.length-1 && items[0][1];
  const el=$('#gdcheck'); if(el) el.innerHTML=items.map(x=>`<span class="${x[1]?'ok':''}">${x[1]?'✓':'○'} ${x[0]}</span>`).join('')+`<span style="border:0;background:none">${ok?'可以解鎖了！':'完成大部分步驟就可以解鎖'}</span>`;

const K={};
function syl(w){w=w.toLowerCase().replace(/[^a-z]/g,''); if(!w) return 1; if(w.length<=3) return 1; w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'').replace(/^y/,''); const m=w.match(/[aeiouy]{1,2}/g); return Math.max(1,m?m.length:1);}
function buildWords(s){
  const segs = s.segments && s.segments.length ? s.segments : [{speaker:null,text:s.text||''}];
  const words=[]; const sentences=[]; let html='';
  segs.forEach(sg=>{
    html+=`<div class="seg">${sg.speaker?`<span class="spk s${esc(sg.speaker)}">${esc(sg.speaker)}</span>`:''}`;
    const sents = (sg.text||'').match(/[^.!?]+[.!?]+["'’”)]*\s*|[^.!?]+$/g)||[];
    sents.forEach(st=>{
      const start=words.length; const toks=st.split(/(\s+)/); let off=0; const offs=[];
      toks.forEach(tk=>{ if(tk.trim()){ const i=words.length; words.push({w:tk,n:tk.toLowerCase().replace(/[^a-z0-9']/g,'').replace(/’/g,"'")}); offs.push(off); html+=`<span class="wd" data-i="${i}">${esc(tk)}</span>`; } else html+=tk; off+=tk.length; });
      sentences.push({text:st.trim(),start,end:words.length-1,offs});
    });
    html+='</div>';
  });
  return {words,sentences,html};
}
function openKaraoke(s){
  if(!s||!(s.text||s.segments)) return toast('未有講稿');
  stopAll();
  const b=buildWords(s);
  Object.assign(K,{s,words:b.words,sentences:b.sentences,idx:-1,mode:'idle',blob:null,free:false,result:null});
  const ov=document.createElement('div'); ov.className='kov'; ov.id='kov';
  ov.innerHTML=`<div class="khead"><div class="t"><b class="serif">${esc(s.title||'')}</b><small>${esc(s.version||'')} · 撳任何字可聽讀音或加入生字</small></div><button class="kx" onclick="closeKaraoke()">✕</button></div>
   <div class="kprog"><i id="kbar"></i></div>
   <div class="kbody" id="kbody"><div class="inner"><div class="ktext plain" id="ktext">${b.html}</div><div id="kres"></div></div></div>
   <div class="kctl" id="kctl"></div>`;
  document.body.appendChild(ov); document.body.style.overflow='hidden';
  $('#ktext').addEventListener('click',e=>{const w=e.target.closest('.wd'); if(w && K.mode==='idle') wordPop(w,+w.dataset.i);});
  drawCtl();
}
function openFree(tid,i){
  stopAll(); const t=TASKS[tid];
  Object.assign(K,{s:{title:t.ir[i],version:'自由試答',taskId:tid,q:i},words:[],sentences:[],idx:-1,mode:'idle',blob:null,free:true,result:null});

    const b=$('#popadd'); b.innerHTML='<span class="spin"></span>';
    let d={word:w.toLowerCase(),example:ctx};
    try{ d=Object.assign(d,await aiCached('w_'+w.toLowerCase(),'define',{word:w,context:ctx})); }catch(e){}
    addVocab(d); $('#popdef').textContent=(d.ipa?d.ipa+'  ':'')+(d.pos||'')+' '+(d.zh||''); b.textContent='✓ 已加入';
  };
}
document.addEventListener('click',e=>{ const p=document.querySelector('.pop'); if(p && !p.contains(e.target) && !e.target.closest('.wd')) p.remove(); });

boot();
</script>
</body>
</html>
