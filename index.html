y want to talk about:","points":["whether Hong Kong is successful in international sport","whether sport is important to Hong Kong people","whether Hong-Kong can learn from other countries to improve sports","anything else you think is important"],"ir":["Can training improve sport skills? .","Why do many Hong Kong teenagers stop doing sport?","Do women have the same opportunities to play sport as men?","Why are some countries more successful than others at sport?","Are attitudes to sport changing in Hong Kong?","Is there too much emphasis on sport nowadays?","Will Hong Kong ever become famous for sport?","Can sport teach you life skills?"]},{"id":"2019-3.1","no":"3.1","label":"Death of Facebook?","intro":"This article appeared in an online magazine:","title":"Death of Facebook?","text":"Since Facebook’s launch in 2006, it has become THE number one platform for sharing photos, chatting and sharing much more. Its founder, Mark Zuckerberg, is now one of the richest men in the world. Today there are over a billion registered users of Facebook.\n\nStorm clouds may be on the horizon for Facebook though. Many young people are less interested in using Facebook than older generations. Large numbers of young people see Facebook as being something that is ‘uncool’ and used by older people. As a result, there is a growing trend for the younger generation to use other social media platforms such as Snapchat, a photo sharing app.\n\nSecurity ‘is also causing concems for Facebook. Criminals and terrorists have been using Facebook and large amounts of ‘fake news’ in recent months have led to increasing criticism. In particular, Russia has been accused of using Facebook to try to influence election results in a number of countries.\n\nBut for Hongkongers the biggest worry now seems to be privacy. A recent report indicated that companies are increasingly checking job applicants’ Facebook profiles before interviews to find out more about them and also what they really do in their free time. Some companies regularly check what their staff post on Facebook and a number of cases of staff being fired because of comments they posted have been reported.\n\nAs the young switch to other platforms and privacy issues grow, more questions are being asked about Facebook’s long term success.","task":"You are doing a project on social media. Your group has been asked to discuss Facebook and the future of social media. You may want to talk about:","points":["whether young people in Hong Kong use Facebook","what advice you would give people about using Facebook","whether social media will continue to be popular","anything else you think is important"],"ir":["Do you use Facebook?","What do most people like to do on Facebook?","What social media do you enjoy using the most?","Should schools teach students how to use social media effectively?","Why might social media make people feel lonely?","How do you know what you read on social media is true?","How do you think social media will change in the future?","Why do people create fake Facebook pages?"]},{"id":"2019-3.2","no":"3.2","label":"‘Women still paid badly’, survey finds","intro":"This article appeared in a local newspaper:","title":"‘Women still paid badly’, survey finds","text":"Women are on average still paid HK$15 less per hour than men, according to the latest figures released by the government.\n\nThe statistics, which were compiled and released by the Hong Kong Census and Statistics Department, showed that the hourly salary of women in Hong Kong in 2017 was HK$60.50, compared to HK$75.90 for men. The problem is even worse in terms of monthly income. Young women in the 15-19 age bracket earned HK$3,100, while young men in the same age range earned HK$5,300.\n\nSurprisingly, the pay difference is true of men and women of all ages and levels of education. For example, men-who had received post-secondary education were paid HK$118.30 per hour, while women with the same level of education only received HK$97.80. One reason often cited by apologists of this phenomenon is that it is understandable that women are paid less because they are more likely to leave the work force to take care of family members some time in the future.\n\nSome students expressed disappointment at the news of the gender pay gap. Tiffany Wong, 16, was concerned about traditional views regarding men and women affecting wages. \"I think the belief that ‘women are more suited to staying at home, taking care of the children and doing housework while men are better suited to a competitive office environment and working long hours, is still very real. Therefore, employers still tend to consider men for higher paid jobs than their female counterparts. They see it as a safer investment.\"","task":"Your careers advisor is discussing discrimination in the workplace. Your group has been asked to discuss the gender pay gap. You may want to talk about:","points":["whether there are differences in job performance between men and women","why women ase generally paid less than men","how the gender pay gap could be reduced","anything else you think is important"],"ir":["What job would be suitable for you?","Are some jobs more suitable for women than men?","What jobs are seen as traditionally male or female jobs?","In what other ways are women treated unfairly?","Should it be illegal for men and women to be paid differently?","‘Will the gender pay gap continue in the future?","Apart from gender, why do some people get paid more than others?","Is Hong Kong becoming a fairer society?"]},{"id":"2019-3.3","no":"3.3","label":"Dear Mr Wong","intro":"This email was sent to a Hong Kong secondary school teacher:","title":"Dear Mr Wong","text":"The Disciplinary Team suspects that two students in your class have cheated on their homework assignment. The two students in question are Chan Tai Man and Chris Wong.\n\nWe have looked at the students’ homework assignment and they are almost identical, which suggests the two students have copied from each other. However, we need more evidence. Could you arrange to talk with each student separately so we can find out more about what happened?\n\nAfter you have spoken one-on-one with each student, we may need to re-interview them again. Please send us your findings and include any recommendations on how to handle this particular case. To deter students from repeating the same offence, we have used after-school detention for minor issues. For more serious cases, we meet with parents to try and understand any underlying issues. If a student continues to cheat repeatedly, he or she may be asked to leave the school.\n\nThe school regards cheating as a serious issue and we will send a reminder to all students of the dangers of copying other students’ homework, using the internet to buy essays and using apps such as Google translate to do assignments.\n\nIf you have any questions, feel free to contact any of the members on the team. The Disciplinary Team","task":"Two students have been caught cheating at your school. Your class teacher has asked your group to discuss this issue. You may want to talk about:","points":["why students cheat","whether cheating is a common problem in schools","suitable ways Sf dealing with the problem","anything else you think is important"],"ir":["Do teachers know when students cheat?","Is there more cheating now than in the past?","Does technology make cheating easy?","Is copying from the internet cheating?","If parents do homework for their children, is that cheating?","What type of students tend to cheat?","Are some kinds of cheating worse than others?","Is cheating common in society?"]},{"id":"2019-4.1","no":"4.1","label":"What the ‘door close’ button in Hong Kong lifts reveals about selfish city","intro":"These letters to the editor appeared in a local newspaper:","title":"What the ‘door close’ button in Hong Kong lifts reveals about selfish city","text":"LETTER 1\n\nIn every lift in Hong Kong, the lettering on the “door close” button is worn with overuse. I’ve even seen people close the door before selecting the floor they want. On many occasions, I’ve had people stare at me blankly with a finger firmly on the button as I raced across a lift lobby. Why does this happen? Just to save a few seconds?\n\nI see this attitude of self-importance and selfishness in other parts of Hong Kong culture. It is rare to see people hold doors open, offer seats to the elderly or let people pass them on the pavement.\n\nPerhaps we should remove all the “door close” buttons from lifts. It would give us an extra few seconds to consider others.\n\nPeter Lok\n\nLETTER 2\n\nI disagree with Peter Lok’s logic in his July 27 letter. Why is there a door close button if we shouldn’t use it? Is it there just to show we are polite because we do not press it?\n\nSurely, if someone is in a position to press that button and does not press it, they are being rude. The button is there to be pushed, to save busy people many seconds at a time so they do not have to wait for the door to close automatically.\n\nIn the same way, if we hold the door open for everyone we will never get to work.\n\nJudy Lai","task":"Your class is working on a project about living in densely populated urban areas. Your group has been asked to discuss the two points of view expressed in the letters. You may want to talk about:","points":["which letter you agree with","other situations when crowded places cause problems","how to deal with these problems","anything else you think is important"],"ir":["Do you prefer to use the lift or stairs?","Are you often in a hurry?","What behaviour do you think is impolite?","Do you agree that young people today are polite?","Does living in a city make people less polite?","Do we need to teach politeness?","Why is being polite important?","Do ideas of politeness change over time?"]},{"id":"2019-4.2","no":"4.2","label":"Unusual English Names","intro":"This article appeared in a local magazine:","title":"Unusual English Names","text":"Hong Kong has fallen in love with odd English names. Unusual names are everywhere: a top government official is called York, celebrities called Bambi, lawyers Bunny. Names not found in English-speaking countries are becoming more common.\n\nTo understand why Hongkongers choose to be called Ice or Chocolate instead of John or Jane, we must explain why we use English names in the first place. In the early 1980s, 90 percent of secondary schools taught in English. At that time it seemed desirable to have an English name for business or when working with foreigners. In school, it was easier for English-speaking teachers to remember students’ English names than their Chinese ones. As locals tend to only use their Chinese names with people who are really close, like family members, it became normal to use an English name when meeting people for the first time.\n\nBut the use of strange names?\n\nPartly, it is \"incomplete knowledge\" of the English language. Februar might have been a misspelling or the result of someone over-generalizing the use of the names of the months like April, May or June, or both. Also many unusual English names come from Chinese: Singer Lee Hak-kan’s English name is Hacken.\n\nNow the younger generation has found traditional names less attractive and want to be unique and different, taking names from brands like Chanel and Rolex. \"I love my English name,\" said Dictionary Leung, \"I am the only Dictionary Leung in the world!\"","task":"Your English teacher-has asked you about the use of unusual English names in Hong Kong. Your group is going to discuss this topic. You may want to talk about:","points":["how students choose their English name","what type of names you think are suitable and unsuitable","what problems unusual names cause","anything else you think is important"],"ir":["Do you use English names with your friends?","Is it important to have a special name?","Do teachers use students’ English or Chinese names?","Are Chinese names for close friends and families?","Should non-Chinese people in Hong Kong have a Chinese name?","Why do some people change their name?","Why do some names become fashionable?","Psy ans Py What should parents consider when choosing names for their children?"]},{"id":"2019-4.3","no":"4.3","label":"Person of the Year 2019","intro":"This poster appeared on the noticeboard of your school:","title":"Person of the Year 2019","text":"Each year we select a person whose behaviour or success can be used as a role model to encourage students to work hard and be successful. Last year we selected the singer Alan Tam Wing-lun. He was chosen as a role model because of his wide range of talents as a writer, composer, singer and actor.\n\nThis year we have nominated the four people below. One of them will be selected to be the school’s Person of the Year.\n\nART — Dodo Cheng: a Hong Kong film and television actress and host. She has won numerous acting awards in both film and television, as well as hosting awards. She is the hardest worker on TVB and represents a time when all Hongkongers worked hard for their dreams.\n\nSPORT — Sarah Lee Wai Sze: a Hong Kong professional cyclist. Her greatest success to date is winning the bronze medal at the London Olympics. She has been successful despite suffering from a childhood illness and being from humble beginnings.\n\nBUSINESS — Richard Li: although he did not graduate from university, he started his own company when he was 25 and has been one of the leading Hong Kong businessmen in recent years. He has three children and gives money regularly to charity.\n\nPOLITICS — Carrie Lam Cheng Yuet-ngor: she was born into a poor family. She studied hard and entered Hong Kong University, then the Hong Kong government. After a stellar career in government she is now the Chief Executive of Hong Kong.","task":"The principal wants to add more people to the list. Your group has been asked to suggest other people who might be a good candidate to be Person of the Year. You may want to talk about:","points":["what can be learned from role models","why some students may not select the nominees listed","other potential nominees","anything else you think is important"],"ir":["Do you have a role model?","Would you be a good role model?","Are musicians good role models?","Should senior form students be role models?","Does being a role model put pressure on celebrities?","Do we have different role models at different times in our lives?","Can people who are unsuccessful be a good role model?","What is the difference between an idol and a role model?"]},{"id":"2019-5.1","no":"5.1","label":"CCTV EVERYWHERE","intro":"This article appeared in a local newspaper:","title":"CCTV EVERYWHERE","text":"CCTV surveillance cameras have become such a common feature of Hong Kong that we often don’t notice them. But they notice you.\n\nMany people are worried about the use of closed-circuit television and how it affects the privacy of individuals.\n\nTo test these concerns, we took a trip from Causeway Bay to Chek Lap Kok airport to find out how much we are being watched.\n\nWe counted at least 100 cameras during the 80-minute trip - a trip which involved visiting street-level shops and shopping malls and using several types of transport.\n\nThe government argue that CCTV reduces crime but there is no research on any direct links between a high use of CCTVs and a low crime rate:\n\nPoliticians and police seem to think it is a magic anti-crime system without saying exactly how it helps. CCTV is often a helpful tool in criminal investigations, but having cameras in public and private places does not necessarily prevent crime.\n\nWhy then does the Hospital Authority have 5,400 cameras at its public hospitals or the Legislative Council have 443 CCTV cameras outside? And how will these recordings be used?\n\nPeaceful protesters worry about being arrested, criminals steal CCTV cameras to help them commit crimes, private investigators use CCTV to spy on cheating couples but the biggest worry is the lack of laws to regulate the use of CCTV in public or private areas.","task":"Your school principal wants to introduce CCTV cameras to your school. Your class teacher wants you to discuss this topic. You may want to talk about:","points":["advantages of CCTV cameras","disadvantages of CCTV cameras","what rules there should be about the use of CCTV cameras in school","anything else you think is important"],"ir":["Do you think CCTV is a good thing?","Do you worry about CCTV?","Do you think CCTV stops crime?","How will CCTV change in the future?","Are there some public places where there should be no CCTV?","Should people be worried about losing privacy?","Should CCTV recordings be shown on the news?","Is personal privacy more important than public security?"]},{"id":"2019-5.2","no":"5.2","label":"New HKUST campus in Guangzhou","intro":"This article appeared in a university alumni magazine:","title":"New HKUST campus in Guangzhou","text":"Hong Kong University of Science and Technology (HKUST) will partner with Guangzhou University to set up a campus in the city of Guangzhou that is aimed at taking in up to 6,000 students.\n\nHKUST President Wei Shyy said the university plans to admit the first batch of students in three years’ time.\n\nThe Guangzhou campus will have an area of 1.13 square kilometers — twice the size of its Hong Kong campus — and will be in a desirable location next to the express rail station in Nansha, only 25 minutes by rail from the West Kowloon Station.\n\nThe new campus will provide the necessary room for HKUST to expand and develop beyond the limited facilities of the Hong Kong campus. in the joint-university project, buildings, facilities and laboratories will be funded by the Guangzhou government while HKUST will run the institution.\n\nShyy hopes to foster closer academic ties between the two institutions and says the Guangzhou campus will complement the Hong Kong campus. \"Our consideration is not merely to increase the number of students. The more important consideration is to ensure that our main campus and the new campus will work together to make HKUST truly outstanding and become one of the world’s leading universities.\"","task":"Your school has invited HKUST to give a talk on the new Guangzhou campus to S.6 students. Your group will help to facilitate a Q&A session after the talk. You may want to talk about:","points":["why Hong Kong universities want to develop in mainland China","what problems Hong Kong students may face studying on the Mainland","what advice to give to students thinking about studying on the Mainland","anything else you think is important"],"ir":["Would you like to study in mainland China?","Why do people want to study in mainland China?","What are the advantages of studying in mainland China?","What can students learn from studying in mainland China?","Will studying in mainland China become more popular?","Is studying outside Hong Kong beneficial?","Should more Hong Kong institutions expand to the Mainland?","What are the problems of developing closer academic ties with mainland institutions?"]},{"id":"2019-5.3","no":"5.3","label":"ELON MUSK AND JAPANESE BILLIONAIRE TO SEND EIGHT ARTISTS TO THE MOON","intro":"This article appeared in a UK newspaper:","title":"ELON MUSK AND JAPANESE BILLIONAIRE TO SEND EIGHT ARTISTS TO THE MOON","text":"‘I did not want to have such a fantastic experience by myself\"\n\nElon Musk’s rocket company SpaceX is sending a Japanese billionaire and eight artists on the first private trip around the moon. Japanese billionaire Yusaku Maezawa will pay for himself and between six and eight creative people like film directors, poets and painters to take the week-long trip. He hopes it will become a major intemational event. He is set to make the trip in 2023, and he will fill the rocket with a range of different artists from Earth.\n\nMr Maezawa, 42, said he wants his guests for the lunar orbit \"to see the moon up close, and the Earth in full view, and create work to reflect their experience.\" Mr Musk said the trip will cost \"a lot of money\", but declined to disclose the exact amount. Such missions are thought to cost at least US$150 million. \"I did not want to have such a fantastic experience by myself,\" said Mr Maezawa. \"I wish to create amazing works of art for humankind.\"\n\nHe didn’t immediately say whe will be on his guest list for the spaceflight. The mission will not involve a lunar landing. Space tourism began in 2001 when California businessman Dennis Tito paid for a journey on a Russian rocket to the International Space Station. SpaceX already has a long list of firsts, with its sights ultimately set on Mars.","task":"Your English teacher has asked your class to write an essay entitled: ‘Space travel is a good use of money.\" You have been asked to discuss this topic in groups first. You may want to talk about:","points":["why people are so interested in space travel","whether space tourism will become popular","whether there are better ways to spend money","anything else you think is important"],"ir":["Are you interested in space travel?","Would you like to be a space tourist?","‘Will people live on the moon in our lifetime?","‘What would be the most enjoyable thing about a space flight?","Who else should be taken on the space trip?","What problems will long space journeys cause?","Should space travel be organised by private companies or by governments?","What qualities do you need to be a space traveller?"]},{"id":"2019-6.1","no":"6.1","label":"To kill or not to kill","intro":"This article appeared in a Singaporean newspaper:","title":"To kill or not to kill","text":"Singapore is at a crossroads in its management of wild monkeys, and to cull or not to cull these native animals has emerged as a key question.\n\nCulling, the selective killing of animals to manage their population, continues to provoke debate amongst people over how best to deal with monkeys as well as stray dogs and wild boar.\n\nComplaints about problems caused by monkeys fell sharply from 1,860 instances in 2013 to just 750 last year after a large number of monkeys were culled by The Veterinary Authority (VA). The VA killed about 570 monkeys, about a third of the estimated population during that period. The VA maintains that it only culls animals as a last resort. It has also explained that moving the monkeys is not feasible as that simply transfers the problem from one area to another.\n\nBut animal welfare groups in Singapore believe the success of campaigns to get people to stop feeding the monkeys has helped reduce the number of complaints about monkeys, not the culls. They also suggest the use of birth control on females would further help the situation. The government has stressed that birth control can only be part of a wider programme. In Hong Kong, for instance, planting fruit trees to provide more food for monkeys has reduced the number of such complaints.\n\nThe government must now decide if it is to embark on another round of culling wild monkeys to alleviate the problem further.","task":"You are in a school debating club. The next debate will be: ‘Selective killing should not be used to control animal numbers in Hong Kong.’ Your group is meeting to discuss this question. You may want to talk about:","points":["why governments use selective killing to control animal numbers","other methods of controlling animal numbers","whether or not you support culling","anything else you think is important"],"ir":["Are you an animal lover?","What wild animal would you like to see?","How do wild animals cause problems in Hong Kong?","What is the best way to control the number of monkeys in Hong Kong?","Why do people feed wild animals such as monkeys?","Do you think most Hong Kong people are animal lovers?","‘What animals are the most troublesome in Hong Kong?","Do people sometimes pay too much attention to animal welfare?"]},{"id":"2019-6.2","no":"6.2","label":"Translation Apps","intro":"This blog appeared on the author’s personal webpage:","title":"Translation Apps","text":"On a recent trip to Japan I was amazed to see hotel staff in the hotel I was staying at using what turned out to be a translation gadget. The reception staff wore them around their neck to translate questions and answers from Japanese into Chinese and English so that they could communicate with tourists successfully even though they only spoke Japanese. The fast and accurate translation greatly improved our trip as there were no miscommunications and ali the staff could quickly answer any problems we had. Although at times the translation was a little bit strange, it was never too bad to understand.\n\nTranslation apps and machines such as Google Translate are developing so fast that they are now able to do many tasks in both written and spoken translation. While I understand that they are still not able to do complicated translations of literature and legal documents, they are already effective in many areas of business and tourism. Westemers in China often use translation apps to help understand menus.\n\nJ am sure that translation devices will continue to develop and soon will be able to translate from Chinese to English more effectively than most university graduates. This raises the question of whether or not we need to invest-so much time and money in learning foreign languages at all.\n\nWhy should Hongkongers spend 15 or 16 years learning English or Putonghua if they can buy a cheap app that can help them communicate even more accurately?","task":"Your ICT class is discussing how technology is changing the world. Your group has been asked to discuss translation devices. You may want to talk about:","points":["the advantages and disadvantages of using translation devices","whether translation devices should be allowed at school","whether learning languages is still important","anything else you think is important"],"ir":["What language would you like to learn?","Have you ever used a translation app?","Is it fun speaking a foreign language?","Are translation apps easy to use?","Who do you think will benefit from translation apps?","Will fewer people learn foreign languages in future?","Why are some people better at learning languages than others?","Do you worry about technology becoming too essential?"]},{"id":"2019-6.3","no":"6.3","label":"Taking selfies is becoming more dangerous, study finds","intro":"This article appeared on a travel blog:","title":"Taking selfies is becoming more dangerous, study finds","text":"The next time you are standing at the top of a waterfall, take care when you have the urge to snap a quick selfie. It could be the last thing you do. More than 250 people worldwide have died taking selfies in the last six years, according to a new study.\n\nResearchers found the leading cause of selfie-related deaths to be drowning, followed by incidents involving transport. For example, falling from a cliff into the sea below or taking a selfie in front of a train. Other causes of selfie-related deaths are taking photos with live animals. A German woman was recently killed while taking a selfie with an elephant.\n\nThe report noted that while the simple act of taking a selfie isn’t dangerous in itself, the problem arises when people take risks while trying to get that perfect shot. It also pointed out how many of the selfie-related deaths involved young people. More than 85 per cent of the victims were between the ages of 10 and 30. It was difficult to confirm the exact number of people seriously injured or needing medical help, but the researchers believed it was extremely high and growing every year.\n\nSelfie-related deaths have now become a serious safety concern.","task":"You are a member of the school photography society. Your group has been asked to discuss problems caused by selfies. You may want to talk about:","points":["why selfies are so popular","the dangers caused by taking selfies","why people are willing to take such risks","anything else you think is important"],"ir":["Do people take too many selfies?","What are interesting places to take selfies in Hong Kong?","Is it only young people who like taking selfies?","Will selfies remain a popular trend?","Do you think no-selfie zones will be introduced in the future?","Do you think no-selfie zones will be effective?","Apart from the risk of injury, what other problems do selfies cause?","What makes a good selfie?"]},{"id":"2019-7.1","no":"7.1","label":"A Hong Kong Drink","intro":"This press release was issued by the Hong Kong Tourism Board:","title":"A Hong Kong Drink","text":"The Tourism Board is holding a competition to find an English name for a well-known Hong Kong drink. The winners will receive two free annual passes for Ocean Park.\n\n‘The special drink, a mix of tea and coffee called Yuenyeung (sometimes written Yinyeung, or Yinyong) is made of a mixture of 30% coffee and 70% Hong Kong-style milk tea, it can be served hot or cold. The name Yuenyeung refers to mandarin ducks, a symbol of love in Chinese culture.\n\nWong King Hei of the Tourism Board said, \"Around the world, countries, regions and cities are closely linked to their local drinks. America has Coca-Cola, France has red wine and Taiwan has bubble tea. It would be great to have a famous Hong Kong drink.\"\n\n\"ft is well known to Hongkongers, with regular competitions among restaurants to see who makes the best drink. Tourists are less familiar with it,\" added restaurant owner Paul Mak. The Tourism Board wants to promote the drink to both local Hongkongers and tourists to show an important part of Hong Kong culture. However, currently it has no suitable English nine so it is difficult to promote the drink and encourage tourists to try it.\n\nThe following names have been used in the past: 1. Hong Kong Tea\n\n2. The Hongkongers’ Drink\n\n3. Kowloon Coffee\n\nWhilst each of these holds a certain charm, the Tourism Board now wants to find an English name for the drink for the twenty first century.","task":"Yout class teacher has asked your group to think of a name that could better promote the drink. You may want to talk about: .","points":["suitable name for the drink","why this name would be suitable","how else the government could promote the drink","anything else you think is important"],"ir":["What is your favourite drink?","Do you prefer tea or coffee?","What drinks are most popular with young people?","Do older and younger people enjoy the same type of drinks?","What is the best local Hong Kong food for tourists to try?","Do you think tourists would enjoy this special Hong Kong drink?","What other parts of Hong Kong culture should be promoted?","Do you ever choose a product because it has an interesting name?"]},{"id":"2019-7.2","no":"7.2","label":"E-lai see","intro":"This letter to the editor appeared in a local newspaper:","title":"E-lai see","text":"Oldtai see New lal see\n\nE-payment is becoming ever more popular in Hong Kong, and is even used in the traditional wet markets, as most customers find it convenient. After 20 years Octopus no longer has a monopoly, with rivals such as Alipay and Apple Pay competing for a share of the pie.\n\nAlthough technology definitely enhances our quality of life, in some areas traditional money is still important. For example, can an electronic red packet really convey the same warmth and feeling as a real Jai see (or red packets) full of new bank notes? Is giving new notes still a must for lai see?\n\nWhatever you yourself feel about these questions, the change is already well underway in China. The United Overseas Bank found four out of five people in mainland China gave digital Jai see this year. The traditional values of the Lunar New Year would seem to be being replaced by new habits in the digital era.\n\nTo me, and to many people of my generation, the Lunar New Year should be about fireworks, good food, visits to parents and relatives, New Year greetings and real money Jai see gifts. Family reunions should be given top priority as people celebrate, but young people are starting to see it differently and the use of electronic Jai see is just another example of their indifferent attitude towards the spring festival and traditional values in general.\n\nIvy Fung, Yau Yat Chuen","task":"You have been asked to write an essay titled: \"Are Hongkongers open to change?\" Your group has been asked to discuss the use of e-payments as /ai see. You may want to talk about:","points":["why people are using e-payments for Jai see","whether real money wil] remain popular","what other changes to the Lunar New Year people might dislike","anything else you think is important"],"ir":["Is electronic /ai see popular in Hong Kong?","Have you received any electronic /ai see?","Would you prefer to receive electronic Iai see or a teal lai see?","Why are e-payments not popular in Hong Kong?","Is giving /ai see old-fashioned?","Why do you think e-payment is used so widely in China?","What does giving /ai see show about a person?","Is technology making personal relationships less close?"]},{"id":"2019-7.3","no":"7.3","label":"Inequality in Hong Kong","intro":"This article appeared in a local newspaper:","title":"Inequality in Hong Kong","text":"The household income distribution report released on Friday shows that Hong Kong’s wealth gap has widened and Hong Kong now has one of the greatest wealth gaps in the world. Although the city’s overall wealth has increased dramatically, working families and individuals have not benefited from it.\n\nThe difference in wealth between rich and poor be measured by the Gini co-efficient, where zero represents a society with perfect equality. In this measure, the higher the Gini co-efficient, the greater the wealth gap. Table I shows that Hong Kong has a Gini score of 0.54, which represents extreme inequality.\n\nTable 1 Gini co-efficient for five countries and regions\n\n04 O2 @ Gini Rating\n\nHK Japan Canada USA China\n\nAnnouncing the report, Leslie Tang Wai-kong highlighted the fact that the richest 10 per cent of households in Hong Kong have a monthly income of HK$112,450— 44 times more than the poorest 10 per cent, who make an average of HK$2,560. In particular, the report shows that Hong Kong is unusual because of the high number of very poor elderly people.\n\nDeveloped countries such as Japan (0.34) and Canada (0.33) are far more equal. The report details possible reasons for this including policies such as a high minimum wage, poverty reduction targets, pensions, controlling rent and higher tax on wealthy citizens.","task":"Your teacher has asked you to discuss inequality in Hong Kong. He has asked your group to suggest ways to help reduce the inequality in Hong Kong. You may want to talk about:","points":["whether Hong Kong really is an unequal society","why unequal societies may have problems","policies that would make Hong Kong a more: equal society","anything else you think is important"],"ir":["Do you like living in Hong Kong?","Do poor people need more help in Hong Kong?","Do people worry about Hong Kong being unequal?","Does everyone in Hong Kong have an equal chance to be successful?","Is Hong Kong a fair society?","Do you think wealth inequality is an important issue?","Would you like to live in a perfectly equal society?","Ase unequal societies unfair societies?"]},{"id":"2019-8.1","no":"8.1","label":"Co-living","intro":"This article appeared in a property magazine:","title":"Co-living","text":"Co-living is the latest trend to hit Hong Kong’s property market. In a co-living building, tenants usually have their own bedroom but share the kitchen, bathrooms and living areas. It can be substantially cheaper than normal renting and has the added potential benefit of fostering a community spirit. We went to Weave, a co-living space in Prince Edward, to find out more about it.\n\nThe 13-storey Weave feels like a university hall of residence, but more grown-up.\n\nThe first two floors of the building are taken up by a restaurant. There is also a games area. On the third floor is the kitchen and living area, which includes a reading corner, a gym, some sofas and a TV — perfect for group movie nights. There are also vending machines around the room for late-night needs.\n\nThe rest of the floors have bedrooms, some shared and some private. Shared rooms are around 250 square feet and can sleep four people. They also have a bathroom. These rooms are the least expensive, at around HK$7,200 per month. Standard rooms are for one person and have their own bathroom, but they are only around 100 square feet.\n\nFinding somewhere to live in Hong Kong that is both comfortable and affordable is a real challenge, and not everyone can commit to a long-ferm contract. Co-living takes away this pressure, while also ensuring that you have a clean, safe, and well-maintained place to sleep, eat and relax.","task":"Your class has been asked by your teacher to look at alternatives that young people have to living at home. Your group has been asked to discuss co-living. You may want to talk about:","points":["the advantages of co-living","the disadvantages of co-living","what niles you think co-living accommodation should have","anything else you think is important"],"ir":["Would you enjoy co-living?","What would you find difficult about co-living?","Do you think that co-living will become popular?","Why is having some private space important?","What would your dream accommodation be?","Why do some people prefer to live by themselves?","What might you team from co-living?","Should the government encourage co-living?"]},{"id":"2019-8.2","no":"8.2","label":"McSleepers drive crisis home","intro":"This editorial appeared in a local newspaper:","title":"McSleepers drive crisis home","text":"We all know that Hong Kong has a housing crisis, but did you know the number of \"McSleepers\" - those sleeping overnight at McDonaild’s — has increased nearly 600 percent over the past five years?\n\nA Recent survey found 334 \"McSleepers\" sleeping overnight at McDonaid’s 24-hour restaurants, and that number is most likely only a small part of the total.\n\nI can’t help wondering whether the homeless would have been thrown out onto the streets if they had curled up for a nap in other restaurants or in air-conditioned places. So staff at the McDonald's should be praised for showing kindness to people without a place to sleep at night.\n\nAccording to the survey, reasons why people choose to sleep at McDonald’s inchide staying in an air-conditioned environment, security and the use of bathrooms. Some \"McSleepers\" complain that the government is not doing enough to reduce homelessness. They claim that the conditions in the homeless such shelters.\n\nThe question is how long this can go on. If the number of \"McSleepers\" grows, sooner or later McDonald’s will have to ask if jt can still manage to provide a safe place for these people to sleep. Those sleeping in their restaurants take up space, often make customers feel uncomfortable and at times make their restaurants difficult to keep clean.","task":"Your class is doing a project on homeless people in Hong Kong. Your group has been asked to discuss the issue of the homeless sleeping in 24-hour McDonald's restaurants. You may want to talk about:","points":["what problems homeless people face","why they go to McDonald’s","how this affects McDonald’s","anything else you think is important"],"ir":["Do you like to go to McDonald’s?","Do you ever visit McDonald’s late at night?","Where else do homeless people sleep?","Do you think McDonald’s is a caring company?","What would be the most difficult thing about sleeping in McDonald’s?","‘What types of people are more likely to be homeless?","Should private companies do more to help solve the problem of homelessness?","Why does homelessness exist in wealthy cities?"]},{"id":"2019-8.3","no":"8.3","label":"Should there be an age limit for political leaders?","intro":"This article appeared in an international newspaper:","title":"Should there be an age limit for political leaders?","text":"The US President Donald Tramp is 71 years old. Dr. Mahathir became the Prime Minister of Malaysia at 92. Isn’t it time we considered age limits to make room for a younger generation of leaders?\n\nThere certainly are some benefits to having older political leaders: they can draw on the wisdom and life experience gained over decades of high-level decision-making. But there’s also no doubt that being a world leader includes work and travel requirements that can be physically demanding and difficult for some older people. to handle, not to mention the mental attentiveness that is needed to stay focused.\n\nPerhaps the biggest issue that surrounds elderly leaders is whether or not they are able to understand the modern world. Some have questioned how people who grew up decades ago can possibly understand young people today. Younger leaders, like French President Emmanuel Macron at 39, are equipped with a more personal understanding of the current issues and some might say are more able to guide the new generation in the coming years.\n\nWith an aging population, this problem is becoming increasingly recognized, and in some countries there have been attempts to introduce legal age limits for heads of state or government. France recommended banning politicians over 70 from standing for election but the idea was rejected because it might be considered discrimination against someone based on their age.","task":"Your school is planning on holding a summer course called ‘Developing Young Hong Kong Leaders’. Your class has been asked to discuss this topic. You may want to talk about:","points":["what skills a political leader needs in today’s society","the strengths and limitations of older leaders","whether age should be a factor in choosing a leader","anything else you think is important"],"ir":["Would you like to be a leader? .","Would you prefer to have a younger or an older leader?","What is the biggest advantage younger leaders have?","Should older leaders be respected because of their age?","Do older leaders understand young people?","How important is life experience for leaders?","Should there be age limits on leaders?","Does society discriminate against the elderly?"]}]},{"id":"2023","year":"2023","label":"2023 DSE","tasks":[{"id":"2023-1.1","no":"1.1","label":"Family Mart’s first “unmanned convenience store”","intro":"This article appeared on a business website:","title":"Family Mart’s first “unmanned convenience store”","text":"We paid a visit to a Tokyo convenience store where there's no human clerk to pay.\n\nOn Thursday, Family Mart opened a new branch inside Tokyo Station. It has the sort of food and beverages you’d expect in a Japanese convenience store, but there aren’t any employees at the check-out counters. That’s because the payments are all done through a slick, unmanned system.\n\nOne difference you’ll notice right away is that there’s a gate you pass through when entering the shop. As we stepped through, a recorded voice called out, \"Irasshaimase!\" (\"Welcome!\").\n\nThe total selection of products isn’t quite as wide as it is at some Family Marts, but customers can still get toiletries and face masks.\n\nThere actually is one Family Mart employee on the premises, who only handles shelf-stocking and customer inquiries. When we walked up to the check-out counters with our purchases, no human cashier was present. We didn’t even have to scan anything. The terminal already knew what we had in our hand to buy and it made an electronic beep to draw our attention to the screen, where the total amount to be paid was displayed. You can pay with an e-money card, credit card or cash.\n\nOh, and by the way, there’s also a gate you have to pass through in order to leave the store, and if you have an unpaid bill, it won’t open up until you settle your account.","task":"Your group is doing a project on unmanned convenience stores, You are meeting to discuss this. You may want to talk about:","points":["the benefits of unmanned convenience stores","the limitations of unmanned convenience stores","whether unmanned convenience stores are a good idea for Hong Kong","anything else you think is important"],"ir":["Do you often shop at convenience stores?","What do people usually buy at a convenience store?","Do you prefer self-checkout or paying at the cashier?","Is customer service important to you when shopping?","Do you think there will be more theft in unmanned stores?","Would you find shopping at an unmanned store too impersonal?","Do you think the trend of unmanned stores will continue to grow?","Do you think automation is making life too convenient?"]},{"id":"2023-1.2","no":"1.2","label":"Cinemas vs Movie Streaming Services","intro":"This article appeared on a business website:","title":"Cinemas vs Movie Streaming Services","text":"Technology is changing the way young people consume entertainment. Many youngsters are choosing to use online movie streaming services instead of going to the cinema to watch films.\n\nThe popularity of streaming services such as Netflix, Disney Plus, and Apple TV further increased during the COVID pandemic because cinemas were shut down everywhere. Now, more than 200 million people use Netflix to watch movies and TV shows. This is due to four main advantages it has over cinemas.\n\n1. You can choose from thousands of movies and TV shows to watch. 2. The monthly price of Netflix is cheaper than one movie ticket.\n\n3. There is original content on Netflix you cannot watch in cinemas. 4. You can watch movies anywhere on your phone and laptop.\n\nA study also shows that after joining Netflix, 30% of people go to cinemas less often and 15% of them don’t go to cinemas anymore. While this is good news for movie streaming services, cinemas are closing down duet toa lack of demand, and a number of the biggest cinema chains around the world have filed for bankruptcy.\n\nThis brings up the question: Is this the end of cinemas?","task":"Your class is doing a project on the entertainment industry. Your group is discussing the i increasing popularity of movie streaming services and how it impacts cinemas. You may want to talk about:","points":["whether going to cinemas is a popular pastime in Hong Kong","what cinemas can do to compete with movie streaming services","any disadvantages of movie streaming services","anything else you think is important"],"ir":["Do you like watching movies?","Do you go to the cinema often?","Which do you prefer: watching a movie in the cinema or at home?","Would you pay for a movie streaming service?","What is your most memorable experience of going to the cinema?","What can people learn from watching movies?","Do you think movie streaming services make people less social?","Do you think movie streaming services will eventually replace cinemas?"]},{"id":"2023-1.3","no":"1.3","label":"Plant-based meats","intro":"This article appeared on a webpage:","title":"Plant-based meats","text":"Impossible Foods and OmniFoods ate two of the best-known names in Hong Kong offering plant-based fake meat. While you’re most likely to have seen them on the menus of Western restaurants, both brands have taken a step into traditional Chinese cooking, creating plant-based tasting menus at Chinese fine dining restaurants.\n\nChef Tsang is a restaurant industry veteran who works at Ming Court, a Michelin-starred restaurant on Hong Kong Island. \"Meat is indispensable in Chinese cuisine and fresh pork is the soul of Cantonese cuisine. But the arrival of plant-based meat offers vegetarian options to diners and encourages them to make diet changes.\"\n\nThe rise of vegetarianism, increasing concerns about health and the very real threat of climate change have inspired the chefs at the restaurant to provide more vegetarian options to diners. They would also like to demonstrate how plant-based meat can be used in Cantonese cuisine — including Cantonese fine-dining and make it just as delicious.\n\nChef Tsang has started experimenting with the new OmniSeafood series. \"The Omni Classic Fillet from the OmniSeafood series can be used in most of the traditional dishes in Cantonese cuisine. One of our popular dishes is Fried Omni Classic Fillet, Kung Po style.\"","task":"Your school is considering serving plant-based meats in the canteen on Green Mondays. You are discussing your views on this topic. You may want to talk about:","points":["why plant-based meats are gaining popularity","whether your school should encourage students to take up a vegetarian diet","whether people will eat less meat in the future","anything else you think is important"],"ir":["Do you prefer meat or vegetables?","Have you been to a vegetarian restaurant?","Do most teenagers eat healthily?","Do you think you could only eat vegetarian food?","Why is it difficult for people to change their eating habits?","How could vegetarianism be promoted in Hong Kong?","Do you think the combination of fine dining and fake-meat will be successful?","Do you agree that meat is essential in Chinese cuisine?"]},{"id":"2023-2.1","no":"2.1","label":"Night Owls","intro":"This article appeared in a lifestyle magazine:","title":"Night Owls","text":"‘Night owls’ are people who are naturally more awake and active at night and tend to go to bed late. Research has found that night owls face higher rates of poor health, including having a 10 percent higher risk of dying younger than ‘early birds’ or people who get up early and feel more energetic first thing in the day. Night owls often suffer from long-term lack of sleep and this can increase the chance of diabetes, heart disease and obesity. Not having enough sleep even for just one night can make us moody; when it happens every single night for an extended period, depression can develop.\n\nAssociate professor Kristen Knutson at Northwestern University said: \"This is a public health issue that cannot be ignored. We need to recognise that people have different body clocks which regulate the time we feel sleepy and wakeful throughout the day. Some people naturally wake up early while others feel more awake at night. All of this comes down to a combination of genes and the person’s environment.\"\n\nEmployers can benefit from adjusting start times to suit individual employees’ needs. Another study found that when companies let night owls start work later in the day or allowed them to work from home, there was an estimated US$277m gain in productivity. It argues that people who are more awake at night should be allowed to start and finish work later. Not everyone is suited to get up for an 8am start.","task":"Your group is doing a project on sleeping patterns and you are meeting to discuss this. You may want to talk about:","points":["the advantages of being a night owl","the advantages of getting up early","whether companies should have flexible working hours for people with different sleeping patterns","anything else you think is important"],"ir":["Do you wake up early on weekends?","Do you often have problems waking up in the morning?","What do you do if you cannot fall asleep?","What do you do to keep yourself awake when you are sleepy?","Have you ever overslept for something important?","What time of the day are you most productive?","Would you consider a job that requires working at night?","Do you envy people who only need a few hours of sleep?"]},{"id":"2023-2.2","no":"2.2","label":"Should teachers and students be friends on social media?","intro":"This article appeared on an online news website:","title":"Should teachers and students be friends on social media?","text":"A majority of teens are online and most of them use social networking apps such as Facebook, Twitter, Instagram and Snapchat. This makes social media a convenient way for teachers to connect with students. Some teachers think that as Instagram is what most teenagers use these days, it is a good idea for teachers to connect with students in this way to maintain their interest. Some parents agree that this allows teachers to be leaders and role models for their students online.\n\nBut at the same time, students should learn to know the difference between personal and professional interacting with teachers on social media, the line between personal and professional communication is less clear. Therefore, it is recommended that students should not talk to their teachers like their friends on Instagram. Otherwise, they may cross that line.\n\nRecently, a number of parents have also complained about seeing teachers wearing swimsuits and gym clothes on their Instagram accounts. These parents claimed the photos were inappropriate. In order to avoid such problems and complaints, some schools are proposing a new policy not to allow teachers and students to be friends on social media.","task":"Your school is proposing a policy not to allow teachers and students to be friends on social media. Your group has been asked to discuss the proposal. You may want to talk about:","points":["why students like to connect with their teachers on social media","problems with connecting with teachers on social media","whether you agree with the proposed policy","anything else you think is important"],"ir":["What do you like to share on social media?","Do young people spend too much time on social media?","Do you think many Hong Kong teachers are active on social media?","Why do you think Instagram is so popular?","Should schools teach students how to use social media safely?","Should parents monitor their children’s friends on social media?","Does social media negatively affect your learning?","Should schools monitor their students’ social media activities?"]},{"id":"2023-2.3","no":"2.3","label":"Graduation ideas","intro":"This advertisement for local entertainment appeared on a webpage:","title":"Graduation ideas","text":"Helicopter ride\n\nScenic flights take off from the roof of the iconic Peninsula Hotel, allowing guests to take in the unbeatable aerial view of the world famous Victoria Harbour, marvel at the rock formations of the Geopark and cruise over the beaches and bays of Hong Kong Island. As night falls, catch Hong Kong’s famous laser light show, Symphony of Lights, on your return.\n\nCooking lessons with a celebrity chef\n\nTake your cooking skills to the next level with a local celebrity chef. Join a Michelin-starred chef in a Hong Kong restaurant to learn the techniques that have brought them fame and fortune. The chef will teach you everything from buying the freshest ingredients to creating unforgettable dishes. Then enjoy seriously good food at the ultimate dinner party.\n\nZip line across Hong Kong\n\nIf hanging off rocks and flying over the water is your style, nothing beats a day of zip-lining with Hong Kong’s spectacular scenery as a backdrop. Your journey begins with a trek through rocks, historical relics, and lush greenery to reach the site. Don’t worry: experienced local zip-lining guides will brief you on the safety instructions before you make the leap. And once you do, well, keep your eyes open — it’s a fun ride to the other side!","task":"Your group is in charge of organising a graduation celebration for your class. You may want to talk about:","points":["what to consider when planning a graduation celebration","whether any of the above activities are suitable","how else you might celebrate your graduation","anything else you think is important"],"ir":["Would you like to go on a helicopter ride?","Would you like your teachers to attend your graduation celebration?","What is the best way to celebrate something?","How do students usually celebrate graduation in Hong Kong?","Would you like your graduation celebration to be held outdoors?","Which do you prefer: a big celebration or a small one?","Would you like to be on the school graduation organising committee?","Is a graduation celebration meaningful to you?"]},{"id":"2023-3.1","no":"3.1","label":"How the pandemic has redefined the fashion industry","intro":"This article appeared in a fashion blog:","title":"How the pandemic has redefined the fashion industry","text":"COVID-19 has upended many norms and one of its top victims has been the fashion industry.\n\nA survey queried 1,843 Americans on how the pandemic has impacted their relationship with fashion trends and clothing. While one-third of Americans did not buy any new clothing during the COVID-19 lockdown, retail clothing businesses have actually seen an increase in sales since March 2020.\n\nShoppers are shopping for various reasons but a universal trend is that Americans are mostly shopping for more comfortable clothes to fit the remote work lifestyle.\n\nThe survey found that more than half of people (61%) are reaching for sweats, yoga pants and more casual clothing. Not only that, but nearly 40% have lowered their standards of what’s ‘acceptable’ to wear since lockdown began.\n\nSocial media has also played a big role in revolutionizing fashion since early 2020. Tiktok, Instagram, and YouTube have influenced fashion choices. One-third of respondents said they have purchased clothing seen on social media during the last year.\n\nSince people have been working from home, offices no longer require workers to wear a ‘professional outfit’. More than 20% of survey respondents said they won’t return to how they dressed before the pandemic. Spending more time at home for work and entertainment has given more people the freedom to express themselves and get more experimental with fashion.","task":"Your class is discussing people’s attitudes towards buying clothes since the start of the pandemic. You may want to talk about:","points":["how the pandemic has changed the way people dress","how the pandemic has changed the way people shop for clothes","how the fashion industry can cater for these changes","anything else you think is important"],"ir":["Do you like fashion?","Do you like shopping for clothes?","Do you dress differently at home when compared to going out?","Do you prefer shopping for clothes in stores or online?","Do Hong Kong teens like to follow fashion trends?","Where do people get their inspiration for fashion?","Which is more important to you when you buy clothes: comfort or how they look?","Do you think keeping up with fashion trends is a waste of money?"]},{"id":"2023-3.2","no":"3.2","label":"The value of doing chores","intro":"This article appeared in a local newspaper:","title":"The value of doing chores","text":"One of the traditions of Japanese education is that students do soji (cleaning). Soji starts after lunch and lasts for about 20 minutes. This happens four times a week and, on the last day of each semester, there is a longer cleaning session called o-soji (big cleaning).\n\nDuring the entire cleaning time, the public announcement system blasts cheerful marching music. Every class is responsible for cleaning its own classroom and two other places in the school.\n\n+ . va eae Japanese students cleaning during the Through cleaning, children develop values such as responsibility, collective cleaning time, soji.\n\ncooperation and discipline.\n\nSimilarly, research shows that when children help out with home duties or chores, they actually do better in school, and are more thoughtful and considerate. Even if they are asked to be responsible for only a certain area, like their own bedroom, they show more consideration to other family members and are less likely to mess up other areas.\n\nChildren who participate in everyday responsibilities are also found to be more positive and have a stronger sense of self-worth. Interestingly, the effects are comparable to those of playing with friends.\n\nWhen children are contributing, they feel needed and bonded to the family. They see that they have an important role to play, and consideration and helpfulness become second nature to them.","task":"As part of the school’s environment improvement campaign, your principal would like to add cleaning sessions to the timetable. Your class teacher has asked your group to discuss this. You may want to talk about:","points":["benefits of adding cleaning sessions to the timetable","possible problems of requiring students to clean the school","cleaning tasks that are suitable for different forms","anything else you think is important"],"ir":["Do you like doing housework?","Do you help out with housework?","What can be done to make cleaning less boring?","How can parents motivate their children to do housework?","Do you agree that teenagers are messier than adults?","Do you agree that housework can bring family members closer?","Should cleaning staff receive more respect in society?","Will technology change housework in the future?"]},{"id":"2023-3.3","no":"3.3","label":"Gardening becomes a way of healing","intro":"This article appeared in a newspaper:","title":"Gardening becomes a way of healing","text":"Horticultural therapy is a professional practice that uses plants and gardening to improve mental and physical health. A horticultural therapist works with any group that can benefit from interaction with plants, including children, the elderly and those dealing with addiction and mental health problems.\n\n\"T was suffering from depression, which seriously affected my life,\" Mary Wright, a patient at a mental health centre, said. \"One day, I was asked, ‘Can you do flower arranging? Can you\n\nwater and take care of plants?’ I said, ‘Well, I'll try it.\" Mia hein a i lala\n\n\"Tt was exactly the help I needed,\" she said. \"When I’m touching a plant, it’s a very calming experience. It helped me get better.\"\n\nMany studies have found that just being in nature — such as taking a walk through a garden, a park or a forest — can improve not only your state of mind but your blood pressure, your heart rate and your stress levels and, over time, can lead to a longer life.\n\nStudies have also found that horticultural therapy supports recovery and improves mood, resulting in shorter stays for patients at hospitals and mental health facilities.","task":"Your school wants to develop students’ interest in growing plants. Your class teacher wants you to discuss this idea. You may want to talk about:","points":["what benefits growing plants can bring to students and the school","whether growing plants will be popular among students","what other activities can help promote students’ well-being","anything else you think is important"],"ir":["Do you like going to country parks?- Do you like gardening?","Do more young people or older people enjoy caring for plants?","Are there enough green spaces in Hong Kong?","Is gardening a popular hobby in Hong Kong?","Do you prefer caring for plants or keeping a pet?","Should there be plants in the work environment?","Which do you prefer: real or artificial plants?"]},{"id":"2023-4.1","no":"4.1","label":"Wearable smart devices are here!","intro":"This article appeared on a business website:","title":"Wearable smart devices are here!","text":"Wearable smart devices, commonly known as wearables, have become popular over the last ten years. Smartwatches like the Apple Watch are likely the best-known ones. But there are many other kinds of new smart devices you can wear on your body now, including clothing and jewellery. Let’s take a look at two of them.\n\nSmart Ring. The most common kind of smart jewellery might be the smart ring. Smart rings are worn on the finger like regular rings. But they can collect health-tracking data for the users and allow them to review it on a smartphone later. Compared to a smartwatch, the smart ring is less distracting since it cannot receive messages and can only track the user’s health. And if you don’t like rings, there are also smart bracelets created by well-known fashion brands.\n\nSmart Clothing. By covering a large amount of a user’s body, smart clothing can provide more information than other wearable devices. It allows for better medical care and lifestyle improvement. For example, there are smart shirts capable of diagnosing respiratory diseases, smart shoes that monitor running performance, smart yoga pants that vibrate to improve form during exercises, and smart swimsuits that alert the user to apply sunscreen. A luxury brand also added location-tracking to its jeans to track how frequently the customer wore them, so that the brand can reward frequent wearers with more of its products,","task":"Your class is doing a project on new technologies and your group is discussing wearable smart devices. You may want to talk about:","points":["why wearable smart devices are becoming popular","the disadvantages of wearable smart devices","whether wearable smart devices should be allowed at school","anything else you think is important"],"ir":["Do you or your friends have a wearable smart device?","Would you buy a wearable smart device?","Do you prefer a smart watch or a smart ring?","Do you think wearable smart devices are a waste of money?","Do you think there are too many smart devices in our lives?","Are wearable smart devices fashionable?","Can using wearable smart devices help us become healthier?","Would you be concerned about privacy if you wore a wearable smart device?"]},{"id":"2023-4.2","no":"4.2","label":"Adaptability quotient","intro":"This article appeared on a website:","title":"Adaptability quotient","text":"We are all familiar with IQ (intelligence quotient) and EQ (emotional quotient). Adding to these two Qs is a new one: AQ. AQ stands for adaptability quotient. It is the ability to learn, adjust, and change to new situations or circumstances. People with high AQ can work in a variety of environments and succeed in times of change and uncertainty.\n\nTechnology is changing our world every day and requires us to learn and re-invent ourselves again and again, faster and faster. The good news is that AQ is something we can train and develop:\n\nChange your routine\n\nSeek or create opportunities for change. Doing the same thing is comfortable, but we can easily become too lazy to leave our comfort zone. Instead of staying home for the weekend again, reconnect with your old friends, Rather than robotically walking down the same street, take different paths.\n\nKeep learning Learn a new skill every now and then. Learning requires active thinking, careful planning, constant adjustment and strong commitment. Learning anything new will train you to be always up for challenges.\n\nBe curious and observant\n\nWatch and learn from others. They can be successful people you read about in books or your friends and family. Pay attention to how and why people make important decisions in life. The more you think from different people’s perspectives, the more open you will be to different ideas.","task":"Your school is organising a workshop on adaptability quotient (AQ). Your group is brainstorming some ideas for the workshop. You may want to talk about:","points":["why being adaptable is becoming more important nowadays","whether being adaptable is more important than being intelligent","whether it is possible to teach adaptability","anything else you think is important"],"ir":["Do you like trying new things?","Can you adapt to new environments quickly?","Do you think having new experiences is important?","Are Hong Kong students adaptable?","Are young people better at coping with change than older people?","Do you think change is always good?","Do you consider yourself a risk taker?","Why are some people more adaptable than others?"]},{"id":"2023-4.3","no":"4.3","label":"How to use social media to spread positivity","intro":"This article appeared in an online magazine:","title":"How to use social media to spread positivity","text":"Social media has taken the sharing of knowledge to an entirely new level, but we face so much information we often don’t know what to do with it. Here are some ways to reduce the impact of social media on your mental health and help you use social media to spread positivity instead.\n\n1. Be intentional about using social media. When you show up to use a social media platform, such as Instagram, ask yourself, ‘Why am I here?’ If you don’t have any need to be on that platform then, close the app.\n\n2. Filter the noise. Go through your feeds and delete anyone who isn’t contributing to a positive environment. You can’t change the way people act but you can change your experience using these platforms quite easily.\n\n3. Don’t use it to fill time and space. If you are using social media to kill time, you might want to ask yourself why. Why do I have to be entertained every second of the day? There’s nothing wrong with being bored standing in line.\n\n4, Remove yourself from the negativity.\n\nAt the end of the day, if you feel like you can’t handle it or social media is really impacting your happiness in a negative way, it might be a better idea to remove yourself from it entirely. You might be surprised by how little you miss it after a while. You can always come back to social media when you feel like you are ready to be there again.","task":"You are members of the Mental Health and Wellness Club. Your group has been asked to discuss the impact of social media on students’ well-being. You may want to talk about:","points":["what kind of people are popular on social media","the negative effects of social media on users","what the club can do to help promote better social media habits","anything else you think is important"],"ir":["Do you use social media?","Would you like to be popular on social media?","How do you feel when someone \"likes\" your social media posts?","Do social media posts show someone’s real life?","Do people become addicted to social media?","How do you control your use of social media?","Do you agree there is a lack of compassion on social media?","Does social media impact people’s self-esteem?"]},{"id":"2023-5.1","no":"5.1","label":"Searching for family history drives Chinese to DNA tests","intro":"This article appeared in a local newspaper:","title":"Searching for family history drives Chinese to DNA tests","text":"With a growing middle class, an increasing number of people are now keen on finding their roots in China. DNA testing kits are now widely available — users simply buy the kit, follow the instructions and mail a sample of their DNA back. Within a week, a digital report returns, showing the origin of their DNA.\n\n\"I was curious about my family history. I wanted to know who I am and where I came from,\" Miao, a Chinese executive who recently used the service, said. \"Since I grew up in the south, I was quite certain that I’m a southern Han.\"\n\nBut when results of the test came back, Miao was shocked. She had 60% Manchurian ethnicity - a north-eastern group. This then led to a search of her grandmother’s surname, which revealed that her great-great-great-grandparents were actually from the Red Banner — a royal family group in Manchu society during the Qing dynasty. In the process, she also reconnected with a few distant relatives she never knew existed.\n\n\"The DNA test was such a good experience that I’ve just bought another DNA testing kit. This one can reveal your personality,\" Miao said. The kit she referred to claims to be able to detect personality traits in the genes, like whether the user is outgoing or shy, optimistic or pessimistic. \"Who knows what L’ll find out about myself!\"","task":"Your class is doing a project on family history. Your teacher wants you to discuss the use of DNA tests to help research family history. You may want to talk about:","points":["why people want to know about their family history","whether there are any disadvantages to DNA testing","other ways to find out about your family history","anything else you think is important"],"ir":["Are you interested in your family’s history?","Do you often visit your relatives?","Do you feel closer to your relatives or your friends?","How can you keep a record of important family events?","How would you feel if you found out you were related to someone famous?","Do you think young people know much about their family history?","Would you be interested in taking a DNA test?","Is personality more affected by DNA or our environment?"]},{"id":"2023-5.2","no":"5.2","label":"Carousel","intro":"This article appeared in a newspaper:","title":"Carousel","text":"Carousell is one of Singapore’s most well-known startup companies, a platform on which users can buy and sell new and secondhand goods.\n\nIt has come a long way since 2012, when the startup was awarded $7,000 to develop a mobile-based marketplace app. Today, it’s present in seven markets and valued at US$1.I billion.\n\nCarousell was founded by three university friends — Quek Siu Rui, Marcus Tan and Lucas Ngoo. The trio wanted to build an app that would help to declutter the mountain of stuff they’d accumulated. The idea was to build a mobile-first version of US-based classifieds platforms like eBay and Craigslist. They were guided by a simple question: how can we reduce the time it takes to list a product?\n\nFor decades, when newspapers dominated the classifieds business, it would take a few days for an ad to show up in the papers. Then came the internet. Online classifieds like Craigslist cut that time to 30 minutes. You'd take a picture with a camera, transfer the file to a computer, connect to the internet and upload the listing.\n\nAs smartphones began to hit mass adoption, the founders aimed to build an app that allowed users to upload a listing for secondhand electronics, fashion, even cars and property. All within seconds. Snap, list, sell.","task":"Your school is planning to use Carousell to sell products donated by students for a school fundraising event. You are meeting to discuss this. You may want to talk about:","points":["the benefits of buying and selling products online","how to organise the donations for uploading to Carousell","any problems which might occur from selling products online","anything else you think is important"],"ir":["Do you buy things online?","Do many people sell things online in Hong Kong?","Could selling things online become a full-time job?","Would you like to start your own business?","What are the difficulties of owning your own business?","Will more jobs involve the internet in the future?","What advice would you give someone starting his or her own business?","What qualities make someone a good entrepreneur?"]},{"id":"2023-5.3","no":"5.3","label":"24 FitnessHK","intro":"This post appeared on a fitness website:","title":"24 FitnessHK","text":"With coronavirus keeping people indoors and away from sports and gyms, obesity is on the rise and so are health risks caused by an inactive lifestyle. But no need to worry, because 24 FitnessHK is bringing the workouts and personal trainers to your home!\n\n24 FitnessHK is now offering online yoga classes to all its members!\n\nFrom this month onwards, we are offering all our members online yoga classes held by some of our most experienced yoga teachers and senior personal trainers. You can learn and do yoga with these experts from the comfort of your home. All you need is a laptop or a mobile phone with a camera.\n\nMeet the community!\n\nHumans are social animals and need to socialise even when we are social distancing. Once you subscribe to this package, you can attend these yoga classes with your fellow fitness enthusiasts. You can talk and interact with them through the chat function on our mobile app to share your fitness journey.\n\nAmazing value for money package!\n\n* 10 online yoga classes for only $2000 * Includes a limited-edition yoga mat, and a 24 FitnessHK towel and water bottle\n\nWhat are you waiting for? Join now!","task":"You and your friends want to join some online fitness classes. You are meeting to discuss this. You may want to talk about:","points":["advantages of online fitness classes","things to consider when choosing an online fitness class","whether online fitness classes will continue to be popular","anything else you think is important"],"ir":["Have you attended any online fitness classes?","Do you think you are an active person?","Are there any disadvantages of online fitness classes?","Should yoga be taught in school?","Do you prefer to exercise alone or in a group?","Ts going to the gym popular nowadays?","Is Hong Kong becoming a healthier society?","Why are some people obsessed with doing exercise?"]},{"id":"2023-6.1","no":"6.1","label":"Super Bowl Advertisements","intro":"This article appeared on a website:","title":"Super Bowl Advertisements","text":"The Super Bowl is the championship game of the American National Football League (NFL). Super Bowl TV commercials are a cultural phenomenon as they have been among the United States’ most-watched television broadcasts. These advertisements are high-profile and some viewers only tune in to watch the commercials rather than the game.\n\nThis year, the advertisement that won the ‘Best Super Bowl Ad Competition’ was a heartwarming commercial for Doritos, a brand of potato chips. In the ad, a kid dressed as a cowboy rides his big dog and uses a rope to lasso a bag of Doritos out of his brother’s hands.\n\nThe winning ad showed how Super Bowl commercials sometimes can be less about creating laughter and more about appealing to the heart. \"The ad touched the depths of my soul,\" says Char Baringhaus, a middle school teacher from Michigan. \"Nothing reaches raw emotion like the love of animals.\"\n\nSometimes, the best way to sell a product is to tell a good story and create an emotional connection between the product and the viewers. A story that relates to our common experiences in life and has some elements of humour and surprise is a winning formula.","task":"Your Business Studies teacher wants your group to use storytelling to advertise a new sports drink called ‘Champion’. You are meeting to discuss this. You may want to talk about:","points":["whether storytelling is a good way to advertise","what ideas can be used in a storyline about the sports drink","how to make the advertisement memorable","anything else you think is important"],"ir":["Do you like watching advertisements?","Do you think advertisements are annoying?","Have you ever bought something because of an advertisement?","Do celebrities make advertisements more effective?","Would you like to work in the advertising industry?","Does advertising make people buy things they don’t really need?","Would you pay extra to watch programmes without advertisements?","ese NAY RYN Should advertisements targeting children be banned?"]},{"id":"2023-6.2","no":"6.2","label":"Good habits every student should develop","intro":"This article appeared on a webpage:","title":"Good habits every student should develop","text":"A survey of educators highlighted ten habits that successful students share:\n\nGet organised. Plan what you’re going to do and when you’re going to do it.\n\nDon’t multitask, Studies have shown that multitasking is physically impossible.\n\nDivide it up. Divide your work into manageable chunks and reward yourself when you finish each chunk. This will make studying (more) fun.\n\nSet a schedule. Do you work better right after school or after you’ ve eaten dinner? Are you more productive in 90-minute blocks or half-hour spurts? Find a schedule that works for you and stick to it.\n\nReview. Review your material several days ahead of time, in small chunks. Use flashcards or take practice tests. But don’t cram.\n\nfrom the television and other distractions. Whether it’s the library or your bedroom, set aside a space that you’ Il want to spend time in.\n\nFind a study group. Get together with a group of people who are learning the same things. Teaching others he
