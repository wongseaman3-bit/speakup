ry of that moment.","task":"Your group is doing a project on taking photos of food for a food blog. You may want to talk about:","points":["why some people love taking photos of food","any negative effects of taking photos of food","how to put together a blog about food photos","anything else you think is important"],"ir":["Do you like looking at photos of food?","Do your friends like taking photos of food?","How do you feel when your friends take photos of your food?","Have you ever scolded someone for taking photos of food?","Do you think taking photos of food is bad manners?","Should restaurants ban people from taking photos of their food?","How has social media enhanced people’s love of food photography?","Can food photography be considered \"works of art\"?"]},{"id":"2014-2.2","no":"2.2","label":"“We’re no trouble at all”","intro":"Below is an extract from an article about street culture in Hong Kong:","title":"“We’re no trouble at all”","text":"Street culture — seen in the likes of street art, dance, graffiti and skateboarding — is becoming far more accepted than it used to be in Hong Kong. And yet youngsters who enjoy dancing in the street or doing tricks with their skateboards at night are sometimes still dismissed as \"troublemakers\" and \"youths at risk\". Yeung Kin-tong, a social worker at the Chai Wan Centre of the Chinese YMCA of Hong Kong, is familiar with such negative labels.\n\n\"People see kids hanging out at night and think they are troublemakers. But the truth is they can only enjoy their hobby at night, when there are fewer people around,\" Yeung says. \"They are not making trouble; they are trying to avoid it.\" Yeung started interacting with ‘youths who began dancing and skateboarding on the street a decade ago. She adds that Hongkongers have come a long way in recognising the value of street culture.\n\n\"People used to frown upon teens on skateboards. They did not Tespect it as a sport. Same with street dancing or graffiti. People did not consider them as art. But that was in the past; now people understand more about street culture,\" she says. Yeung cites the Hong Kong International Street Jam Festival held on April 19 at Victoria Park, which was the first government-sponsored street culture event. \"Street culture is gaining Tecognition,\" she says.","task":"Your group wants to give a presentation about street culture in Hong Kong. Discuss with your group what to include in your presentation. You may want to talk about:","points":["why some people think street culture is negative","reasons why street culture is becoming more popular","how to change people’s attitudes towards street culture","anything else you think is important"],"ir":["Do you have friends who like street dancing?","Do your parents allow you to go out with your friends at night?","What do you think of people who skateboard in the street?","Should schools promote street culture?","Should teenagers be encouraged to take part in street culture?","What difficulties may street performers encounter?","What do you think of people who write graffiti?","Do you think street culture promotes creativity?"]},{"id":"2014-2.3","no":"2.3","label":"Happy in Switzerland!","intro":"Below is an extract from a newspaper article about the happiest citizens in the world:","title":"Happy in Switzerland!","text":"Switzerland is home to one of the world’s most successful economies and also one of the happiest populations in the world. In fact, Switzerland was ranked the world’s 3rd happiest country in the United Nations’ 2013 World Happiness Report, while Hong Kong was ranked 64\" (out of 156 countries).\n\nSo what’s Switzerland’s secret? The tiny European country — with a small population and very few natural resources — is known for investing in its people. Switzerland invests more in the health, education and talent of its people than any other country in the world. This has led to an economy that is competitive, highly innovative and an educated society that has adopted technology quickly. Below.are four things we can learn from Switzerland.\n\n1. Excellent healthcare. With a high-quality healthcare system that provides universal coverage, the Swiss live longer, are emotionally and physically healthy, and thus feel better.\n\n2. High-quality education. 86% of adults aged 25-64 in Switzerland have earned a high school diploma, and the Swiss also have higher average test scores in literacy, math and science.\n\n3. Talent and innovation. Switzerland is number one in the world for innovation, on-the-job staff training, attracting talent from elsewhere and government-funded training. The Swiss are well-paid and retain their own talent.\n\n4. Well-developed infrastructure. The Swiss have created an efficient transportation system and excellent Internet connectivity.","task":"As members of your school’s Model United Nations club, your group has to give a talk about Switzerland and Hong Kong. Discuss with your group what to include in the talk. You may want to discuss:","points":["how Hong Kong compares with Switzerland in the four points mentioned","whether Hong Kong’s ranking should be higher","how Hong Kong can improve its happiness ranking","anything else you think is important"],"ir":["What makes you happy?","What makes you unhappy?","Are you happier than your friends?","Do you think young people in Hong Kong are happier than their parents?","Why are some people unhappy even though they have good health?","Does having poor Internet connection make you unhappy?","Is there a relationship between education and happiness?","Can where you live affect your happiness?"]},{"id":"2014-3.1","no":"3.1","label":"Urban Dictionary","intro":"Below is an extract about the Urban Dictionary:","title":"Urban Dictionary","text":"The Urban Dictionary was started in 1999 by Aaron Peckham. Since then, it has become an archive for any new term or slang word, particularly those used to describe the behaviour and activities that have arisen because of social media and the web. More than 7 million entries are listed on the site and 2,000 definitions are added daily and it has become the default dictionary for many users.\n\nUrban Dictionary\n\n'S users contribute and vote on which definitions are most Popular, it says something about our current culture — something that traditional dictionaries can’t do.\n\n‘People have always been inventive with language,’ said Katherine Connor Martin, the head of U.S. Dictionaries at Oxford University Press. ‘In the 19% century, if young people were -using slang terms among themselves, those words had to become very well entrenched before anything came into popular [ue she added. ‘Now, if someone invents a new word on Twitter, it can go viral.’","task":"Your group has to do a project to compile a dictionary of English words commonly used by teenagers. Discuss with your group how to carry out this project. You may want to talk about:","points":["useful sources for collecting words commonly used by teenagers","ways to decide what words to include in your dictionary","how to present the information for the dictionary in an interesting way","anything else you think is important"],"ir":["Do you like to learn new English words?","How often do you use a dictionary?","Are dictionaries useful in learning a language?","Do you like to learn new words from Pop songs and rap music?","Should schools promote the use of the Urban Dictionary?","Do you think the Urban Dictionary is a reliable source of information?","Do you think slang plays an important role in learning a language?","Should standard dictionaries include words from the Urban Dictionary?"]},{"id":"2014-3.2","no":"3.2","label":"Finland — the world’s best education system","intro":"Below is an extract from a magazine about Finland’s education system:","title":"Finland — the world’s best education system","text":"The 2012 global league table, produced by the Economist Intelligence Unit, has found Finland to have the best education system in the world. The rankings combined international test results and data such as graduation rates between 2006 and 2010. Finland has consistently topped the international rankings for education systems. Why is it so successful? Below are some characteristics:\n\nStudents don’t start school until they’re 7 years old.\n\nNo standardized tests until they are 16 years old.\n\nGrades are not compulsory until students are in lower secondary.\n\nStudents of different abilities are taught in the same classroom.\n\nNo homework because it is assumed that mastery is achieved in the classroom.\n\nEducation emphasizes \"equal opportunity for all\".’They value equality over excellence.\n\nAbout two-thirds of students in Finland attend college. That’s the highest rate in all of Europe.\n\nOnly the top 10% of school graduates are eligible to become teachers.\n\nAll teachers are required to have a master’s degree, which is fully paid for by the government.\n\n10. Teachers receive more professional development.","task":"Your group is preparing for a discussion topic \"Our Education System\" for a Critical Thinking class. You may want to talk about:","points":["the most positive aspects of Finland’s education system","positive aspects of Hong Kong’s education system","which characteristics of Finland’s education system would not work in Hong Kong","anything else you think is important"],"ir":["Did you enjoy studying at primary school?","Does homework help you to learn better?","Is it too late to start school at seven years old?","Would you like to study in a school like the ones in Finland?","Should students of different abilities be separated into different groups?","Do examinations motivate you to study?","Would you have learnt more if you had studied in Finland?","Do all students in Hong Kong have equal opportunities in education?"]},{"id":"2014-3.3","no":"3.3","label":"The government is going ahead with the construction of a giant ferris","intro":"Below is an article about constructing a ferris wheel:","title":"The government is going ahead with the construction of a giant ferris","text":"wheel on the Central waterfront, The wheel will reach 60 metres into the sky, carrying passengers in air-conditioned gondolas, It is estimated that about 2,000 people will ride on weekdays and 4,000 on weekends and public holidays. Each ride could.last 10 to 15 minutes, with a fare of about HK$100.\n\nSupporters of the plan say that Hong Kong would benefit from adding a ferris wheel to its skyline. \"It will offer a unique experience that both locals and tourists can enjoy.\"\n\nBut not everyone is convinced that a ferris wheel will be good for Hong Kong. Lawmaker Paul Tse stressed Hong Kong has very few tourist spots along the coast and that the Central waterfront is a prime location and very expensive. Hong Kong already has very good observation points on The Peak and Sky100 in Kowloon, where people can enjoy the view from both sides of the harbour.\n\nHis concerns are echoed in part by Paul Zimmerman of the Society for the Protection of the Harbour. He feels that Hong Kong should not be seen as a ‘copycat’ simply mimicking the London Eye and the Singapore Flyer, two ferris wheels which are bigger than the one proposed to be built in Hong Kong. \"I would rather the land is used for waterfront restaurants or a kids’ playground.\"","task":"Your group is discussing the proposed construction of a ferris wheel on the Central waterfront. You may want to talk about:","points":["whether Hong Kong needs a tourist attraction along the waterfront","whether a ferris wheel would be an ideal tourist attraction","how the land could be developed for other purposes","anything else you think is important"],"ir":["— Would you like to ride a ferris wheel?","Do you think that riding a ferris wheel is fun?","Would you rather ride a ferris wheel during the day or at night?","Would you pay HK$100 to ride a ferris wheel to see Hong Kong’s harbour?","Do you think a ferris wheel in Hong Kong will be successful?","Do you agree that the best tourist attraction in Hong Kong is its harbour?","Do you think that the ferris wheel should be a temporary or a permanent attraction?","Do you agree that Hong Kong is always copying other cities?"]},{"id":"2014-4.1","no":"4.1","label":"Cyber-spying on kids","intro":"Below is an extract from a newspaper article about cyber-spying:","title":"Cyber-spying on kids","text":"Last year, the Hong Kong Research Association interviewed around 1,000 people (500 parents and 500 children aged 10 to 19) on their internet use and social media habits.\n\nThe study found that over 90% of young people used social media compared to 80% of parents. However, when it came to Facebook, 75% of young people used Facebook while only 56% of parents used it.\n\nThe study also revealed that 13% of parents admitted using fake identities to check up on their children through Facebook. A further 6% used their children’s username and password to access their social media accounts,\n\nWhen interviewed, parents explained that they wanted to monitor their children’s online activities, but had to create fake identities because children tended to set a level of privacy to exclude their parents. Children, however, did not like parents checking up on them. One reason given for not wanting to have parents as Facebook \"friends\" was because their parent might embarrass them by posting awkward-comments or baby photos online.\n\nNot all children felt this way, though. One S6 student said that she had no problems with her parents as Facebook \"friends\" because they already knew everything about her.","task":"As members of your school’s Computer Club, your group is to give a presentation to club members on the topic \"Communicating with Parents through Social Media\". You may want to talk about:","points":["whether parents should access their children’s social media accounts","why parents want to monitor their children’s online activities","why some children may not want their parents to be their Facebook \"friends\"","anything else you think is important"],"ir":["Do your parents use Facebook?","Do you communicate with your parents through social media?","Would you allow your parents to be your Facebook \"friends\"?","Should parents allow their young children to have Facebook accounts?","How would you feel if your parents did not allow you to have a Facebook account?","Would you give your social media username and password to your parents?","How would you feel if your parents created fake accounts to monitor your online activities?","Do parents have the right to spy on their children’s online activities?"]},{"id":"2014-4.2","no":"4.2","label":"Couponing — Job, Hobby, or Necessity?","intro":"Below is a blog entry about couponing:","title":"Couponing — Job, Hobby, or Necessity?","text":"Using coupons has become very popular these days. There are hundreds of websites and blogs available on the web for people to visit to help them learn how. to use coupons effectively, share deals, get advice and exchange information on tips and deals.\n\nWhen I am asked \"doesn’t couponing seem like a full time job to you?\", my response is \"It is my job to save my family money on groceries and other things.\" When I first started couponing I spent a fair amount of time each week cutting, organizing, researching deals, etc. but it was not long before I got the hang of it and had a system! Now a couple of hours a week accomplishes my money saving goals!\n\nT actually feel couponing is a hobby more than a job because hobbies are something people do because they enjoy it. I enjoy using coupons! It is exciting to see how much you saved at the end of a shopping trip just as a person would be excited seeing a completed hobby project!\n\nWhen I started couponing I was a single mother of four young children and had just lost my job. It was not a hobby to start cutting costs, it was an absolute necessity. Although I am no longer a single mother, saving money is still a necessity. The fact is, no matter what your financial situation is, coupons can help save money to let you achieve your goals!","task":"Your group is discussing the culture of using coupons. You may want to talk about:","points":["the types of coupons students normally use","the reasons why people like to use coupons","any potential disadvantages of couponing","anything else you think is important"],"ir":["Do you use coupons?","Where can you get coupons from?","What other ways can you save money apart from using coupons?","Do you think couponing is a good hobby?","Would you be willing to spend your time on couponing?","Do you think coupons help make a company more popular?","Do you think some people could become addicted to couponing?","Does the culture of couponing affect people’s shopping behaviour?"]},{"id":"2014-4.3","no":"4.3","label":"Superheroes","intro":"Below is an extract from an online article about superheroes:","title":"","text":"Superheroes — there’s just something fascinating about imagining how life would be different if we nea extraordinary powers to protect the world from evil. Below are the Profiles of three superheroes.\n\nSailor Moon\n\nSailor Moon is a typical 14-year old who likes sleeping late and Playing video games. Bunny (or Usagi in Japanese), like many superheroes before her, one day discovers she has great magical powers, Wearing a distinctive costume, she races off to save the world from various bad guys, discovering inner strength she never knew she had and.. -saving the day!\n\nMonkey King\n\nIf you think Superman or Spiderman has been around for a long time, think about Monkey King. He has been China’s favourite superhero for at least five centuries, He’s amazingly strong, he can fly, and he has a few tricks those other Superheroes have never heard of. And he’s always ready to do battle with demons,","task":"As members of your school’s newly-formed Superheroes Society, your group now has to decide how to get started. You may want to talk about:","points":["which of the three superheroes would best represent the society","how to attract new members to join","what activities the society could organize","anything else you think is important"],"ir":["Do you have a favourite superhero?","Do you enjoy movies about superheroes?","What superpower would you like to have?","Do superheroes appeal more to boys or girls?","Are superheroes good role models?","Would your school allow you to organize a Superhero Society?","Why do superheroes continue to be popular?","If you had a superpower, would you let other people know about it?"]},{"id":"2014-5.1","no":"5.1","label":"International Film Day","intro":"Below are plot summaries of three movies:","title":"","text":"Departure Gate is a 2006 Canadian romantic drama film. The movie takes place one summer night in Paris and follows Hunter Pang, a young Canadian, and Sung Wing Yee, a young Chinese woman, who meet the evening before they are both to return to their own countries. Since they believe they will never see one another again, both end up revealing more about themselves than they normally would. The film ends the next day at the airport, where the two agree to meet at the same place in six months’ time.\n\nLanguage: English and Cantonese\n\nThe Hunted is a 1999 Japanese adventure film set in 19\" century,.Macau, A Japanese diplomat is sent to Macau to negotiate trade with the Portuguese. When he is accused of killing a Portuguese woman, he becomes part of a cruel game. He is given a brief head start, then hunted by Portuguese soldiers. With a combination of luck and intelligence, he manages to avoid being killed and eventually gets back to his boat to escape.\n\nLanguage: Japanese with English subtitles\n\nLanguage Matters is a 1978 Indian comedy-drama film. A fifty-five year old housewife, Gita Kapoor, is preparing for her daughter’s wedding but is made fun of by her daughter for her lack of English skills. She decides to secretly enrol in an English-speaking course and surprises her family by giving a speech in English at her daughter’s wedding and in doing so shows how much she has grown through her efforts to learn English.\n\nLanguage: Hindi with English subtitles _","task":"As members of the school’s Movie Club, your group wants to organize an International Film Day. You may want to talk about:","points":["whether or not international films will appeal to students","the benefits of holding an International Film Day","which of the three movies to choose for the opening film","anything else you think is important"],"ir":["Do you watch movies alone or with friends?","What kind of films do you like to watch?","Do you usually read film reviews?","Do young people prefer watching films in the cinema or at home?","What problems could you face if you had to organize a film festival at school?","Would you prefer to see a local film or a foreign film?","Do you think there are enough films made for your age group?","What makes a film popular?"]},{"id":"2014-5.2","no":"5.2","label":"China’s dinosaur hunter","intro":"Below is an extract from a newspaper article about a ‘dinosaur hunter’:","title":"China’s dinosaur hunter","text":"Xu Xing is the go-to man in China for anything people want to know about dinosaurs. He has an extraordinary track record and has named 60 species so far — more than any other researcher in his field. And he is only 43 years old.\n\nXu didn’t set out to be a dinosaur hunter; in fact, he had no idea what a dinosaur was until he entered university. Initially, Xu wanted to study economics, but in those days, students were not allowed to choose their degree. For reasons that are unclear to him, he was assigned ‘Palaeontology’, the study of fossils.\n\nWhile he was working on his master’s degree, the small number of dinosaur species which were being discovered in China grew rapidly. Funding was increasing; farmers started recognising the value of the fossils they found; and construction meant that new fossils were being unearthed more frequently.\n\nFossils are now a thriving business as well as a science in China. Dinosaur hunters often have to have good relationships with farmers, museum directors and the tourism bureau to gain access to fossil sites. One of Xu’s concerns is the fossil ‘grey market’, where people try and sell fake bones or buy real ones and keep them in their private collection.\n\nXu says, ‘When I started my career, I never expected that I would have made so many discoveries. It’s a job that requires a lot of hard work and luck.’\n\nDr. Xu Xing is visiting your school to talk about his work on dinosaurs. Your group is preparing for his visit.","task":"You may want to talk about:","points":["aspects of his life and career people would be interested in","questions to ask Dr. Xu","any other activities that can be included in Dr. Xu’s visit","anything else you think is important"],"ir":["Are you interested in dinosaurs?","Do you think dinosaurs are scary?","Would you go to a dinosaur exhibition?","What would your friends and family say if you wanted to become a dinosaur hunter?","Would you be interested in going on a field trip to look for fossils?","What is the attraction of studying dinosaurs?","Is the study of dinosaurs important?","If dinosaurs could be cloned, would you support it?"]},{"id":"2014-5.3","no":"5.3","label":"Common health ‘mistakes’","intro":"Below is an extract from an online article about health ‘mistakes’:","title":"Common health ‘mistakes’","text":"Every day, we make common health ‘mistakes’ that may affect our health in general. Making a few simple changes to your daily routine may save your life. Below are some examples of health ‘mistakes’.\n\n1, Showering every day A daily hot shower using harsh, dry soaps can be bad for your skin. \"Using hot water combined with harsh soaps can remove the skin’s oils and moisture, resulting in dryness, cracking and even infection of the skin,\" said a doctor.\n\n2. Sleeping too little Getting less than 6-8 hours of sleep a day greatly affects your health, no matter how much you exercise. Scientists have discovered that those who skipped sleep increased their risk of stroke and heart disease by 400%. 3\n\n3. Carrying a heavy bag Carrying a heavy schoolbag or handbag around can really hurt your health by causing back pains, neck problems and poor posture, according to experts.\n\n4. Over-exercising It’s wrong to think that the more time we spend exercising, the better our health. Working your body too hard can lead to a weaker immune system, muscle damage, and knee, foot, or back problems.\n\n5. Skipping breakfast Skipping breakfast not only makes you feel tired and less active, it is also linked with a higher risk of diabetes and can lead to obesity as your body stores up more fat to use as energy\n\nthroughout the rest of the day.","task":"Your group wants to organize a workshop about common health ‘mistakes’. Discuss with your group what to include in the workshop. You may want to talk about:","points":["how common these health ‘mistakes’ are in Hong Kong","the top three ‘mistakes’ to choose for the workshop","how to make the workshop interesting","anything else you think is important"],"ir":["Do you eat breakfast every day?","Do you sleep more than six hours a day?","Do you agree that breakfast is important?","What can schools do to solve the problem of heavy schoolbags?","Which health ‘mistake’ is most surprising to you?","Which is worse — over-exercising or under-exercising?","Should we trust health information found on the Internet?","Do attitudes towards health habits change over time?"]},{"id":"2014-6.1","no":"6.1","label":"Team sports","intro":"Below is an extract from a magazine article about team sports:","title":"Team sports","text":"Sports can be expensive for some families. Not only that, the training can be very tough, requiring long hours of practice. Additionally, in individual sports (like tennis, squash, etc.), it can be quite lonely sometimes without having teammates to train with. It might also be difficult to handle failure in competitions too. Is it worth pursuing sports then? Most definitely yes, especially playing in team sports (like football, volleyball, etc.).\n\nThere are certainly many well-known benefits of physical activity arid sports in general. However, playing team sports provides extra benefits. Being part of a team demands commitment, punctuality, encouraging your teammates, and team-work. Team sports also mean that young people can make friends outside of school and learn how to work towards achieving a.common goal.\n\nAccording to a research study in ScienceDaily last year, a Youth Risk Behaviour survey was conducted on 1,820 high school students in America. Researchers Young that playing team sports could reduce bullying and violence in everyday life. The findings indicated that boys who played team sports were less bullied than boys in individual sports. Boys who did not participate in any sport experienced the most bullying. Girls who played either individual or team sports were less likely to get into fights, compared to girls who did not play any sports at all.","task":"As members of your school’s Sports Club, your group is to give a presentation to your schoolmates about team sports. Discuss with your group what to include in the presentation. You may want to talk about:","points":["the benefits of playing team sports compared to individual sports","the disadvantages of playing team sports compared to individual sports","how team sports can be promoted in Hong Kong","anything else you think is important"],"ir":["Do you play team sports?","Would you prefer to play in team sports or individual sports?","Do you prefer watching team sports or individual sports?","Would your parents allow you to become a professional sportsperson?","Why is it sometimes difficult to encourage people to play sports?","Should more money be invested in developing facilities for team sports in Hong Kong?","Do you agree that playing team sports reduces violence?","Is it more difficult to handle failure in individual or team sports?"]},{"id":"2014-6.2","no":"6.2","label":"E-textbooks — Instant access to thousands of textbooks","intro":"Below is an advertisement from an e-textbook seller:","title":"E-textbooks — Instant access to thousands of textbooks","text":"E-textbooks are digital versions of print textbooks enhanced with features such as high-speed search and electronic note-taking. These e-textbooks contain the same content as print textbooks. Go paperless and save big on our huge selection of cheap e-textbooks.\n\nYou can subscribe and access our e-textbooks for up to 360 days. We carry over 100,000 electronic textbooks and electronic book titles. If an e-textbook is available, it will appear as a purchase option for a particular textbook. Once you purchase an e-textbook from our website, you will receive an email with a link which you can click on to access your e-textbook.\n\nE-textbook Features : i ® Pages identical to print textbook with same Pagination e Easy navigation with linked Table of Contents ¢ Take notes and highlight text\n\ne Copy and paste text\n\n¢ Search for specific topics i Save up to 60% with e-textbooks. i\n\n° Print pages Save more with subscription packs. ¢ — Send information to classmates Bi ear pes ee e Read on mobile devices with a browser\n\ne Read on Android devices, iPad, iPhone and iPod Touch with CourseSmart Apps","task":"Your group is discussing whether schools should replace traditional textbooks with e-textbooks. You may want to talk about:","points":["the benefits of e-textbooks","the benefits of traditional textbooks","how e-textbooks could change the way people learn","anything else you think is important"],"ir":["Do you prefer e-textbooks or traditional textbooks?","Do you think that textbooks are too expensive?","Do you think the use of e-textbooks will become more popular in Hong Kong?","Do you think e-textbooks will one day replace traditional textbooks?","Do you like the idea of reading an e-textbook on your iPhone?","How would you feel if your school did not use e-textbooks?","Should the government provide subsidies for e-textbooks?"]},{"id":"2014-6.3","no":"6.3","label":"Struggling with debt","intro":"Below is an extract from a newspaper article:","title":"Struggling with debt","text":"Hong Kong university students and those enrolled in other forms of tertiary institutions are having a hard time struggling with huge debts, a recent survey suggests. University students borrow, on average, HK$109,000 in government loans, while students taking sub-degree and private degree courses borrow HK$192,000.\n\nThe survey involving 727 students who have unpaid loans was carried out from late August to mid-September by the Hong Kong Federation of Youth Groups (HKFYG). About 65 percent of students have taken up at least one part-time job over the past year, working for an average of 33.8 hours per week. Just about 10 percent of students said they were confident about paying off their debt on time, while most expect they would still be repaying well into their 30s.\n\nThe most expensive fees are for private degrees, which can cost as much as HK$90,000 a year. Student loans have an annual interest rate of 1.4 percent, which must be repaid within 15 years after the student graduates, Asked whether they thought they faced financial Pressure, students gave an average ratmg of 7.31 out of a scale of 10, with 10 being \"intense pressure\",\n\nAmy Fung Dun-mi, Vice-President of HKFYG, suggests the government should get rid of interest rates and subsidise more degree places, while private institutions should offer more scholarships.","task":"You are going to write a letter to a local newspaper to express your concerns regarding the financial problems tertiary students face. You may want to talk about:","points":["expenses tertiary students face","the problems of having a loan","whether getting a degree is worth the cost","anything else you think is important"],"ir":["Would you lend money to your friends?","Would you work part time if you were studying at university?","Would you consider applying for loans to further your studies?","Should students work and save money before going to university?","Should parents pay for their children’s post-secondary education?","Is it better to study a part-time course if you don’t have enough money?","Should university education be free?","Does cost affect your choice of subject to study?"]},{"id":"2014-7.1","no":"7.1","label":"Compulsory courtesy classes","intro":"Below is an extract from a newspaper article about classes for Mainland students:","title":"Compulsory courtesy classes","text":"China’s education ministry has ordered all primary and middle schools to teach students the basics of good manners, both with formal classes and by holding after-class activities,\n\nCourtesy and good manners classes will be conducted for students of different age groups. Primary school students will learn to speak politely, respect the elderly and the customs of ethnic minority groups, observe traffic rules and proper table manners and wear clean clothes.\n\nMiddle school students will be taught to hold polite conversations with both Chinese people and foreigners, dress properly and observe etiquette (courtesy rules) on the telephone, in emails, text-messaging and in exchanges of letters, as well as in public venues.\n\nIn addition, high school students will master the Principles and the art of holding conversation and dressing properly for different occasions, along with etiquette for delivering speeches and debates. They will also learn how to keep the proper distance from other people when they are queuing or using lifts.\n\nThe ministry encouraged teachers to diversify and find innovative Ways to conduct courtesy education to make it more attractive and effective.","task":"Your group is participating in a discussion on the topic \"Should compulsory courtesy classes be introduced in Hong Kong secondary schools?\" You may want to talk about:","points":["whether courtesy classes should be compulsory or not","what can be taught in courtesy classes","which age group of students would benefit the most","anything else you think is important"],"ir":["Are you polite to everyone?","Do people on the MTR show good manners?","What do you consider to be rude behaviour?","Which is the better place to learn good manners ~ home or school?","How can schools make courtesy classes attractive to students?","What would you do if someone was rude to you?","Why do we need good manners?","Does being courteous mean that you are a good person?"]},{"id":"2014-7.2","no":"7.2","label":"Are LEGO figures getting angrier?","intro":"Below is an extract from a blog entry about LEGO:","title":"Are LEGO figures getting angrier?","text":"Nevermind increasingly violent video games or the ever-present danger of an uncensored\n\ninternet, a far more important and unexpected change is happening that could be raced affecting children’s emotional development. Researchers have discovered that the faces on LEGO Minifigures are becoming increasingly angry and less happy. Combined with a trend towards more war-related LEGO themes, a team led by Christoph Bartneck at the University of Canterbury said, \"We cannot help but wonder how this impacts how children play.\"\n\nThe influence of LEGO is huge. The product is sold in more than 130 countries and the company produced more than 36 billion lego bricks in 2010 alone. On average each person on earth owns approximately 75 lego bricks. The vast majority of LEGO figures have happy faces (324), but the next most common is anger (192), followed by sadness (49), disgust (28), surprise (23) and fear (11). And the trend is for an increasing proportion of angry faces, with a reduction in happy faces.\n\nBartneck’s team also observed that LEGO has a considerable range of weapon systems in their products and that the company is moving towards more war-based play themes. Together with the rising numbers of angry faces, the researchers warned that LEGO might not be able to hold onto its highly positive reputation. The children that grow up with LEGO today will remember not only smileys, but also anger and fear in the Minifigures’ faces.","task":"Your teacher wants you to do a project about the impact of LEGO on young people. You may want to talk about:","points":["whether LEGO is popular among young people","reasons for its popularity compared to other toys","pros and cons of playing with LEGO figures with different faces","anything else you think is important"],"ir":["What toys did you play with when you were small?","Do you think playing with LEGO is fun?","Would you like to play with war-based LEGO?","Do you think LEGO is more popular with boys than girls?","Why does LEGO appeal to adults as well as children?","Should schools use LEGO in class?","Should there be an age restriction for war-based LEGO figures?","What challenges do you think LEGO is facing?"]},{"id":"2014-7.3","no":"7.3","label":"Is there truth in advertising?","intro":"Below is an extract from a website:","title":"Is there truth in advertising?","text":"The average consumer is overwhelmed with somewhere between 500 and 1300 advertising messages per day. When we get up in the morning and turn on the television or the radio, there will be anywhere from 15 to 25 commercials. As we travel to school or work, we will be exposed to billboards, signage, business logos, advertisements on other vehicles, etc. which will add another 10 to 20 ads.\n\nUnfortunately, a lot of the messages that we are being exposed to may be less than honest. A good example of this comes in the form of weight loss supplements. They proclaim, \"Take these pills and you will lose weight 30 percent faster without diet or exercise.\" Others say, \"These pills work uniquely with a woman’s body to increase the amount of weight loss.\" Unfortunately about 95 percent of all of the diet programs are not as effective as advertised.\n\nThe success of a product does not rely only on its advertising but also on its quality. Many advertising campaigns fail because the product doesn’t deliver on the promises made in the advertisements. Companies are well advised not to exaggerate or over-promise, since advertising can only make people buy the product the first time. Once customers discover the Product is not good, they will not buy it again.","task":"Your group has to prepare for a debate with the motion \"Advertising does more good than harm to society\". Discuss with your group what to include in this debate. You may want to talk about:","points":["positive effects of advertising on society","negative effects of advertising on society","what products should not be advertised","anything else you think is important"],"ir":["What kinds of advertisements do you like?","Do you think there are too many advertisements on TV?","Do you find advertisements entertaining?","Do you think it is effective to advertise products on buses and the MTR?","Are there any negative effects that advertising may have on young children?","Would you like to live in an advertisement-free society?","Which attracts more customers — a quality product or a good advertisement?","What makes a TV advertisement effective?"]},{"id":"2014-8.1","no":"8.1","label":"Super-sized Japanese Food","intro":"Below is an extract froma newspaper article about meals in Japan:","title":"Super-sized Japanese Food","text":"If you thought that only the Americans had super-sized food portions, then think again. After generations of staying slim on small portions of rice, noodles and vegetables, there is a growing trend in Japan of copying western-style big meals — known as ohmori (ch-mo-ri) or \"large serving\". Ohmori meals are increasingly popular, with delighted customers Photographing their food and posting it online.\n\nOne of Japan’s largest web forums has encouraged users to upload their favourite images of ‘mega ohmori’ or mega large meals. Amongst the favourites is a sushi roll (picture 1) stuffed with large chunks of fish which looks like it could easily feed a family of four! Picture 2 shows just how huge the pile of noodles is.\n\nMany restaurants are now cashing in on the craze, using particularly huge stacks of food as publicity stunts to attract customers. However, such enthusiasm for stomach-bursting meals may be risky, especially since it is considered extremely rude in Japan not to finish everything on your plate or to waste food. It would certainly be most challenging trying to eat everything!","task":"Your group has a stall at your school’s fun fair. You are considering selling super-sized food. You may want to talk about:","points":["whether super-sized meals are becoming popular in Hong Kong","the pros and cons of using super-sized meals to attract customers","what food your group could super-size in order to attract customers to your stall","anything else you think is important"],"ir":["I. Would you eat a super-sized meal by yourself?","Would you order a super-sized meal if local restaurants offered it?","Would you order a super-sized meal if you knew you could not finish it?","Would you take unfinished food home from a restaurant?","Which is more important to you — the quality or quantity of food?","Do you think it’s rude not to finish everything on your plate?","Do people eat more now than in the past?","Should restaurants use super-sized meals to attract customers?"]},{"id":"2014-8.2","no":"8.2","label":"From Hong Kong to Hollywood!","intro":"Below is an extract from a newspaper article about a Hong Kong teenager:","title":"From Hong Kong to Hollywood!","text":"When 16-year-old Jeremy Lin started writing a comedy based on his own personal experiences in school in Hong Kong, he did not expect Hollywood to pick up his script and turn it into a 90-minute film. \"I’m just some kid who wrote something and then they wanted to make it into a movie,\" said the Year 11 pupil studying at an international school.\n\nJeremy first submitted a proposal for a movie to a Los Angeles-based screenwriter and investor, Ms. Fabienne Wen, at a film workshop in 2012. After Ms. Wen read the proposal, she encouraged him to write a full-length script, which he finished in 2013. Impressed, Ms. Wen brought the script to Hollywood’s attention. This then started a price war among movie executives wanting to produce the film. Studio Best Medicine Production won. Angel Gracia, who directed the 2011 romantic comedy From Prada to Nada, will be the director for the film.\n\nThe movie, called Senior Project, is aimed at teenagers and set in America. The plot revolves around five high-school students, including a teenager who lies about his sexuality and a student who tries to keep up the appearance of being rich. Jeremy is now one of the world’s youngest screenwriters and a local teenager who dared to dream big.","task":"As members of the school’s Film Society, your group is organizing a workshop and has invited Jeremy Lin to take part. You may want to talk about:","points":["activities to do in the workshop","questions to ask Jeremy Lin","what students could learn from Jeremy Lin","anything else you think is important"],"ir":["Do you like watching movies about teenagers?","Do you prefer watching foreign movies or local movies?","Do you want to work in the movie industry?","How would you feel if your movie proposal was selected to become a Hollywood movie?","What kind of Hong Kong movies would appeal to an international audience?","Would life at your school make an interesting film?","What can students do to turn their dreams into reality?","Do teenagers all over the world face the same kind of issues?"]},{"id":"2014-8.3","no":"8.3","label":"Warning signs you are addicted to technology","intro":"Below is an extract from an online article about technology:","title":"Warning signs you are addicted to technology","text":"Today, it is virtually impossible to live without the aid of some form of technology (like smartphones, the\n\nBelow are some signs that might indicate that you are addicted to technology: 1. Increasing your time spent daily on computer and internet activities that are not related to work or school.\n\n2. Feeling very anxious or distressed when separated from technology (e.g. not being able to check emails, surf the internet, send mobile text messages etc.).\n\n3. Multi-tasking by using multiple forms of technology at one time (e.g. playing computer games while watching TV and listening to music etc.), which could lead to a lack of concentration,\n\n4. Losing confidence and interest in the real world while choosing the comfort of a virtual world, thus sacrificing time spent with friends and family, or even skipping school.\n\nWe certainly can’t live without technology today. The key is finding the balance between our constant need to engage with technology without becoming digital slaves.","task":"Your group wants to give a class presentation about addiction to technology. Discuss with your group what to include in your presentation. You may want to talk about:","points":["why some Hong Kong teenagers are addicted to technology","possible signs of being addicted to technology","any tips or advice for overcoming technology addiction","anything else you think is important"],"ir":["What do you use the computer for?","Should parents control the amount of time children spend on the computer?","What would you do if you could not use the computer for a week?","Which is worse — having no computer or no mobile phone?","If you could only use the computer for one hour a day, what would you do?","Is spending seven and a half hours a day on the computer unhealthy?","In your opinion, is being addicted to technology a serious problem?","Who is to blame for the addiction to technology?"]},{"id":"2014-9.1","no":"9.1","label":"Hong Kong Police Force Post-Secondary School Summer Internship Programme","intro":"Below is an extract from an advertisement for the Hong Kong Police Force:","title":"Hong Kong Police Force Post-Secondary School Summer Internship Programme","text":"Have you always wanted to be a police officer? Have you ever wondered what it would be like to be part of the Hong Kong Police Force? Apply for the Police Force’s Summer Internship Programme Sor a genuine experience in a real-life police work setting.\n\nPolice Public Relations Summer Intern\n\nEntry requirements: Job duties: Applicants should s (1) Youth activities * be permanent residents of Hong Kong SAR + To review & update the Junior Police Call * be full-time students of Post-secondary a (JPC) website and Facebook page institutions from disciplines of Hospitality & + To assist in organizing & executing JPC Tourism, Marketing, Business, Public & Social activities & training Administration, Public Relations, Computer (2) TV & films production Sciences & IT, Languages, Graphic Design, + To co-ordinate filming applications made by Sports Sciences, Journalism & Media, and Mass film/media industry Communications * To assist in the preparation of the weekly * possess good knowledge in computer production of Police Magazine applications + To assist in the maintenance of the video speak fluent Cantonese & English library Duration: July to August 2014 Allowance: $7,700 per month","task":"You are looking at an advertisement for a summer internship for the Hong Kong Police Force. Your group is thinking about whether to apply. You may want to talk about:","points":["why some teenagers would be keen to join the Hong Kong Police Force","which job duties in the Public Relations internship your group would prefer to do","benefits of the Public Relations internship compared to other jobs","anything else you think is important"],"ir":["Would you like to join the Police Force in the future?","Do you think that being a police officer is a dangerous job?","What would your parents say if you wanted to become a police officer?","Do you think the Police Summer Internship Programme is a good scheme?","Should speaking English be a necessary job requirement for joining the Police Force?","How can the Police Force encourage more women to apply?","Do you respect someone who is a police officer?","Why is it important for the Police Force to communicate with the public?"]},{"id":"2014-9.2","no":"9.2","label":"What Ever Happened to World Class Customer Service?","intro":"The following is an extract from a blog:","title":"What Ever Happened to World Class Customer Service?","text":"Hong Kong risks losing its competitive edge if the quality of its customer service continues to decline. \"The customer is king\" means providing quality service to customers so that they get the best experience. However, cases of bad customer service are becoming more frequent.\n\nThere was the case of the waiter who angrily said again and again, \"THERE ARE NO MORE SEATS\" when I wanted to book a table. \"What about the waiting list?\" I asked. He said that there was no room on the waiting list. Then there was the case when I called a company and had to go through their automated phone system and it took forever to get my question answered. It was only after a very long wait that I was able to finally speak with an actual person. When I finally got someone on the phone, they acted as though they were doing me a favor by answering my inquiry.\n\nTo improve customer service, the major focus has to be,placed on the employees to make sure they are treated equally and that they work in an environment that is motivating, inspiring and encouraging. Employees should be given a word of praise whenever possible. Every attempt possible should be made to motivate employees by rewarding them for a difficult job done well. With these measures in place, we should see\n\nworld class customer service return to Hong Kong once again.","task":"Your group wants to collect opinions from your schoolmates for a group project about customer service in Hong Kong. You may want to talk about:","points":["why good customer service is important","whether or not customer service in Hong Kong is getting worse","how customer service can be improved","anything else you think is important"],"ir":["Would you like to work in a restaurant?","Is good customer service more important in a restaurant or a clothes shop?","Would you complain if you experienced bad customer service?","How can shop assistants give a good impression to tourists in Hong Kong?","Would you recommend a restaurant despite bad customer service?","Do you think you could deal with rude customers if you worked in a shop?","Should service industry employees be given more respect?","How can employees be motivated to improve the way they treat customers?"]},{"id":"2014-9.3","no":"9.3","label":"Study Time to keep kids off the streets","intro":"Below is an extract from an online article about Study Time:","title":"Study Time to keep kids off the streets","text":"At 7pm every weeknight, Mr Dadang walks through a small: village in Indonesia, and sounds his loudspeaker’s sirens. Children armed with backpacks come out of their homes and go to the village community hall, where they are watched by village headmen. They take out schoolbooks and pencils with one mission — to study. \"This is a call to my beloved children, that from 7-9pm, Study Time is in effect, May you become clever children, disciplined and focused,\" he yells alongside parent volunteers on study patrol.\n\naround in groups on the streets at night. Children can choose to study in a common space or at home. Those caught not studying have to Pay a 2,000 rupiah (HK$2) fine, a heavy amount for some families. So far, no fines have been collected because Parents are very keen on this scheme.\n\nVolunteers help the children with a variety of subjects, like English, making them write words in Bahasa Indonesia and then translate them into English. Older children help the younger children too,\n\nWith its success, the study curfew has spread to other provinces across Indonesia, where residents have embraced this community effort.","task":"Your group is participating in a forum on the topic \"Study Time should be introduced in Hong Kong\". Discuss with your group what to include in the forum. You may want to talk about:","points":["the benefits of having Study Time in Hong Kong","the negative effects of having Study Time","whether Study Time could be implemented in Hong Kong","anything else you think is important"],"ir":["What is your favourite time to study?","Do you prefer to study alone or ina group?","Is studying every night from 7 to 9pm a good thing?","Would having to pay a fine of HK$100 motivate you to study?","Do you study better if your Parent is monitoring you while you study?","Apart from a fine, in what other ways can students be motivated to study?","Would Study Time be more beneficial for weaker or stronger students?","Does imposing study rules demotivate students?"]},{"id":"2014-10.1","no":"10.1","label":"Do children have too much power in Sweden?","intro":"Below is an extract from a newspaper article about children in Sweden:","title":"Do children have too much power in Sweden?","text":"Sweden was the first country in 1979 to ban the use of physical punishment to discipline children. However, some argue that its child-centred approach has gone too far and children now rule the family instead of parents. A psychiatrist who wrote the book \"How Children Took Power\" says parents should listen to their children but Swedish children now tend to decide everything in families: when to go to bed, what to eat, where to go on vacation, even what to watch on TV.\n\nHe adds that not disciplining Swedish children or setting boundaries from a young age has led them to have expectations that are too high, and they think that life is too hard for them. This has resulted in a sharp increase of anxiety problems, self-harming and children being unprepared for adulthood. Teachers have complained that students have become bad mannered and uncontrollable, frequently using foul language and not caring about schoolwork. Another expert feels because of Sweden’s emphasis on democracy and equality, Swedish parents try to be too democratic. Parents should act like parents and not act like friends. They should make decisions, take control, and not try to be popular all the time.\n\nNonetheless, some people feel that the Swedish parenting style is successful. Swedish children are very outspoken and can express their opinions well. On the whole, Swedish youths still top international rankings of well-being.","task":"During a class on Critical Thinking, your group is given the discussion topic \"Do you agree that children will have too much power if they are not disciplined?\" You may want to talk about:","points":["whether Hong Kong children have too much power","the positive effects of disciplining children","the negative effects of disciplining children","anything else you think is important"],"ir":["Do your parents listen to you?","Do your parents allow you to decide what time to come home?","What type of punishment is worse for you — no TV or no phone?","Are Hong Kong children over-protected?","What decisions should children be allowed to make?","Do you feel you had enough freedom when you were growing up?","Should parents act like friends to their children?","Should a family be run as a democracy?"]},{"id":"2014-10.2","no":"10.2","label":"Why I dance","intro":"Below is an extract from a magazine interview with a teenager:","title":"Why I dance","text":"by Sugar Chan\n\nI have been dancing since secondary school.\n\nThe first dance group I ever belonged to was the Hong Kong Youth Dance Group, which provided me and still provides its members — with regular training in dance techniques. It also gave me a chance to perform different types of dance such as Hip Hop, Jazz, Funk and Modern Dance.\n\nI was in the dance group for three years and it was truly a unique experience. I didn’t just learn dance steps and techniques, also made friends and became myself. For this, I have to give credit to my dance teachers who also became my life teachers. I learnt so much from them, both about dance and self-awareness. Apart from teaching me about performing on stage, they also kept asking me, ‘What are you doing here? Who are you? Why do you perform? Is it just for yourself or are you trying to attract attention?\"\n\nThose questions meant a lot to me as I was growing up and I have asked myself the same questions many times. As a teenager, dance was transformative and helped me to find myself. I now understand that I dance not to please the audience. I dance for myself, dance because I am.","task":"As members of the Hong Kong Youth Dance Group, your group is giving a presentation during assembly to encourage fellow classmates to join the group. You may want to talk about:","points":["whether Hong Kong teenagers like dancing","what teens can learn from dance","what activities can be organized to promote the group","anything else you think is important"],"ir":["Do you enjoy watching dancing?","Would you like to dance on stage?","What would your parents say if you wanted to join a dance group?","Would you recommend that your school includes dance as a learning activity?","Would you prefer to dance solo or ina group?","What can be learned from performing on stage?","Do people dance to attract attention?","Is traditional dance losing its appeal?"]},{"id":"2014-10.3","no":"10.3","label":"Subscribe to Magazines at a Low Price!","intro":"The following information appeared on a website:","title":"Subscribe to Magazines at a Low Price!","text":"Gadgets Magazine features more than just electronic equipment and high-tech trends. Gadgets Magazine gives you all the latest news and updates on mobile phones, laptops, cameras. You can also get the prices of all the latest products of leading companies like Nokia, Samsung, Motorola, BlackBerry, Lenovo, Acer, HCL and much more.\n\nGlobal Traveler is a monthly travel magazine. The magazine is aimed towards American executives who travel internationally and domestically in first- and business-class. It features news, articles, city guides, travel deals, travel blogs, hotels, golf courses, restaurants and airline reviews.\n\nCosmopolitan is an international magazine for women. It was first published in 1886 and was later transformed into a women’s magazine in the late 1960s. Also known as Cosmo, its content includes articles on women’s issues, relationships, health, careers, self-improvement, celebrities, fashion and beauty.\n\nNational Geographic Magazine is the official magazine of the National Geographic Society. It has been published continuously since its first issue in 1888, nine months after the Society itself was founded. It primarily contains articles about geography, history and world culture. The magazine is published monthly, and additional map supplements are also included with subscriptions.","task":"Your school library is going to subscribe to a new magazine and your group wants to discuss which one is most suitable for students to read. You may want to talk about:","points":["the pros and cons of choosing each magazine","the magazine to be chosen","other types of magazine the library should subscribe to","anything else you think is important"],"ir":["Do you like reading magazines?","What makes a magazine popular with teenagers?","Do you prefer buying magazines or reading online magazines?","Do your parents support you in buying teen magazines?","Why do teachers recommend students to read newspapers more than magazines?","Are teen magazines good value for money?","How do teen magazines affect teen fashion?","Should a magazine educate or entertain?"]}]},{"id":"2015","year":"2015","label":"2015 DSE","tasks":[{"id":"2015-1.1","no":"1.1","label":"Gadgets for better selfies","intro":"The magazine advertisement below presents four gadgets to help improve ‘selfies’:","title":"Gadgets for better selfies","text":"Selfie Shutter\nEver dreamed of taking hands-free selfies? Designed in Hong Kong, the Selfie Shutter (HK$300, available at Studio A – Mong Kok) is a remote bluetooth shutter to help get rid of that annoying selfie arm from your shots. Stand your phone up on this stand and click away. It’s small and easy to carry around.\n\nSelfy iOS\nSelfy iOS (HK$8, available at itunes.apple.com) provides a similar service to Selfie Shutter, by giving you a timer. As an added bonus, it comes with a built-in effects editor. Android users might want to look at the free app, YouCam, which offers a similar set of features.\n\nSelfie Stick\nIf you’re looking to take group shots or simply want to take in more of the view behind you, try one of these selfie sticks (HK$350, DG Lifestyle Store, Pacific Place, Admiralty). It is highly portable, only 23cm long and when extended reaches 93cm. Pair with Selfy iOS or YouCam and you should have the perfect selfie set-up.\n\nN1 Mini\nThe N1 Mini (HK$4,000) is a smartphone for selfie fans which has a rotating camera with a 195-degree angle. Its main purpose seems to be to get a better angle of yourself without moving your hand. For any selfie obsessives, the “beautify” mode will give you a slimmer face and clearer skin.","task":"As members of your school’s Photography Club, your group is planning to give a talk about ‘selfies’ and to recommend two of the pieces of equipment above to take better ‘selfies’. You may want to talk about:","points":["why selfies seem to be so popular among young people","the advantages and disadvantages of the gadgets advertised","which two you would recommend","anything else you think is important"],"ir":["How often do you take selfies?","Do you post selfies on social media sites?","Do you prefer to take a selfie or ask a friend to take a photo of you?","Do you have a favourite photo of yourself?","Do you prefer to take a selfie of yourself or with other people?","Why do you think some people like selfies?","Why do you think selfies are more popular among younger people than older people?","Do you think the selfie is a form of creative expression or self-love?"]},{"id":"2015-1.2","no":"1.2","label":"Digital Memory Boxes","intro":"Below is an extract from a webpage about funding a journey to the moon:","title":"Digital Memory Boxes","text":"A decade from now, if all goes well, a spacecraft with a high-tech drill will land at the South Pole of the moon. There, it will drill up to 100 feet down into the surface and collect rock samples to bring back to Earth, These samples will hopefully answer questions like \"What are the origins of the moon? ... Is the moon suitable for a permanent manned base for space exploration?\"\n\nBefore the spacecraft leaves, it will bury a two-part time capsule: a public part, full of Earth's history, and a private part, full of \"digital memory boxes\" created by individuals and schools.\n\nBritish engineer, David Iron, who came up with the plan said, \"We have carried out research and been quite surprised how keen people are. School kids think the idea of having a bit of themselves on the moon is\n\nfantastic.\"\n\nBy donating HK$1000 you can be one of the first to reserve yourself a Digital Memory Box. Think of it like an iPod or memory stick: into your memory box, you will be able to upload whatever digital information you want: a personal message, a photo, a family tree, a poem, a video, your favourite song...the choice is yours! Millions of individual memory boxes, belonging to people and schools all over the world, will make up the private archive — to be buried deep inside the moon.","task":"Your school has decided to send a digital memory box to the moon. As members of the Student Union, your group is going to discuss what to put inside your school’s memory box. You may want to talk about:","points":["the purpose or theme of your memory box","things your school could put inside","how to get as many students and teachers involved as possible","anything else you think is important"],"ir":["What do you remember about your primary school?","What are your best memories from primary school?","Do you have a special photo that reminds you of a happy time?","What would you put inside your personal memory box to send to the moon?","Would you pay a thousand Hong Kong dollars to send a digital memory box to the moon?","What do you think should be put inside the public time capsule on the moon?","What is your earliest memory from your childhood?","Do you think the Internet is changing how we remember information?"]},{"id":"2015-1.3","no":"1.3","label":"The Youth Olympic Games","intro":"Below is an extract from a website about the Youth Olympic Games:","title":"The Youth Olympic Games","text":"The Youth Olympic Games is a sporting event for young people aged 15-18. Its vision is to inspire young people around the world to participate in sport and live by the Olympic values of respect, excellence and friendship through sport. Below are three events held at the Nanjing Youth Olympic Games in 2014.\n\nChat with Champions: For a true champion, results are not everything. It is also important to have a sense of social responsibility, a healthy lifestyle and mutual respect for others. This forum provides an opportunity for young athletes to interact with real champions in person. Professional athletes will take part in the forum to share their knowledge, give advice, discuss different subjects and talk about their professional career.\n\nAthlete Career Planning Workshop: This workshop will focus on time management. Athletes will learn how to maximize their time each day through optimal planning and how to balance sport and study. Members of the International Olympic Committee will share their personal experiences with young athletes and discuss different sports careers and how to have a life after sports.\n\nInternational Exhibition: The International Exhibition will strengthen the young athletes’ understanding of global topics. Interactive activities will be held on topics such as fair play, peace promotion, Olympic education, AIDS prevention, sexual health, first aid and humanitarian values. Through these activities, athletes will be able to engage with world issues.","task":"As members of the Sports Society, you are going to organize activities based on the values of the Youth Olympic Games. You may want to talk about:","points":["which of the above activities you think would be most suitable for school students","what other activities could be held based on the values of the Youth Olympic Games","how to get more people in the community involved in these activities","anything else you think is important"],"ir":["Do you like watching sporting events?","Have you participated in any sporting events?","Who is your favourite sportsman or sportswoman?","Why do some athletes only care about winning?","Which is more important: winning the game or sportsmanship?","Do you agree that athletes should be role models for teenagers?","Do you think it is a good idea to pursue a career in sports in Hong Kong?","Why is it important to promote sports culture in Hong Kong?"]},{"id":"2015-2.1","no":"2.1","label":"Welcome to Sydney's Famous Original Doll Hospital","intro":"Below is an extract from an article about a doll hospital in Australia:","title":"Welcome to Sydney's Famous Original Doll Hospital","text":"The Doll Hospital has cared for dolls, teddy bears, wheeled toys and many other items for over 100 years. Business boomed during World War II, when there were very few new dolls being made or sold, but today, 80% of the business comes from adults who want to restore their childhood memories or pass on their childhood toys to their grandchildren or others.\n\n\"Doctors\" who work at the family-run hospital specialize in repairing different things, such as antique and modern dolls, teddy bears and soft toys, prams, suitcases and handbags etc. \"The interesting part of our job is that no two dolls are the same, so every day poses a new challenge for us,\" say the doctors. \"There is nothing more satisfying than seeing the smile on a customer’s face when they reunite with their beloved\n\ntoy.\"\n\nAside from doll repairs, you can also wander for hours around the Doll Shop, which carries everything you could possibly dream of in a doll shop. There are dollhouses and hand-made dresses for dolls, with matching bonnets and pants. Prices for dolls start at around AUD$20 (around HK$140), for a regular doll, to thousands for a rare collector's doll.\n\nSo if you have a precious doll or bear stuffed in a cupboard, maybe injured, aged and a little neglected, it's time to take them to Sydney's Famous Original Doll Hospital, and ensure they will be passed on and loved for many years to come.","task":"You and your group study Business Studies. Your group is discussing whether a doll hospital would be a good business idea in Hong Kong. You may want to talk about:","points":["why people want to repair their old toys","whether a doll hospital business in Hong Kong would be successful","how doll hospital could be marketed","anything else you think is important"],"ir":["What toys did you play with?","Do you still keep your childhood toys?","What toys do young children like to play with nowadays?","Is it worth spending money repairing old toys?","Why do adults like to collect toys?","Can children live without toys?","Will electronic games replace traditional toys?","Do you think toys play an important role in a child’s development?"]},{"id":"2015-2.2","no":"2.2","label":"Elective Courses for Secondary Schools","intro":"Below is an extract from a leaflet about elective courses:","title":"Elective Courses for Secondary Schools","text":"L Firefighting\n\nFirefighting is one of the most dangerous jobs in the world. It requires complete discipline and attention to the professional standards necessary to fight fires, handle hazardous materials and conduct search-and-rescue operations. Students will become familiar with the procedures, equipment, and technologies used by current fire departments. This course challenges students academically, mentally and physically.\n\nIL Media Technology and Film Production\n\nThis course offers students an opportunity to study all aspects of video and media production, from planning and writing for production to operating studio and editing equipment. Students practise various methods of gathering news and information from individuals, research and online resources. In addition, students are\n\nintroduced to the principles of film production.\n\nIl, Fisheries and Wildlife Management\n\nThe Fisheries and Wildlife Management course offers instruction in the identification and management of wildlife and aquatics and of their habitats. Content will also include the issues related to endangered species and organizations that protect fisheries and wildlife.\n\nIV. Business Law\n\nStudents examine the foundations of the local legal system and learn the rights and responsibilities of citizens. Students gain practical knowledge and life skills by exploring concepts related to laws governing business and individuals. Focus areas include contracts, consumer protection, criminal law, employment law and careers in the legal profession.","task":"Your school is planning to introduce a new course for senior students in the next academic year. As members of the Student Union, you are meeting to discuss which course you would recommend. You may want to talk about:","points":["how the four courses can benefit students","what difficulties may be encountered if these courses are introduced","which course would be the most popular among students","anything else you think is important"],"ir":["Which subject do you like the most?","Which is your least favourite subject?","Are you happy with the courses offered in your school?","In your experience, are core subjects easier than electives?","What criteria do you consider before choosing an elective?","What are the pros and cons of requiring students to take core subjects?","Which elective do you think should be made into a compulsory subject?","Have electives made your learning experience more well-rounded?"]},{"id":"2015-2.3","no":"2.3","label":"Mission to Mars","intro":"Below is an extract from a webpage about a young girl who wants to be the first person to go to Mars:","title":"Mission to Mars","text":"Alyssa Carson, a 13-year-old girl from Louisiana, USA, is hoping to become the first person to attend ali three of NASA’s (National Aeronautics & Space Administration) world space camps. She plans to become the first person to visit Mars. \"It’s a place no one has been. A place deserted right now. I want to take that first step,\" she said. If all goes according to her 20-year plan, Alyssa will go on a mission to Mars in 2033.\n\nAlyssa speaks Spanish, French and Chinese, and tweets about her trips to NASA events and space camps, and the talks she gives to inspire other children to achieve their goals. \"I have thought about possibly being other things but being an astronaut was always first on my list,\" she says.\n\nAlyssa’s father says, \"There’s no doubt in my mind that her dream and passion will drive her to that planet.\" And NASA is taking Alyssa very seriously. NASA’s Paul Foreman said of Alyssa, \"She’s doing the right things, taking the right training and steps to become an astronaut.\" Alyssa and her father have discussed the possibility of her not returning to Earth. Her father said, \"If that’s the only option, she still wants to go.\"\n\n\"JT don’t want one obstacle in the way to stop me from going to Mars,\" Alyssa says with determination. \"Failure is not an option.\"","task":"As members of your school’s Astronomy Club, your group is planning to invite Alyssa Carson to come and give a talk to your school. You may want to talk about:","points":["why you would like to invite Alyssa","what you would like Alyssa to talk about","any other activities that could be included in Alyssa’s visit","anything else you think is important"],"ir":["Would you like to be an astronaut?","Would you like to go to Mars?","Do you think Alyssa Carson is too young to train to go to Mars?","What ambitions do you have for your future?","If you went to Mars, what do you think you would find there?","Would you like to take a trip into space on a new passenger plane?","If you went to Mars, what challenges do you think you would face?","Do you think tourism in space will ever become popular?"]},{"id":"2015-3.1","no":"3.1","label":"Bring Your Own Device","intro":"Below is an extract from an online article about using your own mobile device at school:","title":"Bring Your Own Device","text":"One high school in Virginia, USA, is considering a program that allows students to bring their mobile devices including smartphones, iPads or notebook computers to school. The program would be rolled out slowly over two semesters giving teachers and students time to adjust to the change in policy.\n\n\"For our older students there is a policy right now of not using mobile devices, so we will have to have that debate about when it will be appropriate,\" said Jean Colley, a senior staff member of the school.\n\nFor the first semester, \"Bring Your Own Device\" will be implemented only in select classrooms where teachers have volunteered to test the program before it is introduced school-wide during the second\n\nsemester. Board Chairman Garry Carter said he hopes the program will be implemented carefully and that other\n\nmethods of learning that have been so successful for so long will not be abandoned. Colley stressed that the devices would not take the place of traditional teaching with pencils and books.\n\n\"I don’t think you'll see a classroom of students doing this,\" Colley said bowing her head with thumbs moving as if tapping out a text message. \"But I do think these devices will accelerate their learning.\"\n\nSchool Board member Anne Rollins said it is important the students learn to filter and synthesize the material they get online. \"The technology is going to give them data, but it’s not going to think for them.\"","task":"In your group discuss the possibility of introducing a \"Bring Your Own Device\" policy in your school. You may want to talk about:","points":["the benefits and problems of this policy","how to prevent such problems","in which subjects mobile devices would be most useful for students","anything else you think is important"],"ir":["I Do you have a mobile device?","Do you take a mobile device to school?","Do you use a mobile device to do your homework?","Do students use mobile devices for learning in your school?","If your school offered to buy you a mobile device, what would you choose?","Do you think a mobile device helps you learn faster?","Do you think you can improve your English using a mobile device?","How will mobile devices change the way people learn?"]},{"id":"2015-3.2","no":"3.2","label":"Top Jobs in the World to Consider","intro":"Below is an extract from a website on the best jobs in the world:","title":"Top Jobs in the World to Consider","text":"#1: Software Developer: These professionals are the brains behind your Candy Crush obsession and Android phone dependency. They design anything from apps, games and computer software, to databases and operating systems.\n\n#2: Nurse: Nurses are now specialists in their own right: some offer care for a specific health condition (such as diabetes or cancer), a group of people (such as premature babies or the elderly) and even a particular type of environment (such as an emergency room or school). Responsibilities within this field also cover the full spectrum, from clerical work, to administering medicine, to performing procedures and\n\nmonitoring a patient’s progress.\n\n#3: Web Developer: Have you ever opened a webpage and your jaw instantly drops? The website's color scheme, layout, main image, user experience — everything really — is absolutely perfect. If you have, this is thanks to the hard work of a talented Web developer. Responsible for designing, coding and modifying websites, Web developers strive to create visually appealing sites that feature user-friendly design and easy\n\nnavigation.\n\n#4: Veterinarian: Vets take care of animals, but they also do much more. They protect the safety of our food supply by inspecting livestock, promote public health by fighting animal-borne diseases and help foster healthier relationships between people and their animal companions.\n\n#5: Nutritionist: They advise clients on food and nutrition, develop meal plans and track progress so that clients can live a healthier lifestyle or reach a nutritional goal.","task":"As members of the Careers Committee, your group is going to organize a career planning workshop about the five jobs above. Discuss with your group what to include in your workshop. You may want to talk about:","points":["what skills students need for the five jobs","whether you think these jobs would be popular among students","how to make the workshop interesting","anything else you think is important"],"ir":["What is your dream job?","Would you like a job in the IT industry?","Would you like a job in the health sector?","Do you prefer a job working alone or working as a team?","Is interest the most important factor when choosing a job?","Does getting a university degree matter to your career path?","Do you think people in Hong Kong focus too much on their salary?","Would you choose a career just because it was easy to get a job?"]},{"id":"2015-3.3","no":"3.3","label":"The city in the sky","intro":"Below is an article about an award-winning proposal:","title":"The city in the sky","text":"The ‘Endless City’ project is an ambi
