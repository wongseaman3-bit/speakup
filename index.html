tious plan which suggests skyscrapers of the future may one day house an entire city. London is the proposed city for this project, which could accommodate thousands of people — as well as schools, offices, shops and even parks.\n\nThe ‘Endless City’ project would see a giant 300m skyscraper built with its own complete ecosystem featuring offices, shops and ‘huge’ parks. Residents would be able to walk around intertwining ramps in the interior of the giant building, passing through shopping, commercial and residential areas. The building would include many of the features that can be found in a city environment, such as public spaces, entertainment zones and shopping areas. Different areas of the building would be linked by a series of bridges and walkways helping to ‘increase exchanges, communications and interactions’ and the different levels will offer stunning views across London’s skyline.\n\nThe proposal has been drawn up by SURE Architecture, whose design has already won the SkyScrapers and SuperSkyScrapers Competition. The firm insists the building would be a great space-saver in dense cities which have previously spread outwards rather than upwards. The architects hope the project will encourage people to think about ‘vertical city designs’ that would, in the future, bring the feeling of a city inside a building, and residents would never have to leave.","task":"Your group is now discussing the ‘Endless City’ proposal. You may want to talk about:","points":["what other facilities should be included in the Endless City","the pros and cons of living in the Endless City","whether a similar proposal would be popular in Hong Kong","anything else you think is important"],"ir":["Do you like living in a high-rise building?","Do you think Hong Kong has too many tall buildings?","Which do you prefer: living in a quiet village or a busy city?","Would you like to live in a building you never had to leave?","Do you think it is important to have a nice view from your home?","What can be done to solve the problem of land shortage?","What are the pros and cons of having only high-rise buildings in a city?","Do you think that a city’s architecture reflects the culture of a city?"]},{"id":"2015-4.1","no":"4.1","label":"Online Writer Rises to Fame","intro":"Below is an extract from an article about an online writer:","title":"Online Writer Rises to Fame","text":"The Midnight After is a 2014 Hong Kong satirical horror comedy film directed by Fruit Chan and starring a wide cast of actors. The film is based on the web-novel, Lost on a Red Mini Bus to Taipo, by the 25-year-old Hong Kong writer nicknamed \"Mr. Pizza\", who first became famous on the Internet foram HKGolden.\n\nLost on a Red Mini Bus to Taipo is about a bunch of passengers who are lost in a parallel world — where the surroundings remain the same, yet all humans have disappeared. It was first serialized online from February to July 2012 and then published in book form in July 2012. Against all odds, the book, which contains adult themes and strong language, sold 30,000 copies at the Hong Kong Book Fair.\n\nPizza, who is a big fan of American writer Stephen King and the US television series Lost, decided to create his own sci-fi novel with a local touch. He wrote the novel using local slang to relate to the online community. The story became an instant hit and was one of the three bestsellers at the book fair.\n\nWhile Pizza welcomes feedback and criticism, some internet users left unreasonable and nasty comments. He admits that it took some time to get used to that aspect of writing online. He describes some of the hateful comments as \"like you are writing something in your room, but suddenly someone comes in and shouts at you in your face\".","task":"As members of the school magazine, you are preparing for an article on how to be an online writer. You may want to talk about:","points":["the advantages of writing online","the problems faced by online writers","whether there should be censorship of what is published online","anything else you think is important"],"ir":["Do you like reading online?","Have you read any online stories?","Haye you ever posted things you have written online?","Do you think people can write whatever they like on the internet?","Why do online stories appeal to young people?","Do you think online fiction will replace print fiction?","What do you think about posting online comments?","Should online fiction be free?"]},{"id":"2015-4.2","no":"4.2","label":"Recruiting firm specializes in Gen Y candidates","intro":"Below is some information regarding a survey about Generation Y in the workplace:","title":"Recruiting firm specializes in Gen Y candidates","text":"A recruiting firm called Jobfind specializes in recruiting Generation Y job seekers. Its mission is to find jobs for thousands of capable young people (young professionals aged 30 or under) who are very talented but often get overlooked by employers who only focus on grades and the number of extra-curricular activities that applicants have done.\n\nA survey was conducted to investigate how employers in Hong Kong felt about their Gen Y employees. Here are some major findings:\n\nQuestion 1. 59% of the employers said that they found it difficult to manage Gen Y staff because of the following: o Lack of loyalty\n\nUnrealistic job expectations\n\nImpatience\n\nNeed of constant attention\n\nLittle respect for authority\n\nQuestion 2. The employers took the following measures to make their workplace more attractive to their\n\nGen Y employees:\n\n© — Setting up mentorship or coaching programmes\n\no Encouraging own initiative and independent thinking\n\no Allowing flexible working hours and more work-life balance\n\no Adopting a more casual environment (e.g. wearing jeans and t-shirt or working from\n\nhome)\n\nThe survey also found that members of Gen Y are tech-savvy and know how to use social media to gain opportunities. These younger workers are also regarded as being the most \"enthusiastic\" about their jobs. On the down side, they are rarely considered as team players or hardworking at work.","task":"As members of the Careers Team, your group is designing a workshop for Gen Y school leavers. Discuss with your group what to include in the workshop. You may want to talk about:","points":["whether you agree with the description of Gen Y in Question","which measures taken by employers in Question 2 would be most popular with young employees","how to make the workshop interesting","anything else you think is important"],"ir":["Would you like to work for someone or for yourself?","Do you think wearing jeans to work is appropriate?","Do you think you would be a good employee?","What are the qualities of a good boss?","Do you think it is important to always follow the instructions of your boss?","If you did not agree with your boss’ decision, what would you do?","Do you share any of the characteristics of Gen Y?","Which is more important: job loyalty or better job prospects?"]},{"id":"2015-4.3","no":"4.3","label":"Extreme Study Tour: Antarctica","intro":"Below is an extract from a newspaper article about a study tour:","title":"Extreme Study Tour: Antarctica","text":"From December 2013 to January 2014, City University of Hong Kong sent a team of 23 undergraduates on a 3-week research expedition to Antarctica. Antarctica is one of the planet’s loneliest, coldest, most fragile and endangered landscapes. At its centre is the South Pole. The students —- who are from different departments — collected environmental and ecological data to turn into creative art forms.\n\n\"The Antarctica expedition enables creative artists, researchers and scientists to work together, interpreting environmental data into interesting visuals such as animation, gaming and film,\" said team leader Prof. Scott Hessels. \"This once-in-a-lifetime trip will offer new insights into a sustainable future and help the public better understand environment issues.\"\n\nSome activities that students did in Antarctica included tracking and measuring changes in the body temperature of penguins; studying life in Antarctica; examining physical properties of icebergs; and collecting sound recordings of Antarctic winds.\n\nStudents had to prepare themselves physically and take first-aid courses, as well as obtain all necessary equipment. Another challenge was to raise HK$30,000 funding per person, which was 40% of the full cost per person, with university and external sponsorships covering the rest of the expenses.\n\nAs the Student Committee of your school’s upcoming overseas study tour, your group is meeting to discuss","task":"the possibility of going to Antarctica. You may want to talk about:","points":["whether Antarctica would be a suitable location","what difficulties students could face if they went to Antarctica","how to choose students to join the study tour","anything else you think is important"],"ir":["Do you like study tours?","Would you enjoy travelling overseas with your classmates?","How would you feel if you were away from your family for three weeks?","What would your parents say if you wanted to go to Antarctica?","Would you want to go to Antarctica if funding was available?","Would you prefer a school tour that was educational or entertaining?","Should schools organize study tours to remote locations?","How would a study tour to Antarctica be beneficial to Hong Kong?"]},{"id":"2015-5.1","no":"5.1","label":"Compulsory military service","intro":"Below is a text about compulsory military service in Switzerland and South Korea:","title":"","text":"In around 40 countries in the world today, young people (usually men) are required to spend one or two years in compulsory military service. Switzerland and South Korea are two such countries.\n\nMilitary service in Switzerland\n\nIn 2013, 73% of Switzerland’s voters voted to keep the country’s compulsory military service. According to Swiss law, male citizens aged between 18 and 34 have to do four months of basic training in the army. About 20,000 men a year attend basic training as a soldier and must be ready for follow-up military training. Many young men complain that the months spent in the army are a waste of time, but older voters say this obligatory duty is the best way to defend the country. Some Swiss men refuse to fulfill their military duties and in this case they can choose to do non-military duties such as environmental projects or work with the elderly,\n\nMilitary service in South Korea\n\nIn South Korea military service lasts as long as two years. Unlike Switzerland, young men who are fit and healthy cannot choose to serve the community instead. Recently, however, the Korean media has highlighted a number of controversial cases involving celebrities who have taken measures to avoid compulsory military service. In 2002, Yoo Seung Jun, a Korean pop singer, became an American citizen to avoid his military duty. Another recent example is MC Mong, a popular singer-rapper accused of avoiding his military service in Korea by having several healthy back teeth removed.","task":"Your group has to prepare for a debate with the motion \"Compulsory military service is a good idea\". You may want to talk about:","points":["arguments in favour of compulsory military service","arguments against compulsory military service","whether it would be a good idea to introduce compulsory military service for women","anything else you think is important"],"ir":["Would you like to be a soldier?","Would you prefer to be a soldier or work with the elderly?","If you were a soldier, what would you miss most?","What kind of person do you think makes a good soldier?","Why do you think people in some countries volunteer to join the army?","If you had to join the military, which would you choose — the Army, the Navy or the Air Force?","Which is more beneficial for the individual — compulsory military service or compulsory social service?","Do you think anyone who refuses to do military service should be punished?"]},{"id":"2015-5.2","no":"5.2","label":"Meals on Wheels","intro":"Below is an extract from a column about robots in the service industry:","title":"Meals on Wheels","text":"Friendly and attentive waiters are a key ingredient in the running of a successful restaurant. Now more and more robots are replacing humans by providing a reliable waitressing service in Chinese restaurants and\n\nhotels.\n\nOne such new restaurant in Jiangsu Province, China, is staffed by 15 robots that not only carry food to a diner’s table, but help cook it too. The robots greet customers, deliver food and help with cooking in the kitchen and if they encounter a rude customer, there is no chance of them spitting in the food. Some of the robots can manage polite conversation, as well as greeting customers with 40 different phrases. Just like with humans, the energy-intensive job takes its toll on the robots, which are expected to offer between five and eight years’ service. Each one costs around HK$50,000.\n\nAnother robot restaurant serving dumplings and noodles cooked by robots was recently set up in Harbin, Heilongjiang Province. When a diner walks into this restaurant, an usher robot says, ‘Earth person hello. Welcome to the Robot Restaurant.’ There is even a singing robot to serenade diners.\n\nSimilar robots are also taking over small tasks in hotels. The Pengheng Space Capsules Hotel in Shenzhen has robotic receptionists and doormen as well as mechanical waiters. Because the robots are not paid a salary, a stay at the hotel is cheap at just HK$70 per night.","task":"Your group is planning to write an article for your school magazine about the benefits and problems of introducing robots into the service industry. You may want to talk about:","points":["advantages of using robots","reasons why people might be against using robots","other industries that could benefit from using robots","anything else you think is important"],"ir":["Would you like to work with robots?","Would you like to eat in a restaurant served by robots?","Do you think robots can replace teachers?","Do you think robots will replace people in most jobs?","Do you think robots could do any useful work in your secondary school?","In a restaurant, would you rather be served by a robot or a real person?","If you had a robot, what would you like it to do?","Do you think it is worth spending fifty-thousand dollars on a restaurant robot?"]},{"id":"2015-5.3","no":"5.3","label":"Top 15 essential items for everyday life","intro":"Below is an extract from a webpage about the top 15 most essential items for day-to-day living in Britain:","title":"","text":"The Internet/wi-fi 6. Mobile phone/smartphone 11, Book/eReader/Kindle 2. Bath/shower 7. Pet cat or dog 12. Comfy sofa or chair [ 3. TV 8. Washing machine 13. Make-up/cosmetics\n\n4. Laptop/tablet/iPad 9. Tea 14. Newspaper/magazine 5. Car 10. Coffee 15. Chocolate\n\nWhen I think about the basic necessities of everyday life, the top of my list is a warm shower with a fresh bar of soap! Unfortunately, in a new survey personal hygiene has fallen into second place behind the Internet, which has become more important to some people than having a bath, eating or seeing their\n\nfamily!\n\nA new survey asked 2000 people in Britain to name the most essential items for day-to-day life apart from food and shelter. Just under half of them (48%) said being able to use the Internet was more essential than seeing their family. About 51% reported that they could go longer without seeing their friends than using their mobile phone.\n\nOne researcher, Katie Lomas, said the findings show the extent to which technology now dominates most people’s essential daily routines. She said: \"What we believe to be essential is an extremely personal choice, and something that varies between individuals. For the average person, technology now dominates their list of essential daily comforts, perhaps because we are so reliant upon these items and enjoy the luxury of being connected.\"","task":"In your group discuss the most essential items for day-to-day living in Hong Kong. You may want to talk about:","points":["which items might be different from those in the British survey","how the order might be different in Hong Kong","how different generations might differ in their choices","anything else you think is important"],"ir":["What important things do you take to school?","How often do you use the Internet?","What are the three most essential items you carry with you?","How long could you go without using your mobile phone?","How long could you go without watching TV?","Do you think technology dominates your life?","Which could you go longer without — seeing your friends or using your mobile phone?","Is being connected to the Internet a luxury?"]},{"id":"2015-6.1","no":"6.1","label":"Youth Leadership Training Camps","intro":"Below is an extract from a leaflet about two leadership training camps:","title":"Youth Leadership Training Camps","text":"Youth Adventure _ Public Speaking for Effective Leadership Aims to develop: Aims to: * an ability to identify problems and plan solutions; ¢ enhance the leadership skills and public speaking e a fuller understanding of what different people skills of participants;\n\nbring to a team, and how to work together; « demonstrate to participants how public speaking e an ability to take better care of themselves. skills can be used by leaders to communicate\n\ntheir ideas to the public;\n\n¢ allow outstanding student leaders from secondary schools to serve and understand the local community.\n\nActivity Highlights:\n\n1. Raft Building:\n\nA great team building event for participants to work together to produce a strong raft. Our instructors will give\n\ntips along the way on using the most efficient knots and getting everybody involved. Participants will then test their raft out by sailing it on the water. 2. Public Speaking Contest: Each participant will give a 5-minute speech on a selected social problem in front of a panel of judges, all other participants and their proud parents. A question-and-answer session will follow after each speech.\n\nActivity Highlights:\n\n1. Dialogue with Leaders: Participants will have the opportunity to interact with several famous leaders in Hong Kong, who will share with participants their views on different local issues.\n\n2. Capture the Flag: Participants will be split into two teams and each team receives a flag which they must stick into the ground. They have to work together to capture the flag of the other team in order to win.","task":"As members of the Student Union, you are meeting to discuss which of the above camps should be chosen for this year’s Personal Development Programme. You may want to discuss:","points":["which of the above camps is more suitable for students","the criteria for selecting students to join the camp","what concerns about the camp need to be addressed","anything else you think is important"],"ir":["Do you like going to camps?","Have you ever participated in a training camp?","What qualities make a good leader?","Do you prefer indoor camps or outdoor camps?","Apart from training camps, in what other ways can an individual be developed?","Which do you prefer: to be a team member or a team leader?","Is leadership an essential skill in life?","Can leadership be trained?"]},{"id":"2015-6.2","no":"6.2","label":"WHAT IS UPCYCLING?","intro":"Below is an extract from a website about upcycling:","title":"WHAT IS UPCYCLING?","text":"Upcycling is the process of converting waste materials or useless products into new materials or products of better quality or for better environmental value. When you upcycle an item, you aren’t breaking down the materials. You may be refashioning it but it’s still made of the same materials as when you started. Also, the\n\nupcycled item is typically better or the same quality as the original.\n\nUpcycling is not a new concept. Some of the best examples of upcycling come from the 1930s and 40s when families had very little economic or material resources. During that time, people reused almost everything, repurposing items over and over until they were no longer useful: feed sacks became dresses or old doors became the new dining room table. What was old was new again, but with a twist.\n\nOne of the biggest reasons for the rebirth of upcycling is the positive impact on the environment. Items destined for the dump are rescued and remade into something useful. When you upcycle, you remove items from the global garbage stream. Upcycling instead of recycling is good too; recycling requires energy or water to break down materials. Upcycling only requires your own creativity and upcycled products can rival those found in high-end\n\ndepartment stores.\n\nExamples of items that can be upcycled are:\n\ne old tyres > chair\n\n¢ old t-shirts > cat tent\n\n° old books > lamp stand\n\na\n\nCat tent Book lamp stand\n\nChair","task":"Your school has decided to organize an upcycling campaign. As part of the campaign your group is going to upcycle one item shown in the three photos above. You may want to talk about:","points":["which item to upcycle and why","difficulties you may face","how to sell your upcycled product","anything else you think is important"],"ir":["Do you recycle things that you buy?","What do you do with your old clothes?","What do you do with your unwanted books?","How convenient is it for you to upcycle?","How successful is your school at upcycling?","How can we encourage people to upcycle more?","Do you think shops should sell upcycled products?","Do you think Hong Kong does enough to upcycle waste?"]},{"id":"2015-6.3","no":"6.3","label":"Girls and STEM subjects","intro":"Below is an article taken from the letters page of a local newspaper:","title":"","text":"A recent survey has shown that subjects like Science, Technology, Engineering and Maths ~ STEM for short — continue not to attract as many females as males. Hong _ Kong parents, for example, often discourage their daughters from pursuing STEM subjects. In Hong Kong universities, men still dominate these subjects. At the \" L)OJ Hong Kong University of Science and Technology women make up just 21% of Ore engineering students. A 2013 survey of 57 companies in Hong Kong showed that women represent fewer than 10% of IT staff at more than half the companies. In the US) by 2020 there will be 1.4 million jobs in computing fields, but women are likely to fill only 3% of those\n\njobs.\n\nGirls who show an early interest in STEM subjects often lose interest due to the male-dominated learning environment. A study from Britain shows that girls studying in single-sex schools are nearly 24 times more likely to study physics at A-level than if they had studied in mixed schools.\n\nWe should be showing young women that they can love science and maths. Without enough women in science and technology, we will not have the thinking skills and creative diversity for Hong Kong to\n\ncompete globally.","task":"Your group is meeting to discuss the number of girls and boys taking STEM subjects in Hong Kong in preparation for a meeting with parents and teachers. You may want to talk about:","points":["the reasons why fewer girls than boys are attracted to STEM subjects and STEM careers","what schools and universities can do to encourage more girls to study STEM subjects","how to persuade parents to let their daughters do STEM subjects","anything else you think is important"],"ir":["Do you like Maths?","Do you think science subjects are fun?","Do you think there are school subjects that girls like more than boys?","Did your parents encourage you to choose certain subjects at school?","Would you like to work in the technology industry?","Do you think boys and girls should go to separate schools?","Do you think all STEM subjects should be compulsory at school?","Do you think IT should be a compulsory subject for all forms?"]},{"id":"2015-7.1","no":"7.1","label":"Events organized by Dialogue Experience","intro":"Below is an extract from a Hong Kong company website called Dialogue Experience:","title":"Events organized by Dialogue Experience","text":"Dinner in the Dark Experience one of the most unique dinners you will ever have. In the dark restaurant you see absolutely nothing,\n\nnot even your hand in front of your face. Challenge yourself by guessing the food you are eating and have lots of fun as blind guides sitting at your table lead you through games and activities that sharpen your hearing and your sense of touch, smell and taste.\n\nPrice: HK$850\n\nSimulation in the Dark\n\nTake a cane and follow your blind guide by feeling your way into specially constructed dark rooms where sounds, smells, wind, water and temperature give you the sense that you are Qe\n\nactually outdoors in Hong Kong; in a park, on a ferry, in a market. However, the environment is so black that you can see absolutely nothing. Roles are reversed as the blind guides try to help you cope with their world of darkness. The tour lasts for one hour but the effects can last a lifetime.\n\nPrice: HK$75\n\nConcert in the Dark\n\nThe pitch dark journey begins as soon as you enter the venue, where blind ushers lead the audience to their seats. This year’s concert is called ‘The Sound of Colours’ and features some well-known Canto-pop stars who interact with and move among the audience. Impressive sound effects and other creative uses of the darkness take the audience on a journey of the senses.\n\nPrice: HK$480","task":"As part of your Other Learning Experiences, the school wants to take part in one of the above events organized by Dialogue Experience. In your group, discuss which event would be the most suitable for your class. You may want to talk about:","points":["the benefits of each of the events","further details you would like to know about each","which event you would choose","anything else you think is important"],"ir":["Do you like being in the dark?","Were you frightened of the dark when you were a child?","What difficulties do you think blind people face?","Would you like to hold your birthday party in the dark?","If you were blind for a day, what would you find difficult to do?","What do you think your school can do to help people who are unable to see?","What challenges do you think blind people have when learning?","Do you think a museum in the dark would be popular in Hong Kong?"]},{"id":"2015-7.2","no":"7.2","label":"HK Open Photo Contest 2015","intro":"Below is an extract from a webpage advertising a local photo competition:","title":"HK Open Photo Contest 2015","text":"Photography is an art form, a powerful means of communication and visual expression arousing great emotions and civic debate, and one which may even lead to social change.\n\nThe HK Open Photo Contest is open to all secondary school students. The competition intends to encourage discussion and social responsibility on important issues in Hong Kong through photography. To extend this dialogue, a photo library will be set up online where the winning images (under a Creative Commons license) can be used for lectures, workshops, school talks and other non-commercial projects. They will also represent a photographic history of modern-day Hong Kong.\n\nSchools may choose one of the following three themes:\n\n- Poverty in Hong Kong - Beauty and Ugliness - Disappearing Wildlife\n\nTo enter the contest, participants can visit: www.openphotocontest.hk and register with their Facebook account. Each participant can upload a maximum of 10 photos. Each photo must have a title. The organisers of the Contest will pick out the finalists and the winners will be selected by public vote. The winner, first runner-up and second runner-up will receive HK$20,000, HK$10,000 and HK$5,000 respectively as well as competition trophies.\n\nWhat the judges are looking for: focused theme, creativity, technique, layout and potential for discussion.","task":"Your school wants to enter the HK Open Photo Contest. Discuss the competition with your group. You may want to talk about:","points":["the benefits of taking part in the competition","which theme you would recommend to your school","what sort of things you could take photos of","anything else you think is important"],"ir":["Do you like taking photos?","Have you ever entered a competition before?","What kinds of photos do you enjoy looking at?","Do you prefer taking photos of people or places?","Do you think photography should be taught in school?","Why do people take photos?","What do you think of black and white photography?","What skills do you think a good photographer needs?"]},{"id":"2015-7.3","no":"7.3","label":"Student of the Year Awards","intro":"Below is an article about the 2014 winner of the Student of the Year Awards:","title":"","text":"The South China Morning Post and The Hong Kong Jockey Club are proud sponsors of the Student of the Year Awards. The Awards reward the achievements of senior-level students in seven categories, aiming to recognise and encourage Hong Kong's young leaders of tomorrow.\n\nTam Pok-man was named the first grand prize winner of the competition in 2014. Judges praised Pok-man's humble attitude, enthusiasm and his outstanding academic achievements, especially in the field of physics.\n\nPok-man, 17, is a Form Six student. He was nominated by teachers as an outstanding student, who excels not only in the classroom — both in sciences and the arts — but also on the sports field, as a musician, and as\n\nan ambassador for the environment and a keen volunteer.\n\nPok-man has a true passion for physics. He has represented Hong Kong in international competitions, winning a silver medal in the 44th International Physics Olympiad, a bronze medal in the 14th Asian Physics Olympiad, and was the first runner-up in the 30th Hong Kong Mathematics Olympiad.\n\nHe has also won awards outside of his main area of interest: a certificate of outstanding achievement in the Bible speaking category of the 64th Hong Kong Schools Speech Festival; a silver award in the Hong Kong\n\nCreative Poster Contest.\n\nPok-man is also dedicated to community services, and has been a committee member of Hong Kong Green\n\nYouth Music Interflows 2012; and the Creative Poster award in the 16th Wu Chien Shing Science Camp\n\nYouth Ambassador since 2012.","task":"As members of the School Magazine, you are going to interview Tam Pok-man for an article on how to make the most of secondary school life. You may want to talk about:","points":["what students can learn from Pok-man","other aspects of his life you would like to find out about","how to make the article more interesting","anything else you think is important"],"ir":["Do you enjoy your school life?","Do you like taking part in competitions?","Is having an extra-curricular activity a good or bad thing for students?","Do you think having an interest in a subject is important?","Which do you spend more time on: your studies or extra-curricular activities?","Would you like to be friends with someone like Pok-man?","Should Form Six students be banned from extra-curricular activities?","Are awards important to you?"]},{"id":"2015-8.1","no":"8.1","label":"Celebrity Justice: Does Punishment Fit the Crime?","intro":"Below is an extract from an online newspaper:","title":"Celebrity Justice: Does Punishment Fit the Crime?","text":"If you're driving around New York City and see a street sweeper who looks an awful lot like the famous international singer Boy George, don’t worry, you're not going crazy.\n\nThe singer was found guilty of drug possession and will start his five days of community service on Monday.\n\n\"No special treatment,\" said a Times Square sanitation worker. \"A broom, a dustpan, and work to be done.\"\n\nFrom drugs to drink driving charges, the list of criminal celebrities is long. But many believe their punishments don't always match the crime.\n\n\"Celebrities have a huge advantage over the average person,\" said Harvey Levin, managing editor of the entertainment news website TMZ.com. \"Juries are comprised of television watchers, moviegoers, people who listen to music, and they tend to show a lot of goodwill towards celebrities.\"\n\nHowever, many A-listers do have good records when it comes to bouncing back from a crime. Actress Winona Ryder was arrested on shoplifting charges and accused of stealing US$5,500 worth of designer clothes and accessories at a famous department store. In 2002, she was sentenced to 480 hours of community service, US$3,700 in fines, US$6,355 in repayment to the department store and ordered to attend psychological and\n\ndrug counseling.\n\nTwo years later, a judge reduced her crimes to misdemeanors (lesser charges) after she completed her 480 hours of community service. She has since gone on to star in more than 20 films.","task":"As members of the Liberal Studies Society, your group is discussing celebrity and crime. You may want to talk about:","points":["whether you agree with the punishments given to celebrities","why famous people who commit a crime are sometimes treated differently","whether you would still support a celebrity even after he or she has committed a crime","anything else you think is important"],"ir":["Do you have a favourite pop star?","Which famous person is a good role model?","Is having an idol a good or bad thing for teenagers?","Why do some people worship celebrities?","What would you say to your friends if they wanted to be a celebrity?","Should celebrities be given stricter penalties if they break the law?","Do you think celebrities should be well-behaved all the time?","Does fame make a celebrity a better person?"]},{"id":"2015-8.2","no":"8.2","label":"Children should start school at six","intro":"Below is a newspaper article about schooling:","title":"Children should start school at six","text":"Pupils should not receive full classroom tuition until the age of six, according to a leading academic. Dr Richard House, senior lecturer at Roehampton University, said pupils, especially those from relatively well-off backgrounds, suffered the most from being pushed \"too far, too fast\". He said that students can benefit from being slowed down in the early years, allowing them to develop naturally.\n\nHe warned that if kids are pushed into formal schooling from a very young age, there is a higher chance for them to suffer lifelong negative health effects and even premature death. He added: \"Most children under the age of six need lots of time to play, and to develop social skills, and to learn to control their impulses. An over-emphasis on formal classroom instruction, staying in instead of playing outside, can have serious effects that might not surface until years later.\"\n\nThe conclusions follow a research study that found that starting late \"appears to have no adverse effect on children’s progress\". Dr House, however, admitted that early schooling may be beneficial to children with poor family backgrounds. \"There are of course some children from very deprived backgrounds who in general would, and certainly do, gain a net benefit from starting school early,\" he said. \"But the evidence is now quite overwhelming that such an early introduction to formal schooling is quite unnecessary for the majority of children, and even worse, this can actually cause major developmental harm, and at worst a\n\nshortened life-span.\"","task":"You are preparing for a debate with the motion \"Starting formal schooling before the age of six does more harm than good to children\". Discuss with your group what to include in this debate. You may want to talk about:","points":["arguments for the motion","arguments against the motion","which side you would prefer to take","anything else you think is important"],"ir":["Did you like being a student at primary school?","What skills should young children learn?","Do you think children like going to school before the age of six?","Do you agree that playing is more important than studying for young children?","What are your memories of your first year of attending school?","Why do some Hong Kong parents send their children to school at a very young age?","Do you think an early start to school is important for success later in life?","SAD YH BwYwN Who should decide when children should go to school: parents or the government?"]},{"id":"2015-8.3","no":"8.3","label":"Snakes in Hong Kong","intro":"Below is an extract about snakes from a Hong Kong magazine","title":"","text":"William Sargent, a Lantau Island resident, has had a fascination with snakes since he was twelve and he has caught and photographed thousands of Hong Kong’s 55 snake species.\n\nFear Contrary to common belief, Sargent insists that snakes are not aggressive and that the general lack of\n\nknowledge about snakes has led to much fear. Having said that, dozens of people are bitten by venomous snakes every year. Common reasons for snake bite incidents include:\n\n° Walking through overgrown trails\n\n° Walking on a dimly lit trail and stepping on an unseen snake\n\n° Finding a snake and trying to kill it or pick it up\n\nEducation, not fear Instead of fearing snakes, Sargent suggests that we should try to see them as part of the ecosystem just like\n\nany other creature. People need to learn more about them, he says, through online research and books or even speaking to people who have snakes as pets.\n\nSargent says, \"I take visitors out in the field to photograph snakes. I train them how to look for snakes and how to get the best photos. Very quickly the reaction goes from ‘Arrgh!’ to ‘Wow, that’s a fascinating creature, I didn’t know that’ and ‘Can I go with you again?\" So the next time you see a snake, remain calm, give it space, grab your camera and feel lucky that you have seen a fascinating creature that’s just\n\ngetting on with its day.","task":"Your group is meeting to discuss whether to a) invite students to go on one of William Sargent’s photography field trips or b) invite him to your school to talk about Hong Kong’s snakes. You may want to talk about:","points":["which activity you prefer and why","how you would promote your chosen activity in your school","questions to ask William Sargent","anything else you think is important"],"ir":["Are you afraid of snakes?","Have you ever seen a snake in Hong Kong?","Would you like a snake as a pet?","What would you do if you saw a snake?","Do you think students learn more from field trips or talks?","Do you think snakes would be difficult to photograph?","Do you think Hong Kong’s wildlife should be part of the school curriculum?","Is a fear of snakes something people are born with or something they learn?"]},{"id":"2015-9.1","no":"9.1","label":"YouTube stars","intro":"Below is an extract from an article about YouTube stars:","title":"","text":"YouTube personalities, often referred to as YouTubers, are people who are popular because of their videos on YouTube. Recently, these video stars have drawn crowds of adoring admirers at Fan Events in Asia.\n\nMichael Stevens wows audiences with his endless knowledge of fun scientific facts. 3.2 million people tune in to hear his answers to questions like \"What colour is a mirror?\" or \"What if every person in the world jumped at\n\nonce?\" Simon and Martina Stawski became YouTube celebrities through their video channel \"Eat Your Kimchi\". Each of their videos captures a realistic picture of life in South Korea and answers questions about the culture, music and food of the country from a foreigner’s point of view.\n\nMota, 18, is a YouTube star from California who now has her own clothing brand. At 13, she started making videos in her bedroom talking about the clothes and make-up she liked to wear and soon gained six million followers. With the fans came the brands, which started sending her free products in the hope that she would\n\nmention them in her videos.\n\nJenna Marbles has the 7th most subscribed channel on YouTube and the top channel operated by a woman. Marbles’ videos focus on relationships between people. Her 2010 video \"How To Trick People Into Thinking You're Good Looking\" had over 5.3 million views in its first week. Her video \"How To Avoid Talking To People You Don’t Want To Talk To\" had approximately 34 million views as of April 2015.","task":"Your group is going to invite one of the YouTube stars above to give a talk at your school. Decide which star you would like to invite. You may want to talk about:","points":["the pros and cons of each choice","what you would like the YouTube star to talk about","any other activities that can be included in the visit","anything else you think is important"],"ir":["Do you and your friends watch YouTube videos?","What kind of YouTube videos are popular in Hong Kong?","Do you think young people waste too much time watching YouTube videos?","Why do you think YouTube stars are so popular?","Do you think YouTube is educational?","What videos would you make on YouTube?","Do you think YouTube will become more popular than television one day?","Why do you think many teenagers prefer YouTube stars to movie stars?"]},{"id":"2015-9.2","no":"9.2","label":"Standing desks","intro":"Below is an extract from a website advertising standing desks:","title":"Standing desks","text":"It seems the world is finally realising that humans evolved to stand, not to sit. The evidence is mounting to show that spending too much time sitting at work, during your commute and for leisure increases your risk of several diseases and early death. Unfortunately for us, technological advances and design experts have made sitting more comfortable. Australian adults, for example, now sit for an average of nearly nine hours a day, which is longer than most people spend sleeping. a\n\nSo, could it be time to buy a standing desk?\n\nMany people know when they’ve been sitting too long, because their back or neck gets sore, But it’s what you can’t feel or see that you may need to be concerned about. Canadian researcher, Dr Katzmarzyk, found that those who sit for long periods of time during the day have nearly a one-third higher risk of early death than those who stand a lot.\n\nOur message is to stand up, sit less and move more. Alternating between sitting and standing increases muscular movement, stimulates blood flow and results in more calories burnt and healthier blood sugar levels. Recent findings show that alternating Standing desk between 30 minutes of sitting and standing can improve blood sugar levels,\n\nparticularly after a meal.\n\nNow, if you’re thinking about getting a standing desk, but are concerned about your concentration and productivity, there’s some good news. Research shows task performance such as typing, reading and\n\nperforming cognitive tests is largely unaffected by standing desks.","task":"Your group is preparing a presentation to introduce standing desks to your classmates. You may want to talk about:","points":["advantages of standing desks","disadvantages of standing desks","how to make the presentation interesting","anything else you think is important"],"ir":["Would you like to have a standing desk?","When you aren’t at school, do you spend long periods of time sitting down?","Do you think you spend too much time sitting down in your life?","Would you prefer a job that involves mostly sitting or standing?","Do you think the concept of a standing restaurant would work in Hong Kong?","Do you think it is better to sit or stand at a music concert?","Do you think it is a good idea that people stand up in meetings at work?","Do you agree that your concentration would not be affected if you were working at a standing desk?"]},{"id":"2015-9.3","no":"9.3","label":"Adopt-A-Grandparent","intro":"Below is an extract from an Australian website about a primary school programme called","title":"Adopt-A-Grandparent","text":"About Adopt-A-Grandparent\n\nThe Australian Adopt-A-Grandparent programme is supported by people who have family spread around fact some of our children don’t have any grandparents at all.\n\nThose families who don’t have grandparents around find that their children lack the presence of an older role model and often don’t know how to relate to and communicate with our older generation. The real shame is that our older generation has so much to offer children by way of skills, knowledge and nurturing.\n\nWhat is The Adopt-A-Grandparent Programme?\n\nPrimary schools invite senior volunteers to come to the school and spend time with the children. They read to them, get involved in creative activities, crafts, and play music, Some seniors might tell their story about how things were when they were a kid, something the children love to hear about.\n\nDepending on the scheduling system in each school, seniors can volunteer once a month, once a fortnight, or even more frequently. It is totally up to them to express their preference to the school.\n\nGrandparent/Senior Volunteers Schools invite the grandparents of the children who attend the school to volunteer on a regular basis.\n\nAlternatively, senior communities in the area of the schoo] can be approached and invited to participate.","task":"Your group is meeting to discuss whether it would be a good idea to start an Adopt-A-Grandparent programme at your schoo]. You may want to talk about:","points":["what the grandparents could do and why","the benefits of such a programme for the students and the school","how you might organize the programme","anything else you think is important"],"ir":["Do you like to spend time with old people?","Do you have a favourite older relative?","What do your older family members do that makes you happy?","What things can you learn from your older family members?","Do you think older people make better teachers?","Do you think older people can still contribute to society?","Do you think that young people are losing touch with the older generation?","When your grandparents were young, how different were their lives from yours?"]}]},{"id":"2016","year":"2016","label":"2016 DSE","tasks":[{"id":"2016-1.1","no":"1.1","label":"Life on HK$4 a day an eye-opener for Hong Kong students","intro":"This article appeared in a newspaper in Hong Kong:","title":"Life on HK$4 a day an eye-opener for Hong Kong students","text":"Cebu in the Philippines is best known to Hongkongers as a paradise for holidaymakers. But not far from the resorts that line the beach, hundreds of families live in hopeless poverty; their \"real world\" means trying to\n\nlive on HK$4 a day.\n\n‘An international school in Hong Kong took a group of 65 students to Cebu on a one week trip to work with disadvantaged people in the Philippines. The high school students, accompanied by 20 adults, each paid HK$5000 for the trip, which included flight, accommodation, transport and meals.\n\nThe first three days were spent sightseeing, snorkelling and other beach activities. The next four days were spent supporting local teachers in the classroom teaching English, maths and science. The students also helped in sustainable projects such as building houses, painting a school and serving nutritious food to children in slum communities.\n\nAfter the experience, one of the students said, \"I had a really great time in Cebu but it was sad to see people living in poverty. We were only there for a short time and I think we were helpful. But, I wonder if we\n\nreally make a difference in the long term.\"\n\nOne of the teachers says visiting these communities in the Philippines enables Hong Kong students to see that they live very privileged lives. They also see that the children in the Philippines are similar to them, even though their circumstances are different.","task":"Your group is discussing the kinds of charity work your school could be involved in. You may want to talk about:","points":["the benefits of students doing charity work outside Hong Kong","the concerns of doing charity work outside Hong Kong","whether charity work outside Hong Kong should be a requirement at secondary school","anything else you think is important"],"ir":["Have you done any charity work?","Would you prefer to do charity work locally or outside Hong Kong?","Do you think it’s important to give money to charity?","Which is more important: to give money or your time?","Do you think it is necessary to leave Hong Kong to do charity work?","Should students have to pay to do charity work outside Hong Kong?","Do you think charity work can make a difference?","Who benefits more from charity work outside Hong Kong: the volunteers or the locals?"]},{"id":"2016-1.2","no":"1.2","label":"Space-saving gesture","intro":"Below is an article taken from the business section of a Hong Kong newspaper:","title":"Space-saving gesture","text":"Hong Kong apartments are well-known for being tiny — the average is only 450 square feet. Frustrated at the lack of space, brothers Stuart and Lewis Cerne, came up with the idea of Spacebox — an available and ready-to-use storage solution. It works very much like calling up your favourite tune on your smartphone.\n\n\"My wife and I have been living in a 400-square foot apartment for some time,\" Lewis said. \"With space very tight and moving home not a feasible option, we realised that homes in Hong Kong are not at all equipped to cater for the amount of belongings people own. With my brother, we conceived the idea of creating an on-demand storage solutions business to take the stress out of decluttering the home with an easy web application.\"\n\nWith the click of a button, storage crates can be delivered at any location at a time convenient to you. The boxes can store anything from clothes to memorabilia and household items, and when you have finished packing, the Spacebox team will collect them and store them safely. All the items are recorded on an inventory manager, available on mobile phones. If you need anything back, you can access Spacebox anytime and they can deliver it either on the day itself or the next day at the latest. The service starts from HK$49 per month and each box is insured for up to HK$2,000.","task":"As members of an extra-curricular course called ‘Starting your own Business’, your group has been asked to decide whether it would be worthwhile starting a similar business to Spacebox. You may want to talk about:","points":["whether Spacebox is a good business idea","ways the business idea could be improved","different ways to advertise your business","anything else you think is important"],"ir":["What items would you put inside your Spacebox?","What do you do with belongings you no longer need?","Do you think you keep too many things you no longer need?","What problems are caused by a lack of space in Hong Kong?","How do you try to create more space in your home?","How could flats in Hong Kong be designed to have more storage space?","What space-saving tips would you give to a person moving to a flat in Hong Kong?","Is having fewer possessions the way to a happier life?"]},{"id":"2016-1.3","no":"1.3","label":"The Magic of Outdoor Play","intro":"Below is an extract from a local English language newspaper:","title":"The Magic of Outdoor Play","text":"In Tai Po Kau Nature Reserve, teacher Danie Smith and a few children use the slippery face of a large river rock as a slide. Just a few metres away, another group of children carefully build, branch by branch, pebble by pebble, a riverbank shelter.\n\nWelcome to Hong Kong Forest Kindergarten. It’s among several nature-based schools that have emerged in the city, operating without classrooms or uniforms. While most kindergartens in Hong Kong adopt an academic approach, a few educators are promoting the power of outdoor play, exploration and nature during this critical period in a child’s development. Smith’s playschool explores countryside destinations from Tai Tong Eco Park in Yuen Long to Lions Nature Education Centre in Sai Kung.\n\n\"The children love it when they enter the forest. I am astonished every day at how creative and comfortable they are in nature. I call it the magic of play,\" says Smith, who supports unstructured play, which allows children to improvise and to learn how to interact with each other.\n\n\"The children might return from their outing, clothes dirty and tired out from the running around, but they’ll be more confident and independent than they were in the morning,\" he says. \"At school, children are expected to follow rules, sit still and listen to teachers. They would be punished for running or shouting. There aren’t enough ways to channel their natural energy and creativity. At our forest school, we let children be children.\"","task":"Your group is planning to write an essay in class about whether learning through play should be a regular part of education in Hong Kong schools. You may want to talk about:","points":["games that you played when you were younger","the advantages and disadvantages of allowing children to play at school","whether learning through play should be a regular part of a child’s education","anything else you think is important"],"ir":["Do you do any outdoor activities?","Do you think Hong Kong children can find places to play easily?","What toys did you like to play with when you were very young?","Do you like to go outdoors and explore nature?","Do you think it’s fun to get dirty who playing?","Should the Government provide more indoor playrooms for children?","If you were in charge of a kindergarten class, where would you take the children for the day?","Do you think playing video games is as educational as playing outdoors?"]},{"id":"2016-2.1","no":"2.1","label":"Easy Money for Phone Scammers","intro":"Below is a newspaper article about phone scams in Hong Kong:","title":"Easy Money for Phone Scammers","text":"The risk of being cheated by strangers calling your mobile phone has very quickly overtaken the typical internet fraud where dishonest characters send emergency help messages to friends of hacked e-mail account owners, claiming financial hardship while travelling and asking for cash deposits.\n\n\"Every day, at least someone tries to scam me, usually more than once a day.\" This quote from an American businessman and best-selling author is likely to reflect the feelings of many in Hong Kong these days,\n\nEven with crime-prevention posters displayed clearly in lift lobbies and high-profile press conferences warning the public against giving their personal data to strangers pretending to be postmen, bank tellers, or public security officials, people continue to be fooled by such common scams. Tricksters make more than HK$85 million from these types of calls alone.\n\nThe widespread use of mobile devices for payment and harmful computer programs and phone apps account for the high success of such crimes. The tricksters will continue to apply the latest technology and invent new scenarios to exploit the victims’ psychological weaknesses.\n\nTo guard against these traps, avoid clicking on any link that claims to carry bizarre information, such as instruction before you have established his/her identity. Hang up and call the respective organization to double-check.","task":"Your group is going to give a presentation to your school about how to avoid different kinds of scams. Discuss with your group what to include in your talk. You may want to talk about:","points":["the different types of scams","possible victims of scams","how to avoid being a victim of scams","anything else you think is important"],"ir":["_ Is it safe to store personal information on a phone?","Have you ever received an unwanted phone call?","Have you or someone you know ever been tricked?","Do you think scamming is a very serious crime?","Do you think there is an increasing trend of people being scammed in Hong Kong?","Do you think enough has been done to educate the public about the dangers of scams?","Ifa friend emailed you to ask for help and money, what would you do?","Se Nah ALY Do you think people who lie always do it to harm others?"]},{"id":"2016-2.2","no":"2.2","label":"Hong Kong’s New Street Artist","intro":"Below is an extract from a newspaper about a popular Hong Kong street artist:","title":"Hong Kong’s New Street Artist","text":"In 2015 self-taught street artist Bao Ho won the Hong Kong Secret Walls art competition and is now making a living from her art — not bad for someone who has s only been in the business a year. Polite and softly spoken, the 27-year-old Hongkonger is modest about her win and says she has got much to learn. But beneath the playful smile — like the ones she gives her \"Bao\" characters — she has a fiery determination. She didn’t prepare for the final of Secret Walls — in front of a live audience — preferring to freestyle.\n\n\"I was really angry that day — I was annoyed by something one of my clients said which was rude — so I made use of that emotion,\" says Ho.\n\nFortunately, most of the time Ho is a happy soul and her amusing paintings occupy some key wall space in Aberdeen, Central and Sheung Wan. One restaurant owner loved her work so much that he invited Ho to paint a mural outside his new cafe in Sheung Wan.\n\nHo has a very individual style. Her black and white murals are a striking graphic mix of human bodies, animals, flowers and patterns with the addition of perhaps one colour. Depending on the size, she charges HK$10,000 to HK$15,000 for one mural.\n\n\"A blank wall in a shop is so boring. A cool artwork is a talking point. It changes the feel of the space and makes it more relaxed and friendly,\" says Ho.","task":"It is the 50\" anniversary of the founding of your school and Bao Ho has been invited to paint a mural for the school. You are discussing plans for the Open Day celebration. You may want to talk about:","points":["images Bao Ho should include in her painting","an appropriate location for the painting","how Bao Ho might help the school celebrate the Open Day","anything else you think is important"],"ir":["I Can you draw well?","Do you think you are creative?","Do you think art should be a compulsory subject at secondary school?","Would your parents encourage you to be an artist?","Do you think street art is popular in Hong Kong?","Do you think Bao Ho’s success will be short-lived?","Fa Why are artistic skills often seen as less important compared to academic skills?","Do you think art in the East is very different from art in the West?"]},{"id":"2016-2.3","no":"2.3","label":"Should young adults still live with their parents?","intro":"This text appeared in the opinions section of a Hong Kong newspaper:","title":"Should young adults still live with their parents?","text":"Miss Hong Kong was very honest in an interview when she said, \"If you don’t even have your own space, how can you talk about dreams and aspirations?\" She was making reference to the fact that she can’t afford to move out of her parents’ home, thanks to the city’s expensive property prices.\n\nMiss Hong Kong is voicing out what typical 20-something Hong Kong young adults feel about living with their parents. I know how she feels. thought people are supposed to become independent in their 20s, but living at home largely prevents you from doing so.\n\nMy friends in the same situation often talk about how much they want independence, to be away from the watchful eyes of their families. It’s not that we aren’t allowed to do as we please, it’s just that we can never feel completely comfortable. From small things, like being asked what time you'll be home, to what a friend describes as \"invisible powers dictating what you can and can’t do\". At the end of the day, it all comes down to being careful of what I do out of respect for my elders.\n\nI wish I could make my family understand that staying out all night, not having meals at home and turning my room into a private sanctuary are not signs of disrespect to them. They are actions born out of a longing for my own space.\n\nZac, 24 yrs old","task":"Your group is discussing the idea of living at home with your parents when you are in your 20s. You may want to talk about:","points":["the benefits of living at home with your parents","the disadvantages of living at home with your parents","other ways young adults can be independent while living with their parents","anything else you think is important"],"ir":["When you start working, do you want to live with your parents?","If you moved out, would you prefer to live alone or with friends?","How would you feel if you moved out?","At what age do you ilink a person should live on their own?","Do you think parents want their children to live with them?","Are girls more likely to live with their parents than boys?","Why do more young adults want to live on their own?","Is living with parents a tradition in Hong Kong?"]},{"id":"2016-3.1","no":"3.1","label":"Must-Have Apps for Successful High School Students","intro":"This article appeared in an American education magazine:","title":"Must-Have Apps for Successful High School Students","text":"The following are four educational computer software applications:\n\n1. Maths Formulae\n\nCan’t remember maths formulae? This app is your maths saviour. It stores frequently used formulae for easy access and lets you bookmark the apps you reference the most. It even delves into calculus, geometry and probability, and displays images so you can put the formulae into perspective. It only costs HK$8.00.\n\n2. Language Essentials\n\nLearning a foreign language is a core part of the high school curriculum. Whether you’ve enrolled in French, English, Korean or Chinese, this app will be your study guide. It provides flashcards for learning vocab and audio quizzes to help your speech and pronunciation. Plus, it’s free.\n\n3. Studious\n\nInstead of organising your daily class schedule and homework assignments in a planner, turn to Studious to keep you on track. The app lets you set due dates for assignments and will remind you when big exams are approaching. Forget to silence your phone before class? The app will silence your phone during times you’ve scheduled on your calendar. It’s available for free in the Google Play Store.\n\n4. Mice Dissection\n\nSlicing open a mouse in biology class is fun for some, but for others, it can be messy and uncomfortable. This app will show you the ins and outs of an animal’s anatomy without getting your hands dirty. Vivid 3D imaging also lets you study detailed internal organs. It’s HK$32.00, but worth it if you prefer to stay animal-friendly.","task":"You are members of the Computer Club and your group is discussing apps to buy for the school’s computer tablets. You may want to talk about:","points":["which of the four apps above is the most useful for students","what other kinds of educational apps Hong Kong students may need","whether there are any disadvantages of using apps for schoolwork","anything else you think is important"],"ir":["Do you use any apps to help you study?","Does your teacher use apps in the classroom?","Do you think educational apps should be free to students?","Would you like to design an educational app?","Do you think educational apps will be more or less popular in the future?","Which subjects most benefit from the use of apps?","Why would some students not want to use apps for learning?","Do students who use educational apps at school have an unfair advantage?"]},{"id":"2016-3.2","no":"3.2","label":"Surge in Complaints against Hong Kong Taxi Drivers","intro":"Below is a newspaper article:","title":"Surge in Complaints against Hong Kong Taxi Drivers","text":"New official figures reveal a dramatic rise in passenger complaints against drivers of the city’s 18,000-strong traditional taxis. Among the top complaints were taxi drivers refusing a hire, overcharging and not taking the most direct route. The traditional taxi industry has admitted it is failing to serve customers properly, as dissatisfied customers turn to alternative private car services such as Uber.\n\nSince 2003 when the Transport Complaints Unit started compiling figures on taxi services, the total number of complaints has topped 93,728. The true complaint figures are likely to be far higher. In 2014, complaints topped 10,060, accounting for almost 50 per cent of the unit’s complaints across public transport services.\n\n\"Taxi driver misconduct has spread into many areas, which is why there. is public demand for online hire-car services like Uber,\" said Michael Tien, Legco’s Transport panel chairman. \"If you think about what Uber is offering, it is directly focusing on these complaint areas.\"\n\nReferring to the increasingly bad reputation of taxi drivers, Eddie Wong Chung-keung, former chairman of the Hong Kong Taxi and Public Light Bus Association, said: \"It’s a reality. We even complain about the taxi drivers ourselves.\"","task":"As part of a unit on Hong Kong tourism in your English Language class, your group has been asked to discuss the image of Hong Kong taxi drivers and to suggest ways to improve this image. You may want to talk about:","points":["reasons for the dramatic rise in complaints","possible steps to improve the behaviour of taxi drivers","ways to promote Hong Kong taxis to tourists","anything else you think is important"],"ir":["How often do you take a taxi in Hong Kong?","What is your favourite type of public transport?","Have you or your family ever had a bad experience ina taxi?","What would you do if a taxi driver charged you too much?","What do you think should be done to penalise taxi drivers who receive complaints?","Would you ever use Uber in Hong Kong?","# Do you think Uber means the end for traditional Hong Kong taxis?","Do you think online hire-car services should be allowed in Hong Kong?"]},{"id":"2016-3.3","no":"3.3","label":"Shoot or Protect?","intro":"Below is a text about wild boars in Hong Kong:","title":"Shoot or Protect?","text":"Living in the steep hills that rise from Hong Kong’s densely populated neighborhoods are hundreds, or perhaps thousands, of wild boars. As the city gets bigger and the boar population increases, these creatures appear to be spending more time out of the woods and causing panic on the streets.\n\nOn a Sunday in May, a wild boar got into the Paradise Mall in the city’s Chai Wan district, walked into a children’s clothing store and scared off the two shop assistants. The small female boar climbed up into, and then crashed through, the store’s ceiling. Earlier in the day on the other side of town, another wild boar was captured in a public park after taking a swim in a lake.\n\nTwo opposing solutions have emerged about how to deal with this problem. The Sai Kung Wild Pig Hunting Club proposes, simply, to shoot the animals. \"They are wild animals and not pets\", says Chan Kang, the 4] 72-year-old factory owner who leads the hunting club. \"Boars are fierce. They can weigh up to 200 kilos and can give birth up to three times a year.\" The Hong Kong Wild Boar Concern Group, meanwhile, argues that the creatures are cute. Its members hand out pamphlets that feature drawings of adorable, furry boars and they urge residents to keep calm when they meet a wild boar, not to call the police and to enjoy the ‘special encounter’,","task":"Your group has to prepare a debate with the motion \"Wild animals should be protected and not shot\". You may want to talk about:","points":["arguments for the motion","arguments against the motion","which side would be easier to argue","anything else you think is important"],"ir":["Do you think wild boars are ugly or cute?","Would you like a wild boar as a pet?","What other wild animals cause problems in Hong Kong?","Ifa wild boar approached you, what would you do?","Do you think it is cruel to short wld animals?","In your opinion, should wild boars be protected in Hong Kong?","Is the advice not to call the police when you meet a wild boar sensible?","Why do you think hunting is a popular sport?"]},{"id":"2016-4.1","no":"4.1","label":"Schools replace History and Geography with Computer Programming","intro":"This article appeared in a newspaper in Australia:","title":"Schools replace History and Geography with Computer Programming","text":"The Australian Federal Government recently decided to replace history and geography as compulsory subjects in secondary school and bring in computer programming classes instead. This wil! see students from as young as Primary 5 learning about how a computer works and how to write their own computer programs. Computer classes in school used to be about learning how to use MS Word and Excel — now it’s looking at the world like an engineer — developing logical thinking and creativity.\n\nThe move makes sense given how much technology is in our lives and practically every job requires you to demonstrate some kind of computer skills. Equipping children with advanced computer skills early on in life could help them secure a bright future in a world which is becoming more high tech. This is something that other countries like the US and UK are already doing.\n\nHowever, some people think that teaching children history and geography is equally important, Studying history teaches children to learn from the mistakes people made in the past, which will help them to develop sound decision-making and judgement skills. Likewise, studying geography helps us to understand the connectivity between people and places and to appreciate the Earth as the home that we all share. It can teach us how to better manage the planet’s resources and to become a better global citizen.","task":"You are members of the student council and are having a discussion on whether your school should change its curriculum. You may want to talk about:","points":["whether students should learn history and geography at school","whether computer programming should be taught at primary school","other subjects that can help students develop logical thinking and creativity","anything else you think is important"],"ir":["Would you like to learn computer programming?","Do you like learning history and geography?","What would you rather study: arts or science?","What is the most important skill you learnt at school?","Why do you think some students might not want to learn computer programming?","Do you think all your subjects help you develop logicai thinking and creativity?","Do you think schools should help students get a job or develop life skills?","Do you think there are other subjects that should be dropped from the Hong Kong curriculum?"]},{"id":"2016-4.2","no":"4.2","label":"After-School Hangouts","intro":"Below is an extract from a magazine article about places where students can go after school:","title":"After-School Hangouts","text":"Rosie Jean’s Café Hong Kong’s first family-oriented restaurant has a terrace and outdoor playground where children can play\n\nafter 4:45pm for only $20. You'll also find a menu of breakfast fare, pastries, desserts, healthy smoothies, coffee, free wi-fi, phone-charging stations, colouring mats, books, comics and a great range of toys.\n\nSpace Museum With its unique egg-dome structure, the 8,611-square foot Space Museum is one of Hong Kong’s most\n\nrecognized landmarks. Learn all about astronomy and space technology through its regular exhibits. Watch out for one-off carnivals, lab sessions, competitions and lectures. The large planetarium also features daily Omnimax (very large theatre screen) shows in its iconic dome. Free admission on Wednesdays.\n\nHong Kong Park Embark on an educational excursion in one of Hong Kong’s largest parks. With a pathway set up within the\n\ntree canopy, taking a walk through Hong Kong’s aviary is like being in a rainforest, where you can learn about more than 80 species of birds. The butterflies, dragonflies, and an array of exotic plants at Forsgate Conservatory are also worth seeing.\n\nThe Mixing Bowl\n\nThis shop has all kinds of creative baking and cooking courses, including a traditional Hong Kong treats class where you can learn to make egg tarts, pineapple buns, and SAR-style sausage rolls. The team emphasizes a hands-on approach so expect to get a little messy. Special discount for students.","task":"You are members of the Peer Counselling team and are giving a presentation to the school on places where students can socialise after school. You may want to talk about:","points":["the importance of socialising after school","which of the suggested places would be most popular with Hong Kong students","other places where students can socialise","anything else you think is important"],"ir":["What do you usually do after school?","After school, do you prefer to study or have fun?","Are your after-school activities the same every day?","Do you have time to socialise with friends?","Do your parents mind what you do after school?","After school, do you prefer to spend time alone or with a group of friends?","What makes an interesting after-school hangout?","3on anu F YN Why do some people think negatively of teenagers socialising after school?"]},{"id":"2016-4.3","no":"4.3","label":"The Secret World of Hong Kong’s Private Kitchens","intro":"Below is an extract from a food magazine:","title":"The Secret World of Hong Kong’s Private Kitchens","text":"Hui’s Kitchen is a one-bedroom apartment that the owners have turned into a brightly lit open kitchen-cum-dining room. Every evening around 7pm, a small group of diners who have booked their tables in advance can taste some of 40-year-old chef Paul Hui’s signature dishes, such as drunken chicken.\n\nHui’s Kitchen is not an ordinary restaurant. Indeed, technically it’s not a restaurant at all. It’s a private kitchen, a type of eatery that has a long history in Hong Kong and is an important part of the local dining scene. They’re typically small, serving between 10 and 30 diners at one set time, and located in residential buildings in less-expensive parts of town. Diners can enjoy the experience of a tailor-made menu or leave it up to the chef and be surprised.\n\nPrivate kitchens, however, are not licensed restaurants. They are more like private clubs and so the licensing requirements are not as strict as for regular restaurants. So, many private kitchens just cater to their own members and not the general public. Guests usually need to book well in advance and owners can’t display menus in the window or promote themselves as public dining establishments. By operating a private kitchen instead of a restaurant, \"you don’t have to go through all the food and safety requirements,\" Hui says. \"What you do inside is up to you and the members.\"","task":"You and your group are working on a project on dining experiences in Hong Kong. You may want to talk about:","points":["the advantages of private kitchens","the disadvantages of private kitchens","the impact private kitchens may have on the restaurant industry","anything else you think is important"],"ir":["Which is your favourite restaurant?","Would you like to eat in a private kitchen?","Do you like to try something different every time you eat out?","Why have private kitchens become popular in Hong Kong?","What would make you decide not to go back to a restaurant?","Does good ivoa nave to be expensive?","Should a meal in a private kitchen be cheaper than in licensed restaurants?","Is the reputation of a restaurant important to you?"]},{"id":"2016-5.1","no":"5.1","label":"Hong Kong’s buskers: the good, the bad and the dreadful","intro":"Below is a letter to the editor about street musicians in Hong Kong:","title":"Hong Kong’s buskers: the good, the bad and the dreadful","text":"Buskers, or street musicians, are welcomed with open arms in other parts of the world.\n\nThere are few experiences more pleasing than walking through the streets of the world’s most beautiful cities and hearing concert violinists on their day off, or gifted music students practising for their next exam.\n\nIn Hong Kong, though, it’s a rather different experience.\n\nFirst, let me say, there are a few isolated pockets of moderate ability: an energetic man with a violin attracts quite a crowd near World-Wide House; and a nice sounding jazz group has taken up residence near the General Post Office in Central.\n\nOn the whole, though, most of our buskers are an embarrassment. A quality-control crackdown is well overdue.\n\nFew people would deny that people in need of food and a roof over their heads have the right to beg, but this should not extend into awful, never-ending karaoke. The stark truth is that you are much more likely to hear a busker destroying a classic pop song in Hong Kong than to hear something that might actually make your day any better. Such buskers should be fined on the spot.\n\nOne solution would be a public competition. Local celebrities could judge the musical talent and make jokes about the less talented buskers for our amusement. Winners, selected by viewers, could then be given a permit for the best ‘musical’ locations in the city, and harmony would be restored.","task":"Your group has decided to reply to the letter to the editor. You may want to talk about:","points":["whether you agree or disagree with the writer’s point of view","how to improve the quality of busking in Hong Kong","how the government can encourage busking","anything else you think is important"],"ir":["What kind of music do you like?","Are you a good singer?","Would you like to be a busker?","Do you ofteii see buskers in Hong Kong?","Why do you think some people are against buskers?","Do you think people should give money to buskers?","Do you think buskers are like beggars?","Why do you think music is so important to people and cultures all over the world?"]},{"id":"2016-5.2","no":"5.2","label":"Living in the Past","intro":"Below is an extract from an internet news article:","title":"Living in the Past","text":"Michelle Barnet, 35, from England, is so in love with the 1940s era that she has modelled her entire life around it. She’s spent thousands of pounds redecorating her home with authentic furniture and decor from the ’40s. Each morning she does her hair in perfect curls and carefully dresses herself in 1940s outfits. \"T love everything about the 1940s — the fashion, the music, the decor — I find it totally captivating,\" she says.\n\nBut the highlight came at a 1940s convention when she met Richard, a fellow history enthusiast. \"Our mutual love for the 1940s definitely brought us together,\" Michelle insists. They married three years ago in a 1940s style ceremony with Richard dressed in an original World War II British Navy uniform. The couple now lives in a small ’40s style country cottage and they’re coaching their two-month-old daughter Betsy-Rose to become a 1940s baby with her own collection of vintage’ clothes and toys. \"This is our lifestyle,\" Richard says. \"I come home from work and retreat into our \"40s time zone.\"\n\nMichelle claims that although she loves the material stuff, she also admires the spirit of the people who lived in the °40s. \"It was a time of great hardship, but the entertainers and actors of the time created escapism that lifted everyone’s spirits. This is what I want to achieve and bring alive. My whole life is a flashback to the ’40s and I prefer it to the gloomy modern world.\"","task":"As part of your school’s upcoming history week you have been asked to organise an Events Day that focuses on one particular period in history. In your group discuss what your school could do to celebrate the period you choose. You may want to talk about:","points":["which period you would choose","important features of that period","what events you would organise in the school","anything else you think is important"],"ir":["Do you like history?","Do you like to wa
