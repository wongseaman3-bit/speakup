nt for age-related concerns such as hair loss, a big tummy and wrinkle lines. The younger ones in their 20s and 30s are interested in enhancing their looks, such as their nose, eyes, lips and skin.\n\nDr Tan believes that more men now see plastic surgery as a lifestyle choice. \"Instead of spending money on the latest computer, they would rather spend to ‘upgrade’ their looks to get an added advantage at work, especially for men who have to meet clients,\" he said. Additionally, advances in technology also mean that the procedures are safer, the results are better, and the recovery time is quicker.","task":"Your group has to do a project about men who seek plastic surgery. Discuss with your group what to include in your project. You may want to talk about:","points":["what kinds of men would seek plastic surgery","the reasons for its increasing popularity","any negative aspects of plastic surgery","anything else you think is important"],"ir":["Is it important to be good looking?","Do you think men in Hong Kong would have plastic surgery?","Do you think people should have plastic surgery?","What would you feel if you found out that a classmate had had plastic surgery?","Is it more acceptable for older or younger men to have plastic surgery?","How else can men improve their looks?","Do you think that, one day, more men will seek plastic surgery than women?","What advice would you give a family member who wanted to have plastic surgery?"]},{"id":"2012-8.3","no":"8.3","label":"A super memory","intro":"Below is a newspaper report about a Hong Kong man with a super memory:","title":"A super memory","text":"A Baptist University graduate — 23-year-old Simon Li — set four records when he won the annual Australian Memory Championships in Melbourne. He memorized a sequence of 52 cards and rearranged them accordingly in just one minute and nine seconds. He also memorized another sequence of 280 numbers in just 15 minutes, 90 abstract images in 15 minutes and 176 random numbers in five minutes!\n\nThis international competition has been running for 20 years and tests the memorizing abilities of contestants. They have to pass 10 categories including names and faces, abstract images, speed cards, dates, words and numbers.\n\nLi said that memory study is about making use of the unlimited potential of the brain in a creative way and thinking with imagination. He had only scored 9 out of 30 points in the Hong Kong Certificate of Education Examination before he discovered his interest in memory study. His intelligence quotient has since increased after he began training in January 2006, and he encourages others to do the same.","task":"Your group is interested in memory training and has decided to give a presentation on it. Discuss with your group what to include in your presentation. You may want to talk about:","points":["the benefits of training one’s memory","how one’s memorizing ability can be trained","the types of people who could benefit from having an improved memory","anything else you think is important"],"ir":["Do you have a good or poor memory?","Which is the easiest for you to remember — numbers, names or faces?","Is it important to have a good memory nowadays?","What methods do you use to memorize things?","Do you think that older people can train their memorizing abilities?","In which subjects would memory skills be most useful?","Should schools teach students how to improve one’s memorizing ability?","Which is more important, a good memory or creativity?"]}]},{"id":"2013","year":"2013","label":"2013 DSE","tasks":[{"id":"2013-1.1","no":"1.1","label":"YouSchool?","intro":"Below is an extract from a Hong Kong university’s regular newsletter:","title":"YouSchool?","text":"In Asia, chances for face-to-face interaction with English speakers are limited, making it harder to learn English, But the situation is changing. A study started by the Hong Kong Institute of Education has found evidence of language learning and teaching on the social networking website YouTube.\n\nThe study investigated a video featuring the 2008 Olympics song, Beijing Welcomes You, which was sung in Mandarin Chinese. It was translated and subtitled by amateurs or fans into English — a process known as ‘fansubbing’. The researchers were particularly interested in the comments made by viewers. They were investigating whether there was informal language teaching and learning taking place.\n\n‘We have seen language teaching and learning-related episodes where there is direct attention to language forms, but also episodes where there is relatively deep discussion of issues concerning languages and cultures,\" said principal investigator Professor Philip Benson.\n\nThe online interactions often involved English and Chinese speakers helping each other to learn each other’s language. Findings showed that online language teaching and learning had ‘an informal and playful character often characterised by a direct style of correction and expressing opinion that may be unique to YouTube.’","task":": Your teacher wants your group to give a presentation to encourage other students to learn English outside the classroom. You may want to talk about:","points":["how you could learn English through YouTube and other social networking sites","what other ways you can think of to learn English outside the classroom","advice to give to students who are new to learning English by themselves","anything else you think is important"],"ir":["What is your favourite way to learn English?","Do you think YouTube is a good way to learn English?","What other ways could you use YouTube to learn English?","Do you think it is better to learn English by yourself or with a teacher?","What are the problems of using YouTube to learn English?","Why do you think writing comments on YouTube is popular?","What is the hardest thing about learning a language by yourself?","Can online language learning and teaching replace classroom teaching?"]},{"id":"2013-1.2","no":"1.2","label":"Bring back compulsory cooking classes at school","intro":"Below is an extract from a current affairs website:","title":"Bring back compulsory cooking classes at school","text":"Until we teach kids to cook rice, make a simple stir-fry or prepare a low-cost spaghetti bolognaise, people will continue to incorrectly believe that it’s cheaper to feed your kids at a fast food restaurant than to cook for them at home.\n\nAnd with a whole generation of adults who weren’t taught how to cook, it’s time cooking was made compulsory for all high school students.\n\nIt is doubtful that parents really think their children are better off eating fast food than something they’ve cooked themselves, but if you don’t know how to cook, or you think you don’t have the time, the idea can be terrifying.\n\nDietician Julie Gilbert said many parents now are completely overwhelmed by the huge choice of food in our supermarkets.\n\n‘They are lost and confused,’ she said. ‘We have completely de-skilled ourselves.’\n\nGilbert now has clients who have absolutely no idéa how to prepare even the simplest of dishes, how the food groups work, or the vaguest notion of appropriate portion sizes.\n\nThere’s a happy place in between gourmet and fast food and the only place left to guarantee we continue to get there is our schools.","task":"Your group wants to discuss if every secondary school in Hong Kong should have compulsory cooking classes. You may want to talk about:","points":["why young people usually do not know how to cook","the benefits and problems of having compulsory cooking classes","what should be taught in these classes","anything else you think is important"],"ir":["Do you bring your own food to school for lunch?","Would you like to have cooking lessons at school?","How important is home cooking in Hong Kong?","What new skills would you like to learn at school?","How can we get more people to start cooking?","Should cooking lessons be compulsory for boys at school?","Which subjects are more important at school: practical subjects or academic subjects?","Should cookery be made a degree course at university?"]},{"id":"2013-1.3","no":"1.3","label":"Secrets to having a long life","intro":"Below is an extract taken from an article about the secrets to a long life:","title":"Secrets to having a long life","text":"Many people wish for longevity (i.e. having a long life) on their birthday. To uncover the secrets to long life, Professor Yang Zhimin, Vice-President of the Guangdong Province Hospital for Traditional Chinese Medicine, led a research team and interviewed 128 elderly people between 100-110 years old in Guangzhou. They discovered many common factors:\n\nfood is avoided;\n\n90% have three meals at regular times every day;\n\n63% sleep at least eight hours every day;\n\nDoing housework and going on walks are their main sources of physical exercise; and\n\nFactors\n\n1. 80% are women;\n\n2. 60% live with their spouses or children, emphasising the importance of family care and support; 3. 84% are non-smokers and 68% are non-drinkers; 4, Fresh fruits and vegetables are the most common parts of their daily diet, while fatty and preserved\n\nBased on the survey results, Yang summarised that having a long life requires observing four rules, namely, a proper diet, regular habits, exercise and a positive mindset.","task":"Your teacher has assigned your group to give a short talk to the school during the school’s Live Well Week about achieving long life. Discuss with your group what to include in your talk. You may want to talk about:","points":["which four of the eight factors to include in your talk and why","which rule is the most important for achieving a long life","activities that can be included in the Live Well Week","anything else you think is important"],"ir":["Do you usually eat breakfast?","Do you usually sleep eight hours a day?","Do you eat three regular meals a day?","What other activities can elderly people do to live a longer life?","Why do you think women live longer than men? I Would you want to live to a hundred years old?","Do you think you would have the discipline to follow the four rules?","Why do some people not want to live a long life?","http://dsepp.cor"]},{"id":"2013-2.1","no":"2.1","label":"Apprenticeship programmes in Switzerland","intro":"Below is an extract from a magazine article about apprenticeships:","title":"Apprenticeship programmes in Switzerland","text":"An apprenticeship is a formal, on-the-job training programme through which a trainee learns a marketable craft or trade under the guidance of a master craftsman or tradesman.\n\nIn Switzerland, apprenticeships are a critical part of the secondary education system, and most students complete an apprenticeship even if they plan to pursue post-secondary education in the future. Almost 70% of students between the ages of 16 and 19 participate in a dual-enrollment track which allows them to study one to two days per week in a vocational education and training (VET) programme and spend the rest of f their time in a paid-on-the-job training programme that lasts three to four years.\n\nOne of the main benefits of the Swiss apprenticeship system is that students of all socio-economic and ability levels are engaged in this form of learning. The popularity of the apprenticeship system is proof that these programmes are not just for people who can’t get into university. t\n\ni Moreover, because students entering dual-track VET programmes are often high performers, they are no t ' less academic than students who chose university education rather than vocational training or dual : education. As a result, Swiss dual-track VET students are likely to enter the workplace well prepared for work and having strong academic skills. .","task":"Your group is looking into the possibility of introducing apprenticeship programmes to school students. You may want to talk about:","points":["the differences between apprenticeships and traditional schooling","whether Hong Kong students and parents would be open to the idea of apprenticeship programmes","how to get support from employers to take part in apprenticeship programmes","anything else you think is important"],"ir":["Do you like studying practical subjects?","Are you good at making things?","Do you think an apprenticeship would be boring?","Would you prefer on-the-job training to learning in a classroom environment?","Do you think that Hong Kong schools should offer more job training for their students?","Tf you were an employer, what qualities would you look for in a trainee?","Do you think schools adequately prepare their students for the workplace?","Do you think Hong Kong’s educational system meets the needs of society? - f"]},{"id":"2013-2.2","no":"2.2","label":"Empty shop projects","intro":"Below is an article from a local newspaper:","title":"Empty shop projects","text":"Shopping in Britain is slowly changing due to a recent project designed to use empty shops to increase community spirit. In 2009, the British government created a £3million (HK$37.6million) fund, providing companies and charities with grants to convert unused shops into spaces for community services.\n\nOne popular scheme saw a small fairground set up in a city-centre shop-space during a school holiday, alongside circus skills sessions and other activities for young people.\n\nA company held activities in seven unused shops in another UK city, including photography exhibitions and musical performances. More than 4,000 people visited the area over one weekend.\n\nIna third city, a local company established a university drop-in shop in the main shopping street. It offered advice about studying, fees and funding and ran a free legal-advice clinic. Another empty property showcased the work of local artists, attracting over 10,000 visitors in four months. Local designers benefitted from affordable space, workshops and retail experience.\n\nCould this scheme be adapted for ‘shopping paradise’ Hong Kong? Certain areas seem ideal for such projects, and with government assistance our malls and shopping streets could become places where we exchange ideas and learn new skills, as well as do our shopping.","task":"Your group wants to write a letter to the newspaper to express your opinion on ‘empty shop projects’ that use shop-spaces for community events. You may want to talk about:","points":["the benefits and problems of organising empty shop projects in Hong Kong","what activities would be best for Hong Kong empty shop projects to hold","how to encourage companies and charities in Hong Kong to organise empty shop projects","anything else you think is important"],"ir":["What do you like to do in shopping malls?","What special events do you like to go to in shopping malls? a What activities in your district do you attend?","Do you think holding social activities in shop-spaces is a good idea?","Do you think young people should get involved in the local community?","Where in Hong Kong do you think empty shop projects should be held?","Should there be special areas to hold community events, or should they be held in shopping malls?","What do you think is the best way to increase community spirit in Hong Kong?"]},{"id":"2013-2.3","no":"2.3","label":"‘Strange’ Hong Kong food!","intro":"Below is an extract taken from an online article about local food:","title":"‘Strange’ Hong Kong food!","text":"Hong Kong is world-famous for its cuisine and is known as a food paradise. Yet, some people from outside Hong Kong might find some local food rather strange. One website reviews ten weird Hong Kong foods, and even gives it an ‘eatable’ rating! Below are four examples:\n\nThousand-year-old eggs Duck eggs are buried in\n\nChicken feet Sea slugs These wrinkled, claw-like You'd think sea slugs\n\nTurtle soup Turtles are boiled for up\n\nclay, sand and salt for a couple of months, melting\n\nchicken feet look like something from a witch’s\n\nwould be slimy and slightly rubbery and\n\nto twelve hours, mixed with herbs and then\n\ntheir insides to jelly. The pot! Luckily, they taste you'd be right! Sea slugs served as a type of yolk turns a dark green better than they look, have a slippery texture jelly-like soup. The and smells like it has been although there isn’t much and beginners should try attraction here is the around for 1000 years, meat and is mostly just them fried on a bed of medicinal benefits, skin! noodles or rice with an certainly not the taste, accompanying sauce. which is horrible!\n\noe Sf Eatable rating: 3/10\n\nEatable rating: 4/10 Eatable rating: 6/10\n\nEatable rating: 1/10","task":"Your group has been assigned to produce a brochure for tourists about special focal food in Hong Kong. Discuss with your group what to include in your brochure. You may want to talk about:","points":["e- other kinds of strange Hong Kong food to include in the brochure","why tourists may find these local foods strange","how to make these foods more attractive in the brochure","anything else you think is important"],"ir":["What is your favourite food?","Do you like eating any of the foods shown in the pictures?","Do you like eating foods from other countries?","Do you think it’s important to try different food from other cultures?","What are some things that you would never eat and why?","How adventurous are you as an eater?","How would you convince a tourist to eat chicken feet?","Is food an important part of a country’s culture?"]},{"id":"2013-3.1","no":"3.1","label":"Unusual activities to keep fit in Hong Kong","intro":"Below is an extract from a local lifestyle magazine:","title":"Unusual activities to keep fit in Hong Kong","text":"Photo racing\n\nThe Hong Kong Photography Club turns photography into exercise. Once a month, it organises a ‘photography race’ event. ‘In teams of two, the challenge is to take five photographs under four different themes over a seven-hour period,’ explains club founder Miranda Legg. Because the themes for each photo are random and must be picked up at the home base one-by-one, it means a lot of running around town while carrying a heavy camera. By the end, you’ll be fit and have a collection of great photos from around the city.\n\nHousehold chores\n\nNot that we need studies to tell us this, but a UK study last year showed that doing your own chores ~ that’s vacuuming, laundry, sweeping the floor, taking out the trash — can result in up to 50,000 calories burned per year (playing tennis once a week burns only 26,000 per year).\n\nLion dancing\n\nThe art of lion dancing is an exciting, exhausting, leisure activity. So get a good workout — and pick up a kung fu move or two — by taking a lion dancing training course courtesy of the Hong Kong Chinese Martial Arts Dragon and Lion Dancing Association,","task":"You are organising a Health Awareness Fun Day for your school. You have to choose an unusual activity to help promote exercise. You may want to talk about:","points":["which of the activities in the extract above would be most suitable for a Health Awareness Fun Day","possible problems when organising the Fun Day","other unusual activities to include in the Fun Day","anything else you think is important"],"ir":["_ Is it easy to exercise where you live?","Do you ever do household chores?","Is it better to go to the gym or exercise outside?","Which household chore would be the best for keeping fit?","Would you like to take part in a photo racing competition?","Should schools encourage lion dancing as a way to exercise?","Aside from the health benefits, what other benefits are there to exercise?","Does technology help or hinder us when we try to keep fit?","http://dsepp.cor"]},{"id":"2013-3.2","no":"3.2","label":"Living in Hong Kong: a guide for teenagers","intro":"Below is an extract from a website for teenagers from overseas who are moving to Hong Kong:","title":"Living in Hong Kong: a guide for teenagers","text":"CONTENTS\nLiving in Hong Kong (page 4): Government Structure, Legal System, Employment, Education, Health, Housing, Transport, Pollution and Environmental Control, Law and Order, Tax System, Mandatory Provident Fund, The Media, Telecommunications\nComing to Hong Kong (page 20): Tourism, Immigration, Leisure and Culture, Traditional Festivals\nHong Kong: The Facts (page 26)\nContact Numbers (page 30)\n\nTransport\nHong Kong is a highly mobile city, where people make over 11 million trips daily, using an efficient, economical and multi-modal public transport system that includes railways, trams, buses, public light buses, taxis and ferries.\n\nTourism\nHong Kong is a unique meeting place for East and West, blending Chinese heritage, British colonial influences, high-tech modernity and Cantonese passion. It offers a diversity of travel experiences, from shopping to dining, countryside pursuits, arts and cultural activities and a unique built heritage including temples, monasteries, walled villages, clan halls and colonial structures.\n\nLeisure and Culture\nHong Kong’s universal appeal is evident in a variety of leisure and cultural options, a reflection of the city’s cosmopolitan population and its diverse range of pastimes. The Government nurtures an environment in which freedom of creativity, development of the arts, sporting excellence and recreation in the community can thrive.","task":"Your group wants to improve this website. You may want to talk about:","points":["what teenagers need and want to know about living in a new place","the information from the above guide that you want to keep","how to make the website more attractive","anything else you think is important"],"ir":["What do you like about living in Hong Kong?","What are the easiest ways to make new friends in Hong Kong?","Would you like to live in another country for a year?","What is most difficult about living in a new country?","Do you want to make friends with people who grew up in another country?","If you and your family lived away from Hong Kong, what would you miss the most?","Is it a good idea for parents to make their teenage children live in a new country?","Does the government pay enough attention to teenagers’ needs?"]},{"id":"2013-3.3","no":"3.3","label":"Protecting yourself from cyber crime","intro":"Below is an extract from a magazine article about IT security:","title":"Protecting yourself from cyber crime","text":"themselves against cyber crimes. Cyber crimes could be identity theft, loss of ATM or bank passwords, or even financial losses when criminals use your account to buy expensive things online! According to the government, the number of reported cyber crimes in Hong Kong in 2009 was 1,506, but it had risen to 2,206 by 2011.\n\nThese statistics are unsurprising. Some of the world’s 25 most common passwords in 2012 were ‘password’, *123456’, ‘abc123’, and even ‘monkey’! Experts say passwords like these — which are so easy to guess make a cyber criminal’s job even easier, allowing them to steal vital personal information by breaking into remember a long or unique password.\n\nExperts suggest the following steps to protect yourself from cyber crime:\n\nif 1. Never use public computers to access emails or bank accounts because there could be a ‘virus’ installed to copy your password(s).\n\nNever use the same password for all, or most of, your online accounts.\n\nNever store important information, such as passwords, on your mobile phone. Change your passwords regularly.\n\nSet complex passwords.\n\nwren","task":"As members of your school’s Computer Club, your group needs to give a presentation about cyber crime. Discuss with your group what to include in your presentation. You may want to talk about:","points":["why cyber crimes occur","the importance of protecting ourselves from cyber crimes","ways to protect ourselves from cyber crimes","anything else you think is important"],"ir":["Do you change your password regularly?","Do you use different passwords for all your email accounts?","Do you have difficulty remembering your passwords?","Have you shared your passwords with anyone before?","Would you tell your parents the password to your email account?","Do you think it is safe to buy things online?","Should schools invest more money in developing good IT security?","Do you think cyber crime is a serious offence?"]},{"id":"2013-4.1","no":"4.1","label":"Are we cruel to our food?","intro":"Below is an extract from an online article about ‘cruel foods’:","title":"Are we cruel to our food?","text":"By the time that cheeseburger arrives on your plate, it’s hard to think about anything but how tasty it’ll be. But when you trace the origins of each ingredient ~ the beef, the fried egg, the yummy bacon — some uncomfortable truths emerge. Below are three examples of the cruelest foods you can eat.\n\nLobsters\n\nA recent study reveals that, contrary to previous thinking, lobsters and crabs can feel pain and show signs of stress. Lobsters are usually boiled alive, and some Japanese restaurants even serve live lobster sashimi where you choose your lobster from a tank and it appears on your plate in seconds, slit down.\n\nShark’s fin sou\n\nThis soup is made with fins that are sliced off sharks in open water, The shark is then tossed back into the water, leaving the animal to drown or bleed to death. Many of the fins served come from endangered shark species. More status symbol than nutritious, shark’s fin soup is a popular gourmet dish throughout\n\nGoose liver\n\nThe French make a delicacy called ‘foie gras’ which is goose liver that tastes very creamy. The creaminess comes from the goose being forced to eat large amounts of corn which is pushed down its throat through a long metal tube, After a month of force-feeding, the animal is killed and its unnaturally\n\nthe middle and squirming. Asia. enlarged liver is served.","task":"Your group has to prepare for a debate in class on the motion We should NOT eat food from animals that were cruelly treated. Discuss with your group what to include in your debate. You may. want to talk about:","points":["e some foods that come from animals which are cruelly treated","arguments for the motion","arguments against the motion","anything else you think is important"],"ir":["Do you think eating shark’s fin is wrong?","Should school canteens stop serving meat?","Do you think restaurants should stop serving shark’s fin?","Do you think it is important to know where your food comes from?","Which is more important to you regarding food — its taste or its origins?","Should foods that come from cruelly-treated animals be banned by the government?","Should we criticise people who eat ‘cruel foods’?","Should animal rights be protected?"]},{"id":"2013-4.2","no":"4.2","label":"Contact sports","intro":"Below is some information from the internet about contact sports:","title":"Contact sports","text":"The term contact sport is used to describe sports in which players have physical contact with an opponent. Contact between players can be divided into different levels.\n\nFull contact sport is any sport in which physical contact with an opponent is allowed. In rugby and American football, players can tackle another player to the ground or use their body to block a player running on the field.\n\nLimited-contact sports are sports in which the rules are specifically designed to prevent contact between players. Although contact can happen, penalties are used to reduce contact between players. Examples include basketball, field hockey, netball and squash.\n\nNon-contact sports are sports where participants take turns competing or are physically separated to make it nearly impossible for them to make contact during the course of a game, Examples include sports such as golf, tennis, volleyball, swimming and gymnastics.\n\nIn recent years, there has been a growing perception that full contact sports are brutal, prone to violence and tend to cause injuries. This has led to a trend to decrease the amount of aggression and rough play in sports. Full contact, however, is seen as a major component in some sports such as rugby and is unlikely to ever be removed.","task":"Your group is talking about whether teenagers should participate in full contact sports. You may want to talk about:","points":["reasons why some people are against full contact sports","the benefits to teenagers of participating in full contact sports","the difficulties of introducing full contact sports in schools","anything else you think is important"],"ir":["What sports do you like the least?","Do you prefer full contact sports or non-contact sports?","Would your parents allow you to take part in full contact sports?","Would you participate in a full contact sport?","Have you ever been injured playing sport?","Do you think it is okay for girls to play full contact sports?","Do you think full contact sports should be banned?","Do you think full contact sports will ever be widely accepted in Hong Kong?"]},{"id":"2013-4.3","no":"4.3","label":"Simplicity has its own rewards","intro":"Below is an extract from a local newspaper:","title":"Simplicity has its own rewards","text":"Mok Ho-kwong is no ordinary environmentalist. He doesn’t just talk about his ideals but puts most of them into practice. He lives in a remote village house in Fanling, where he grows his own vegetables.\n\nHis house has few electrical appliances and no air-conditioning or television.\n\nThe 30-year-old university graduate makes his own soap, uses only salt to clean his teeth, picks up furniture thrown out by others and occasionally burns waste wood to cook.\n\nHe says most quality-of-life issues facing urban dwellers, such as rising home prices, air pollution, income inequality and food safety scares, are a matter of choice. ‘I have spacious living here and right outside I can breathe very good air. Whenever I want fresh and safe food I harvest whatever I need from my farm. This is a quality life. Everyone is able to live it, but many can’t leave the city, which is too convenient for them.’\n\nMok doesn’t care much about what he earns, as long as it covers his expenses and rent. ‘The more money you make, the more you want,’ he says, ‘which pressures you to get more. And I don’t have this anxiety now.’","task":"Your school wants to organise a one-month-long course on simple living. As part of the course, students have to live in the countryside for a week like Mok Ho-kwong. You may want to talk about:","points":["the skills that students will learn from this course","the benefits and problems this plan will bring","what other activities to include in the course","anything else you think is important"],"ir":["Do you enjoy spending time in the countryside?","Would you like to live a simple life in the countryside?","Do you think people in Hong Kong need to know about nature?","Do you think that living in the countryside would make everyone happier?","If you could choose only one household electrical appliance to have, what would it be?","Do you think people can be happy without money?","Do you think everyone could live a simple life like Mok Ho-kwong?","Do you agree with the statement, ‘The more money you make, the more you want’?"]},{"id":"2013-5.1","no":"5.1","label":"Digital devices deprive brain of needed downtime","intro":"Below is an extract from an American newspaper:","title":"Digital devices deprive brain of needed downtime","text":"Smartphones are now powerful computers with high-speed Internet connections, letting people get more work done and have more fun, relieving the boredom of exercising, standing in a queue, or sitting on a train.\n\nThe technology makes the tiniest windows of time entertaining, and potentially productive, But scientists point to an unexpected side effect: when people keep their brains busy with digital input, they are sacrificing ‘quiet time’ that could allow them to better learn and remember information, or come up with new ideas.\n\n\"Almost certainly, resting the brain lets it go over experiences it’s had, solidify them and turn them into permanent long-term memories,’ said Loren Frank, a specialist in learning and memory. He believes that when the brain is constantly stimulated, ‘you prevent this learning process.\"\n\nAt the University of Michigan, a study found that people learned significantly better after a walk in nature than after a walk in a dense urban environment, suggesting that processing a barrage of information leaves people fatigued.\n\nEven though people feel entertained, even relaxed, when they pass a moment at the bus stop by catching a quick video clip, they might be over-tiring their brains, scientists say.","task":"Your group wants to give a presentation about the ways that smartphones and tablets are changing the lives of young people in Hong Kong. You may want to talk about:","points":["how using them affects people’s brains","how using them affects people’s behaviour","how using them affects people’s relationships with others","anything else you think is important"],"ir":["Do you like using smartphones?","How should people spend their time when travelling on public transport?","Why do people like using smartphones so much?","Do you think people in Hong Kong use their smartphones too much?","Are smartphones the most important technological product nowadays?","Do you think smartphones help or prevent learning?","Do you think smartphones are changing society?","snr and eed Do you think smartphones damage creativity?"]},{"id":"2013-5.2","no":"5.2","label":"Get rid of clutter!","intro":"Below is an extract from an online article about clutter and messiness:","title":"Get rid of clutter!","text":"Do you have a very messy bedroom filled with all sorts of things such as old books, clothes and magazines everywhere? Clutter takes up valuable space — not just in your surroundings, but in-your head as well, Of the two, the psychological effect of clutter is more important. According to an expert, ‘When we clear the clutter out of a space, people breathe a sigh of relief. People feel lighter, more at peace, more focused.’\n\nExperts believe this is because the human brain is not equipped to deal with so much stimulation. If there’s stuff everywhere you look, you are more likely to become stressed out and anxious. Clear out and organise your environment, and your mind can handle more things. Yes, there are physical dangers to clutter— you can easily trip and fall over things left on the floor. However, the psychological effects of clutter appear to be more serious because clutter could make you depressed without you realising it. A messy room is not a pleasant room.\n\nClearing the clutter and becoming organised is not easy. That’s because a lot of what we hold on to is weighed down by emotional baggage. People have a strong attachment to their stuff. It carries memories and feelings, reminds them of things they don’t do anymore, things that upset them at one time or made them happy.","task":"Your group has been assigned to write an article for the school magazine about the effects of having too much clutter in the home. Discuss with your group what to include in the article. You may want to talk about:","points":["reasons why people are unwilling to throw things away","the effects of having clutter in the home","what to do with the unwanted items","anything else you think is important"],"ir":["How often do you clean your bedroom?","Do you have a messy bedroom?","Is it easy to keep your room tidy?","How would you feel if someone cleaned up your room?","Do you find it difficult to throw old things away?","Are you comfortable with clutter?","Do you place any sentimental value in old things?","Can de-cluttering improve your life?"]},{"id":"2013-5.3","no":"5.3","label":"Hong Kong people the most brand conscious in Asia Pacific","intro":"Below is an extract from a report by a market research company:","title":"Hong Kong people the most brand conscious in Asia Pacific","text":"Hong Kong consumers are definitely among the quick adopters of fashion trends and are the world’s most brand conscious, shown both by the increasing number of luxury brand stores opened in the city and also in our latest Global Luxury Brands Study.\n\nConsidered by many luxury groups to be a major market for their products, Hong Kong leads the Asia Pacific region with 40 percent of shoppers claiming to buy products of luxury brands, significantly exceeding the regional average of 15 percent.\n\nAs the global study reveals, Hong Kong tops the world in sales of luxury brands such as Gucci, Louis Vuitton, Ferrari, etc.\n\nAccording to our on-going tracking of Hong Kong consumers’ retail spending, an average of $6,000 per person was spent on luxury products by people in Hong Kong in the past three months.\n\nHong Kong is considered by many international brands to be the major market in Asia. With the improving personal financial status of Hong Kong people and an increasing number of tourists who love to shop for luxury brands in Hong Kong, there is huge room for growth in the luxury sector,","task":"Your group wants to gather information about the shopping trends for luxury brands in Hong Kong for a iy project. You may want to talk about:","points":["why international brands want to open stores in Hong Kong uy","the advantages and problems this brings","what other information to include in the project","anything else you think is important"],"ir":["What brands or products do you like?","Would you like to buy luxury brands?","Do you think luxury brands are too expensive?","Are luxury brands better than normal brands?","Do you think young people spend too much on luxury brands?","What products reflect Hong Kong’s identity?","Do you think that local brands can compete with international brands?","What does the focus on luxury brands in Hong Kong say about Hong Kong people?"]},{"id":"2013-6.1","no":"6.1","label":"RoboMart","intro":"Below is an introduction to an online shop:","title":"RoboMart","text":"For your robot needs\n\nThe future is now. Robots to clean, look after your pet and guard your property are here to stay. Our selection of life-improving robots includes domestic robots: if you don’t like doing a task, we have the right robot for you, from vacuuming your floors with Dustbot 12, to cleaning your swimming pool with Poolclean V1. Don’t like getting your hands dirty with your cat? Choose Magicat 2 to clean its litter tray, or Autofeed to provide food regularly every day.\n\nOur range of sport robots is similarly trouble-saving. Can’t find a table-tennis partner? Then choose Ping-pong Pro to shoot balls at different speeds and angles. if Tired of carrying your golf clubs? Then RoboCaddy will take the weight for you, following you around automatically!\n\nFinally, sleep happily with our security robots. SecurityPlus will monitor your property with motion sensors and infrared scans, alerting you via SMS or a loud alarm if it detects anything strange. For ultimate defence, choose BotBlaster. Capable of firing 800 plastic pellets a minute, if it detects an unauthorised intruder as it drives around, it will start shooting until they retreat.\n\nChoose smart: choose RoboMart!","task":"Your group wants to write a report about the use of robots in the home. You may want to talk about:","points":["the services that robots can provide for humans","the disadvantages of using robots in the home","what other kinds of robots you would like to see in the future","anything else you think is important"],"ir":["Would you like to have robots in your home?","Would you like to have a robot pet?","Which robots do you think would be popular in Hong Kong?","What jobs would be performed better if they were done by robots?","Do you believe that robots will improve our lives?","If you had a robot that could do anything, what would you want it to do for you?","Why are some people so interested in robots?","What things do you think robots will never be able to do?"]},{"id":"2013-6.2","no":"6.2","label":"How Humans Will Get To Mars In 2023","intro":"Below is a report from a technology website:","title":"How Humans Will Get To Mars In 2023","text":"Guess how they'll get to the planet? Well, a reality television show called Mars One plans to pay for the whole project and film the Mars travellers for the rest of their lives. Seriously, that’s what the organisers are claiming and they have the support of industry professionals. From the official Mars One site:\n\nMars One’s mission objective\n\nThe first crew of four astronauts will establish the first human settlement on Mars by 2023. A new team of four will join the settlement every two years. By 2033 there will be over twenty people living and working on Mars, This will be a one-way trip — the Mars astronauts will wave goodbye to their family and friends forever.\n\nOur vision\n\nA manned mission to Mars is one of the most exciting, inspiring and ambitious adventures that mankind can have, We see this as a journey that belongs to us all. The entire world will be able to watch and help with decisions as the settlers are selected, follow their extensive training for the mission and of course watch them living on Mars. The mission will provide invaluable scientific and social knowledge that will be accessible to everyone,\n\nWell what do you think — stupid idea to promote a TV show, or might they really manage it?","task":"Your group wants to give a presentation on humans living on other planets. You may want to talk about:","points":["the good and bad ideas from the Mars One project","what other issues should be considered when humans live on another planet","the reasons why people may want to move to another planet","anything else you think is important"],"ir":["Would you like to live on another planet?","What two things would you take to another planet?","Are reality TV shows popular in Hong Kong?","What types of people should be selected as astronauts?","If you were an astronaut on the Mars One project, what would the biggest problem be for you?","What would you find most exciting if you were an astronaut on the Mars One project?","Do you think the Mars One project will succeed?","Do you think space travel should be funded by the government or by private companies?"]},{"id":"2013-6.3","no":"6.3","label":"Video games ARE art","intro":"Below is an editorial from a computer gaming website:","title":"Video games ARE art","text":"Recently, a large news corporation published an article that attacks the heart of our computer games. Their that this is entirely false. .\n\nThe article says, ‘As interesting as new games can be, they fall short of engaging the human heart. Games can be fun and rewarding in many ways, but they can’t transmit the emotional complexity that is the root of art.’ This is clearly ridiculous.\n\nWho has not felt joy when a main character in a game falls in love? Who has not felt pain and sadness when a loved character dies? Who has not felt fear when facing the final battle?\n\nAre movies considered art? YES. Music compositions, paintings, novels? YES. Then what are video games? They are much more than art, They are a perfect mixture of graphical art, musical soundtracks, gripping stories and one thing missing from traditional art forms: INTERACTIVITY. If we say that video games are not art, then there is no such thing as art, and we are denying all forms of art their true existence.","task":"Your group wants to prepare for a debate on the topic Computer games are beneficial for young people. You are supporting the motion. You may want to talk about:","points":["why video games are considered art","what benefits there are to playing computer games","how you will argue against the other team’s ideas","anything else you think is important"],"ir":["Howdo you feel when you play video games?","Is it more fun to play video games alone or with other people?","Why are video games so popular?","Is it okay if parents spend a lot of time playing video games?","Do you think characters are more interesting in a video game or in a film?","Do computer games bring people together or force them to be alone?","Do you think video games can truly engage players’ emotions?","Do you think video games are as artistic as paintings?"]},{"id":"2013-7.1","no":"7.1","label":"Dogs: replacement children?","intro":"Below is an extract from 4 local current affairs website:","title":"Dogs: replacement children?","text":"The birth rate in Hong Kong may be steadily falling but pet ownership and spending on pets is rising.\n\nA recent report published by Akuba University, Japan, suggests that raising a pet dog can be the emotional equivalent to raising a baby in scientific terms, According to the report, the hormone oxytocin, which is released during moments of romantic or familial love, is also released when dog owners play with their pets. Some female dog owners say their dog-owning experiences have led them to decide on whether or not to raise children. In a significant 2012 survey, 16% of Hongkongers questioned said they would prefer keeping pets to having kids, a number which is seemingly rising.\n\nMedia reports estimate that it costs up to HK$4 million to raise a child in Hong Kong. Owning a dog obviously costs less, but for some owners money is no question when it comes to the health and safety of their pets, easily spending $23,000 a year.\n\nIndeed, new businesses are thriving from dog-mania: whilst canine fashion is commonplace, Hong Kong now has restaurants that host dog birthday parties, salons for giving fashionable haircuts to dogs, and even psychologists who specialise in treating dogs.","task":"Your group is giving a presentation on the increasing importance of dogs as pets in Hong Kong. You must discuss what to include. You may want to talk about:","points":["the reasons why many dog owners place so much importance on their pets","the activities they do with their dogs in Hong Kong","the advantages and problems that may arise from spending so much time with their dogs","anything else you think is important"],"ir":["What fun things can you do with a pet?","Would you like to work in a job where you look after dogs?","What things can you learn from having a pet?","Do you think students should keep a class pet at schoo!?","Do you think some people spend too much money on pets?","Do you think caring for a pet and looking after a young child are similar?","What do you think about treating dogs as humans?","Do you think dogs can replace children?"]},{"id":"2013-7.2","no":"7.2","label":"The decline of Cantopop?","intro":"Below is an introduction by a local museum to accompany an exhibition:","title":"The decline of Cantopop?","text":"Since the 1950s, Cantonese Pop music (or Cantopop) has been at the centre of popular culture in Hong Kong. It has been the fruit of the hard work of countless singers, We grew up with Cantopop. It is our collective memory.\n\nHowever, concerns have recently been voiced by industry experts that the impact of Cantopop is fading from Hong Kong’s popular culture.\n\nThe emergence of new media such as mobile phones and the Internet has both allowed music from abroad to flood Hong Kong and encouraged the illegal downloading of music. These damaging activities have forced down music sales from HK$17 billion in 2002 to HK$0.56 billion in 2012.\n\nMeanwhile, the entertainment industries of neighboring regions have made great advances since the 1980s, and singers from the Mainland and Taiwan have grown in popularity. K-Pop and J-Pop (from Korea and Japan) are also massively popular, This means Cantopop is now less dominant in Asia.\n\nFinally, it has often been said that Cantopop content has been over-focused towards love songs for young people, Unlike in the 1970s-1990s, this limited range is failing to attract a diverse audience and so is ignoring older generations. Is Cantopop destined to disappear in the next generation?","task":"Your group wants to propose a project focusing on Cantopop for the Learning English through Popular Culture elective at school. You may want to talk about:","points":["why Cantopop is a suitable topic for the school project","what to include in the proposal","whether you agree with the article that Cantopop is less popular today","anything else you think is important"],"ir":["Who is your favourite Cantopop star in Hong Kong?","Do you enjoy singing Cantopop in karaoke?","Do you listen to Cantopop?","What do you like about Cantopop?","Would you like to be a Cantopop star?","Why do you think K-Pop and J-Pop are so popular in Hong Kong?","Do you think people should be able to share songs on the Internet for free?","Do you think the subjects in Cantopop songs are relevant to young people’s lives in Hong Kong?"]},{"id":"2013-7.3","no":"7.3","label":"Peer pressure amongst teens","intro":"Below is an extract from an online article about peer pressure:","title":"Peer pressure amongst teens","text":"Peer pressure is one thing that all teenagers have in common, whether it is pressure to conform to a group norm or pressure to act a certain way because everyone else is doing it.\n\nTeenagers begin to spend a lot more time with their friends, and less time with their family. The need for acceptance, approval, and belonging amongst friends is vital during the teen years, This makes them more vulnerable to the influences of their peers — which can be positive or negative. Positive peer pressure is when teens follow their friends to do well, such as studying hard in school. Negative peer pressure is when teens are more likely to engage in negative behaviours like drug use or shoplifting in order to fit in with a\n\ngroup.\n\nDifferent factors cause teens to react to peer pressure in different ways. Gender, age and whether they feel rejected by their peers or family are some factors. For example, boys give in more easily to peer pressure than girls, particularly in dangerous situations. Younger teens are more easily influenced than older teens, with peer pressure at its highest when they are 14-16 years old. Individual characteristics such as confidence level, personality and degree of maturity also make a difference.","task":"Your group wants to give a class presentation about peer pressure that teenagers experience in Hong Kong. Discuss with your group what to include in your presentation. You may want to talk about:","points":["the kinds of peer pressure that Hong Kong teenagers have","the positive and negative influences of peer pressure","what teens can do when they face peer pressure","anything else you think is important"],"ir":["Do you face pressure at school?","What pressures do parents place on their children?","Do you think it is important to follow what your friends do?","Have you experienced peer pressure in school?","Can peer pressure help us in our studies?","Do you think boys and girls react differently to peer pressure?","Is it possible to have no peer pressure at all?","Has peer pressure been a positive influence in your life?"]},{"id":"2013-8.1","no":"8.1","label":"Hong Kong loves Blogs August 2012","intro":"Below is a report from a market research company:","title":"Hong Kong loves Blogs August 2012","text":"A new survey of 387 people over 18 years old reveals that three-quarters of Hongkongers read blogs weekly. So first of all, what is a blog? It’s a website which contains the writer’s personal experiences, observations and opinions about food, fashion, technology or any subject you can think of. Table 1. Weekly Media Usage Read blogs Write blogs Participate on online forums Hong Kong 11% 52% 69% US. 40% 18% 31% Table 2. Table 3. Table 4. Table 5. What blogs do you What do you like to Do you trust blogs’ The impact + like to read? write about in your advicelinformation? blogging has on blog? your life is...? News 59% Personal 55% Allthe time 4% Positive 44% Travel 54% News 35% Frequently 21% Neutral 53% t Shopping 51% Food/cooking 35% Sometimes 55% Negative 3% Health 41% Entertainment 34% Seldom 10% Tech/gadgets 40% Travel 23% Never 2% Politics 11%","task":"Your group wants to start a class blog and you want to persuade your class teacher to allow you to do this. You are now discussing how to convince your teacher. You may want to talk about:","points":["the benefits and problems with having a class blog","which topics you want to include in your class blog","what information from the survey you will use to persuade your teacher","anything else you think is important"],"ir":["What do you read on the Internet?","Do you know anyone who reads blogs?","If you had a blog, what would you write about?","Do you think blogs are useful for teenagers?","Would you trust the advice from a blog?","Why do you think that some people enjoy reading other people’s blogs?","Why do you think that some people spend so much time writing blogs?","How do you think blogs will change in the future?"]},{"id":"2013-8.2","no":"8.2","label":"Coping with emotional traps","intro":"Below is an extract from a magazine about ‘emotional traps’:","title":"Coping with emotional traps","text":"Working in groups is common in school — whether conducting experiments together, working on homework assignments, or co-operating during extra-curricular activities. Sometimes in the group, we meet people who are difficult to work with and we end up arguing with them. We get angry and frustrated, falling into something which experts call an ‘emotional trap’ that prevents us from achieving success when working together.\n\nEmotional traps are negative emotions caused by something small like a group member annoying you, or something big like fighting with a friend. It is easy to fall into emotional traps; the key is how you react when someone upsets you, through a process called ‘unhooking’. Unhooking means freeing yourself from all sorts of emotional traps.\n\nThere are three steps to unhooking. First, unhook physically by doing something physical to release the negative energy to calm down, for instance, running, walking or simply splashing water on your face. Secondly, unhook mentally by examining the facts of the situation objectively, instead of emotionally. For example, instead of focusing on how upset you are at the situation, focus on what the solutions are to the situation. Lastly, unhook verbally by not blaming or scolding people, which could cause more conflicts or arguments.\n\nUnhook yourself from emotional traps today!","task":"Your group has to give a talk to a Secondary One class about working with people and solving conflicts. Discuss with your group what to include in your talk. You may want to talk about:","points":["the difficulties people face when working in a group","ways to solve or avoid conflicts or arguments","the benefits of working well in a group","anything else you think is important"],"ir":["Do you prefer working in a group or alone?","If you were angry with your friend, what would you do?","In group projects, who should choose the group members — teachers or students?","Have you had any positive experiences working in a group?","How would you deal with a lazy group member? ’ Would you like your school results to be based on 100% group work?","Do you find it easy to free yourself from emotional traps?","Would you rather win an argument or maintain a friendship?"]},{"id":"2013-8.3","no":"8.3","label":"Blue eyes – an ideal form of beauty?","intro":"Below is an extract from a newspaper article about eye colour and Asia’s definition of beauty:","title":"Blue eyes – an ideal form of beauty?","text":"Of all the different eye colours, blue appears to be the most desirable as there is a popular belief that people with blue eyes are considered ‘good-looking’. To cater to this desire, there are contact lenses in different colours (like green and blue) to allow people to have ani eye colour of their choice. Coloured contact lenses are popular in many parts of Asia, especially in Japan and Korea, where it is not uncommon to see girls with dyed blonde hair wearing blue contact lenses.\n\nAccording to the International Society of Aesthetic Plastic Surgeons, South Korea has the highest cosmetic surgery statistics in the world, including eye surgery to make people’s eyes larger. This has caused debates as to whether Asians believe that Caucasian eyes are more beautiful. Some say that Asians are just trying to conform to a global beauty standard, whilst others argue that Asians are striving to appear more Caucasian, since they see this as an ideal form of beauty.\n\nNow, it seems that a doctor in America is able to permanently change the colour of one’s eyes — from brown to blue! Using a laser treatment lasting only 20 seconds, the laser energy is absorbed by the eye’s brown pigment, causing the pigment tissue to change, effectively changing brown eyes to blue within two to three weeks. This procedure is pending approval and costs US$5,000.","task":"; Your group wants to discuss whether Western forms of beauty should be considered the ideal form of beauty. 4 You may want to talk about:","points":["popular beliefs about what is considered good-looking for men and women","whether the colour of one’s eyes is an important criterion in being considered good-looking","whether or not Western forms of beauty should be considered the ideal","anything else you think is important"],"ir":["Do you like your eye colour?","Would you wear coloured contact lenses, such as green or purple?","Would you want to change your eye colour? a\" What would you say to a friend who was thinking of changing their eye colour?","If you permanently changed your eyes to blue, how would your family feel?","Should Asians be criticised for wanting to look Westernised?","Do you think the procedure to change one’s eye colour would be popular in Asia?","Do you feel pressure to conform to a Westernised form of beauty?"]},{"id":"2013-9.1","no":"9.1","label":"Hong Kong’s heartbeat","intro":"Below is an extract from a local newspaper:","title":"Hong Kong’s heartbeat","text":"Hong Kong street markets are a feast for all our senses, says Douglas Young Chi-chiu, founder and chief executive of local retailer G.O.D. (Goods of Desire). He is so proud of the city’s heritage that he is helping to celebrate its street markets in a new exhibition.\n\nYoung goes to local markets so he can ‘feel’ the unique character of a place. ‘People are very friendly, more personal in the wet market. They’re what gives a city its sense of character: that’s what makes us human — unique.’\n\nYoung’s exhibition uses some of his designs based on the iconic red - street-market lamps. ‘The lamps represent the market,’ Young says. \"But rather than displaying real lamps, I’ve turned them into different sizes and functions: it’s more fun and humorous.’\n\nHe created lamps ‘like flying UFOs’. He also made chairs to look like gigantic lamps, where people can sit and chat, and designed exhibition rooms in the style of giant red lamps.\n\n‘T hope the exhibition will help Hongkongers better appreciate our unique character,’ he says. ‘Our street ; markets may be noisy and chaotic, but they’re also fun, exciting places. They’re irreplaceable; they represent Hong Kong’s identity and its traditions.’","task":"Your school wants to hold an exhibition on Hong Kong’s Identity and Traditions. It wants your group to design this exhibition. You may want to talk about:","points":["what ideas from the above article you want to include in your exhibition","what other traditional aspects of Hong Kong culture to include","how to present these things in a fun and humorous way","anything else you think is important"],"ir":["Do you like going to local wet markets?","Do you ever go to exhibitions?","Which traditional aspects of Hong Kong culture are changing?","Do you think there will still be wet markets in 50 years’ time?","What other methods can help promote a city’s traditions?","Is it important for people to appreciate their culture?","Is it always a good thing to stick to tradition?","Which traditional aspects of Hong Kong culture do you hope will never disappear?"]},{"id":"2013-9.2","no":"9.2","label":"Calculators in schools to be banned!","intro":"Below is an extract from a newspaper article about calculators in school:","title":"Calculators in schools to be banned!","text":"By 2014, the use of calculators will be banned in primary school exams in England and severely restricted in lessons because children have become ‘dependent’ on them. Studies have shown that because current rules allow schools to introduce calculators freely from thé age of seven, 98% of 10-year-olds in England rely on calculators in Maths lessons — far higher than the global average of 46%.\n\nSchools will have to avoid introducing calculators until the final year of primary school, when most children are 10 years old. Calculators will also be banned in national tests for 11-year-olds. The government hopes that this will end the habit of ‘simply reaching for the calculator’ to work out basic sums (such as 900 minus 452). According to reports, students in Singapore, Hong Kong and Massachusetts, where calculators are already banned in Maths classes in primary schools, currently outperform pupils in England in Maths at the ages of 10 and 14,\n\n‘All young children should be confident with methods of addition, subtraction, multiplication and division before they pick up the calculator to work out more complex sums. By banning calculators in Maths tests, we will reduce the dependency on them in the classroom for the most basic sums. Children will have a solid grounding in the basics so they can grow up to be comfortable with the Maths they will need in their adult lives,’ says an English official.","task":"Your group has to prepare for a debate with the motion Calculators should NOT be banned in primary schools. Discuss with your group what to include in this debate. You may want to talk about:","points":["advantages of using calculators in primary schools i","problems of using calculators in primary schools","whether or not you agree that calculators should be banned in primary schools","anything else you think is important"],"ir":["Do you like Maths classes?","Do you use a calculator for simple maths?","Are you able to do maths without a calculator?","Is it okay if primary school students use calculators at home?","Does having maths skills help you in life in general?","Do you think people who can do maths without a calculator are smarter than those who cannot?","Are schools in Hong Kong putting too much emphasis on mental arithmetic?","Do you think the dependency on calculators is a cause of poor maths results?"]},{"id":"2013-9.3","no":"9.3","label":"Book review","intro":"Below is a book review from a local newspaper:","title":"Book review","text":"What’s the story about? Hero on a Bicycle\n\nPaolo is anormal 13-year-old living in Italy in 1944, in an area by Shirley Hughes\n\ncontrolled by German troops during World War Il. Walker Books tok eK\n\nOne night he is stopped by a group of men, pulled off his bicycle and dragged into the darkness. What happens next will change his life forever and put his family and friends in great danger. Saving his loved ones and surviving the war will take all of Paolo’s courage.\n\nIs it any good?\n\nHero is a very tense and vivid tale focusing on one boy and his family. Paolo is a lively and totally believable character, It is a thrilling and emotional novel about war, but also about courage and love in the face of terrible danger and hardship. The author was influenced to write this story by real-life accounts, stories of courage and suffering from actual people.\n\nThe scene-setting and character detail help to make the book excellent. The hero on a bicycle is an ordinary boy, but his story is certainly not ordinary. This is a novel well worth searching out on bookshop shelves overcrowded with books about wizards; vampires and magic. Strongly recommended as a thrilling and original read.","task":"You have been asked to choose some English books for your school’s Reading Club and you have just read $ this review. You may want to talk about:","points":["whether you would recommend Hero on a Bicycle for the Reading Club","what other kinds of books you would choose","the benefits and challenges of reading fiction","anything else you think is important"],"ir":["What do you like reading?","Do you think reading fiction is fun for young people?","Do you prefer reading fiction in English or Chinese?","Would you rather read stories about Hong Kong or another country?","Do you prefer reading a novel or watching the movie version?","How do you choose which books to read?","Do you find reading book reviews helpful?","Is it more important to read fiction or non-fiction?"]},{"id":"2013-10.1","no":"10.1","label":"Chindōgu: Weird and Useless Japanese Inventions","intro":"Below is an extract from a website:","title":"Chindōgu: Weird and Useless Japanese Inventions","text":"The Japanese term Chind6gu (literally ‘unusual tool’) describes any invention which is so strange that you forget about its actual usefulness. So popular was this idea that Kenji Kawakami, who coined the term, founded the international Chinddgu Society. Defining a particular gadget as Chinddgu-worthy is harder than it looks. The Chinddgu Society dictates several core rules which must apply to the said invention. It must be useless and it must be real and not just a concept. Furthermore, a Chind6gu should be designed for daily use,\n\nThe Baby Mop Too much work to do around the\n\nhouse? Got a kid or two to keep an eye on? This gadget lets users keep track of their kids and get on with cleaning up!\n\nChopstick Noodle Cooler Nice and simple — attach the mini-fan to your chopsticks and start eating — your food will never be too hot again!\n\nFall Body Umbrella\n\nGetting wet because of a small umbrella is now a thing of the past. Behold, the Full Body Umbrella, an umbrella conjoined\n\nwith a lengthy plastic sheet.","task":"Your school is holding a Society Day to introduce clubs to students. Your group wants to set up a Chinddgu Society. You may want to talk about:","points":["what the aims of your society will be","what will make your society different from the other clubs","which of the above inventions you would use to promote your society","anything else you think is important"],"ir":["Which of the three inventions in the photographs do you like the most?","Would you like to be an inventor?","Why do you think some people are interested in these inventions?","Do you think younger people or older people would be more interested in these inventions?","Would people in Hong Kong use these inventions if they were promoted here?","How could schools in Hong Kong-encourage creativity in their students?","Is it easy to be an inventor?","Which invention do you wish had never been invented?"]},{"id":"2013-10.2","no":"10.2","label":"How to behave at the dining table nowadays: Rules of table manners I","intro":"Below is an extract from a newspaper article about updated rules of table manners:","title":"How to behave at the dining table nowadays: Rules of table manners I","text":"Do you like eating with your fingers? It may have been frowned upon for decades but eating with your hands our more informal times, a new ten-point guide to acceptable modern dining behaviour and manners has been released.\n\nTop tips include cutting food into manageable pieces before picking it up, using a napkin to wipe messy hands and using a fork to pick up any food that spills onto the plate, It even reassures people that it is acceptable to use cutlery like knives and forks, even if fellow diners choose not to. Many traditional rules remain, such as sitting up straight, keeping elbows off the table, and waiting for food to cool instead of blowing on it. ‘Table manners are no longer about sticking to a strict and outdated code of conduct. They exist\n\nBelow are four new rules:\n\n1. Never use your mobile phone at the table. Definitely no texting!\n\n2. Never wipe your mouth with your hand or talk with your mouth full,\n\n3. If eating with hands, take small bites so you don’t spill anything.\n\n4, If you are using a napkin, place it on your lap. Don’t tuck it into your shirt.","task":"For your school’s Mind Your Manners Week, your group has been selected to conduct a workshop on dining 7 and table manners. Discuss with your group what to include in this workshop. You may want to talk about:","points":["some kinds of behaviour that might be considered rude at the dining table","some traditional rules and updated rules on dining manners","which rule is the most important one and why","anything else you think is important"],"ir":["Do you watch TV while you are having dinner?","Do you prefer to use chopsticks, or a knife and fork? oe Do you use your mobile phone at the dining table?","Do you think table manners are important?","Should table manners be taught in school?","How do you feel about people using their mobile phones at the dining table?","Are there any cultural differences between Western and Asian table manners?","How closely should people follow the rules of table manners?"]},{"id":"2013-10.3","no":"10.3","label":"How children succeed","intro":"Below is an extract from a family magazine article about parenting:","title":"How children succeed","text":"How Children Succeed by Paul Tough (HMH, 2012) takes the reader through a series of real life examples of children, educators and psychologists who have turned out talented, intelligent and balanced people.\n\nOne of the most common aspects of the traditional Hong Kong education is that children need to be pushed as hard as possible, Tough, in the book, supports this theory with stories of how 13-year-olds from low-income families can become chess masters through putting in hours and hours of practice. It is similar to the idea that Malcolm Gladwell raised in his book, Outliers. He says we need 10,000 hours of ‘deliberate practice’ to master a skill.\n\nIn the book, Toughcites several studies that prove external incentives (rewards given by someone other than yourself) don’t work in the long term. If you offer money for blood donations, over time fewer donors show must come from within ourselves. Children need to want to succeed, to do well on the test, to understand what achieving something will bring them.\n\nWhile nowadays it may seem too cold and discouraging to have no sticker charts, house points or gold stars in school, it may be that we need to push our children to find their own internal incentives.","task":"Your group has to make a presentation to a group of parents about helping children to succeed. Discuss with your group what to include in the presentation. You may want to talk about:","points":["ways that Hong Kong parents try to help their children to succeed","what motivates Hong Kong children to succeed","advice to give parents","anything else you think is important"],"ir":["Did you enjoy your primary school life?","Do you think students should have more free time?","Do you think children in Hong Kong live a balanced life?","What motivates you to succeed?","Do you agree that children need to be pushed as hard as possible?","Do external incentives such as money or gifts motivate you to succeed?","Do you think parents in Hong Kong place too much emphasis on external success?","What is your idea of success?"]}]},{"id":"2014","year":"2014","label":"2014 DSE","tasks":[{"id":"2014-1.1","no":"1.1","label":"Is email still cool?","intro":"Below is an extract from a website about email:","title":"","text":"Having an email account used to be cool. You could send people in Africa your thoughts on a new K-Pop song, receive email confirmation for movie tickets you bought on the phone and ignore scam messages. Not anymore. Why? New York Times technology writer Matt Richtel has a theory — email just isn’t cool anymore. An email account in the year 2014 is a \"sign you’re old, It’s the technology your Dad uses\". And, as we all know, the last thing a teenager wants to be is like his Dad. It also requires a \"boringly long process of signing into an account, typing out a subject line and then sending a message that might not be received or answered for hours\".\n\nWhy Are Young People Abandoning Email?\n\nfrom Nairobi writes, \"I don’t use email for casual correspondence, why would 1? It’s too formal and unnecessary, it would be like writing your friend a long letter asking if they wanted to get coffee next Tuesday.\" Which is probably why, as Richtel notes, the \"number of visitors in the United States to major e-mail sites like Yahoo! and Hotmail is now in steady decline, peaking as long ago as November 2009\".\n\nYahoo! Senior Director of Product Management David McDowell, however, points out many email functions (attachments, cc lines) are not designed for teenagers anyway. Maybe they’ll come around when they enter the workplace.","task":"You are preparing to give a talk in your school to school leavers about writing emails in their lives after leaving school. You may want to talk about:","points":["whether young people write emails in their daily lives","the challenges young people may face when writing formal emails","the advantages of using email over other forms of communication","anything else you think is important"],"ir":["Do you write emails often?","Do you find writing emails easy or difficult?","What is the most popular way for young people to communicate with each other?","Do you prefer writing an email or writing a letter?","What is the hardest thing about writing a formal email?","What kinds of letters cannot be replaced by emails?","Why do you think emails have replaced letters?","Do you agree that using emails is a sign that you are old?"]},{"id":"2014-1.2","no":"1.2","label":"Airport Ambassadors","intro":"Below is an advertisement taken from the Hong Kong International Airport website:","title":"Airport Ambassadors","text":"The Hong Kong International Airport is looking for youths aged 18-24 to be\n\nAirport Ambassadors. These Airport Ambassadors are stationed at busy\n\nlocations throughout the airport to offer immediate assistance to anyone in\n\nneed and ensure that all passengers feel at home the minute they arrive at the\n\nairport. Typical duties of an Ambassador include providing onsite assistance to a\n\ntravellers inside the terminals and handling customer enquiries at Customer WRB Meroe Services Counters.\n\nSince the launch of the Airport Ambassador Programme (AAP) in 2002, over 560 young people have received on-the-job training and many graduate ambassadors have found their ideal- jobs in aviation or tourism related industries after completion of training.\n\nThe Airport Ambassadors’ duties include:\n\n© Greeting passengers\n\n© Answering passenger enquiries and giving directions © Offering assistance to passengers in need\n\n© Promoting passenger safety\n\nTo be eligible to apply for the AAP, candidates need to have completed secondary school but should not have a university degree. Language proficiency in Cantonese, Putonghua and English is also required.","task":"Your group is meeting to discuss the Airport Ambassador Programme. You may want to talk about:","points":["why the Airport needs Ambassadors","whether being an Airport Ambassador would be difficult for young people","what qualities/skills/characteristics are necessary to be a good Airport Ambassador","anything else you think is important"],"ir":["Have you been to the airport?","Would you like to be an Airport Ambassador?","What would be the best part of being an Airport Ambassador?","Do you think the Airport Ambassador Programme would be popular with young people?","What can the Airport do to promote its Ambassador Programme?","Should senior citizens be recruited as Airport Ambassadors?","Do you think the Airport Ambassador Programme enhances the image of Hong Kong?","es NAH RYN How do you think you would benefit from being an Airport Ambassador?"]},{"id":"2014-1.3","no":"1.3","label":"Helicopter parenting — good or bad?","intro":"Below is a letter to the editor about parenting:","title":"Helicopter parenting — good or bad?","text":"The phrase ‘helicopter parenting’ is used to describe parents who hover over their kids at all times, ready to step in at a moment’s notice to keep their children safe. I believe helicopter parenting can be a good thing for younger children. However, others think that helicopter parents create conditions that make it difficult for their kids to succeed.\n\nOur job as parents is to protect our kids and give them the tools they need to both survive and succeed in the real world. We all want our kids to grow up to be productive members of society. No one wants to be the parent who suffocates their kid. Our role is to protect them 24 hours a day, seven days a week when they first come into the world and then gradually ease off, giving them more and more freedom and responsibility as they prove ready for the task. And while kids fight for more freedom, it is ultimately up to the parent to decide what they are ready to handle on their own.\n\nWe all look down on parents who are not involved enough with their kids, who don’t spend enough time teaching them. The danger with helicopter parents is when they don’t allow their own kids to make decisions to keep themselves safe. Those are the kids who grow up to be kids unable to make good choices and unable\n\nto protect themselves from their own stupidity.","task":"Your group wants to write a letter to the editor to express your views about helicopter parenting. Discuss what to include in the letter. You may want to talk about:","points":["the qualities of good parents","whether helicopter parenting is good","other complaints young people have about the relationship with their parents","anything else you think is important"],"ir":["Do you make your own decisions in your family?","When you have a problem, do you ask your parents or your friends for help?","Is it helpful for parents to always check on their children’s studies?","Why do you think some parents want to control everything in their child’s life?","Do you think helicopter parenting is common nowadays?","Should parents allow their children to make mistakes?","What is the best way for parents to monitor their child’s development?","How can parents and children have better communication?"]},{"id":"2014-2.1","no":"2.1","label":"Crazy about food photos!","intro":"Below is an extract from an online article about taking photos of food:","title":"Crazy about food photos!","text":"Years ago, if you took out a camera to take pictures of your food, or your friend’s food, people might have laughed at you. Nowadays, more and more people are taking food photos and uploading them on Facebook, Twitter or Instagram. But according to a mental health expert, Dr. Valerie Taylor, photographing food is an indication of mental illness and of health problems. She says that those who constantly take pictures of what they’re eating usually have some type of unhealthy relationship between food and their weight.\n\n\"We take pictures of things that are important to us, and for some people, the food itself becomes central and the rest the venue, the company, etc. — is background,\" Dr. Taylor says. Obsessing about food photography could lead to \"unhealthy weight disorders\",\n\nHowever, others feel that taking photos of food could also suggest one’s eagerness to share with others what one has eaten or the celebration of one’s passion. Some also feel that a picture speaks a thousand words, and so a picture of last night’s dinner might best describe an incredible meal. It is also sometimes fun to take pictures of strange foods (e.g. grasshoppers covered in chocolate), or the food\n\nyou encounter when you are travelling to keep a memo
