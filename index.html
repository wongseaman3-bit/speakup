<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speak Up · DSE Paper 4 Coach</title>
<meta name="description" content="HKDSE English Paper 4 說話練習：歷屆題目、小組討論指引、個人回應範文、卡拉OK跟讀及 AI 發音評分。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script>
/* =========================================================
 *  ★★★ 老師只需要改呢一行 ★★★
 *  LOGIN_URL：Apps Script「登入部署」的網址（/exec 結尾）
 *  API 網址會喺同學登入時由後端自動傳過嚟，唔使填。
 * ========================================================= */
window.APP_CONFIG = {
  LOGIN_URL: 'https://script.google.com/a/macros/elearn.jccssyl.edu.hk/s/AKfycbwhhAE6MJRF5yQ6G9jKNlBnMW_0gcccPyNaaEsjbPI-uVjd635MDiuFJZ3MJnPWTOIo/exec'
};
</script>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --card2:#fbf6ec; --ink:#1d2a3a; --ink2:#3a4757; --muted:#6b7280;
  --line:#e8dfcf; --accent:#d9483b; --accent-soft:#fbe3df; --gold:#e3a33b; --gold-soft:#fbefd6;
  --sage:#3f8a68; --sage-soft:#dcefe5; --blue:#3a6ea5; --blue-soft:#dde8f5; --shadow:0 6px 28px rgba(29,42,58,.08);
  --k-bg:#141d29; --k-ink:#f4ede0; --k-dim:#6c7787;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161e; --card:#19202b; --card2:#1f2733; --ink:#eef1f5; --ink2:#cfd6df; --muted:#97a1ae;
    --line:#2b3542; --accent:#f0675a; --accent-soft:#3a2224; --gold:#f0b552; --gold-soft:#3a3020;
    --sage:#5cb48a; --sage-soft:#1d3329; --blue:#6fa0d8; --blue-soft:#1d2a3b; --shadow:0 6px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11161e; --card:#19202b; --card2:#1f2733; --ink:#eef1f5; --ink2:#cfd6df; --muted:#97a1ae;
  --line:#2b3542; --accent:#f0675a; --accent-soft:#3a2224; --gold:#f0b552; --gold-soft:#3a3020;
  --sage:#5cb48a; --sage-soft:#1d3329; --blue:#6fa0d8; --blue-soft:#1d2a3b; --shadow:0 6px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6;padding-bottom:84px}
.en,.serif{font-family:"Fraunces",Georgia,serif}
a{color:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
textarea,input,select{font:inherit;color:var(--ink)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700}
.logo .mark{width:34px;height:34px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:Fraunces,serif;font-size:19px}
.logo small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink2);font-weight:500;font-size:15px}
.nav a.on{background:var(--ink);color:var(--bg)}
.me{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--gold-soft);color:var(--ink);display:grid;place-items:center;font-weight:700}
.bnav{display:none}
@media (max-width:760px){
  .nav,.me .nm{display:none}
  .me{margin-left:auto}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:12px;padding:4px 0;border-radius:12px}
  .bnav a b{display:block;font-size:20px;line-height:1.3}
  .bnav a.on{color:var(--ink);background:var(--card2)}
}

/* generic */
h1,h2,h3{line-height:1.25;margin:0}
.h1{font-size:clamp(26px,4.5vw,38px);font-weight:700}
.h2{font-size:22px;font-weight:700}
.h3{font-size:18px;font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--card2);border:1px solid var(--line);color:var(--ink2)}
.pill.g{background:var(--sage-soft);color:var(--sage);border-color:transparent}
.pill.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.y{background:var(--gold-soft);color:#9a6a12;border-color:transparent}
.pill.b{background:var(--blue-soft);color:var(--blue);border-color:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.y{color:var(--gold)}}
.crumb{font-size:14px;color:var(--muted);margin:22px 0 8px}
.crumb a{color:var(--muted);text-decoration:none}
.sec-title{display:flex;align-items:center;gap:10px;margin:30px 0 12px}
.sec-title .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.sec-title.lock .n{background:var(--line);color:var(--muted)}
textarea,input[type=text],input[type=search]{width:100%;border:1.5px solid var(--line);background:var(--card2);border-radius:14px;padding:12px 14px;outline:none;transition:border .2s}
textarea{min-height:76px;resize:vertical}
textarea:focus,input:focus{border-color:var(--ink)}
label.q{display:block;font-weight:600;margin:14px 0 6px}
label.q small{font-weight:400;color:var(--muted)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;z-index:100;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;gap:12px;align-items:center;padding:18px;color:var(--muted)}
.note{background:var(--gold-soft);border-radius:14px;padding:12px 16px;font-size:14.5px}
.note.b{background:var(--blue-soft)}
.note.g{background:var(--sage-soft)}

/* home */
.hero{padding:34px 0 8px}
.hero .h1 span{color:var(--accent)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 16px;min-width:110px}
.stat b{font-size:22px;display:block;font-family:Fraunces,serif}
.stat span{font-size:13px;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.how div{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:14px}
.how b{display:block}
.how small{color:var(--muted)}
@media (max-width:640px){.how{grid-template-columns:1fr}}
.year{border-radius:var(--r);padding:18px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);display:block;position:relative;overflow:hidden;transition:transform .15s, box-shadow .2s}
.year:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.year .y{font-family:Fraunces,serif;font-size:34px;font-weight:700;line-height:1}
.year .t{color:var(--muted);font-size:14px;margin-top:4px}
.year .bar{height:6px;border-radius:9px;background:var(--line);margin-top:14px;overflow:hidden}
.year .bar i{display:block;height:100%;background:var(--sage)}
.task{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;transition:transform .15s}
.task:hover{transform:translateY(-2px)}
.task .no{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.task .tt{font-family:Fraunces,serif;font-size:19px;font-weight:700;margin:4px 0 6px;line-height:1.3}
.task .in{font-size:14px;color:var(--muted)}

/* task */
.tabs{display:flex;gap:6px;background:var(--card2);border:1px solid var(--line);padding:5px;border-radius:999px;width:max-content;max-width:100%;margin:16px 0 4px}
.tabs a{padding:9px 16px;border-radius:999px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:15px;white-space:nowrap}
.tabs a.on{background:var(--ink);color:var(--bg)}
.paper{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.paper .intro{font-style:italic;color:var(--muted);font-size:14.5px}
.paper .art{margin:12px 0;padding:18px 20px;border-left:4px solid var(--gold);background:var(--card2);border-radius:0 14px 14px 0;white-space:pre-line;font-family:Fraunces,Georgia,serif;font-size:16.5px;line-height:1.65}
.paper .art h3{font-size:20px;margin-bottom:10px;text-align:center}
.paper .tk{font-weight:600}
.paper ul{margin:8px 0 0;padding-left:22px}
.paper li{margin:3px 0}
.check{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.check span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.check span.ok{background:var(--sage-soft);color:var(--sage);border-color:transparent}
.unlock{display:flex;justify-content:center;margin:20px 0 6px}
.phr{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.phr:last-child{border:0}
.phr .t{font-family:Fraunces,Georgia,serif;font-size:16px}
.ibtn{border:0;background:var(--card2);width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px}
.ibtn.on{background:var(--sage-soft)}
.phrcat summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none;display:flex;justify-content:space-between}
.phrcat summary::-webkit-details-marker{display:none}
.phrcat summary::after{content:"＋";color:var(--muted)}
.phrcat[open] summary::after{content:"－"}
.phrcat{border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;text-align:left;max-width:100%}
.chip b{font-family:Fraunces,serif;font-size:16px}
.chip small{display:block;color:var(--muted);font-size:13px}
.chip.on{border-color:var(--sage);background:var(--sage-soft)}
.dir{border-radius:14px;padding:12px 14px;background:var(--card2);margin-top:8px}
.dir .s{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.gq{font-family:Fraunces,serif;font-style:italic;color:var(--ink2);margin:2px 0}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{display:flex;gap:10px;align-items:flex-start}
.bub .sp{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.bub .tx{background:var(--card2);border-radius:4px 16px 16px 16px;padding:10px 14px;font-family:Fraunces,Georgia,serif;font-size:15.5px}
.sA{background:#d9483b}.sB{background:#3a6ea5}.sC{background:#3f8a68}.sD{background:#c18421}
.vtabs{display:flex;gap:6px;margin-bottom:12px}
.vtabs button{border:1.5px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;font-weight:700}
.vtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lv{display:inline-grid;place-items:center;min-width:46px;height:26px;padding:0 8px;border-radius:8px;font-weight:800;font-size:13px}
.lv4{background:var(--blue-soft);color:var(--blue)}
.lv7{background:linear-gradient(135deg,#f5c451,#e3743b);color:#fff}
.script{font-family:Fraunces,Georgia,serif;font-size:17px;line-height:1.75;background:var(--card2);border-radius:14px;padding:16px 18px}
.qlist{counter-reset:q}
.qi{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px}
.qi .num{font-family:Fraunces,serif;font-weight:700;font-size:20px;color:var(--accent);width:26px;flex:none}
.qi .qt{flex:1}
.bigq{font-family:Fraunces,Georgia,serif;font-size:clamp(22px,3.6vw,30px);font-weight:700;line-height:1.3}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.timeline div{background:var(--card2);border-radius:12px;padding:10px;font-size:13.5px}
.timeline b{display:block;font-family:Fraunces,serif;color:var(--accent)}
@media (max-width:640px){.timeline{grid-template-columns:1fr 1fr}}
.fb li{margin:4px 0}
.fix{font-size:14.5px;margin:4px 0}
.fix s{color:var(--accent)} .fix ins{color:var(--sage);text-decoration:none;font-weight:600}
.timerchip{position:fixed;right:16px;bottom:96px;z-index:25;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 16px;font-weight:700;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.timerchip button{background:transparent;border:0;color:var(--bg);opacity:.7}

/* vocab page */
.vc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px}
.vc .w{font-family:Fraunces,serif;font-size:20px;font-weight:700}
.vc .zh{margin-top:2px}
.vc .ex{font-family:Fraunces,serif;font-style:italic;color:var(--muted);font-size:14.5px;margin-top:4px}
.hidezh .vc .zh{filter:blur(6px);cursor:pointer}
.hidezh .vc .zh.peek{filter:none}

/* karaoke overlay */
.kov{position:fixed;inset:0;z-index:60;background:var(--k-bg);color:var(--k-ink);display:flex;flex-direction:column;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.khead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #263243}
.khead .t{flex:1;min-width:0}
.khead .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.khead .t small{color:var(--k-dim)}
.kx{background:#263243;border:0;color:var(--k-ink);width:38px;height:38px;border-radius:50%;font-size:18px}
.kbody{flex:1;overflow:auto;padding:28px 18px 40px}
.kbody .inner{max-width:780px;margin:0 auto}
.ktext{font-family:Fraunces,Georgia,serif;font-size:clamp(21px,3.4vw,30px);line-height:1.85;letter-spacing:.005em}
.ktext .seg{margin-bottom:18px}
.ktext .spk{font-family:"Noto Sans TC",sans-serif;font-size:13px;font-weight:700;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;margin-right:8px;vertical-align:4px;color:#fff}
.wd{color:var(--k-dim);border-radius:8px;padding:0 2px;transition:color .2s, background .2s;cursor:pointer}
.wd.done{color:var(--k-ink)}
.wd.cur{color:#1b1206;background:linear-gradient(135deg,#ffd36b,#ff9b5e);box-shadow:0 0 0 3px rgba(255,180,90,.25);}
.ktext.plain .wd{color:var(--k-ink)}
.wd.m-miss{text-decoration:line-through;text-decoration-color:#ff6b5e;text-decoration-thickness:3px;color:#ff9c92}
.wd.m-unc{background:rgba(255,190,70,.18);border-bottom:3px solid #ffbe46;color:#ffe2a8}
.wd.m-int{text-decoration:underline wavy #7fb3ff;text-underline-offset:6px}
.kprog{height:4px;background:#263243}
.kprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd36b,#ff7a59);transition:width .2s}
.kctl{border-top:1px solid #263243;padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:center}
.kctl .row{justify-content:center}
.kbtn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;background:#263243;color:var(--k-ink);display:inline-flex;gap:8px;align-items:center}
.kbtn.rec{background:#e5483b;color:#fff}
.kbtn.go{background:linear-gradient(135deg,#ffd36b,#ff8a59);color:#1b1206}
.kbtn[disabled]{opacity:.4}
.ksel{background:#263243;color:var(--k-ink);border:0;border-radius:999px;padding:9px 12px;font-size:14px}
.klevel{display:flex;gap:3px;align-items:flex-end;height:22px}
.klevel i{width:4px;background:#ff8a59;border-radius:3px;height:4px;transition:height .08s}
.kres{max-width:780px;margin:24px auto 0;background:#1c2735;border-radius:20px;padding:20px;color:var(--k-ink)}
.kres h3{font-size:17px;margin:18px 0 8px}
.kres ul{margin:0;padding-left:20px}
.kres li{margin:5px 0}
.ring{width:118px;height:118px;flex:none}
.bars .b{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.bars .tr{height:9px;background:#2b394b;border-radius:9px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:linear-gradient(90deg,#7fd1a8,#46b07f);border-radius:9px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--k-dim);margin-top:10px}
.legend span b{display:inline-block;width:18px;height:6px;border-radius:4px;margin-right:6px;vertical-align:middle}
.kq{font-family:Fraunces,serif;font-size:clamp(24px,4vw,34px);font-weight:700;text-align:center;line-height:1.3;margin:20px 0}
.bigtime{font-family:Fraunces,serif;font-size:64px;text-align:center;font-weight:700;color:#ffd36b}
.count{position:fixed;inset:0;display:grid;place-items:center;font-family:Fraunces,serif;font-size:140px;color:#ffd36b;z-index:70;background:rgba(10,15,22,.6);pointer-events:none}
.pop{position:fixed;z-index:80;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:12px 14px;min-width:220px;max-width:300px}
.pop .w{font-family:Fraunces,serif;font-size:20px;font-weight:700}
.wov{position:fixed;inset:0;z-index:90;background:rgba(17,22,30,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fade .3s}
.wcard{background:var(--card);border-radius:24px;max-width:420px;width:100%;padding:24px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.wstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wstats div{background:var(--card2);border-radius:14px;padding:10px 4px}
.wstats b{display:block;font-family:Fraunces,serif;font-size:22px}

const PAPERS = [{"id":"2012s","year":"2012","label":"2012 Sample Paper","tasks":[{"id":"2012s-Sample1","no":"Sample 1","label":"A question of privacy?","intro":"The article below appeared in yesterday’s newspaper:","title":"A question of privacy?","text":"Members of the media often complain that the government limits their freedom of expression, though many members of the public feel there is nothing wrong with this. Some years ago, photographs of Twins singer Gillian Chung Yan-tung were published by a local magazine, Easy Finder, and they caused a real storm. The photographs were taken with a hidden camera as she was changing costumes backstage. Many people were upset by this and demanded that press freedom be restricted. The Hong Kong Performing Artists Guild condemned the incident, and insisted the government amend the law and punish the magazine’s owners.\n\n‘Some people thought that the whole episode had been exaggerated, but people buy these magazines for exactly this kind of shocking content so it’s the market itself that demands such pictures,’ explained retired editor John Peters.\n\nMike Chau","task":"Your group wants to write a letter to the editor of the newspaper responding to the points made by Mike Chau. Discuss with your group what to include in your letter in response to this article. You may want to talk about:","points":["whether the media have too much freedom","whether famous people should have their privacy protected","why people like to read magazines for their shocking content and gossip","anything else you think is important"],"ir":["Why do some people not want to be famous?","Why is it sometimes difficult being famous?","What are some of the advantages of being famous?","Why is personal privacy so important to some people?","Can famous people expect to keep their private lives secret?","How are family members of famous people affected by their fame?","Why do some people dislike the gossip magazines in Hong Kong?","Do the public have the right to know about the private lives of famous people?","Why is freedom of expression important for the media?","Are there any types of stories which gossip magazines should not publish?"]},{"id":"2012s-Sample2","no":"Sample 2","label":"Body art expresses individuality","intro":"Below is an extract from a report on youth culture in Hong Kong:","title":"Body art expresses individuality","text":"More and more teenagers are turning to different forms of body art, such as tattooing and nose piercing, to establish their personal identity and look different. One of the main reasons young people decide to modify their bodies is to look cool. Teenagers want to express their individuality and have a strong desire to stand out from the crowd. This gives them a sense of uniqueness that makes them different from everyone else.\n\n19-year-old James Keen is a typical example. He is one of the first in Hong Kong to have had the tip of his tongue split into two. ‘When I first saw it in some teen magazines, I thought tongue-splitting was the most beautiful thing I’d seen in my life,’ says James. Most of his friends do not know that he has had his tongue split unless he shows it to them. When asked how he felt about the splitting process, James said it did cause some pain for about a week, especially when he ate, but he believed it was worthwhile. ‘Piercing of the ears, nose and lips is just too common. I wanted something different.’","task":"Your group wants to write an article for your school magazine about the advantages and disadvantages of body modification. Discuss with your group what to include in your article. You may want to talk about:","points":["why some teenagers like body art such as tattooing and nose piercing","the medical dangers of body art","how Hong Kong society views people with tattoos and their bodies pierced","anything else you think is important"],"ir":["What do you think of teenagers who have tattoos and body piercing?","Why do teenagers think body art is ‘cool’?","Do any of your friends have tattoos and body piercing?","Have you ever thought about having a tattoo or body piercing?","Why is it important for teenagers to express their individuality?","How do adults and parents feel about teenagers who have body modifications?","Do teenagers go too far with body modifications these days?","What do you think are the long term problems of having a tattoo?","What other ways do young people try to ‘stand out’ from the crowd?","What advice would you give to a friend who wanted a tattoo or some kind of body-piercing?"]},{"id":"2012s-Sample3","no":"Sample 3","label":"The Respectable Addiction","intro":"The extract below appeared in a report on health and safety at work:","title":"The Respectable Addiction","text":"People in Hong Kong are famous for working long hours. However, it is now recognized that obsession with work can be an addiction. In Japan, it is called death by overwork and it is estimated to cause 1,000 deaths per year. In the USA, it is known as the ‘respectable’ addiction.\n\nAddiction to work is not the same as working hard or putting in long hours. Hard-working people generally have some balance in their lives. They spend a lot of time at work, but also set aside time for their hobbies, such as playing sport. However, work addicts think about work even when they are playing sport. The obsession with work is total. It prevents them from maintaining healthy relationships and outside interests. Work addicts neglect their health and ignore their friends and family. They avoid going on holiday so they don’t have to miss work, and even if they do go on holiday, they still think about work.\n\nOften, work addicts only realize they have a problem when something terrible happens, for example, when their health completely fails or they start having family problems.","task":"You want to prepare a presentation on work addiction for a group of young people who will soon be starting their first job. Discuss with your group what you will include in the presentation. You may want to talk about:","points":["why Hong Kong people tend to work long hours","the health and social problems that can be caused by long working hours","things that people can do to avoid work addiction","anything else you think is important"],"ir":["Do you have any friends or family members who work too hard?","What are some of the disadvantages of working on Saturday and Sunday?","Do you think young people now work harder than their parents did in the past?","How do you think children are affected by parents who work long hours?","How can children in Hong Kong help parents who have to work long hours?","How much do you believe success depends on hard work?","How might a workplace be disadvantaged by having workaholics on its staff?","Why do you think work addiction is known as the ‘respectable addiction’ in the USA?","Why do you think some people enjoy working so much?","Some people live to work and others work to live. Can you tell us which kind of person you think you are and why?"]}]},{"id":"2012p","year":"2012","label":"2012 Practice Paper","tasks":[{"id":"2012p-1.1","no":"1.1","label":"Teens far too materialistic","intro":"The letter below appeared in yesterday’s newspaper:","title":"Teens far too materialistic","text":"I think that today’s teenagers have a very casual attitude towards material possessions. From the time they are born, they get what they want, even things that are not necessary. And yet they keep demanding more from their parents. It makes no sense to buy things without thinking about the price. What’s more, youngsters are easily affected by their peers. If their friends have something new and trendy, they will also want to have it. But they do not consider whether they really need it. Parents should not buy their children too many items that they do not really need. And they should teach them to treasure what they have. They have to set a good example. Young people need to exercise self-control.\n\nY.L.","task":"Your group wants to write a letter to the editor of the newspaper responding to the points made by Y.L. Discuss with your group what to include in your letter. You may want to talk about:","points":["whether teenagers are materialistic","whether teenagers are easily affected by their peers","how young children should be educated not to be materialistic","anything else you think is important"],"ir":["What do teenagers buy that they do not need?","What should children spend their money on?","What new things do teens all want to have?","How can parents teach their children not to become so materialistic?","Why do young people want to buy brand name products?","What problems can result from becoming too materialistic?","Why do some parents give in to their children’s demands?","How can teenagers develop more self-control over their spending?"]},{"id":"2012p-1.2","no":"1.2","label":"Little Popstars / CHIC Clothing","intro":"Below are two advertisements for part-time summer jobs:","title":"Little Popstars / CHIC Clothing","text":"LITTLE POPSTARS — Recruiting Workshop Presenters\n\nDo you have a bubbly outgoing personality; good singing voice; love of children – ability to interact with all ages; responsible and positive attitude? The job requires you to run musical workshops for preschool children. Classes are 30-45 minutes in length. Training is provided. $40 per hour. Email jobs@littlepopstars.com for more details.\n\nCHIC CLOTHING — Part-time salesperson wanted for clothing store in TST\n\n4 days per week. 8-hour shifts (12pm-9pm with one hour lunch break). Good communication skills in English and Cantonese. Uniform provided. $40/hour. Contact Ms Chan at 36288070.","task":"Your group is considering whether to include the two advertised jobs in the ‘summer jobs’ section of the school magazine. Discuss with your group whether these jobs would be suitable for students. You may want to talk about:","points":["the skills students would need to do these jobs","the benefits for students who are employed in these jobs","other kinds of jobs that may be suitable for students","anything else you think is important"],"ir":["What kind of summer part-time job would you like?","What kind of job would be a dream job for you?","What kind of things do students who have a part-time job spend their money on?","Do you think students should do part-time jobs during the summer?","What skills can students learn from doing part-time jobs that they can’t learn at school?","Do you think part-time jobs affect school work?","What should you do in order to be successful in a job interview?","What kinds of part-time jobs should secondary school students avoid?"]},{"id":"2012p-1.3","no":"1.3","label":"Out of this world","intro":"The article below appeared in a local newspaper:","title":"Out of this world","text":"An American who claims that he was taken away by aliens left some members of his Hong Kong audience completely lost. 56-year-old market researcher Jim Sparks was invited to speak by the Hong Kong UFO (Unidentified Flying Objects) Club.\n\nSparks said aliens first abducted him in 1988 when he was a property developer. He said, ‘I had a good business and a good life when one day I was pulled from my bed into an alien spacecraft.’ At first he refused to co-operate with the aliens. But as the years passed, he got to understand more about them and even seemed to have won the trust of the aliens. ‘They know us better as a person than we know ourselves. Not only can they read our minds, they also have the technology to be invisible,’ Sparks insists.\n\nWhile many of the audience listened quietly, some had clearly had enough. One of those who headed for the door said, ‘He’s a pretty good storyteller because he seems so sincere, but for me it’s too much like science-fiction.’","task":"You want to write an article discussing whether you think aliens exist. Discuss with your group what you will include in the article. You may want to talk about:","points":["whether there is life on other planets","whether you believe that aliens have visited Earth","whether aliens would be a threat or a benefit to our planet","anything else you think is important"],"ir":["What do you think aliens would look like?","Do you enjoy watching movies about aliens?","Would you believe someone if they said they had met an alien?","What information about human beings do you think might be useful for aliens to learn?","Is it worth spending money on trying to locate alien life in the universe?","If there are no aliens, why do so many people claim to have met them?","If there were aliens, what would they think about human life on earth?","What positive outcomes could result from learning about alien culture?"]}]},{"id":"2012","year":"2012","label":"2012 DSE","tasks":[{"id":"2012-1.1","no":"1.1","label":"An intern in Hong Kong","intro":"Below is an extract from a newspaper interview with an intern in Hong Kong:","title":"An intern in Hong Kong","text":"Student Fonnie Tang joined an accounting firm during the summer holidays as an unpaid intern. She wanted to gain work experience for her future career. She talks about how crucial her internship is to her becoming an accountant.\n\nWhat was your internship like? I attended a one-week training course to learn about accounting techniques. After training, I was assigned to assist some of the permanent staff.\n\nWhat did you do during the internship? I followed company staff on visits to clients’ offices, prepared financial balances and statements, and so on.\n\nWhat were the major challenges? Assisting colleagues in the preparation of accounting documents can be complicated!\n\nWhat have you learned about your chosen career? You need to have good interpersonal skills to get on well with clients.\n\nAny advice for potential interns? Recognise your weaknesses and utilise your talents. The key to success is to have a sincere heart and a desire to learn.","task":"Your group wants to write a report about professional internships in Hong Kong. Discuss with your group what to include in your report. You may want to talk about:","points":["how an unpaid internship could be beneficial","what the challenges would be of being a summer intern","what characteristics a good intern should have","anything else you think is important"],"ir":["What job would you like to do in the future?","Would you like to apply for a summer internship?","Which company would you like to work for as an intern?","Why do you think some students would not be keen to be a summer intern?","How would you persuade your parents to let you be an intern?","Should all students be required to participate in an unpaid internship?","Do you think students who have participated in an internship have an advantage in finding good jobs?","Which is more important in achieving success in your career — qualifications or experience?"]},{"id":"2012-1.2","no":"1.2","label":"Mooncake giving — a time-honoured or outdated tradition?","intro":"Below is an extract from an article which appeared in a newspaper on the Mainland:","title":"Mooncake giving — a time-honoured or outdated tradition?","text":"For centuries, mooncakes were the symbol of China’s Mid-Autumn Festival, but in recent years they have become associated with excessive packaging and high calories,\n\nIn 2009 alone, China produced 250,000 tons of mooncakes, and wrapping paper consumed more than 6,000 trees, according to the People’s Daily website. However, regulations introduced by the Chinese government appear to have exerted a major influence on the mooncake market. ‘Mooncakes have less wrapping compared to last year and more are in recyclable paper boxes rather than metal ones,’ said a Walmart salesperson in Beijing.\n\nWhile luxury boxes may not be as prominent this year, there is not much change to the Mid-Autumn ‘gift culture’ at the core of the excess. ‘It has become a custom we tiredly follow,’ said one customer, referring to the practice of sending expensive mooncakes to superiors and important friends. Until the Chinese start to question the time-honoured but outdated gift-sending mentality and encourage better packaging and recycling standards, Mid-Autumn Festival will continue to be a time of wasteful over-consumption.","task":"Your group is discussing the tradition of giving mooncakes, You may want to talk about:","points":["whether the tradition of giving mooncakes is wasteful","whether traditional mooncakes should be replaced with non-traditional versions","how the festival can be celebrated in a more environmentally-friendly way","anything else you think is important"],"ir":["How do you celebrate Mid-Autumn Festival?","Does your family eat all the mooncakes they receive?","Do you feel that it is important to buy mooncakes to celebrate Mid-Autumn Festival?","How do you feel about the variety of non-traditional mooncakes now available?","Do you think that cheaper, more simply packaged mooncakes are as attractive as a gift?","Do you think businesses should be fined for excessive mooncake packaging?","Do you agree that Hong Kong people are losing interest in giving mooncakes?","Do you think it is important to maintain traditions like the giving of mooncakes?"]},{"id":"2012-1.3","no":"1.3","label":"Cosplay in Hong Kong","intro":"Below is an extract from a blog about cosplay in Hong Kong:","title":"Cosplay in Hong Kong","text":"Japanese manga (comics) are becoming more popular worldwide, and thanks to easy access to multimedia and the internet, the youth in Hong Kong have become more involved in costume play, otherwise known as cosplay — the act of dressing up in costumes and wigs and behaving like their favourite characters in popular manga.\n\nIndeed, the number of local youths participating in cosplay has increased sharply. However, some of the experienced cosplayers think that the standard of new cosplayers (who have less experience) is unacceptable, and feel that they are ruining the image of Hong Kong cosplayers in general. This is because they think that the newcomers’ cosplay appearance does not accurately resemble the manga character, and they may not fully understand the character that they are impersonating.\n\nAccording to one blogger, this creates conflict among new and experienced cosplayers, threatening the harmonious environment of cosplay in Hong Kong.","task":"Your group wants to give a presentation about cosplay in Hong Kong. Discuss with your group what to include in your presentation. You may want to talk about:","points":["whether cosplay is popular in Hong Kong","how Hong Kong society views cosplayers","how experienced cosplayers can help new cosplayers","anything else you think is important"],"ir":["Why do some people like to read comic books?","Do you have any friends or family who enjoy dressing up as manga characters?","Would you dress up as a character from a comic book?","Do you think cosplay is more popular among boys or girls?","How would your parents feel about you participating in cosplay?","What do you think of people who enjoy cosplay?","Why do you think some young people enjoy the culture of cosplay?","In what other ways do young people express their identity?"]},{"id":"2012-2.1","no":"2.1","label":"King of Comedy","intro":"The biography below appeared in an online entertainment magazine:","title":"King of Comedy","text":"The ‘king of comedy’ Stephen Chow’s sense of humour and sharp wit have created some of the most hilarious moments in Asian cinema. As an actor, director, producer and scriptwriter, Chow has consistently produced films that have turned into box office gold.\n\nChow’s entry into comedy began with the 1990 film Al! For The Winner. Received well by Asian audiences, Chow began to develop his distinct brand of humour known as ‘Mo Lei Tau’ and by 1994, found himself capable of writing and directing successful films of his own, such as From Beijing with Love, God of Cookery and King of Comedy.\n\nAttempting to cater to a wider audience outside Asia, Chow began to change the comedic style of his films, producing big budget productions which employed more comedic action, special effects and computer generated imagery, as seen in his 2001 hit Shaolin Soccer. His follow-up film Kung Fu Hustle finally brought him international acclaim, winning a BAFTA for ‘Best Film Not in the English Language’ and ‘Best Director’ at the Golden Horse Film Awards.","task":"You are members of the film club at your school. You want to organize a Stephen Chow festival. You may want to talk about:","points":["aspects of his life and career people would be interested in","how you would get information about Stephen Chow","activities that you could organize","anything else you think is important"],"ir":["Would you want to become a famous actor?","Do you prefer funny movies or serious movies?","Should famous actors be paid a lot of money?","Do you think famous actors are happy?","What school subjects may help someone become an actor?","What in your opinion makes a good actor?","Can a serious message be expressed through comedy?","Do you think it is easier to make good comedy or good drama?"]},{"id":"2012-2.2","no":"2.2","label":"Smart technology?","intro":"Below is an extract from an article about technology:","title":"Smart technology?","text":"Forget super-smartphones and iPads; here arc two products that are different in today’s consumer-technology inencbasevonsssenecensesenessuseussnsuenssueeseaasuteseuneetneceesennsscunenseseanenseasess The Karotz A 23cm-tall white The Pogoplug This device allows bunny with a Hello you to put your Kitty-type face and a personal files online glowing tummy, it is without trusting them described as ‘an to a third party’s intelligent house servers, where they robot’. could be hacked. Your data never tt has a speaker for leaves your control. playing internet radio, a webcam and By connecting your a synthesized voice __ computer to a that can read you Pogoplug, you’re newspaper headlines. creating your own In fact, a child could personal storage use the Karotz to system for all your signal to a parent at files such as music, work that he is home movies and photos. from school.","task":"Your group wants to write an article for your school magazine about technological products such as the Karotz and the Pogoplug and their usefulness in our lives. Discuss with your group what to include in your article. You may want to talk about:","points":["why people like to use technological products","the benefits of technological products in our lives","whether all technological products are useful","anything else you think is important"],"ir":["What technological product would you like to have?","What kinds of technological products do you use in school or at home?","Do you think young people enjoy using the latest technological products more than older people?","Do you believe that technology has improved our lives?","Do you believe that technology has negatively affected our lives?","Do boys and girls like different technological products?","What technological product can you not live without?","Why do you think some people enjoy using the latest technology so much?"]},{"id":"2012-2.3","no":"2.3","label":"Tips for writing a diary","intro":"The suggestions below appeared on Wikihow:","title":"Tips for writing a diary","text":"Pick a cover design that you think is nice or suits your style.\n\nTry starting the entry with something catchy or exciting and then end with writing your feelings about the day or doing a drawing to show how you are feeling.\n\nA format you can use is to write your entry on one side of the page and on the other side put a picture or include a souvenir like an entrance ticket to a show.\n\nMake it good to read. When you look back you want to enjoy reading it.\n\nWrite all of your deep thoughts. If you keep things inside of you, there's no point in keeping a\n\ndiary. Keep it neat! Try not to write in it more than once a day.\n\nDon’t worry if you can't write every day.","task":"Your teacher wants to promote the use of diaries so that students get more writing practice. You may want to talk about:","points":["why it is useful to keep a diary","how to make a diary interesting and memorable","which tips you would find most useful for writing a diary","anything else you think is important"],"ir":["Have you ever kept a diary?","Would you prefer to write a diary on paper or online?","What problems could occur if you lost your diary?","Would you prefer to write a diary in your first language or in English?","How would you feel if someone read your diary?","Should parents have the right to read their child’s diary?","Would you read someone’s diary if you found it?","What might you learn about yourself, if you looked at your diary ten years later?"]},{"id":"2012-3.1","no":"3.1","label":"The race is on!","intro":"Below is an extract from a column about a cross-harbour race in Hong Kong:","title":"The race is on!","text":"After a break of 30 years, the cross-harbour race is being organized once again. Participants have to swim from Sam Ka Tsuen Public Pier in Lei Yue Mun to Quarry Bay Park, a distance of 1.8km. The number of participants is limited to 1,000, and in order to qualify as a participant, interested applicants need to show that they can swim 1,500 metres in 45 minutes.\n\nOne concern is whether the quality of water is suitable for swimmers, and another is whether the currents may be too strong. However, it seems that the swifter currents at Lei Yue Mun firstly help to keep the water cleaner than other parts of the harbour, and secondly help the swimmer to go with the flow to make the race easier. The event will not be harmful to swimmers, according to the organizers, the Hong Kong Amateur Swimming Association, and they hope to make the cross-harbour race an annual event.","task":"Your group is going to write an essay about the cross-harbour race in Hong Kong for a class assignment. Discuss with your group what to include in your essay. You may want to talk about:","points":["the popularity of swimming in Hong Kong in general","any potential dangers of swimming across the harbour","the benefits of the race for participants and Hong Kong","anything else you think is important"],"ir":["Do you prefer swimming in a swimming pool or in the sea?","Why do you think some people would enjoy swimming across Victoria Harbour?","How difficult do you think it would be to swim across Victoria Harbour?","Why do some people prefer swimming in the sea or ocean, rather than swimming in a pool?","Where would another good place be in Hong Kong to hold a swimming race?","Why do you think the quality of water is important to swimmers?","What kind of safety measures should the race organizers have in place?","Do you think that making the cross-harbour race an annual event would benefit Hong Kong?"]},{"id":"2012-3.2","no":"3.2","label":"OXFORD SCHOOL OF ENGLISH","intro":"The advertisement below offers study tours to England:","title":"OXFORD SCHOOL OF ENGLISH","text":"Study Tour Programmes (June-August)\n\nAirport greeting and transfer You will be picked up from the airport and taken to our centre where you will be introduced to your host family.\n\nHomestay accommodation\n\nHomestay accommodation not only offers students an opportunity to experience English culture but also provides a real environment for them to practise their English. The homestay programme allows students to have their own room, sample English homestyle cooking and be treated as part of their host family.\n\nEnglish language classes Three hours of intensive English classes every weekday morning.\n\nEducational excursions and sightseeing tours Excursions to historic sites and places of local interest are offered three afternoons a week. Full-day excursions are provided on Saturdays.\n\nRecreational activities A range of sporting and recreational activities are provided two afternoons a week.","task":"Your school is planning a one month summer study tour to England. Discuss with your group the pros and cons of going on a study tour. You may want to talk about:","points":["what skills or knowledge can be gained from study tours","what difficulties or problems might be encountered on a study tour","whether you would recommend the above programme for your school","anything else you think is important"],"ir":["Would you like to go on a study tour?","In which country would you most like to go on a study tour?","Would you prefer to stay with a host family or in a hotel on a study tour?","What aspects of staying with a host family would worry you most?","Why do you think study tours are becoming more popular with Hong Kong schools?","Do you think it would be difficult to mix with students from other countries on a study tour?","In what ways would going on a study tour help you become more sociable?","What are the ideal qualities of a host family?"]},{"id":"2012-3.3","no":"3.3","label":"Sushi 101 workshop","intro":"The activities below appeared in a local food magazine:","title":"Sushi 101 workshop","text":"One-day sushi workshop taught by executive Sushi Chef, Hiroshi Nagashima. Learn how to make your own rolls and eat what you create! All materials are included.\n\ne Lecture: history of sushi and how to make sushi rice\n\n+ Demonstration: cutting and decorating rolls\n\n« Hands-on practice: basic rolls & special rolls\n\n« Tasting time!\n\nThe world of Japanese food decoration\n\nJapanese food is renowned for its elegant presentation. Acclaimed chef Hiroshi Nagashima will show you more than 60 garnishes for home parties and give you insider tips for successful presentation. Most are simple enough to master in seconds, although a handful will challenge your skills.\n\nNight out in a sushi bar\n\nThe sushi conveyor belt is far from monotonous and the conveyor belt sushi bar is a great way to host a party. Sushi, cocktails or other delicacies are placed on the conveyor belt while guests feast their eyes on all those culinary delights passing by.","task":"You are members of a Japanese Cookery Club. Your group wants to organize a welcoming event for new members. You may want to talk about:","points":["which activity would be best for attracting new members","how the event could be promoted","what other events the club could organize in the future","anything else you think is important"],"ir":["Would you tike to work in a sushi restaurant?","Would you like to attend a cookery workshop?","Why do you think Japanese food is popular in Hong Kong?","Is food decoration or taste more important?","What are some major differences between Japanese and Chinese food?","Do you think there are health risks in eating raw fish?","Would you recommend a conveyor belt sushi bar to someone who has never been to one?","Do you think Japanese food’s reputation for being healthy is justified?"]},{"id":"2012-4.1","no":"4.1","label":"A lack of space","intro":"The editorial below appeared in a local newspaper:","title":"A lack of space","text":"Hong Kong is one of the most overcrowded cities in the world. With a population of 7 million squeezed into a small area, buildings have had to be built much higher to accommodate the expanding number of people who live and work in the city. While the height of buildings has risen, the size of the flats inside has got smaller. It is not uncommon for several family members to be sharing a small two bedroom apartment. What effect does this lack of space have on people?\n\nIncreased mental problems is one issue associated with cramped living. Another is antisocial behaviour, especially when people are living in subdivided flats, where they often live in only one room with facilities that they must share with strangers. Indeed, problems are not just restricted to dealing with non-family members; a lack of space can also make it much more difficult to have harmonious relationships with those who are closest to us.","task":"Your group wants to gather information about the lack of space in Hong Kong for a group project. You may want to talk about:","points":["how a lack of space affects the lives of Hong Kong people","how Hong Kong people cope with having so little space","any possible benefits of Hong Kong’s lack of space","anything else you think is important"],"ir":["Where do you go when you need more space?","Do you feel that Hong Kong is a very crowded city?","How does living in crowded conditions affect you?","What are the disadvantages of sharing a room with another family member?","Do you think that the public places in Hong Kong provide enough space for people?","What should the government do to create more space?","What advice would you give to someone who has to live in crowded conditions?","How can a lack of space affect a person’s mental health?"]},{"id":"2012-4.2","no":"4.2","label":"‘Take a Brake’ Low Carbon Action Scheme","intro":"The information below appeared on the ‘Take a Brake’ Low Carbon Action website:","title":"‘Take a Brake’ Low Carbon Action Scheme","text":"The ‘Take a Brake’ Low Carbon Action scheme is a green initiative that encourages people to drive less and adopt green driving habits, as well as to promote low carbon living among non-drivers. The scheme is designed to target schools, corporations and the general public.\n\nThe School Engagement Programme aims to enhance students’ understanding of emissions and to promote the concept of ‘no car’. The programme mobilizes students to become ‘Young Ambassadors’ to invite the public to support the ‘Take a Brake’ Low Carbon Action scheme and to opt for public transportation rather than drive private cars. Through a series of educational activities, the scheme intends to give the public a better understanding of the issues of climate change and what each individual can do to reduce their ecological footprint on a daily basis.\n\nSince 2010, more than 4,000 kindergarten and primary school students have been recruited as ‘Young Ambassadors’. They have actively promoted the ‘no-car’ concept to drivers. Over 6,000 pledges have been received from individuals who have agreed to lead a low carbon lifestyle and drive one day less per month.","task":"You are members of your school’s student council and are considering whether to promote the ‘Take a Brake’ Low Carbon Action scheme in your secondary school. You may want to talk about:","points":["what the benefits of such a scheme would be","what students can do to become involved","how such a scheme could be promoted","anything else you think is important"],"ir":["Why do some people want to own a car?","Would you want to be a ‘Young Ambassador’ for the scheme?","Do you think it is a necessity to own a car in Hong Kong?","What are the disadvantages of owning a car in Hong Kong?","What are the advantages of alternative modes of transport other than a car?","Do you think it is possible to ban all private cars from Hong Kong roads?","What measures could the government take to reduce the number of cars on the roads?","Do you think such a scheme will have an effect on improving the environment?"]},{"id":"2012-4.3","no":"4.3","label":"3D: I see the future","intro":"Below is a newspaper report about 3D animated movies:","title":"3D: I see the future","text":"With the success of the re-release of the animated movie The Lion King 3D, Disney and Pixar (an animation company) have decided to update four of their hit animated films into 3D — namely Beauty and the Beast, Finding Nemo, Monsters, Inc. and The Little Mermaid,\n\nFans of these Disney classics are sure to be delighted at being able to watch these films with wonderful 3D visual effects. \"We’re thrilled to give audiences of all ages the chance to experience these beloved tales in an exciting way with 3D — especially for the younger generation,\" said the president of Walt Disney.\n\nThe Lion King 3D earned over US$80 million in America alone; many believe that the Disney 3D movies would do well in Hong Kong because the number of 3D cinemas and 3D-produced films here has grown, according to officials. Ticket sales have increased, reflecting the demand for 3D movies.","task":"Your group wants to give a presentation about 3D movies in Hong Kong. Discuss with your group what to include in your presentation. You may want to talk about:","points":["why 3D movies have become popular in Hong Kong","whether all movies should be changed into 3D format","other effects that can make watching movies more realistic","anything else you think is important"],"ir":["Do you prefer to watch a regular movie or a movie in 3D?","Would you like to have a 3D television at home?","Do 3D movies appeal more to younger people or older people?","Why do some people not enjoy watching a 3D movie?","Do you think it is better for cinemas to provide 3D glasses, or should customers bring their own 3D Is it a good idea for movies to be re-released in 3D in order to attract a younger audience?","Which is more important in a movie — a good story or the visual effects?","Which types of movies have the most effective 3D effects?"]},{"id":"2012-5.1","no":"5.1","label":"The destruction of Hong Kong’s heritage","intro":"The article below appeared in a newspaper:","title":"The destruction of Hong Kong’s heritage","text":"Rather than show care and concern for the city’s environment and architectural heritage, Hong Kong’s tycoons and prominent citizens have been accused of going out of their way to destroy it in exchange for profit. The landmark Wan Chai Market is becoming the base of a giant residential block, which will see its heritage and architecture destroyed. And now a developer has put in a demolition plan for what is probably the oldest house on the Peak, a handsome villa constructed in 1887.\n\nThe government, for its part, has destroyed by reclamation a huge area of the harbour at Central, and now proposes to sell the west wing of the Central Government Offices for redevelopment. The offices are part of Government Hill, Hong Kong’s last true heritage zone, which its own consultant recommended be part of a new protected area. The government’s intention to sell this important part of Government Hill, presumably to one of the developers that have already destroyed so much of the city’s heritage and environment, will critically destroy the beauty of this heritage area.","task":"Your group are members of a heritage conservation society and want to write a letter to a local newspaper expressing your views on this issue. You are meeting to discuss what to include in the letter. You may want to talk about:","points":["why certain buildings should be preserved","how to balance urban development with heritage conservation","what action should be taken to help preserve such buildings","anything else you think is important"],"ir":["What are your favourite old buildings in Hong Kong?","Do you think Hong Kong people prefer to keep old buildings or build new ones?","How can heritage conservation promote tourism?","Do you think the older or younger generation cares more about heritage preservation?","How can heritage conservation help educate people about the past?","When would it be appropriate to destroy heritage buildings?","What other things apart from old buildings need to be saved to preserve Hong Kong’s heritage?","What criteria should be considered when deciding whether buildings should be preserved?"]},{"id":"2012-5.2","no":"5.2","label":"Dolphins under threat","intro":"The article below appeared on a conservation website:","title":"Dolphins under threat","text":"Experts warn that building a third runway at Chek Lap Kok Airport will pose a serious risk to the ever-decreasing population of Chinese white dolphins. Since 1997, 135 white dolphins have died. Nobody really knows what will happen to the remaining 200 dolphins in Hong Kong waters, if the planned development goes ahead. This is mainly due to the fact that the remains of the dead dolphins are generally in such poor condition that it has been impossible to work out what caused their death. Possible reasons are collisions with sea traffic, pollution and disease.\n\nReclamation would increase the size of the airport by another 50 percent and would be in an area inhabited by the dolphins. Along with other infrastructure projects, such as the construction of the bridge linking Hong Kong to Macau, many people believe the dolphins’ survival can only happen if major conservation measures are adopted.","task":"Your group are members of the Dolphin Conservation Society. You want to raise public awareness about the impact of economic development on the survival of the Chinese white dolphin. You may want to talk about:","points":["why the dolphins should be better protected","how the threat to the dolphins can be highlighted to the public","whether protecting dolphin habitats is more important than the development of infrastructure","anything else you think is important"],"ir":["Would you like to see the Chinese white dolphin in the wild?","What would you do to show your support for the dolphins?","Do Hong Kong people care about what happens to the Chinese white dolphins?","Would you like to work for an organization that protects endangered animals?","How can environmental groups help to protect dolphins?","Can tourism help protect dolphins?","In what ways could the media be used to publicize the dangers the dolphins face?","Are we using up too many resources trying to save endangered animals?"]},{"id":"2012-5.3","no":"5.3","label":"Teaching money smarts to kids via cartoons","intro":"Below is a newspaper report about teaching children how to manage their money:","title":"Teaching money smarts to kids via cartoons","text":"Most children in Hong Kong get pocket money but, according to parents in a survey, it seems only a few believe their children have very good money management skills. Yet nearly all parents think it is important for kids to learn responsible money management skills, and would like tools to help them teach these skills.\n\nA new cartoon show — Cha-Ching Money Smart Kids — features a band called Cha-Ching whose aim is to teach children the basic concepts about money in a fun and engaging way. The programme stresses four basic money management concepts — earn, save, spend and donate — so children learn the many ways they can use their pocket money. Most importantly, they are taught the differences between wants and needs.\n\n\"Changing behaviour takes practice and Cha-Ching gives kids the chance to practise the four money management concepts. Ultimately, this practice will help build essential and responsible money management habits,\" says the show’s creator.","task":"Your school is considering whether to show the Cha-Ching Money Smart Kids cartoon to teach good money management skills. Your group is discussing whether this is a good idea. You may want to talk about:","points":["why it is necessary to teach good money management skills","whether showing a cartoon is the best way","what additional activities could be introduced","anything else you think is important"],"ir":["Are you good at saving money?","How do teenagers in Hong Kong spend their money?","Have your parents ever taught you money management skills?","Do you think schools should teach money management skills?","Should teenagers be given pocket money or have to earn it?","Do you think that donating money is an important component of good money management skills?","Do teenagers know the difference between wants and needs?","Of the four basic money management concepts — earn, save, spend and donate — which are you worst at?"]},{"id":"2012-6.1","no":"6.1","label":"E! Torico","intro":"Below is a review of a restaurant in Hong Kong:","title":"E! Torico","text":"Although El Torico is a well-known Spanish restaurant in Tai Koo, we had not reviewed it before. After finally trying their food though, we felt like we hadn’t been missing out on much. The place itself is quite pleasant, with colourful and welcoming Spanish decoration. We sat down and ordered a couple of items from their menu for dinner.\n\nThe prawns with garlic and chili came nicely cooked, tender and juicy. The Iberico ham, though a small portion (15 grams) and a bit too soft, was only passable. Their mushroom and spinach dish was too creamy. Our main course was their signature paella (rice). We weren’t expecting too much given its price ($128 for two people), but were still disappointed at the limited ingredients (a count-on-your-fingers amount of clams, prawns and chopped sausage) and the dry rice!\n\nAlong with its poor service, almost everything at El Torico screamed \"below average\". We’re not very keen on going there for food again.\n\nVerdict: 2 out of Sstas kK wk we ww","task":"Your group is doing a project on restaurants in Long Kong. Your group has to write reviews of different restaurants. You may want to talk about:","points":["the different kinds of cuisines in Hong Kong","the characteristics of a good restaurant","what a good restaurant review should include","anything else you think is important"],"ir":["What is your favourite restaurant?","Have you ever been to a bad restaurant?","Which is more important to you when choosing a restaurant — its food or its decoration?","Which is worse — poor service or bad food?","Which would you trust more —a restaurant review or your friend’s recommendations?","Do you think restaurant reviews are reliable?","Should restaurants respond when they receive a negative review?","How can restaurants get feedback from customers?"]},{"id":"2012-6.2","no":"6.2","label":"Reality TV","intro":"The article below appeared on a website about reality TV:","title":"Reality TV","text":"A reality show is a kind of television show in which members of the public or celebrities are filmed living their everyday lives or undertaking specific challenges. They are usually asked to describe afterwards their thoughts and feelings while they were taking part in the activity.\n\nCritics of this genre think that reality TV has a negative impact on society because it reinforces bad stereotypes and immoral behaviour, such as greed and vanity. For example, in ‘Fear Factor’, a prime-time reality game show, contestants had to swallow live cockroaches in order to stay in a competition to win million dollars.\n\nProponents of reality TV maintain that it engages with hot topics such as class and race, and captures the human spirit in a way that sitcoms and dramas cannot do. One critic argued that reality shows have the power to break stereotypes citing Susan Boyle, the homely singer who became a star after performing on ‘Britain’s Got Talent’, a reality show where people compete to become famous singers.","task":"Your group is doing a project to find out how popular reality TV shows are in Hong Kong. You may want to talk about:","points":["how people of different generations view reality shows","what type of reality shows people prefer","reasons why these shows are popular/unpopular","anything else you think is important"],"ir":["Do you like watching reality shows?","Would you want to be a participant in a reality show?","Which TV shows do you prefer watching — reality shows or traditional dramas?","Which do you prefer watching — reality shows or comedy?","Would a reality show featuring famous celebrities be popular in Hong Kong?","How might winning a reality show change the winner’s life?","Do you think reality shows have a positive or negative impact on society?","Some critics of reality TV call it ‘Humiliation TV’. Would you agree?"]},{"id":"2012-6.3","no":"6.3","label":"Teaching English via video games","intro":"Below is a newspaper article about an English teacher’s innovative teaching methods:","title":"Teaching English via video games","text":"An English teacher in Malaysia has been teaching English through the method he knows best — video games. He strongly believes that video games change the way students learn the language. \"Video games are packed with action and rich graphics. There are also words and phrases used in the games which I believe can be learnt by students,\" he said.\n\nHe found that using animation, songs and Internet material in his classroom was really effective in capturing the students’ attention, enhancing their interest and improving their English. \"I found that it is easier to teach students using pop culture and technology, which can help to bridge the gap between the teacher and student,\" he added.\n\nHe himself enjoys playing video games, including simulation and role-playing games, for up to four hours a day. \"People always assume that playing video games is bad for you, but I believe in keeping a balance between work and play,\" he says.","task":"Your group has to write a blog about English lessons in Hong Kong. Discuss with your group what to include in your blog. You may want to talk about:","points":["any interesting English lessons you’ve had in school","any English lessons you’ve had in school that were not enjoyable","advantages or disadvantages of using video games in English lessons","anything else you think is important"],"ir":["Would you enjoy learning English through video games?","Is it important for teachers to make English lessons fun?","Can video games be used to teach other subjects?","Would teachers who use video games to teach English be popular?","How effective is the use of technology in teaching English?","Do you think that a student’s English proficiency would improve through the use of songs?","Apart from using video games, what else can teachers do to enhance students’ interest in learning Do you think it’s important to have a balance between work and play in the classroom?"]},{"id":"2012-7.1","no":"7.1","label":"Home swapping vacations","intro":"The article below appeared on a home swapping website:","title":"Home swapping vacations","text":"Home swapping for vacation travellers has been around for 60 years, but it’s only in recent years that it has caught on in Asia. Initiated by a group of European teachers in the 1950s, this mode! of home swapping travel can be generally described as ‘I stay at your place — you stay at mine.’ A variation is that the two parties alternately host each other, saving each other the expense of accommodation and providing a more ‘local-flavoured’ trip.\n\nHome swapping deals are usually made online, through home swapping agencies such as Homeexchange.com, where registered members have their personal profiles, pictures of their houscs and preferred destinations posted online. They are then able to match with others looking for exchanges.\n\n‘It is true that in Asian culture, we don’t fancy inviting strangers to our homes nor do we feel comfortable at other people’s places. People are more concerned about the potential risks rather than the benefits when talking about home swapping,’ said Steve Xue, Asian President of Homeexchange.com. He compares it to online dating which was initially rejected by mainstream society due to the potential risks, but he believes that business will boom once the positive aspects of home swapping are better understood by the public.","task":"Your group thinks that home swapping might be a good idea for a family vacation but you would like to discuss the pros and cons. You may want to talk about:","points":["what the risks of home swapping are","what the advantages of home swapping are","whether local culture can be better experienced through home swapping","anything else you think is important"],"ir":["Would you like to stay in someone else’s home while on vacation?","If you had a choice, would you prefer to stay in a hotel or someone’s home?","What information would be useful to know before selecting a suitable home swap?","Do you think home swapping will ever become popular in Hong Kong or Asia?","What would be your greatest concern if you swapped homes?","If you had a chance to swap homes, what kind of dream home would you like to live in for a day?","What aspects of a Hong Kong flat would people from overseas dislike?","If someone stayed in your home, what do you think they would learn about life in Hong Kong?"]},{"id":"2012-7.2","no":"7.2","label":"Toy town","intro":"The article below appeared in a newspaper:","title":"Toy town","text":"Hong Kong has been making many of the world’s toys for the past 60 years, and while production takes place in Chinese factories, it is still Hong Kong companies which are responsible for the action figures, dolls and remote-controlled cars placed under Christmas trees the world over. ‘Seventy percent of global toy products are made by Hong Kong-run companies,\" says Mr Yeung, the executive vice president of the Toy Manufacturers Association of Hong Kong.\n\nA new exhibition organised at the Hong Kong Design Institute of more than 1,000 Hong Kong-made toys will showcase the territory’s toy-making roots and may eventually lead to a permanent museum. It features all types of playthings, from rare Qing dynasty figurines to the Cabbage Patch dolls and Teenage Mutant Ninja Turtles produced during the industry’s 1980s heyday and the latest digital toys that hook up to iPods and iPhones.\n\nBut with kids turning to non-traditional playthings such as video games, computers, music and cosmetics at younger ages, some say toy manufacturing may be a sunset industry. That is something that Mr Yeung can’t bring himself to agree with. ‘As long as there are kids, they will need toys to play with.’","task":"Your group is working on a project on the changing trends of toys and games in Hong Kong. Discuss with your group what to include in the project. You may want to talk about:","points":["whether traditional toys and games are still popular","the advantages of non-traditional toys compared to traditional toys and games","what kinds of toys and games will be popular in the future","anything else you think is important"],"ir":["What was your favourite toy or game when you were growing up?","Do you still have toys or games from when you were a child?","Do you think Hong Kong should open a toy museum?","What qualities do you look for when you buy a toy or game?","Do you think children should have more time to play with toys or games?","Are there toys or games that parents wouldn’t want their children to play with?","Do you think that as a result of high-tech toys, children are growing up more quickly than before?","Do you think that Hong Kong toy manufacturers deserve more recognition?"]},{"id":"2012-7.3","no":"7.3","label":"‘I love my work, but the money is rubbish.’","intro":"The two letters below appeared in a business columnist’s advice column in a newspaper:","title":"‘I love my work, but the money is rubbish.’","text":"I’m in a quandary. I do interesting, rewarding work at a small design company. I like the hours and the people, but the pay is terrible. In Hong Kong, it just doesn’t go far enough. I’ve been told by my employer that I can rewrite my own job description to make it even better, although it wouldn’t mean much more money. Instead, I could go for a standard position with a bank, working much longer hours but with a starting salary at least 50 per cent more than I’m getting now. So my problem boils down to this: I’m twenty-seven this year; do I take the money or the job satisfaction?\n\nDesigner, male, 26\n\n‘I never wanted to be a lawyer, but now I’m stuck.’ I did not grow up wanting to be a lawyer, I just ended up there because I had good grades and was attracted to the big salary. I travelled around the world for two years, but then had to come back to law-related work to pay the bills and mortgage. Now I’m in my late twenties and desperately want to do something meaningful. But I have obligations, and have acquired a certain lifestyle. So I lack the courage to change completely, to give up the big salary, even though I know I could be much happier doing something else.\n\nLawyer, female, almost 30","task":"You are taking a guidance course offered through the careers department of your school and are discussing the problems faced by young people when choosing a career. You may want to talk about:","points":["the struggles young people face when deciding on a career","what criteria are important when making a career choice","what advice you would give to someone who does not know what job they would like to do","anything else you think is important"],"ir":["Do you know of someone who is in a job that they don’t like?","What job would you do if money were not an issue?","Would you be willing to leave Hong Kong to pursue your dream job?","What is more important to you: money or job satisfaction?","Do you think you will do one or many jobs during your working life?","How important is job security to you? .","Do you think young people today have more job opportunities than their parents?","Would family expectations influence your choice of career?"]},{"id":"2012-8.1","no":"8.1","label":"Outdoor music festivals","intro":"The article below appeared in the local newspaper:","title":"Outdoor music festivals","text":"Outdoor music festivals are well-established in Europe and America. In the UK and US, they are million dollar businesses generating enormous revenue. But in Hong Kong, they are still not a part of the culture.\n\nTwo outdoor music festivals were discontinued in 2006 and 2010 because venue spaces were too small, nearby residents complained about the noise and the government was unsupportive. Similar difficulties confront the annual Clockenflap Music and Arts Festival which was held at the West Kowloon Cultural District. In their second year of running the festival, residents living near the venue complained they could not hear their television while the festival organizers were testing their sound equipment.\n\n‘The government needs to set aside the space and say, right, this is going to be used for outdoor events throughout the year, and if you build any residential space nearby, sorry, but there is going to be noise,\" says Mike Hill, Clockenflap’s Festival Director. ‘Hong Kong needs to have an open space allocated for music. There is a demand for it. It could be jazz. It could be Chinese Opera. It could be what we did — an alternative music and arts festival.\"","task":"Your group wants to write a letter to the editor to express your views about outdoor music festivals. Discuss what to include in the letter. You may want to talk about:","points":["whether there is a demand for outdoor music festivals in Hong Kong","whether the complaints about noise are a fair concern","what other events you would like to see held in the West Kowloon Cultural District","anything else you think is important"],"ir":["Are you interested in attending an outdoor music festival?","Would you prefer to attend an indoor or an outdoor music performance?","Do you think Hong Kong people would like to see more outdoor music festivals?","Do you think a music festival should only feature famous bands and performers?","Would you like to get involved in organizing an outdoor music festival?","Besides noise complaints, what other problems might organizers of an outdoor music festival face?","Do you think these types of festivals develop people’s interest in the arts?","Do you think the government is doing enough to support local musicians and artists?"]},{"id":"2012-8.2","no":"8.2","label":"Rising trend of men seeking plastic surgery","intro":"Below is a newspaper report about the increasing number of men in Singapore who have had plastic surgery:","title":"Rising trend of men seeking plastic surgery","text":"Doctors in Singapore say that they are seeing more male patients these days who seek plastic surgery. Dr Tan, a plastic surgeon, said he has seen a 25 percent increase in male patients each year who want to improve their looks.\n\nThese men come from all age groups and professions. Older men, in their 40s and upwards, usually seek treatme
